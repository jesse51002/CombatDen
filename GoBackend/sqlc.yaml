version: "2"
sql:
  # User domain - SQL queries and generated code in internal/user/sql/
  - engine: "postgresql"
    queries: "internal/database/sql"
    schema: "supabase/schemas"
    gen:
      go:
        package: "sql"
        out: "internal/stuff/sql"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        # Generated files: db.go, models.go, queries.sql.go in internal/user/sql/
