<!-- Internal sales leave-behind. Lives in onepager/, which deploy/upload.py
     skips entirely (no INCLUDE_GLOB matches files under this directory). -->

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23F4F3EE'/%3E%3Ctext x='32' y='44' font-family='Jura,sans-serif' font-weight='700' font-size='36' text-anchor='middle' fill='%23E55A1C' letter-spacing='-0.03em'%3ECD%3C/text%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Jura:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* Screen: center the artboard on a soft gray "desk" so it reads like a printed page. */
  html, body {
    margin: 0;
    padding: 0;
    background: #d9d6cf;
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* Global rule: \n in any COPY string renders as a real line break. */
    white-space: pre-line;
  }
  #root { display: flex; justify-content: center; padding: 32px 0; }
  .page-frame {
    width: 816px;
    height: 1056px;
    background: #F4F3EE;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }
  .print-hint {
    position: fixed;
    top: 12px;
    left: 12px;
    font-size: 11px;
    color: rgba(0,0,0,0.55);
    background: rgba(255,255,255,0.85);
    padding: 6px 10px;
    border-radius: 4px;
    font-family: "Inter", sans-serif;
  }
  .print-hint b { color: #E55A1C; }

  /* Print: one US Letter page, no margins, no on-screen chrome.
     IMPORTANT: in the browser print dialog set Margins → "None" (Chrome's UI
     margin overrides @page) and enable Background graphics so orange prints. */
  @page { size: letter; margin: 0; }
  @media print {
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;
      width: 8.5in;
      height: 11in;
    }
    #root {
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .page-frame {
      box-shadow: none !important;
      margin: 0 !important;
      page-break-inside: avoid;
      page-break-after: avoid;
    }
    .print-hint { display: none !important; }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  }
</style>
</head>
<body>

<div class="print-hint">Print: <b>Ctrl/Cmd-P</b> · Margins → <b>None</b> · enable <b>Background graphics</b></div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="./onepager.jsx"></script>
</body>
</html>
