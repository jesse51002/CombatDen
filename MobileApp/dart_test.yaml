# Test tags.
#
# `golden` marks the layout PREVIEW generators — dev-only tools that
# render each layout format to a PNG under `test/goldens/` for review.
# They are skipped by default because they are review artefacts, not
# assertions: they depend on a locally installed typeface and, via
# `google_fonts`, on network access for the brand font.
#
# Regenerate the previews explicitly:
#   flutter test --tags golden --update-goldens --run-skipped
#
# The layout INVARIANT gates (`*_invariants_test.dart`) are untagged and
# always run. Those are the tests that enforce the arrangement-only
# contract, and they must stay green.
tags:
  golden:
    skip: "review artefact; run with --tags golden --update-goldens"
