# Figma file inventory for the CombatDen mobile app prototype.
#
# CombatDen and CombatDenBJJ are the SAME app — same screens, same layout —
# with different branding and color. Every screen below should have a node id
# in BOTH files (a `combat_den` id and a `combat_den_bjj` id). When you call
# the Figma MCP, pick whichever brand variant the user is currently designing.
#
# How to use:
#   1. Find the screen by name in `screens:` below.
#   2. Pick the brand: `combat_den` or `combat_den_bjj`.
#   3. Use that brand's `file_key` (from `files:`) and the screen's
#      `nodes.<brand>` value as the node_id for the Figma MCP call.
#   4. Re-fetch as many times as needed during build — better five looks
#      than one wrong screen.
#
# When new frames are added in Figma, append them here in the same change,
# with BOTH node ids if they exist. If only one brand has the frame yet,
# leave the other as `TODO` and flag it.

files:
  combat_den:
    name: CombatDen
    file_key: auxEZmrWWZ61mNnrFQxVg0
    url: https://www.figma.com/design/auxEZmrWWZ61mNnrFQxVg0/CombatDen
    page_node_id: "0:1" # UserMobileApp page
  combat_den_bjj:
    name: CombatDenBJJ
    file_key: UAxqToXg6ziKew5UC6pAZR
