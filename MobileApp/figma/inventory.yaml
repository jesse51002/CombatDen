observations:
  - Mobile-first 393px width (iPhone SE / 13 class).
  - Frame heights vary 852 – 2377; most screens are scrollable.
  - No documented color / type / spacing tokens in Figma — DesignConstants in
    code is the source of truth.
  - Multi-role app: separate coach onboarding flow and student scoring screens.
  - CombatDen and CombatDenBJJ share screen structure; the only deltas should
    be brand colors and brand assets. If a structural divergence appears,
    flag it here.
