    tags: [clips, entertainment, professional]
  - query: best UFC title fight full highlights
    tags: [professional, clips]
  - query: mma fighter training camp day in the life
    tags: [vlog, behind_the_scenes]
  - query: UFC news this week breakdown
    tags: [news, informative]
