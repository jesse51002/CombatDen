company_name: Apex MMA
type: Mixed martial arts gym
videos_desc: |
  All-ranges mixed martial arts for members who want the complete game — striking,
  wrestling, and submissions stitched together. Worth surfacing: fundamentals
  explainers that frame how the phases connect, high-level fight breakdowns and
  technique analysis, elite professional fight footage and finishes, training-camp
  day-in-the-life vlogs, and credible news on the sport's biggest events.
avoid_desc: |
  Within-MMA content the gym rejects: backyard and unsanctioned street brawls
  passed off as "MMA", fake or staged knockout compilations, low-credibility
  "deadly technique" channels promising one-move finishes, and content
  normalizing dangerous weight cuts or reckless training as how the sport works.
