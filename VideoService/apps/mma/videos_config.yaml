company_name: ApexMMA
type: MMA gym (full mixed martial arts)
videos_desc: |
  A hardcore MMA fight gym for committed hobbyists who train like fighters.
  Worth surfacing: well-rounded MMA technique breakdowns that connect striking,
  wrestling, and BJJ (takedown setups, cage clinch work, ground-and-pound,
  scrambles); hard-sparring and fight-camp footage from real MMA teams; elite
  UFC and other top-promotion highlights and full-fight breakdowns; coach
  interviews and pro-fighter vlogs on training culture and weight cuts; and
  serious S&C / conditioning content built for MMA fighters.
avoid_desc: |
  Within-MMA content the gym pushes back on: videos arguing one discipline
  alone is enough for MMA ("you only need boxing", "BJJ is all you need in a
  fight", "pure wrestlers dominate MMA"); titles selling a single flashy move
  as a guaranteed fight-finisher ("the ONE move that always works in MMA",
  "deadliest submission/kick", "this spinning move beats everyone");
  guaranteed-street-fight-finish clickbait and fake "master" / no-touch
  knockout content; and cardio- or fitness-MMA workouts marketed as actual
  fight training ("MMA cardio workout" / "MMA bootcamp" framed as fight prep
  with no sparring or pressure).
searches:
  - query: mma striking to takedown setup tutorial
  - query: ufc fight breakdown technique analysis
  - query: ufc title fight full highlights
  - query: inside mma fight camp training week vlog
  - query: best mma knockouts compilation
priority_channels: []
