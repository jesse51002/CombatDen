  kickboxing. and watch him teach like jiu-jitsu and like he'll spar and [ __ ] me
  up. I'm like, "Oh man, this guy's so [ __ ] cool. He's the life that I want." And
  then hindsight, this man probably hates his [ __ ] life. He's probably [ __ ] half
  brain dead. He's teaching cardio kickboxing classes for 20 bucks. 20 bucks a class.
  So it's like whenever you look at UFC fighters and you want to be this understand
