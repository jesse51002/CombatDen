transcript: If somebody had a street fight, I would still give the edge to the boxer.
  Then it would be the wrestler. It would not be the martial artist on a street fight.
  It would not be the karate guy. I would go to tie boxing right after that. Cuz these
  things, like when you're boxing, you are fighting. You are striking in the face.
  You're getting struck in the face fully. In karate, you are not getting hit fully.
  It's kind of a business. Boxing, you learn how to fight. Wrestling, you learn how
  to fight. >> Most street fights end up on the ground, too. So, >> I absolutely disagree
  with that. Really? Yeah. Because it starts on the feet. >> It starts on your feet.
  Somebody ends up on the ground probably. But if I mean somebody who knows how to
  box gets in an altercation, they're probably not going to the ground. Unless you
  are another professional boxer, you don't know how to block that. You just don't.
  And you're dealing with fractions of seconds. So, you know, so boxer number one,
  wrestler number two, tie boxer number three. Yeah. Cuz a leg kick or whatever, somebody
  knows how to throw a leg kick, you don't know how to block that either.
