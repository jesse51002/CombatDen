transcript: 'OK, I''m going to demonstrate a roundhouse

  kick. First, again, you want to stay in a right

  leg back position. Again, you don''t have to always be in a right

  leg back. You can switch your stances, whichever you

  want. I''m going to demonstrate with the right leg

  first. OK, to do a roundhouse kick, just like a front

  kick, we''re going to raise our knees up, one. The second thing you want to do is
  called

  pivot. You want to turn your bottom foot all the

  way, two. Three, you want to snap kick. One, and bring it back in and down. So a
  quick demonstration. Fighting stance, and bring it back, or landing

  forward. One more time. Now I like to, again, train with my partner. He''s holding
  the hand target. He''s holding, again, about 45-degree angle. Right now I want to
  practice on my stomach

  level. I''m going to stay in, again, fighting stance,

  in a relaxed state. Number one, make sure you don''t get too stanced. Knees up,
  pivot, snap out, and land. One more time. And that''s how you do roundhouse kick.'
