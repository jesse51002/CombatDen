transcript: San Hagen explains his fighting style. >> I mean, uh, I always really
  looked up to all of the defensive guys that I would watch. Like, I know that in
  boxing, just winning the defensive battle is a big piece in boxing. And the judges
  almost even score a little bit for it, but in MMA, it's just all like only offense
  scores, right? So that's not really the way that I grew up thinking was good martial
  arts really cuz my some of my favorite guys were Mayweather, Pernell Whitaker, >>
  Nino Daire, like all of these really awesome movers that did a phenomenal job at
  protecting themselves.
