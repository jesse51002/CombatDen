transcript: what is the first kick you should learn in MMA it's the roundhouse kick
  the roundhouse kick can be used to chip away at your opponent's legs over time or
  to land one big devastating kick that knocks your opponent out and finishes the
  fight here are three important tips that will help you improve your roundhouse kick
  tip number one set yourself up by opening up the toes so as you throw the roundhouse
  kick step open number two don't throw that kick straight up towards the sky we want
  to be rotating our hips over so you got to turn your hips over to go through the
  opponent step open turn the hips over number three make sure you land in your stance
  notice when I threw that kick I wasn't off balance when I landed I throw the kick
  and I'm landing right back in my stance where I'm ready to go to continue learning
