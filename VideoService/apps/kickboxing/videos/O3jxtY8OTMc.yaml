  I spoke about before but then I''m going to twist my heel all the way

  around to the front and watch what happens to my hips when I do that. They''re all
  the way in. I''m not even trying hard and I''m moving Bob much more than before.
  From here.. That''s where the power comes from. It starts

  from the floor and then it comes from the hips. So it''s very important to push

  off that floor but probably even more important than that is to come up onto

  the ball of your foot and twist you heel all the way around to the front. Now you

  notice that when I connect with my target I''m coming up as spinning around

  on the ball of the foot but I always drop to my heel as I connect with my

  opponent. I always drop my weight into the kick. I don''t stay up on my toes like

  that. I make sure it twists around the ball of the foot,

  I get the hips all the way to the front but I''m dropping my weight into the kick.
  See the heel? All the way to the front. Like the Thai boxers do, you should  absolutely

  kick with the shin. That''s the hardest part. Obviously the higher you get it''s
  harder to kick with the shin but you know I can

  catch him at the foot I can still cause a lot of problems by should be aiming

  mostly to kick with the shin and if I catch them with the knee as well, well

  you know, that''ll do as well. What should definitely do is kick with a

  bent knee. It shouldn''t be a straight leg when you kick because that''s kind of

  awkward.You want to make sure that when you connect with your target you need to

  be hitting with a bent knee. Actually what you should do is hit and then push.

  Extend your knee as you hit. You hit in and then extend the knee. So you hit him

  in the shin and pushing through. Also the quickest route is a straight line

  right ? So if I''m gonna kick you. What makes more sense? Does it make more sense

  for my foot to come all the way out like this? This sort of semi

  circular motion? Or does it make sense to just come straight through - bang. That

