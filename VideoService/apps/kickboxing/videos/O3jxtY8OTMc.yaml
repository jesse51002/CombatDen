  No

  point. And any way if I''m kicking to the body I want to try and get underneath

  the guard anyway. So the idea is to kick up towards your opponent. Up, and then
  at

  the last minute, I''m twisting. Same for a head shot. Up, twist. I''m not going
  to do

  the kick like this. I''m wasting energy. It''s taking me too long to get there.
  And what did I say about the floor? The floor is where the power originates from
  so,

  if I come up here and then round and then in... all that momentum I''ve got from
