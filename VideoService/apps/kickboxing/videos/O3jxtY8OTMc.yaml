transcript: 'Hey guys, Scott Adkins here and I''m back

  with another kicking tutorial this time we''re going to do the round kick

  otherwise known as the turning kick. If you want to have the most power and

  speed in your turning kick or round kick it''s not going to help you if you''re

  kicking from too far back. Where am I gonna kick? I''m going to kick in front of

  me here. My kicking leg is all the way back here. So that''s a hundred and eighty

  degrees away from my target and it takes me a lot longer to get from here to

  there than it would if my foot was closer to my intended target and a bit closer
  to me. So what I want is to do just for

  this exercise is to stand with your feet shoulder width apart. You''re gonna take
  your kicking leg directly back so you''re in more of a sprinting

  position like you''re gonna come off the blocks. Yeah? You don''t want

  to be like this. People when they talk about kicking they say well the power, it

  comes from the hips and that''s absolutely right but the thing is before

  the hips come into play, you''ve got to push off the floor. The floor hopefully
  is

  in an immovable object as soon as you push off the floor that''s where the power

  originates from and then it''s up to you to put your hips into play and to

  make that kick as powerful and as quick as possible. So not all the way

  back here like that I''m a bit more forwards like a sprinter, up on my toes,

  ready to kick and get to my target, get to my opponent. And by the way I''m not
  saying that

  you should always fight like this. That''s up to you how you should find or how
  you

  should practice martial arts. I''m just here to tell you that you''re going to

  get to your opponent, to your intended target quicker, if you would start with

  your foot a little bit closer to where it''s going. Next thing you need to do is
  recruit

  your hips. So a lot of people they don''t move their pivoting foot, in fact they

  don''t pivot. They just kick. So this is how not to do it. This is my front foot.

  This is very important and watch what the front foot does. It''s not really

  doing much is it? I''m coming up on the ball of the foot which is okay but I''m
  not pivoting my heel around. If I don''t move my heel around, what''s happening
  to my hips? I''m not using them. Right? So I weigh 86 kilograms and if I don''t
  pivot on my foot and I don''t bring my hips around

  and then probably only using the weight of my leg which is less than

  10 kilograms. So I want to use 86 kilograms don''t I? And the way for me to do that
