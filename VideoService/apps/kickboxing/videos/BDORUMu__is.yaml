  fighting stance step number one is going to be doing the turn or a turning step
  motion which looks like this your back leg is going to turn step around i would
  practice that way first once you get the hang of that then you need to be make sure
  that you're able to keep that foot that steps around off the ground so it's going
  to look like this you turn keep it up off the ground now step number two once you
