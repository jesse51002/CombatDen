transcript: That's how it was at the International PLA Boxing Championships in Oxnard,
  California, where Jerry and Josh competed. This isn't a video about winning or losing.
  It's about what happens before, during, and after the ring. My name is Casia Ribero.
  Being around these two young fighters made me realize something deeper. The ring
  doesn't just test your strength, it reveals your spirit. Every punch tells a story
  of courage, discipline, and heart. And behind every fighter, there is silence, focus,
  and a will that doesn't break. That's why Roose Mindset was formed to tell the stories
  behind the fights, the unseen battles that shape who we are.
