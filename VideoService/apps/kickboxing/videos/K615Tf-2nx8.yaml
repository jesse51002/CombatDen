transcript: We are talking about five musthave combos that you need in your striking
  arsenal. Entering into 2026, you want to be training like a champion. And if you're
  looking to do some sessions outside your regular classes at the gym, you're looking
  at doing some solo training to up your own skills, be sure to head over to Strike
  Ready where you can grab Edge Performance Training, which features 36 1-hour training
  sessions where you can follow along with me. I crafted these to make sure they challenge
  you both physically, but also technically. And right now, we have a great special
  on just $99 down from $149. And this is the perfect opportunity for you to up your
  striking skills going in to 2026. Now, let's talk about some of these musthave combinations.
  And very often when I've heard people saying, "Oh, I'm going in for my first fight."
  One of the things they often say is, "Oh, in the first 20 seconds, I'm going to
  throw this combo." They have a set combo in their mind. And a lot of times when
  they have these set combos, they'll say something like, "Yeah, okay. I'm going to
  step in. I'm going to throw a double jab and then a front kick and a cross and then
  a spinning hook kick. I'm like, whoa. Okay, that's a cool combo, but the chance
  of anything really landing, it's not so much. So, I want to give you combinations
  that I go, okay, you can throw these. Number one, they're going to provide you safety,
  but number two, they're going to open up your opponent's guard and hopefully allow
  you to land something. And while I'm not a big advocate for having set combinations,
  like I don't want to be out here and be like, "Okay, I'm gonna step forward and
  throw double jab, upper cross, round kick, and that's what I plan beforehand. I
  don't like that." But there are some basic combos that really work that allow you
  to be safe that you can step forward and be like, "Yeah, I'm going to throw this."
  So, the very first one is coming from a jab to a lead hook on the same arm and then
  coming to the low kick. And that's all you need, the jab to the hook to the low
  kick. Why does this combo work so well? Well, number one, when you're at that long
  jab length, you're going to be at a fairly safe distance, assuming, of course, that
  as you jab, your other hand is not way out here, but you close it off. Right from
  there, now I've basically taken away most of the holes for counters. I come one.
  Now, what's going to happen is they're either going to close their guard or they're
  going to parry, which leaves this side of the head open. So, you come one to two,
  you make this hook really long, so you don't have to change range. Boom. Boom. And
  then from there, when you've distracted them and you've knocked their weight on
  that left hook towards this thigh, all of a sudden now it's hard for them to get
  that check off. So you come the one to the two. If either of those land, that's
  great. If they don't, that's fine. And then you slam that low kick in. And timing
  is everything. It can't be one, two, and three. It's one, two, three. So it's that
  popup pop pace. you get that combo down, you're going to be landing lots of low
  kicks and just in general coming jab to lead hook is something great to work as
  well. Our next combo is a jab to an inside low following to cross and then a body
  hook. This one again makes me feel very safe. Why? Because we're maintaining that
  long jab range at the beginning jab and I can keep this arm out down the middle
  after it. I don't have to pull it straight back. So, I flick up my jab, but it just
  comes back halfway posting out as a safety point. And right away, I'm shuffle stepping
  up to get that inside low off. From here, I step out on an angle. And that's the
  really important part of this. I don't want to stay right here where their counters
  are going to hit me. I come one to two and I step out. So, my head is off the center
  line. Whenever I bring my head off the center line, I just make sure the other hand
  is very high. So, now I know I'm protected. If they throw anything, who cares? Jab
  inside low, step off the center line, and then that body shot to finish off. Yes,
  you can have a good opportunity here to land some really important shots, but even
  better, because you take that angle off the center line and you have that hand posted
  after the jab, you're so incredibly safe. Jab to inside low, cross to body hook,
  and then I can just angle off slightly so I'm not staying right in front of them.
  Beautiful way to put together a nice fourpiece combo. Combo number three is going
  to be a little bit different. I want to give you guys something that changes up
  leading with that jab. We're going to enter with a body cross. I know a lot of people
  won't like that, but it's actually a great way to start off because most people
  are prioritizing the head shots for that first technique. So coming down to the
  body can create that drop in the arms, opening the head. I like to come from the
  cross and then up for a hook cross at head level. And then we're going to switch
  back down to the body or down to the leg with that lead round kick. So I come one,
  two, three, and right into there. It's not so much the middle shots that I'm worried
  about landing. It's the fact that, okay, I can land here. And then these ones, if
  they land, great. If they don't, that's fine. And it's all the setup to get back
  to the body. So, this is about targeting the lower section as opposed to the head.
  I very simply make sure on my cross that I either bring my head off the center line
  or I maintain really long distance instead of trying to get in and put lots of power
  in it. I just snap and then I can follow up nice and smooth on this fourpiece. Now,
  this next one seems so simple, but it's actually very, very effective. And it's
  going to be a quick double jab into a low kick, but then a second low kick. And
  the trick on the second low kick is to catch it fast so that if they check the first
  one, they're going to drop and then you hit them. Very few people are just going
  to stay here and check the first one and not put their foot directly back down.
  So, what I find is if you can catch the slightest angle and get yourself a little
  closer and a little to the outside of their lead leg, it's so easy to come and catch
  them in the hamstring. And that double jab is just a distraction. Again, if it lands,
  that's great. But I just give them a little flick flick. And then one to two. And
  this is beautiful. Double jab to one and two. Because I'm doubling up on that back
  leg, I want to make sure that my lead or my hand that matches the kicking leg is
  not swinging down cuz that puts me in danger of getting countered. So I keep this
  hand up in the middle. So any shots that come are going to just be deflected off
  that forearm. If I do it from a stance switch, I come one, two, you can see I hit
  here. I don't come right back to where I started. I actually step out to this point
  so that I can angle off to the side very slightly. And the last combo that we're
  going to have today is going to finish on a head kick. If you decide to throw this
  in sparring, be sure to recognize it is dangerous and you don't want to lay people
  out the first time you're trying something and then find out, whoa, that really
  works. So, we're going to step in with hook cross. The reason I like the hook cross
  is instead of a jab cross, this hook makes somebody reach out, which creates that
  need for them to open up their guard. So, I throw my hook, I come to the cross.
  Now, if I hit them, that's fantastic cuz they're going to snap back and their hands
  are going to panic and close off the middle. I'm coming from there. Boom. And right
  into that head kick. always on the cross, recognizing that if I do land, they're
  going to want to close off that space, which leaves them exposed to the side and
  allows me to wrap my kick up and behind the head. If I go, I'm going to land with
  my foot and kind of do this flick motion like that at the end of my kick. I can
  come around and catch them back here. So, I come from my hook to my cross right
  into the head kick. And there's not that traditional kind of pause where I'm going
  one, two, three. I want this to come bap, bap, boom, tap, tap, tap. No pause. Hook,
  cross, right into that head kick. Sometimes people find that at punch range, the
  flexibility that it takes to get the leg up to head level is difficult. So instead
  of keeping your head way up high, you can actually drop your head down on that cross
  and just leave it there. And then it's easy to get my foot up to head level. Whereas
  if I keep it up here, oh yeah, it's a little bit tighter. So I step in, bang, bang,
  and then up and around. You take these five combinations I gave you today, practice
  them in your shadow boxing, practice them on the bag. Start making them something
  you have some confidence in, and then try them in sparring. I really believe that
  these will land nicely for you in upcoming sparring rounds or even in your fight.
  Thanks for joining, guys. I'll see you back on the channel soon.
