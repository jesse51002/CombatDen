transcript: Today we're going to be talking about how to execute a beautiful body
  level round kick like just like the Muay Thai fighters or the best kickboxers in
  the world do. Now, here's a little bit of a disappointing bit of news. Your instructor
  might not be teaching you right. How do I know this? At some point in the last few
  weeks, I was at a gym. I saw one of the instructors doing some bag work and I was
  kind of looking out of the corner of my eye as I was doing my own bag work. I'm
  like, "Oh, they're doing that wrong and that wrong and that wrong and that wrong."
  Not even joking. Like took me 10 seconds to see four things they were doing incorrectly.
  And if they're making the mistakes, they're teaching those exact same things, which
  means the students are doing round kicks wrong, most likely. So, we want to make
  sure we have this really, really locked in. very important when you throw a round
  kick because if you do it incorrectly, number one, you get minimal power or number
  two, as you throw the kick, you compromise yourself for counters, neither of which
  are good and they're not going to build your confidence in this super powerful kick.
  Now, of course, we can throw it down towards leg level. We can come up to head level.
  There are small little subtle like changes that you make. So, we're just going to
  focus on the body level today. The first thing that I want to say about executing
  the round kick when we're looking at the technique of it is we want to make sure
  that we're driving that back leg off the ground. Sometimes I see people kind of
  like lift their leg. It just kind of uh and they're really pulling from the hip
  flexor and then getting this snap. Don't think of it as like as that sort of motion
  for a start. Think of it as a push. You take this hip and you force it forward.
  That's a good starting point. If I do not turn this foot that I'm standing on as
  I do that motion, it feels very awkward on this hip now. So, it's about me learning
  to turn and take my heel, which was in the back, and putting it in the front as
  I push forward with this hip. And you can see as this hip goes forward, my shoulder
  follows. That's another spot that so many beginners make mistakes on their round
  kick and then they go, "Oh, I can't kick up at head level. As I throw my hip forward,
  my shoulder follows. My body moves together." Once you have down that motion, then
  it's just a matter of elevating the knee. And one of the easiest ways to practice
  this is just take a surface that you can put your hand against for balance. I push
  and I just get myself to there. And you can see how my leg is somewhat chambered.
  Some people like to go completely chambered and some people go more of a straight
  leg like a big baseball bat. I'm not going to say one or the other is what you have
  to do because there are options when we throw round kicks. And I know many people
  who have thrown round kicks very straight leg bum and they hit my arms. I'm going,
  "Wa, that's powerful." And I know many people who do this snap and again, oh, that's
  powerful. So, while I'll tell you some things have to be done, it'll be your choice
  on how much you extend your leg on that lift and how much snap you choose to engage.
  Once we get ourselves into this position and we're going, okay, now we're snapping,
  we have to look at this heel. We do not want that heel when we're going at body
  level completely flat to the floor. Why not? Because we want elevation, which is
  going to help us increase the power of the kick. We're not kicking horizontally.
  We're kicking upwards. A little bit of an upwards angle. So, as I get that lift,
  I'm going to be able to maximize the power. It's a hard thing to do. But we need
  that elevation. And you can see I've taken that heel again all the way in front
  right there. We now have the body and the leg doing what it needs to do. The rechamber
  is equally as important. Whatever you do going into it, do the same thing coming
  out for now. Yes, there are variations where we come in sideways and then we flip
  the hip and come back more like a front kick. But as you're learning, just do exactly
  what you did. Going in, going out, and that heel doesn't drop until it resets, comes
  off the floor, and then boom, back down. Now, arms. What are we doing with our arms?
  Generally, because the range of a kick is much further than the range of a punch,
  we do not have to worry about defending down the middle. So, we're going to swing
  the arm that matches the leg. As I push the hip forward and my shoulder forward,
  my arm swings down. You can feel that will help your momentum. If I keep this here
  and I push, it doesn't really feel like it goes as naturally as if I whip that arm
  down. The other hand is going to stay right up to the side of my head. In case they
  happen to round kick a split second before me, then their round kick comes right
  into here. My head does not have to stay straight forward. It can turn a little
  bit. I can even use those peripherals if I want to. But don't let your neck fight
  the rest of the body by trying to stay square. My hand, one arm swings down, the
  other one stays up. Boom. And I return right back to my stance. Now, what are we
  landing with? That's an important question. Many people think you have to land with
  your shin or you have to land with your foot. It really depends on whether this
  person is standing their ground, whether they close distance, whether they back
  up. We obviously do not want to land up above the knee. And we don't want to land
  with the tips of our toes. So, what we're looking to land is somewhere between the
  lower portion of the foot, still damaging, and the upper portion of the shin. When
  somebody holds tie heads for you, you should probably be landing slightly with your
  foot and slightly with the shin. A nice combo of the two. But if you happen to get
  a longer range kick and you're going boom, okay, I landed with my foot, that's fine.
  If the distance is a little tighter, maybe I just threw a jab and a hook and I go
  boom, okay, now I'm landing with my shin. That's okay. Either one is fine. Don't
  have to go with this. Oh, yes. I have to land with this point or this point. Understand
  range changes. And as long as you're hitting and you're making that connection and
  causing damage, that's okay. Now, when we don't have a bag or we don't have pads,
  it's difficult to practice the mechanics of everything I just said and control it.
  You absolutely can, but it's very difficult to get the elevation, to get that turn,
  and to come back down and feel comfortable. So, that's why we see many people wrapping
  right through with that kick. And it's a good thing to practice because sometimes
  when you throw a kick, the person backs up. Sometimes you hit them and you're going
  to shift them, especially if you land up at head level and kind of clips over top,
  get that big KO shot. So, what we're looking to do when we practice midair is the
  exact same thing which I already said. Everything's the same except don't worry
  about the rechamber. Once I get to this point, my kick is going to continue to go
  through. I have to stay on the ball of my foot and this foot can wrap right back
  around to where it started. That's it. If we're working off the left leg, the lead
  one, all we have to think is, okay, I'm going to switch my feet. We can absolutely
  kick like this. We can absolutely do a little shuffle up, even though that minimizes
  your power. We could do a step through and a big round kick, but the easiest one
  is to do a little switch of the feet. The lead leg moves backwards. The back foot
  moves forwards. And the timing is slightly offbeat. Lead one moves first. Boom.
  Boom. Boom. Boom. That's my timing. Once I'm in this position, I've essentially
  switched my stance with which means now I can get lots of power. Keep your shoulders
  neutral as you skip your feet. So that now once you're here and you push off that
  back leg and you fire forward, this shoulder can give you massive power by turning.
  I corrected somebody about a month ago when I was at the gym and they they were
  going like this and then trying to kick and they weren't getting power. Neutral,
  you can punch with it. You can front kick from there, knee from there or round kick
  from there. The only difference when I come out of this one is I want to land parallel.
  Boom. And then step back. Boom. And of course, you can play around with what your
  head does on these round kicks. Some people I've seen Muay Thai fighters, they're
  lean way back. I'm not going to say they're doing it wrong, but I prefer to get
  elevation and to stay fairly head above the foot. That's my personal preference.
  People like Super Bon, who are one of the best kickers in the world, off the back
  leg. Boom. He does the same thing. It's up to you on that in that regard. So, that's
  it, guys. Play around with those round kicks, get them on point, and everything
  that I mentioned here will make them look sharp. I'll see you guys back here soon.
