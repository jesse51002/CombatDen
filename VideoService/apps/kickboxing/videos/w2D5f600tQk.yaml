transcript: What's going on everyone? This is Zach with Prospectrics. Today I'm joined
  by Marcus Aino for an indepth conversation about his journey in MMA, his mindset
  heading into competition, and how he continues to grow as a fighter. We talk about
  preparation, mental focus, and what he wants to show when he steps into the cage
  next. Make sure to subscribe for more MMA content. Stay tuned. Welcome to the Prospectrics
  interview. What is your name, age, and the weight class that you fight at? >> My
  name is uh Marcus Aino. I'm 20 years old and I fight at 135 bantamweight. >> For
  viewers meeting you for the first time, who is Marcus outside of the cage? >> Marcus
  outside the cage is just like, you know, your average person. I go to college. I
  go to Calpali Pomona. I'm an electrical engineering major. I'm just kind of your
  average Joe in a way. Not really. You know, I do whatever teenagers, well, adults
  do now. So, you know, it is what it is. Where are you from and how did that environment
  shape you as a fighter? >> I'm originally from Panorama City. I grew up in like
  not really that ghetto of a neighborhood, but it wasn't that great. I went to elementary
  school where there was like Asians who were like the minority. So, I got bullied
  a lot. So, me being bullied, I just had to fight and fight and fight. So, that's
  probably what got me into martial arts in the first place. But, I was also a troublemaker.
  So, you know, that's what brought me into fighting. How did you originally get into
  MMA and what pulled you toward this sport? >> I originally got into MMA be um mainly
  because of my dad. He was a big boxing fanatic. He would love to watch Manny Pac.
  Yeah. Like he would watch everyone back in the day. And I think like his little
  addiction kind of rubbed off on me. And I was watching like UFC boxing, kickboxing
  when I was a kid. So I think when I hit like fifth or sixth grade, I went to jiu-jitsu
  for the first time and it just became an addiction from there. >> At what point
  did you realize MMA was something you wanted to pursue? Seriously? >> The point
  of my life where I realized like MMA was like my calling was definitely in high
  school where like I saw a lot of people like partying, drinking, they were freaking
  doing all this [ __ ] in high school, you know, like they're kind of peeking out
  and I was like in the gym training. I was getting like getting better and better
  and I was like damn like I really love doing this. So I was like I think I could
  I think I'm good enough to make this for my profession. So I was like [ __ ] it.
  Let's do it. >> What sacrifices have you had to make to stay committed to this path?
  >> Oh dude, there's a lot of [ __ ] sacrifices when it comes to MMA. You can't have
  a social life for one. Like all you got to do like to be honest like most people
  don't realize is the training, all that stuff, the diet, everything. That's not
  the hard part. The hard part is the sacrifices that you have to make. The this parties
  that your friends are going to the hangouts that your homies are going out, you
  know, like some family get get togethers. Like sometimes you just got to be like,
  "Yo, I got to train. I got to train." Like you got to give up a lot of stuff because
  at the end of the day, like if someone's out working you in this sport, you're getting
  cooked. So I see it as like, you know, kill or be killed. So at this point of my
  life where I was like, damn. I was like, I got to sacrifice a lot of [ __ ] like
  social hour. I I can't hang out with my friends as much, you know, cuz this is what
  I want to do for my life. I want to make this my profession. I want to go pro. I
  want to go to the UFC. I want to be UFC World Champion one day. So, I don't give
  a [ __ ] if I'll do whatever it takes to become number one in the world. >> In the
  cage, how would you describe your fighting style? >> Man, in the cage, my fighting
  style is very like aggression forwardheavy. I love like, you know, I watch like
  when I was watching when I was a kid, I would watch a lot of Kane Velasquez where
  he would just freaking maul you or come forward heavy with knockouts. I love like
  highlight stuff, you know? Like I like going forward front foot, one twos, like
  just going straight towards you. Like I don't like backing up as much, but I do
  I will back up if I need to. At the same time, like I'm just coming straight at
  you like like a bulldog. >> What are your thoughts like heading up to your fight
  this weekend? My thoughts are like I'm as confident as I could possibly be. You
  know, I already know like the win is mine. I'm not tripping about it. I'm not worried
  about anything. I had a great camp. I sparred with great people like Mark Diego.
  I got my boys Derek. I got Clay. I got a lot of people from Yakubian Muay Thai.
  Shout out to my coaches um Rob Lemus and uh Sean Yakubian. I also got my boy Cheyenne.
  like we've been all working to get better and better and I feel like I just got
  I just leveled up. So, I'm just as confident as I could possibly be for this fight.
  >> If your performance went perfectly, what would that look like? >> If performance
  went perfectly, it would look like either a first round knockout or submission cuz
  I don't think this guy is going to survive, you know? I'm just going to go at it.
  I'm very confident in my skills. I'm very um I'm very tenacious. I'm very hungry
  for everything. So, >> what does this training camp look like compared to earlier
  ones in your career? >> Man, this training camp was a little different. So, like
  earlier in my career, like we realized like we noticed how my grappling was one
  of my power aspects, but I never used it and my striking definitely needed more
  brush up and more um activity. So this training camp like we capitalized on the
  mistakes that I had in my past training camps where we went more combinations, more
  like hands, per better form, better everything. And then we went for more of a um
  offensive wrestling rather than defensive like last time. So for this camp, we just
  went very very very like hard on the mistakes that I made last camp. >> Mentally,
  what keeps your discipline going when you have no motivation? to be honest like
  when I have no motiv motivation I just think about like all the stuff that I did
  before because I'm like I'm very big on time you know time is money right so if
  I'm like damn I'm like I don't feel like training today or [ __ ] like that I either
  think about the time like I wasted coming up to this point of my life or I think
  about someone um working harder than I am and I'm like damn that [ __ ] is working
  harder than I am so I gotta outwork him so I could be better than him so I you know,
  be better than everyone in the world. >> What do you think separates you from other
  fighters >> at this level? >> I think what separates me from other fighters at this
  levels I feel like I'm very well-rounded, you know? I got very great striking from
  Shawn and Rob. I got really good grappling from Sir Lewis. And then I got my boy
  Mark and Diego helping me with the wrestling. So like, and Jesse, actually, shout
  out to Jesse. I got them helping me out with my wrestling. So, I feel like it doesn't
  matter what aspect of the game it is, I could just beat you in it. >> When it comes
  to short-term goals, where do you want your MMA career to be by the end of this
  year? >> By the end of this year, I feel like I should either be a title contender
  or just have that title around my waist. I want around 10 amateur, maybe 15 amateur
  fights before I go to uh pro. So, I'm just going to rack up as much experience as
  I can cuz I'm really young right now. I'm still 20 years old. I'm going to try to
  rack up as much experience I can so when I turn pro where your record does really
  matter. It's just going to be me putting people out. >> So, Prospect Tricks is about
  giving attention to prospect athletes on the climb. What do the fans and supporters
  mean to you? Especially the ones who've been with you since the beginning. >> Man,
  the fans mean everything to me, man. Like, I like to say this a lot. Um, we are
  nothing without fans, you know? Like, our support system is everything. without
  a good support system like our mental, our confidence goes away. So like having
  a great support system in my gym, my family, my friends, like all of them coming
  out to support me and just like, you know, cheering me on. It just means so much
  to me and it means the world to me. I feel like if I didn't have that support system,
  I wouldn't be successful. So that support system in my opinion just means a lot
  cuz that's what that's what will project you to become a better and better better
  and a more well-known fighter. >> Who is Marcus Aino before he started fighting?
  >> Man, Marcus Aino before he started fighting was low-key a little troublemaker,
  you know, like like I said, I got bullied when I was a kid, but the way I kind of
  made up of it is to become a troublemaker myself. I didn't bully anyone, but I was
  a troublemaker. So like me before fighting and me before doing all this, I was just
  a very um energetic per child and then I played a lot of basketball. I did a lot
  of stuff. Um but me now is just a very more tamed, more disciplined person thanks
  to martial arts. >> What gym do you represent? And what does the gym and team mean
  to you as a fighter? >> I represent Kings Combat Sports and Yukubian Muay Thai.
  The gym means everything to me. We're like all ride or dies for each other, you
  know. Um we're all big family. This gym means a lot. Gave me everything that I have
  today. I can't, you know, I don't have anything without my without um Sean, Rob,
  Sir Lewis, and all the people that I met throughout my life and those gyms. I can't
  see anything besides going here or going to um Yakubian Muay Thai. You know, those
  gyms are like what made me who I am today. So those gyms are just everything to
  me. >> What has been this biggest setback that you'd say you've had in your career?
  >> I don't even know if it's a setback because I always like to say having a plan
  B is always unnecessary cuz plan A might not go out. So I feel like I don't I'm
  not going to call it a setback, but going to school cuz you know you have to put
  your attention in school. You're paying for it. But at the same time, you need to
  have a career outside of MMA because, you know, um, Peter Sugarfoot Cunningham once
  said that we're all bunch of shooting stars in the sport. So eventually we're going
  to shine bright than die out. So we always need something to make, you know, more
  money or something to make a livelihood after this profession. Even if you make
  it to the UFC, become a world champion, having something as a backup, like you know,
  being having a job or having a profession as a backup is always, always, always
  an amazing thing to have. >> When doubt creeps in, how do you personally reset and
  refocus >> through like Christ? I'm very religious, but not like as religious as
  other people. So like I feel like when I'm in doubt, I look to Christ and see um
  him giving me this dream as him telling me this is my calling. And then um when
  doubt also creeps in, I always think about my support system. You know, they're
  always pushing me. They're always telling me to go thing, go hard, go bigger, be
  better. Um I'm not I'm not just doing it for them. I'm doing it for myself also
  cuz you know like this is a single game. you know, we're even though um everyone
  else is prepar helping me prepare for war, I'm only I'm the only one going into
  that cage with maybe two people beside me. So, you know, when doubt creeps in, I
  just got God and my friends and family to always come and stray me into this good
  path. >> If someone is watching you for the first time this weekend, what do you
  hope they take away from seeing you compete? >> Man, I hope they take away um that
  I'm an entertaining fighter. I don't like, you know, I want to be an entertaining
  fighter. I don't want to be like a boring fighter. No point fighting. I just want
  to go for highlights, make people happy, and make sure they're make sure their money
  is worth, you know, cuz they're paying 85 bucks for them tickets. Make sure they
  got a good make sure they got a show. >> Finally, what's your last message before
  you fight this Saturday? >> My last message before I fight this Saturday is just
  be ready cuz I'm coming. >> Thank you for your time, Marcus. >> Thank you, bro.
