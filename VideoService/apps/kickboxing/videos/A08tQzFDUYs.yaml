transcript: She spammed one move for the entire fight and it worked. In her second
  K1 fight, Mona Kamura used a strategy that left traditional kickboxing fans both
  puzzled and impressed. She repeatedly used her front leg sidekick, known as a cut
  kick in taekwondo, just like a jab in boxing. In modern taekwondo, it's second nature,
  but in K1, it felt like a cheat code. Her opponent was completely lost and had no
  counter. If she stepped in, she ate a kick to the ribs. If she tried to throw hands,
  Mona was already slipping in punches behind the kick. Just one technique had her
  opponent stunlocked and led to three rounds of pure domination.
