transcript: Mike hit this on me the other day and it's super powerful. I didn't tap,
  but it did hurt. >> In many ankle locks, if you lose the knee line, you lose everything.
  But this one, you'll get the tap. If you have a good bite on the ankle and he starts
  to push down on your leg and escape the knee line, you can still put your butterfly
  hook in, throw your leg over, and get the tap.
