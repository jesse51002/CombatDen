  now helping to control panzer's right leg panzer realizes his leg is in danger so
  he's gonna stand up turn and try to running man out of there basically yanking his
  leg free is the goal but craig is hip to this game and he's got a very strong grip
  on panza's leg look at craig just going for a little ride he's got such a tight
