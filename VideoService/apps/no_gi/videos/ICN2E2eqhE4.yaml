transcript: what's up folks so as promised this is my first ever intermediate Jiu
  Jitsu competition for those of you who are new to the channel I wrestled for three
  years in high school and I've been doing Jiu Jitsu for eight months at the time
  of this tournament I'm still a white belt and I've competed in a few tournaments
  as my opponent immediately pulls guard but I decided to challenge myself and compete
  against all blue belts in a in the Naga rule set that's totally new to me so in
  case you don't know under Naga rules at the intermediate level all Leg attacks are
  legal whereas most organizations don't allow certain leg locks until the brown or
  black belt level but all that said I'm still confident and you know I feel ready
  to compete at this level I'm circling around him trying to pass his guard in a little
  bit of a half Nelson grip which will end up being key in this video and I slowly
  move into side control and I get two points for the pass so right here I have a
  half Nelson grip on his head so it's not like a traditional Jiu Jitsu crossface
  where I would be reaching under the near side of his head I go over the far side
  and in this position um there's not much he can do except what he did right there
  which is just hit me off but the reason this is key is because every time I switch
  my arm to the other side of his head which I'm about to do here he throws up a buggy
  choke like right there my arm comes over boom yeah just like that and I'm putting
  pressure on his neck and pushing him down and just trying to create space in between
  us but since he throws up that Bucky choke you know he gets out of side control
  so it's a good way to create space even if you don't get the submission um so we're
  back to where we started I slip on a little pool of sweat there it's pretty clear
  this guy is not interested in wrestling with me which if you've seen my other videos
  is kind of new to me honestly I don't think I've gone against anyone who decided
  to just pull guard immediately um so it's kind of cool you know like the pace of
  this match was totally different than you know what I'm used to competing in novice
  and beginner grappling competitions so again I have this half Nelson Guillotine
  grip on his neck there's probably an opportunity to go north south there but he
  starts to hip up I just retain control of his head and look for his far hip and
  just drive him back onto his back so one thing that I'm thinking about in this match
  is I feel like I was stalling a little bit again I reach on the other side of his
  head he goes for a buggy choke but the reason that I was switching my grips around
  his head was it felt like I needed to create more action and that just might be
  because my head is moving a million miles an hour during these matches and I wasn't
  thinking of going for you know like a submission in north south like I should have
  been so uh pretty much all points in Naga are worth two points so a guard pass amount
  whatever that's all two points and submission attempts are one point so the rules
  are set up to incentivize submissions which which is kind of cool because you know
  that's kind of the whole point of this martial art I'm in a neon belly and I go
  into Mount and I get two points so I'm up six one two minutes left in the match
  I'm here in Mount which is a good position for me but I'm a little bit high and
  he throws in his right leg and gets into a leg attack again I get a guard pass for
  that one and in this match I'm not thinking about you know how I'm controlling his
  head you know I'm not noticing that when I reach from the other side that's when
  the buggy comes this that's totally just from watching this match back um but I
  go for a chair sit there but he's slippery and quick and he kind of Beats me to
  that angle so nothing comes of that we stand back up and he pulls guard right away
  You're supposed to make contact with your opponent before you sit down um that time
  I'm not sure about but earlier in the match he did do that and here she scooch his
  butt underneath me grabs my leg and this is you know clearly where this guy wants
  to be so I'm doing my best to keep my weight on my feet to not let him put my weight
  in my hands and extend me but he gets my leg fully extended there and gets me with
  the knee bar I was up seven points with less than 30 seconds left and the dude gets
  me with a knee bar I am not Advanced enough to break down what's happening here
  um I reviewed knee bars and a lot of other legs stuff right after this competition
  this is not ah it's hard for me to watch a little bit my leg definitely got a little
