transcript: 'yeah you''re going to compete the way you

  train you''re performance isn''t gonna elevate on

  competition day you''re gonna do exactly what you do in the gym so that''s another

  thing to remember a lot of guys think like something magics can happen you

  know what I mean on competition day you performance doesn''t elevate it falls to
  the level of training so I think we the habits you make in the gym you do in

  competition day so I see a lot of guys when they get past if they''re tired or

  something they''ll let the guy pass and they won''t try and fight you know you

  don''t hold the position for three seconds or maybe they''re getting swept

  and they just sort of lazily accept the sweep so like you can expect to do that

  in a gym and then react appropriately on the competition mats in a high-pressure

  scenario you''re probably gonna be more likely to do what you''re doing in the

  gym because that''s instinct taking over so I think that''s very

  important as well'
