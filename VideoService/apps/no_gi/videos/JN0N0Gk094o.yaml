transcript: And this will be the most common for me, right? As they establish some
  form of cross face, as they pass, as they go to side control, >> [snorts] >> if
  you pass me, I slip and I'm turning belly down and I'm chasing this hip space here.
  I'm not making space. I chase that hip pocket here and I have my elbow close to
  my body here. This allows a real good bounce up. I can push onto his leg bring my
  knee up and step behind.
