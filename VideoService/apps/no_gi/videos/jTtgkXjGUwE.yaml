  most interesting detail which will go deeper into later on his lapel grip near his
  opponent's midsection in an ideal scenario leprey's number one option from the pocket
  is a knee cut like so where he quickly enters a position and beats the frames and
  pins his opponent's light to the mat as he cuts clean through the guard although
  this exact situation is ideal it's not so common because often his opponents are
  ready to defend the knee cut with frames or guards of Their Own but because of the
  fact that the knee cut is arguably leprey's best technique from the pocket he has
  many answers for the common defenses and guards he faced whether it result in finishing
  the knee cut pass or chaining into another technique so let's look at how Library
  neutralized common defenses such as the knee shield and the leg pommel and as you'll
  see leprey's approach to passing the knee shield and guard passing as a whole was
  a total opposite of rigid through movement he would constantly look to go through
  or around the shield challenging the guard in both directions an effective way lepre
  made his way through the knee Shield was by walking his opponent's hip center as
  he opened his knee out to create room to get his elbow in his ideal pocket position
  and then quickly cut back through for the knee cut now here are a few examples of
  leopardy going around the knee Shield here with his opponent out of position and
  late to throw up the shield it's kinda hard to see but lepre drives his knee to
  the mat as he pulls up on the sleeve and circles around the shield to finish the
  pass when looking to go in the other direction leper usually stuffed the shield
  and transitioned into the leg weave now onto the leg Pummel defense the way leopardy
  would deal with the leg Pummel was a thing of beauty showcasing a high level of
  timing and awareness as the opponent would throw the leg in to defend the knee cut
  lepre would quickly re-grip high up on the collar and yank their upper body off
  the mat forcing them into this sort of congested position from here he'd make his
  way around the guard and at the very least chain into other passes this leg Pummel
  defense leads me to the next branch in the tree of lepri's pocket passing system
  dealing with the lasso guard the lasso can be a great way to tie up the opponent
  and create an annoying obstacle for the passer to have to deal with unfortunately
  for his opponents lepre was well known for his ability to dismantle the lasso guard
  and as for nearly any defense against any guard the best way to counter is to not
  get stuck in it in the first place for this reason let reuse details like driving
  his knee into the thigh of the lasso leg ing his elbow in and out at the right moments
  and driving his shoulder downward all of which created pressure to help make it
  really difficult for his opponent to establish an actual lasso control now leprey's
  lapel grip from the pocket along with his constant manipulation of the elbow was
  a huge reason as to why he was not only effective at preventing the lasso but also
  at beating the lasso the script would serve as an anchor while he used his elbow
