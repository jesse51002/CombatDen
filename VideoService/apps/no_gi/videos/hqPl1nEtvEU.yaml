transcript: 'well actually since purple belt I''ve been

  working on this Z guard style of sort of like half guard like I found I never

  really liked playing the underhook half guard because of always being on a lanky

  guy I guess like pretty physically weak compared to a lot of

  those uh muscley smaller guys so I always found like if I tried to play underhook

  half guard it was like there''s a rough time again I got a skinny neck so I get

  guillotine darced so sort of like I like the idea of having the knee up there to

  keep some distance but in but instead of the traditional sort of knee shield

  where you rest the knee on the pec I found myself playing quite a low knee shield

  so like right on the hip and that''s that''s the main Gard I play now and

  another factor is I play it on people''s weaker side so a lot of people will pull

  half guard and knee shield and they like to play it on the opponent''s right leg
  I

  like to mix it up and throw it on the left leg I actually just did this

  because my first coach was left-handed and taught everything on that side but in

  retrospect I think it''s very good strategically like it''s great to play an

  offensive guard on a side people spend maybe ten percent of their training time

  in'
