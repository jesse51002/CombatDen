transcript: Three tips to improve your guard retention. So the first one is we need
  to first frame as early as possible with a stiff arm frame. Make sure you get in
  where your arm can be straight. When your arm is straight, you can replace it with
  your leg. Okay? Then we can get our leg back in front and start to recover. Okay?
  So very early when someone goes left or right, we already want our arm in so we
  can then recover with our legs. Second, we want to self frame if we're being turned
  away. I'm going to frame on my own on the ground with my elbow, creating this connection
  to the ground. So when he pushes, I cannot be turned away. This this prevents me
  facing away and allows me to still recover my legs. Okay. Preferably though, we're
  so far on our side facing them that they try to turn us away and that's difficult
  by itself. But when we are being turned, we go here. Lastly, look for an armpit.
  Okay. So, anytime he makes an angle, I always try to hook an armpit. This is great
  because it still acts as a frame. He tries to come in, I can use that to recover
  and make distance if need be. Hook stay attached and start to tie my opponent up.
  Okay, that also saves us if he runs around to north south. He goes to north south
  to see that hook.
