transcript: Who says white belts shouldn't do leg locks? A lot of people say that.
  The thing with leg locks is there's certain leg locks where if it comes on quick
  and strong, your knee just pops. There's no pain. So, when you do typical heel hooks,
  when I twist his heel up and around, this is going to pop here. Once I get him to
  here where it's at its tightest point, he feels a little pressure but no pain. And
  then if he doesn't know what's going on or understand it as a white belt and I keep
  going, it goes from no pain to pop. But ankle locks is this tendon here. When I
  extend an ankle lock, he's going to feel severe pain. And on a lot of bit of pain,
  he can choose to tap. But here, there's like two levels. There's no severe pain
  before the pop. This is more safe to do a straight ankle when you're a white belt.
  It gives your partner time to tap. I would say straight ankle locks are the way
  to go until you hit blue or purple. Should white belts be doing heel hooks, knee
  bars, tow holds, ankle locks, or should they just do straight ankles? Tell me what
  you think.
