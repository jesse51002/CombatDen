transcript: 'The ADCC West Coast Trials just wrapped up last weekend. And even with
  all the controversy around ADCC over the last few years, it''s still one of the
  most exciting events in grappling right now. And this event had a lot of standout
  performances, but it also gave us a really interesting snapshot of where modern
  nogi is heading. Because when you look back at the weekend, a few athletes clearly
  separated themselves, and a few submission trends kept showing up over and over
  again. [music] More than anything else, I kept seeing three finishes. Strangles
  from the back, ankle locks, specifically belly down, and armbars. So, in this video,
  I want to break down the standout performances from the event, the biggest submission
  patterns we saw, and what all of it tells us about the current nogi meta and where
  it''s heading. Every year, Trials gets more and more stacked. The level of jiu-jitsu
  keeps improving, and even making it to day two can be difficult for seasoned grapplers.
  One thing that really stood out to me among the athletes who battled their way through
  these divisions is this: >> [music] >> They were all extremely well-rounded. Of
  course, you still have specialists, guys who lean heavily into wrestling or leg
  locks, but when you look at the people who made it to the podium, the common thread
  was how dangerous they were in multiple areas. Wrestling, [music] leg locks, scrambles,
  and back takes all played a huge role in their path to victory. Now, everybody that
  won their division had standout performances. To start, Gianni Grippo had a phenomenal
  performance in the 66 kg division. I originally had Dominic Majer winning the division,
  and he came close, but Gianni really showed how much he''s adapted his game to the
  modern nogi meta training at Bodega Jiu-Jitsu. Maybe [music] ego is the way. What
  really impressed me was how Gianni used his guard to sweep, come up on top, pass,
  and expose the back. Once he was on the back, he strangled the majority of his opponents.
  Both of the Sans brothers looked fantastic, with Michael Sans taking gold in the
  77 kg division. The Sans brothers are one of the clearest examples of what modern
  jiu-jitsu is looking like at the highest level. Lots of scrambling, strong wrestling,
  back attacks, and enough leg lock and guard skills to be dangerous from everywhere.
  Michael had a really tough finals match against Max Hanson. I actually thought that
  Max had a real chance to win it, but Michael was able to edge out the decision victory
  in a very competitive match. Nathan Haddad was definitely one of my favorite performances
  of the entire event. He''s a guy who''s come up just a little short in some big
  events like the UFC BJJ, so seeing him finally put it together here was awesome.
  His match against Jaden Groner was one of the most electrifying matches of the entire
  weekend. Jaden was one of my favorite athletes from the recent PGF. He started that
  season a little slower, but improved drastically over the course of it, showing
  that he''s a real true high-level grappler. And I was really rooting for him here
  at Trials. Jaden was actually up 6 to 0 against Nathan, and at about 15 seconds
  left in the match, Nathan jumped on a Kimura from headquarters and transitioned
  right into the armbar and got the finish just with the clock running out. That was
  one of the biggest moments of the event, and it was an insane comeback and a perfect
  example of why you can never relax against someone who can threaten upper body submissions
  that quickly. And Nathan was able to carry that momentum all the way through to
  the finals, where he faced off against Ryan Eaken. Not winning a lot of my bets
  here at this Trials. I had my money on Ryan winning that division, but I think Nathan
  really got a power up from that win against Groner and got the win. In the under
  99 kg division, Elder Cruz was able to wrestle his way to victory in the finals.
  This division has improved drastically over the years. We''re seeing a lot more
  guard work and a lot more leg lock awareness at the heavyweights than we used to.
  But strong wrestling still matters a lot, and Elder did a great job using that to
  control the division. In the over 99 kg division, as expected, Nick Hartman ran
  through the bracket and took gold, finishing his finals match with a straight ankle
  lock. I think Nick has a very real chance of making serious noise at ADCC Worlds
  this year. He''s a dangerous reminder that even at the highest level, basic mechanics
  done at an elite level are still enough to finish anybody. On the women''s side,
  this event was just as exciting, if not more. In the 55 kg division, Shelia Lindsey
  submitted five out of her six opponents on the way to gold. She''s a great example
  of why getting to the back and finishing with a strangle is still one of the most
  important skills in nogi. Efficient, repeatable, and reliable under pressure. The
  same thing could be said for Sara McMann in the 65 kg division, who mixed together
  back strangles and arm locks on her way to victory and punched her ticket to ADCC.
  And then, in the 65+ kg division, Paige VanZant getting the gold was not a surprise
  to me at all. I did think Jocelyn Molina had a very real chance to making the podium
  or potentially contending for that top spot, though. As always, the ADCC Trials
  is a blast to watch. Honestly, battling your way through those brackets can feel
  just as hard as the ADCC Championships themselves. But beyond the individual performances,
  the other thing that really stood out across the entire weekend was the kind of
  we kept seeing over and over again. And when the same submissions keep showing up
  at this level, that usually tells you something important about where the sport
  is heading. And like I said earlier, I really think three submissions stood out
  more than anything else. Back strangles, armbars, and ankle locks. Back strangles
  are never a surprise in nogi. The back is still king. But what''s interesting is
  how people are exposing the back now. With so much more wrestling, so much more
  turtling, and so much more scrambling in modern nogi, there are way more opportunities
  to jump on the back and transition than there used to be. The armbars were really
  interesting, too. Generally, kimuras have been a little more popular in recent years,
  but now we''re seeing more situations where athletes are latching onto an arm and
  carrying that control all the way through to the finish. With rout drags becoming
  more common when passing the guard, and more people using Kimura to armbar sequences
  during guard passing and scrambling exchanges, the armbar is showing up again in
  a big way. We even saw a lot of armbars from closed guard, and we''re continuing
  to see Troy bar entries and armbar transitions from half guard scenarios as well.
  So, while the armbar is usually difficult to get in the slippery nogi setting, we''re
  seeing people adapt their style into attacking it in a different way. And then,
  the last one is the ankle lock. This one is really interesting because leg lock
  trends always seem to swing back and forth between cross ashi, 50/50 backside entries,
  heel hooks, and then return back to straight ankle locks. But this weekend, I felt
  like I saw more straight ankle locks and ankle lock variations than heel hooks.
  We''re seeing more belly down finishes, more clean breaking mechanics from basic
  ashi garami positions, and more athletes finishing from what looked like simple
  entries. Nick Hartman literally won his finals match with a very basic ashi garami
  ankle lock. And that''s what makes it so interesting. The leg lock game can get
  incredibly sophisticated, but events like this remind you how important it is that
  fundamentals still work. If your straight ankle lock from ashi garami is still sharp,
  it can still be one of the most dangerous weapons in your entire game. As always,
  ADCC Trials never disappoints. It''s always an electrifying weekend, and this year
  was no different. Between the standout performances, the level of well-roundedness
  across the division, and the submission trends we kept seeing over and over again,
  >> [music] >> I think this year''s ADCC is going to be incredibly entertaining.
  There are more complete athletes than ever, and that always makes for a better tournament.
  Next [music] week, we''re also looking to finally launch our Patreon. So, if you
  enjoy this style of analytical jiu-jitsu breakdown, definitely go check that out.
  We''ll be releasing blueprints, which are basically study guides for a lot of our
  concept-based videos, along with other exclusive content. So, whether you want a
  study guide to pair with one of our videos, or just a quick refresher before class,
  we''ll be dropping that content on a monthly basis. I''ll see you guys on the next
  one.'
