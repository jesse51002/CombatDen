transcript: Rolling more is not the same as improving faster. This is the lesson from
  the book P by Anders Ericson and Robert P which shows that progress comes from deliberate
  practice. Leaving in the weak link until it changes. Go back to the exact spot where
  you failed. Slow it down and repeat only the part that broke. One clean rep is worth
  10 messy ones. Add quick feedback from a coach or partner and stop the moment quality
  drops. This is practice that targets errors and uses constant feedback. When the
  same situation appears in life training, the answer feels familiar because you have
  carved it into your body. Subscribe for more and check the description and pinned
  comment for deeper study.
