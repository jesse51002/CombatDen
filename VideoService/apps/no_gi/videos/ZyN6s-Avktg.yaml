transcript: Jitsu is a waste of time to learn and I just lost the last 15 years of
  my life doing it throughout the years of training I thought I was learning the best
  martial art a real superpower I was convinced that you could beat people of a bigger
  size even if they're 260 bro walk around with a fresh ego knowing you're safe and
  could defend yourself and that I would be learning valuable skills for the real
  world from coveted professors but it turns out just the opposite was true instead
  what I racked up from all those years was a list of regrets and the worst one being
  regret number one injuries have you seen this clip couldn't walk right for months
  or have you ever shot a double leg and been Sprout on just right and tore your shoulder
  in Jitsu we love to tell people that it's fun and a safe sport YouTubers talk about
  MTH safety coaches talk about band moves and people claim they don't roll hard in
  the gym yet everyone I know starts Jitsu looking like this and changes into this
  a few years later let's be honest here the sport is about breaking Limbs and choking
  people unconscious and we pretend that will never happen to you it goes as far as
  saying Jiu-Jitsu is a gentle art when this is the reality when we say shujitsu is
  a gentle art we mean that regret number two the ego a famous quote for Jitsu is
  to leave your ego at the door this is a great model because you can strip yourself
  of worries and just spend time learning but instead of that happening my Reddit
  is stuffed with people crying about eagles in the sport the ultimate goal of any
  martial art is tranquility and self-respect so let me show you the top athletes
  of the sport and tell me if they're using it even the founders of the sport didn't
  believe in this as they would kick you out the gym if you even had the thought of
  training elsewhere have a friend in another gym banned you're a paying member of
  a gym you should be treated well however that just isn't the case when ego is involved
  in the sport and it especially plays a role in regret number three the belt we practice
  a sport where you wear a fancy uniform wrestle around some pajamas and one mythical
  thing holds the whole outfit together the belt this belt is supposed to represent
  your expertise in the sport if you're higher ranked than someone else they're basically
  a free meal to you right wrong there are no Universal standards to who gets what
  belt JSU is a sport that requires money to operate and be successful business but
  the students pay those bills and they want to see their time is rewarded so they
  all obsess over the cloth around their waist gym professors rank up students on
  a whim have standards different from everybody else and some gyms even charge more
  than $100 just to rank up instead of trying to better yourself the students just
  want to chase a shiny new color I regret doing jiujitsu because I was robbed of
  my time I spent 15 years learning a sport where I'd be walking away practically
  paralyzed I'm still extremely cocky and even though I have a black belt does it
  even matter when Professor Amazon can just promote you the only other regret I have
  is that you watched this video on April 1st and took the video seriously while commenting
  an essay on how I'm wrong
