transcript: i made my friend nick a normal dude who sucked at jiu jitsu into a jiu
  jitsu champion in just 30 days here's how it happened the first thing i did was
  spar with nick to see how much he had to improve to start the roll off i just stand
  up and push next me away to pass his legs i knee slice over nick's frame and then
  i staple his arm and start looking for the kimura i get the grip and i bring nick's
  hand behind his back to get the tap i could already tell nick had a long way to
  go at the end of the 30 days nick was gonna compete in the jujitsu tournament for
  the first time and i want to make sure he'd win you might wonder why well it's because
  nick was actually the one that got me into jiu jitsu years ago we would wrestle
  all the time using moves we saw in ufc after high school i joined the gym and started
  training all the time while nick who was focused on school just practiced occasionally
  at this college club nick told me that he wanted to take jujitsu more seriously
  so i swore to myself that over his winter break i'd make him into a jiu jitsu monster
  we only had so much time so i mainly helped nick with his guard do the calendar
  we had similar body types so i tried showing him my game specifically i helped him
  get better at guard retention butterfly guard and single leg x after two weeks it
  seemed like he was really picking it up fast so i had him roll with brandon a newly
  promoted purple belt to see how far he's come at the start of the roll nick arm
  drags brandon and starts looking for the bath but since he doesn't know how to wrestle
  he just sits back down the tides turn as brandon goes for a rolling kimora on nick
  he gets the grip but luckily nick's able to turn into him before he gets his back
  taken nick drops down and starts looking to pass brendan's legs but he leaves an
  opening for an underhook brandon takes advantage of this by trapping nick's arm
  and sweeping him brandon starts knee slicing and you can hear my stellar coaching
  coming in handy up frame now don't grab don't keep grabbing the leg frame frame
  don't keep grabbing the leg oh it's stuck that's pretty tough [Music] hey turn get
  on top nick may have gotten beaten up but in that role i saw a lot of improvement
  so we kept polishing up his game and started making a game plan for the competition
  a lot of people were commenting on how it was getting really annoying to get past
  nick's legs so the plan was to start on bottom and use single leg x sweeps to get
  points or go for submissions get on top or go for the straight ankle the reason
  i want nick to work on single leg x was because he was entering a beginner level
  competition and in beginner level competitions a lot of people keep their legs wide
  open which makes them susceptible to single leg x we also worked as bar flight guard
  just in case someone stayed on their knees and wouldn't let nick get under them
  but we only had a limited amount of time so we couldn't work his top game very much
  so when nick was on top we were just gonna hope for the best having a game plan
  is one thing but executing it is another so arranged for nick to roll with john
  carlo a former power lifter that outweighed him in this role i asked them both to
  roll like it was a match with points and i told nick to execute the game plan and
  he did just that he used his butterfly guard and even hit the single leg x we were
  working on his top game needed some work but he had improved a lot this improvement
  wasn't just for me drilling with him and giving him technical advice there was more
  to it in the beginning i explained to nick that if he wanted to get really good
  he had to put in work on and off the mats most people aren't willing to do this
  but nick was different he was coming in every day with specific moves he was trying
  to practice after his roles he would take time to analyze what worked and what didn't
  he was going out of his way to watch instructionals to level up his game knowing
  all of this i was excited to see what would happen at the competition but before
  nick could compete he had an arguably greater challenge he had to cut way that's
  right on the day of the competition nick would be cutting five pounds of water weight
  this was the first time nick had ever cub weed and on the right up i could tell
  it was a big thing on his mind as soon as we arrived nick had to start cutting wheat
  it was freezing cold outside so nick was forced to run back and forth in the venue
  until he lost the pounds i could tell it was a big mental challenge for him but
  after about an hour of running and almost passing out on the toilet nick lost the
  weight and was ready to compete it was time for nick's first match would nick keep
  his cool or would he gas out from adrenaline let's find out nick starts to match
  on bottom because we knew it would be really hard for someone to get past his legs
