transcript: the old school mentality of jiu jitsu encourages upper body joint locks
  and chokes and discourages lower body joint locks like heel hooks but now we see
  athletes using leg configurations with very weird names that allow them to control
  their opponent and ultimately submit them so now for the first time just as you
  can do an armbar from guard or an armbar from mount you can do an inside heel hook
  from inside senkaku or 5050 the goal of this video is to discuss the six main leg
  configurations we use to control our opponent and the pros and cons associated with
  each of them [Music] before we dive into the video there's an organization called
  st baldrick's where people shave their heads to raise money and awareness for childhood
  cancer i've been participating in this for 20 years and if you're interested in
  learning more about it donating or even participating the link will be in the description
  below now let's get into the video the term ashigorami just means leg entanglement
  so it refers to any of the leg entanglements we're going to be talking about in
  this video and this video here does a great job of outlining the names of each position
  so i'll leave that link in the description below and just kind of run through it
  quickly myself here but for more detail i recommend you check out that video our
  first sashi gourami is a version of a straight ashi gourami because our opponent's
  left leg is going across our right hip this is called irimi ashigorami or better
  known as single leg x our second ashigurami is across ashigorami because our opponent's
  left leg is going across our right hip so if their leg crosses our center line it's
  called across ashigorami and if you notice in both of these scenarios we have one
  foot on the outside and one foot on the inside of our opponent's hip so if our legs
  are configured in this manner if it's a straight ashi gourami we refer to it as
  an arimiyashi and if it's a krasashigurami we refer to it as krasashi now for an
  estradashigurami we have the option to either throw our feet to the inside or to
  the outside if we throw our feet to the inside like we see here we call this an
  inside ashi if we throw our feet to the inside from across ashigurami scenario we
  refer to that as inside senkaku if we have a straight ashi gourami with both our
  feet on the outside that is outside ashi and if we have a cross ashi gourami with
  both our feet on the outside that is referred to as 50 50. and there you have it
  those are the six basic forms of ashigrami and although it might seem silly it's
  super important to be able to distinguish between these positions very quickly i'm
  going through this book called the talent code which i was able to purchase with
  the money from patreon so thank you all for the support and in the talent code they
  talk about this study that was done involving a group of chess masters as well as
  beginner chess players they presented both the masters and the beginners with kind
  of screenshots of famous matches and asked them to recall where the pieces were
  on the board now the masters of chess that understood what was happening were able
  to recall with much higher accuracy where the pieces were on the board compared
  to the beginners who just looked at it as a random assortment of pieces now for
  the second round instead of taking screenshots of actual chess games they just put
  the pieces in random spots around the board and in this round there was no difference
  between the masters or the beginners so what this tells us is that a master doesn't
  have a photographic memory they have the same memory as a beginner what makes them
  a master is their ability to recognize positions so hopefully this helps drive home
  the point of how important of a video this is for our jiu jitsu development each
  of these ashi gouramis offer a varying degree of back exposure and counter leglock
  exposure to our opponent so we're going to go through and rank these positions based
  on the amount of back exposure and counter leg lock exposure that they offer for
  miyashi gourami it does offer your opponent some ability to counter leglock you
  so that is why i put that as a two but i put back exposure as a one because although
  there is back exposure associated with this position i think it's relatively small
  compared to the other options such as inside ashi where if your opponent clears
  their knee line they're able to do a barambolo and try and take your back but i
  do think inside ashi offers less counter footlock exposure because you're able to
  off balance your opponent pretty easily so if they go after your foot you're able
  to off balance them and you have very quick access to their heel now outside ashi
  i think is the most dangerous position of them all because it offers a significant
  amount of back exposure as well as just counter submissions in general like an arm
  triangle [Music] it also gives your opponent a great deal of counter footlock options
  like we see here where we are countering outside ashi and entering into an inside
  senkaku of our own now if you have your opponent's heel wrapped and they're in a
  submission both of these can be mitigated right your opponent's not taking your
  back and not counter leg locking you if you have their heel and there are people
  like gordon that love outside osha and he uses it quite a bit you can see him transfer
  from 50 50 to outside ashi and begin to attack the heel hook now if they try and
  take your back there are ways to counter this and roll underneath and either come
  up on top and use it as a sweep or to invert into inside senkaku like we see here
  demonstrated by mike students over at the cave academy in pacifica california but
  for me right now i'm not too comfortable with those transitions and i find it a
  little bit scary to go to outside ashigurami if i don't already have their heel
  so that's why i ranked it as a 3 2 counter foot exposure and a 3 2 back exposure
  so now working right along into our cross ashi gourami it's kind of a transitional
  position where we can either throw our outside foot across to enter into insights
  and kaku or we throw our inside foot out to enter into 50 50. and generally we're
  relatively safe when we're in krasashigarami we're not too committed to anything
  so our foot exposure and back exposure are relatively small now when talking about
  back exposure from inside senkaku i think the most popular example is gordon ryan
  getting his back taken by philippe pena so there is a bit of back exposure associated
  with insights in kaku but i think the foot exposure associated with inside senkaku
  is a bit underrated and people are starting to defend inside senkaku with different
  counter leg locks of their own so that is why i have back exposure as a 3 and counter
  foot exposure as a 2. now 50 50 has a reputation of being a live by the sword die
  by the sword type of position where you can have a beautiful entry into 50 50 and
  then all of a sudden you're the one on the defensive so there is definitely counterfeit
  exposure we're offering to our opponent by choosing to enter into 5050 but with
  our feet on the outside of our opponent's body it makes it very difficult for them
  to take our back now that concludes the first half of the chart where basically
  it was all about how vulnerable ijashi gourami makes us to our opponents counter-attacks
  but that's not even the fun side the fun side of the chart is the attacking portion
  of the chart where we discuss how good each ashigorami is at exposing our opponent's
  heel and how much finishing power each ashi gourami gives us but in the interest
  of making these videos about 8 to 10 minutes long i'm gonna defer that to part two
  where we will fill in this chart and then discuss what i believe are the hierarchy
  of positions and basically answer patrick's comment here where we compare outside
  senkaku versus inside senkaku and what i believe more importantly is how to integrate
  these different positions into a system where we can work to get the finish so be
  sure to subscribe so you don't miss that share the video with your training partners
  and we'll see you in the next video [Music]
