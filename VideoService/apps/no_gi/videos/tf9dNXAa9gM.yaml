transcript: I'm just a blue belt but I decided to challenge myself by entering the
  expert division but there was no one in my weight class so I got moved up and had
  to face purple brown and black belts to outweighed me my first match is against
  a jacked purple belt the matches started but my opponent is already trying to finish
  it fast with the leg lock he kicks me in the armpit but my knee is freeze so I started
  trying to come on top he pushes me away and for some reason I decided to go for
  the flashiest iron bar possible but he just rips out of it this is definitely what
  I deserve after going for that I can tell at this point that he's just trying to
  leg lock me so as he comes up I lock up a shoulder crunch then use it to sweep him
  over into Mount when doing the shoulder crunch I like to push my elbow into their
  neck to help guide them over I made a full guide on how to do this sweep which I
  put in the link down below I was in a good spot that is until my opponent pushes
  my ankle away brings his knee inside and starts going for a leg lock this is where
  he wanted to be the whole match I started trying to get my foot inside I'm able
  to open up his legs SWAT his arm away and get up on top but my opponent does not
  want to stay down so I start getting pretty aggressive but it's for nothing because
  he's still able to get up I sit back down but then this happens I take a knee right
  to the eye but I just have to shake it off and keep going as he comes forward I
  enter into a leg lock on my own but he does a good job defending his right leg so
  I push him away and switch to his left leg I throw my leg over grab his heel and
  pull it across to get the tap with the heel hook with that match one it was time
  for my next match against Sebastian a really flexible brown belt he starts off the
  match with some crazy footwork but I'm able to get him into my butterfly half bird
  then I hit an arm drag and push him down to get on top I started smashing down he
  brings his leg over then starts going for a normal Plata I try getting my head in
  to avoid the shoulder lock but he's too flexible pull your arm out however the weakness
  of the Oma Plata is that there's not much stopping me from rolling with the pressure
  so I start to roll but Sebastian notices this and has a calendar ready he backsteps
  and looks for a triangle this was not going well for me but luckily I'm able to
  get my knee inside and start looking for a leg lock I kick him forward then as he
  turns I grab a heel hook would I be able to get two heel hook finishes in a row
  well no but I am able to get on top I show him that he's not the only one who can
  move his legs around in a fancy way I grab his leg and he turns away so I start
  smashing down but he grabs an overhook on my arm I'm afraid that this could turn
  into the same situation that happened before so I had to be careful I get around
  his hook but he still has a neat inside so I switch my hips and go neon belly but
  he turns away so I start looking to take his back I bring my leg across his hip
  then grab his wrist to start taking his back I'm so close to getting it right now
  but my positioning is off so I come up and bring my knee behind his back to take
  him over to the other side then I bring my other leg in as a hook I get four points
  for taking the back I was up on points now and I just had to get the submission
  I stayed here for a little bit looking for the choke but he's able to roll out and
  Escape this is my face when I think about how even if I win this back and forth
  match I'm still gonna have to go against a black belt in the next one but I have
  to forget about that and focus on the match when we reset he throws his arm through
  then goes to deep half guard he uses this to get on top if I grab around his neck
  and start going for a guillotine he spins out but I'm able to get on top I can tell
  by his breathing that he was getting tired so he started picking up the pace I get
  onto his back again but he has some great escapes [Music] now I'm feeling some Deja
  Vu because we end up in deep half guard once again and he uses it to get on top
  he pressures down into me so grab a collar tie and use it to sweep him over with
  a bar Flex Suite but he gets up before I can and starts running at me so I quickly
  invert then shortly after the match ends yes brother good job with me as the winner
  by points now it's time for me to face Louis a 170 pound black belt that puts on
  some heavy pressure I sit to guard then I connect my shin to his shin and start
  sliding under him I'm really looking for that shoulder crunch Louie's like nah take
  this can opener but I'm able to take advantage of his collar Tie by lifting him
  up and grabbing a pinch headlock but Louie does a really good defense he brings
  his legs up and drives into my neck this felt like a stalemate he couldn't really
  escape from here but it's also really hard for me to sweep him so I started trying
  to off balance in with my hooks I lock up a shoulder crunch but he starts putting
  even more pressure on my upper body I was getting tired and I really didn't know
  what to do that is until I remembered the words of John danaher I don't care where
  you are but I don't care where he is the one part of the body which is always exposed
  is legs and that's what I do I push on his armpits and enter into single leg X I
  knew this match was going to be a grind so if I could get the two points for coming
  on top here I'd be in a good spot but Louie gets an underhook on my leg then starts
  smashing down and before I knew it we end up in the same position again bruh I feel
  like the sweep really isn't happening from here so I put him in closed guard but
  in retrospect that was definitely a mistake he brings his arm around my head and
  starts pulling me in let me tell you guys something this sucked my back was already
  bothering me before this match and now I was just questioning why I decided to make
  Jiu Jitsu my career this was one of those weird positions I've never been in before
  and I had to figure out a way to escape it I started trying to get my hand in front
  of his face but I realized that if I do that he could go for his Americana so I
  decide against it I unlock my legs and start looking to take his back so Louis brings
  his arm around to stop me I was no longer getting crunched up into a ball and I
  could go back to oh my God try going for a scissors sweep but nope does not work
  pressure was getting more intense Louis steps over my leg and it looked like I was
  gonna get past my arm is trapped my spine was bent in a way it's not supposed to
  be and all I had was this little Barfly hook but he steps over that he looked like
  it was over until I break my knee inside I swing my hips to get him away from me
  time was running out and if I didn't act fast he'd win the match he stands up so
  I grabbed both his ankles and hit a single leg X sweep I was now up by two did he
  swept me back he likely win the match to secure the win I had to pass his guard
  but Louie is not making it easy for me he keeps pulling down in my head and trying
  to get his foot inside but the connection between my knee and my elbow stops him
  I wasn't sure which pass to go for but then I hear my corner Turtles to defend and
  as I take my leg out he rolls I follow him and we rolling to the table I start getting
  on top I grab a cross face and pass his guard now there's only 20 seconds left and
  I was up by five I just have to control him for these last 20 seconds [Music] [Music]
  and that's how I won the expert division at grappling Industries thanks to Louis
  for the match I think he originally signed up for the Masters division but we ended
  up getting merged together if you guys enjoyed make sure to subscribe and go to
  the link down below to learn how to do the shoulder crunch also I know some people
  are going to say that I should have been promoted already but I've only been the
  Bluebell for two years which is a normal amount of time
