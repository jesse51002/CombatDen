transcript: 'We''ve been looking at this idea of working

  from a cross ashi garami position. We''ve seen that from here I have both of my

  opponent''s legs in front of me - that''s a huge thing. That means I have both the
  primary and the secondary

  leg within my reach. And as a result we can put an unusual amount of control over
  our

  opponent''s movement. We''ve see that from any given cross ashi garami

  situation we can come through and secure the secondary leg and bind up my opponent''s
  legs

  into an ankle-lace ashi garami. Once I lace my opponent''s two legs, essentially

  you''ve shackled your opponent''s legs. You''ve robbed him of whatever athleticism

  he has at this point. As he goes to twist and turn to get out of

  here, it''s a very difficult thing. I have a free hand to defend myself with. But
  at some point we''ve got to make the transition

  from control, to breaking. One excellent way we can do this is through

  the notion of dilemma. I can create a severe threat of break on the

  secondary leg, to setup a break on the primary leg. One of our favorite ways to
  do this is through

  the use of an achilles lock. A common problem I see with achilles locks

  is people will lock far too high on their opponent''s leg. So what I''m going to
  do is use a different

  form of grip where I go underneath my own arm. This means when my left arm emerges
  it will

  be ideally placed directly at the ankle instead of poorly placed up here on the
  shin. So as we come through I go underneath and

  I lock the figure of four. When I get the figure of four I make my fist

  strong so there''s tension running through my body. Now directionality of force
  is going to be

  extremely important here. I don''t want to dissipate forces by falling

  in the wrong directions. I want to square my shoulders up to Josh and

  turn into my opponent. As a result, I can drive into a very, very

  strong form of achilles lock. My opponent''s only real reaction is to try

  and break the grip of my hands. So Josh has to commit to coming forward and

  fighting my hands and extracting his leg. As I go in, and he goes in together, we
  get

  into a strong hand fight situation. It looks like I''m losing the hand fight, and

  the truth is - I am. But I don''t care. As my opponent wins the hand fight and extracts

  his leg, I gain what I really wanted all along the second horn of the dilemma, and
  we lock up

  into a punishing position here with an even stronger lock - the inside heel hook.
  This is key to your development - the idea

  of constructing dilemmas wherever we can. I create a dilemma here between a break
  on

  the secondary leg and a break (an even worse break) on the primary. Once again,
  we use the ankle lace ashi garami

  to slow down our opponent''s movement but at some point you''ve got to go beyond
  slowing

  an opponent down, to actually breaking an opponent. So we come forward, switch,
  always making

  sure I go under my arm - rather than in front which would create poor breaking conditions.
  As I go through, I lock, I don''t put my hand

  on him, we create tension, locking, turning and squaring up to create strong breaking

  pressure. My opponent has to react to that, or he''ll

  break right here. That''s the first horn of the dilemma. As he comes forward to
  fight the hands, we

  get into a strong hand fight, I feel I''m losing the secondary leg, I let it go.
  As he pops out, I gain the leg I wanted all

  along - the primary leg. From here we can lock up in various ways. If I see my opponent''s
  hips coming up, I will

  switch from a regular cross ashi garami to an inside sankaku and from here we get
  tremendous

  breaking pressure.'
