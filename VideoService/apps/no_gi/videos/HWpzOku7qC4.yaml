transcript: The front headlock might be the best system in no gi jiu-jitsu. If you're
  not using it, your game is missing one of the most important positions in modern
  grappling because the front headlock isn't just about guillotines. It's one of the
  best ways to shut down shots, control scrambles, >> [music] >> and take the back.
  So, today we're going to break down why the front headlock is so dominant, what
  makes it work at the highest level, and how you can start using it as a full system
  in your own game. >> [music] >> If you want the study guide to pair with this video,
  our Patreon will be going live next week. We'll have blueprint study guides for
  concept videos like this that you can follow along with or study before you go to
  class. The front headlock is one of the best control positions in grappling. At
  its [music] core, the front headlock is when your partner's head is underneath your
  chest. One hand is controlling a chin strap on their chin, and your second arm is
  either controlling the back of the tricep or digging for an underhook. Your shoulder
  stays heavy on the back of their neck, and your head stays down on their back to
  keep them trapped underneath you. From here, we have three major threats. Submissions,
  rolling them over and taking top position, or rotating to the back. The first goal
  from the front headlock is simple. Keep your partner grounded on their knees and
  elbows. That's what makes almost all of our offense work. We use the chin strap
  and the tricep control to constantly pull their head back down and keep them from
  building back up. Personally, I prefer to have one knee on the floor and one leg
  up so I can stay mobile and continue to drag them down and adjust as I need to.
  Once that control is established, that's when the rest of the system starts opening
  up. So, now that we understand what the front headlock is, the next question is,
  why is this position so important? Because no gi is built around transitions, scrambles,
  and forcing reactions. And the front headlock solves all three. No gi can be chaotic
  because of the lack of grips and the slippery nature of the sport. In the gi, we
  have a lot more ways to slow things down and control people with sleeve grips, collar
  grips, and pant grips. In no-gi, we don't have nearly as many of those options.
  And that's what makes the front headlock so valuable. It's one of the best grips
  you can get in grappling because it does one of the most important things in the
  sport. It controls your opponent's posture and takes their spine out of alignment.
  And once you do that, it becomes much harder for them to build back up, wrestle,
  or create meaningful offense. A lot of people coming over from gi jiu-jitsu are
  used to starting their offense only once they get to side control, mount, or the
  back. The front headlock kind of bypasses all that. It lets you start your offense
  before you've fully stabilized a traditional dominant position. And that's a huge
  deal in no-gi because the best grapplers don't always wait until everything is clean
  and [music] settled. What I think is one of the best parts of the front headlock
  is just how many ways you can enter into it. It's very similar to the Kimura trap
  in that way. You can find front headlock entries almost everywhere. [music] You
  can hit it from standing, whether you're being proactive with snap downs, or reacting
  off a bad shot. You can find it while you're passing the guard, whether standing
  or half guard. You can find it while playing guard with snap downs. And you can
  find it all throughout scrambles, anytime you're able to get higher than your opponent's
  head. All you need to do is get their head [music] underneath your armpit. That's
  what makes it so valuable as a system. The entries [music] are everywhere. One of
  my favorite examples is when you're falling off the back during a back take, and
  instead of losing the position completely, you simply switch over and catch the
  front headlock. That's a perfect example of how this position lets you turn a messy
  transition into control. The most obvious attacks from the front headlock are the
  chokes. The two most common guillotine variations are the arm-in guillotine, where
  your partner's head and arm are inside [music] of the choke, and then a traditional
  guillotine, where it's just your opponent's neck between your two arms. The arm-in
  guillotine variation gives you a little more control. One of your arms is underneath
  your armpit connecting to your choke arm. Arm-in guillotines usually take a little
  more precision and power to finish. Whereas the traditional guillotine has much
  stronger finishing power, but it offers less control. With that being said, one
  of the strongest finishing variations is the high-wrist guillotine, where you get
  your arm all the way around their neck and your knuckles go up past their shoulder
  line. This variation creates a very strong, clean blood choke. Whereas the variation
  where your wrist is lower on your opponent's neck usually is a air choke, which
  is not my preferred way to choke somebody. Recently, Gordon Ryan has came up with
  a variation where he has an arm-in for the control and the high-wrist for the finishing
  power. If you're able to lock this in, Gordon is quoted as saying, "This is probably
  the strongest choke in jujitsu." When we finish guillotines, there are really three
  main positions we're looking for. The most controlling option is pulling them into
  closed guard, but that's usually harder to get against good people. Getting your
  leg all the way through and cleared is difficult. More often, if we can't fully
  close our guard, we'll use one leg as a frame on the hip, and then throw the other
  leg over the back to stop them from jumping to the opposite side. That little detail
  is huge. When you attack guillotines, you want your opponent's head and body on
  the same side as yours. If their head is on one side and their body is on the other,
  they can pass your guard and put you in a bad position. When we put the leg over
  the back, your opponent is forced to fall to the other side. A lot of your opponents
  will also try to roll through to escape on that side. This puts us into a position
  we call the inverted front headlock. This position is simply the front headlock
  position, but flipped upside down with both of our backs on the mat. If we can anticipate
  that, we can roll with them and end up on top in mount or side control. Sometimes
  we can finish the choke, but if not, we can take the dominant top position from
  there. Now, on top of the guillotines that we have from the front headlock, we also
  have a whole 'nother family of chokes referred to as head and arm chokes. And these
  are going to be your D'arces and Anaconda chokes. A D'arce enters through the armpit
  and exits at the neck where the lock is. The Anaconda choke enters through the neck
  and exits at the armpit where the lock is. Both of these chokes give you a ton of
  control, and in my opinion, they're a huge part of having a real front headlock
  game. I also find that they funnel really well off of the inverted front headlock
  position, especially when your opponent starts rolling to escape the regular guillotine
  choke variations. There are definitely more front headlock chokes than just these,
  but the ones I see used the most at the high level are the high-risk guillotine,
  the arm-in guillotine, the D'arce, and the Anaconda choke. That doesn't mean other
  variations don't work or that they're wrong. It just means that if I was newer and
  trying to build a front headlock system from scratch, these four are the ones that
  I would spend the most time on. These are the cream of the crop. Now, the front
  headlock isn't just about submissions. As you start attacking chokes, your opponent
  is going to start hand fighting harder and bring their hands forward to protect
  their neck. A lot of the times, that shuts down the choke, but it opens up your
  other options. When they start over committing to defending their neck, you can
  switch to an underhook and roll them through and come up into a top position like
  side control. Or >> [music] >> even better, you can start rotating towards the back.
  Once you get behind your opponent's elbows from the front headlock, the back take
  becomes a serious threat. Most people do not want you circling behind them from
  here because once you get to the back, you're immediately threatening one of the
  highest percentage finishes in grappling, the rear naked choke. So, now your opponent
  is stuck in a dilemma. If they focus too much on defending the choke, they expose
  the roll or the back take. If they focus too much on stopping the back take, they
  leave their neck open again. That's one of the most basic funnel systems in jiu-jitsu,
  but it's also one of the most important. And that is why I believe the front headlock
  is one of the most important systems in modern no-gi grappling. It's not just a
  guillotine position, it's a control hub. And once you start thinking about it that
  way, you stop treating the front headlock like a random submission and start using
  it like an actual system. If there are any video breakdowns you guys want to request,
  leave a comment down below. Don't forget to like and subscribe, and I'll see you
  on the next one.
