transcript: to finish a straight ankle lock I like to go right into a fake guard pass
  I start pushing his leg open he thinks I'm going to pass through grab sit foot to
  hip foot under knees squeezed now it's like I'm guillotining the ankle I'm gonna
  get this blade right under his Achilles and then we do what we call the zip lock
  go all the way back until he can't go anymore if you're in the ghee pull this down
  as tight as you can grab hold I fall to the side of the ankle knees squeeze together
  instead of staying on your elbow like most people do bring my elbow under my hip
  and drop to my shoulder look at this it's already tight now all I'm going to do
  is turn and look at the floor this is what it looks like follow me for more Jiu
  Jitsu tips
