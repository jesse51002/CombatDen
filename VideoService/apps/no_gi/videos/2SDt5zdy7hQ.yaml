transcript: to my delight in my first match my opponent was happy to wrestle with
  we exchanged collar ties and tried to open each other up to set something up I got
  my opponent with a hard snap down bringing his hands to the mat and I jumped on
  the chance to take a front headlock I dragged down onto his head to keep his hands
  on the mat and use the opening to quickly go behind the back setting in my hooks
  from a straight jacket grip I removed my hook and quickly brought an elbow to get
  a half Nelson while bringing my weight forward to force him to fold from there he
  had no choice but to accept being on the ground and I put my hook back in to score
  points once again foreign
