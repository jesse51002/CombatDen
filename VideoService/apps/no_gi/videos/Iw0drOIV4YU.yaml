transcript: If you're a white belt or blue belt, one of the main things that you should
  be focusing on is having a vision of what you're trying to accomplish and having
  short-term and long-term goals in the sport. Uh it's hard to make progress. Obviously,
  you're going to make progress, but it's hard to make fast progress when you just
  come in and you just go through the moves. So thinking about the sport when you're
  off the mat and coming in every day with a set of goals that you're trying to accomplish
  and things that you want to work on through white, blue, purple, brown, even black
  belts um will make your progression a lot faster. The main X factor in anything
  in life is time. And in jiu-jitsu, it's the same thing. How do I get better in the
  shortest amount of time possible? And the way to do this is by having set goals
  and things that you want to work on each and every class for days, weeks, months,
