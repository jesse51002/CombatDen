transcript: 'Anytime we''re looking to scoop this leg and go 

  k guard, one of the main things that people look   to do here is they sit back on
  their heels and 

  they put their head over this knee here. So now   it''s really heavy. I couldn''t
  really pull this 

  through even if I wanted to. But something that   we can do is especially using
  this knee shield 

  and I''m going to use this cross lat frame and   kind of just my legs in general
  to pull my knees 

  to my chest to get his butt off of his heels a   little bit. And then I''m going
  to look to scoop 

  the other leg. So I''m just going from here to the   other leg underneath. Sometimes
  you can come 

  all the way around towards the outside here.   This is something Lucas Kanard does
  really well, 

  but I find even just staying underneath here with   the scoop grip is pretty good.
  You can really 

  use this to guide them over top of you. A lot   of the times going right in towards
  crab ride. You 

  can also spin all the way through underneath. So,   going for my scoop, he puts
  his weight back 

  in his heels. His weight is over top of this   knee. I''m just going to look to
  scoop the other 

  leg. Bring my knees to my chest and elevate him   over top in this direction here.
  And then I''m 

  going to spin my head all the way through into   the other leg. So now I''m basically
  in Kguard. 

  This is also called the body X. I''m basically in   Kgard on the other side. My
  legs are just kind 

  of flipped here. So, I just take this leg out   and then I''m looking to do all
  of our regular 

  K guard stuff going towards backside 50/50,   7030, all the cool things. But that''s
  not what I 

  want to talk about. I want to talk about anytime   we''re scooping this leg. So,
  you''ll be able 

  to see my hands a little bit better here. So,   he''s got his weight back and over
  onto this 

  side here. So, uh, and a lot of times this is   kind of in conjunction with a sprawl.
  So, 

  they sprawl this leg back. This allows my   hand to transfer to the other side.
  Guide 

  his weight over top of me. Can either go   backside 50/50 here. Can pummel my knee
  inside, 

  go crab ride. There''s lots of different options'
