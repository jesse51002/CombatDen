transcript: 'Today, we discuss the origins of Dagestani dominance in MMA. I''m here
  to clear all of that Russian propaganda, dispel their mythical mountain origin stories,
  and give credit where credit is rightfully due. When Russians shoot a takedown today,
  what you''re watching is a cheap Canadian knockoff. That, my friends, is Canadian
  wrestling. My mentor and spiritual adviser, Georges St-Pierre, once said to me,
  "Any man can take down an attractive woman. A champion can take down a woman of
  every weight category." That philosophy, and that philosophy alone, built the most
  efficient takedown methodology in modern MMA. GSP was a man obsessed with three
  things: karate, aliens, and thick black women. The experience in the latter taught
  him a game-changing concept, angle and penetration. If applied correctly, it can
  defy the laws of physics. Why does an adult man choose karate? I don''t know. No
  one knows. Russia has three national traditions. One, being incredibly rude to the
  staff of any restaurant. Two, annexing things that don''t belong to them. And three,
  claiming to invent martial arts. Two Russians, Victor and Vasily, went to Japan
  in 1907. They studied the art of judo. They came home and decided, "Judo would be
  probably more fun if we took our pants off, right?" So, they took that concept and
  they experimented on each other quite thoroughly. No pants, they kept the jacket
  on, and they decided to call this The only other difference between and judo is
  something that truly only a man with an appetite like GSP could possibly understand.
  The pants came off, but the shoes stayed on. To be fair, Dagestan is statistically
  the greatest wrestling region on Earth by any metric, medal totals, medal density,
  world champions, or dominance in their own Russian national championships. Per capita,
  they produced more Olympic medals than anywhere else. Roughly 1.6 freestyle medals
  per million people. Numbers that would make US, Iran, and Japan look like some bush
  league So, naturally, you''d expect them to have the best takedowns in MMA, right?
  But, they didn''t. Before GSP, Russians sat around 35 to 40% takedown accuracy.
  Then, GSP happened. And suddenly, post-GSP Dagestanis, Khabib sat at a 48% takedown
  accuracy, and Islam, 53% takedown accuracy. Something changed. That something arrived
  in 2007. That was the year Dagestan reportedly got its first VHS player. They entered
  the modern era of technology. And that first VHS tape that they watched was GSP
  taking down the heavily credentialed Josh Koscheck. GSP broke every golden rule
  of wrestling. He bent at the hips. He had a short penetration step, and he was shooting
  off the jab. Wrestling coaches everywhere around the world were in absolute awe.
  And they had to take notes on what this modern phenomenon was. Between 2007 and
  2013, GSP attempted 236 takedowns, and he landed 174. 74% accuracy. He out-wrestled
  NCAA champions, Olympians, national heroes with a posture that would likely get
  you conscripted to the front line in any Russian gym. This was earth-shattering
  to the wrestling community. They realized that that picture-perfect double leg,
  chest up, long penetration step was suicide in MMA. It would be akin to marrying
  your cousin. It might feel right at first, but the visual consequences and aftermath
  are indeed catastrophic. You were literally shooting into the center line of uppercuts
  and knees. Tradition feels good, but in the end, you''re left disfigured. GSP proved
  the future of wrestling was indeed ugly. And Dagestanis looked in the mirror and
  took notes. But, these Dagestanis couldn''t just steal the Canadian shot. That would
  be cultural appropriation. So, they slapped a neckbeard on it, called it Dagestani
  wrestling, and talked about mountains until you forgot to ask where they actually
  learned it. It is a brilliant marketing strategy. It is my marketing strategy. Steal
  something, rename it, and add a bit of flamboyant flair. Through extensive research,
  and believe me, I do mean extensive research, staring at slow-motion videos of men
  bending over, I discovered the Canadian deviation coefficient. For every 10° of
  spine bend, takedown success increased by 4%. The optimal Olympic hip angle, 90°.
  The optimal MMA hip angle, 68°. That''s math. That''s science. It''s ugly. It''s
  and it''s undeniably Canadian. Before 2012, Khabib''s game was all these upper body
  throws, trips, and clinches, pure  nonsense. His wrestling, though, was beautiful,
  upright, and textbook. But, it was wrong for MMA, and he knew that. So, he adopted
  a new system, and in 2013 against Abel Trujillo, we see it. He drops his head under
  punches. He has a short penetration step. He bends at the hips. The classic Canadian
  shot. Sadly for us fans watching at home, 21 takedowns later, that message was clear.
  He''d become the first Dagestani disciple of Georges St-Pierre. Between 2014 and
  2016, he perfected it. Every faint, every jab, every shot, fully embracing his inner
  Canadian very unapologetically. Then, cometh Islam from those same oxygen-deprived
  mountains of Dagestan. Watching that same VHS library, he took GSP''s timing, Khabib''s
  control, and made the shot invisible. And if we want to take a look at the data
  here, GSP had a hip bend of 63°, a penetration step of 0.6 m, and his takedown accuracy,
  74%. Khabib only bent 65°. He had a 0.5 m penetration step, and his takedown accuracy,
  48%. Islam, 70° hip bend. Those are numbers that would make you very popular in
  prison. His penetration step, 0.45 m, and his takedown accuracy, 53%. That''s not
  necessarily evolution. It''s just a control of the narrative. Even Khabib admits
  it. Jiu-jitsu has a problem. He''s right, there''s no takedowns. But, so did wrestling
  until the Caucuses embraced Canada. Jiu-jitsu on its back in MMA doesn''t work,
  and neither does perfect wrestling. The truth lives in bad posture. That''s the
  gospel of Georges St-Pierre. So, there you go. That''s the real story of Dagestani
  dominance, and in my opinion, it''s time they came out of the closet and fully embraced
  who they are. They''re Canadians. And when Khabib says, "Send location," he doesn''t
  mean the mountains. He means Montreal, because that''s where he learned to wrestle.'
