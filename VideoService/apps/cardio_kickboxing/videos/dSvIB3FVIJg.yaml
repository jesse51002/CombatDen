transcript: day 65 of my body transformation today I finally convinced my friend to
  come to the gym with me we started off with a quick run on a treadmill after we
  warmed up we worked on some basic punches it's so much easier to give your best
  in the workout when we train together not going to lie I had my selfish reasons
  to get him into the training because I really wanted to start sparring and because
  we both are beginners and he has a head start because he's not a beast I know that
  he'll quickly catch up and our sparring will be rare fun after we finished the workout
  I went for another workout with my coach boy oh boy he pushed me this is the beauty
  of working with a coach every time I improve my technique or stamina he immediately
  senses it and pushes me to work harder I only had 5 hours of sleep so by the end
  of the workout I was finished we went to work and after it my friend bought his
  own pair of gloves it was a good day
