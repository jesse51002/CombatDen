  throwing punches this stomach gets incredibly strong and you're gonna get that awesome
  six-pack number two the shoulders the shoulders are going to grow so much because
  with those arms up they're getting a burn and every time you start punching you
  feel that Sizzle you can look forward to having disproportionately large shoulders
  compared to the rest of your body with kickboxing as your activity and number three
