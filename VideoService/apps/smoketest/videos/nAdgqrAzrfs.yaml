  throw our cross into our right Locus we would double step instead of Galloping but
  again I'll save the double step for another video combo 4 is a simple jab into the
  rear body or high kick unlike throwing the left hook where we shift our weight to
  our rear leg and generate more power on the right kick we shift our weight to our
  lead leg when we throw our jab but we can still generate power by throwing our regular
  rear body kick by taking a small step into the quarter pivot position elevating
  up onto her Leaf foot tippy toes as we pivot our foot and turn our hips all the
  way to the left driving that Shin across the belly but why not just throw the left
  hook for more power because the jab makes it more simple to find our range our jab
  is long so if our jab lands or gets close to our opponent's head it tells us that
  we are in perfect range for our rear quality kit combo 5 the jab into our lead body
  or high kick similar to combo 3 we double the same side again the jab is just a
  great measuring stick to find our range for our kicks the jab doesn't need to land
