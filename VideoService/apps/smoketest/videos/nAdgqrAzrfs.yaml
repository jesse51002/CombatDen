transcript: in this video I'll be showing seven basic offensive combinations that
  I believe all beginners should know and get very comfortable with before moving
  on to more advanced combinations I will also be showing different and important
  variations to land at these combinations the first combination is the left or lead
  hook to right or rear body kick throwing the left hook loads up the right leg because
  we shift our weight to our right leg when we throw our left hook so we follow up
  with the right kick by pivoting our left foot turning our hips all the way to the
  left side and driving that Shin across the body sometimes when we throw our hook
  into our rear kick our kick is too close because our opponent doesn't back away
  remember our legs are longer than our arms so if our circular punch lands our kick
  might be too close so we can adjust by bending our leg and squeezing the kick in
  by really driving those shins across the body but there is a higher risk of getting
  hit as our head is now closer to our opponent's hands so instead we can Shuffle
  to the left to create space before kicking in fact this generates more power to
  shuffle we step to the left with our left foot as we throw our hook then Shuffle
  by replacing our left foot with our right foot as our left foot steps further to
  the left to create an angle and into our right body kick when you Circle two your
  opponent's left a common reaction is for them to Circle to their left to square
  up with us and when they do make that adjustment they walk right into our kick increasing
  the damage if they don't Circle the square up with us well we have a good angle
  for our kick sometimes when we step and throw our initial hook our opponent backs
  away so we close the distance with the same footwork except we step forward with
  our left foot and into our kick this shuffling footwork also adds momentum and power
  to our kick this shuffling footwork generates momentum and power to only our body
  or high kicks if if we want to generate momentum and power to our lookics we want
  to double step instead but I'll save that for another video so we can also hook
  and Shuffle into our rear high kick foreign body kit similarly to generating momentum
  and Power by going left to right we generate the Same by going right to left when
  throwing the cross all our weight is shifted to our lead leg or left leg so we can
  push off that left leg step forward with our right leg and into our left kick usually
  my opponent backs away after I throw the cross which is why I like to step forward
  into my left kick if they stay still I like to step back with my rear leg and into
  the pivoted position and into my kick you also have the option to switch your stance
  and into your kick we can also step forward and into our left high kick if our opponent
  doesn't back away we can make this same adjustment by stepping back into the left
  high kick Como 3 is the cross to rear body kick or rear high kick instead of focusing
  on momentum and power we now double the same side making it more tricky and less
