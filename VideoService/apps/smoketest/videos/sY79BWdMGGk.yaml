  when it comes to elbows the most common elbows you'll see will be the horizontal
  elbow the up elbow and of course the spinning back elbow and a whole another aspect
  of Muay Thai is the clinching so when it comes to clinching there's several uses
  for clinching but to really dumb things down essentially it can be used offensively
  to set up inside strikes such as your elbows or your knees or maybe even defensively
  to neutralize your opponent's offense and really stop them in their tracks so unlike
  some other grappling Arts you can't actually throw your opponent although you can
  sweep and trip your opponents so fighters in Thailand typically start pretty young
