  Thai often referred to as Thai boxing is a traditional martial art that originated
  from Thailand it encompasses a blend of striking grappling and sweeps earning its
  nickname The Art of eight limbs where the practitioner ERS use their fists elbows
  knees and shins renowned for its versatility and Effectiveness Muay Thai has gained
  popularity worldwide and is favored amongst many high-profile Fighters today unfortunately
  the history of BU Thai isn't that well documented the several historians believe
  that early forms of Muay Thai muao and pral all Trac their roots to the same lineage
  and have linked the heavy influence from the cir Empire which ruled over parts of
  present day Thailand Laos and Cambodia from the 9th to the 15th century and during
  this time cultural exchanges and martial art techniques likely flowed between the
  kir Empire and neighboring region contributing to the Muay Thai that we know today
  so when it comes to the rules of muay thai fighters use their fist their elbows
  their knees and their shins in standup combat the rules typically prohibit groin
  strikes headbutts strikes at the back of the head or the back of the spine and Fighters
  also can't strike their opponents when they're on the ground depending on event
  we time matches typically consists of several rounds most of of which are about
  3 minutes or so with a 1 minute break in between Fighters typically aim to win by
  either knockout technical knockout referee stoppage or decision so Muay High fights
  are typically held inside of a four-sided ring with Muay high fighters wearing boxing
  gloves and also Muay High shorts now Muay Tha boxing gloves typically differ that
  they have more padding to help cushion kicks and other strikes and also they're
  more malleable to help with the clenches now when it comes to the Muay Tha shorts
  typically it's going to a shorter cut compared to boxer shorts or your traditional
  athletic shorts just to help accommodate for kicking and also knees so when it comes
  to the techniques that you'll find in Muay Thai a lot of them are going to be very
  similar to other standup striking arts for example when it comes to the punches
  that a Muay Tha fighter use you'll probably see a lot of the same punches that you'll
