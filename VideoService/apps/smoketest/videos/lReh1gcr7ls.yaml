  being in shape helps and the simple answer is that yes being in shape will help
  if you're taking your first class but with that said regardless of how in shape
  you are chances are you'll still come out of your first class exhausted because
  if you've never trained before in muay thai specifically you're going to be doing
  a lot of movements that your body's not familiar with right you're going to be exerting
  a lot more than you should and your energy expenditure is probably not going to
  be as efficient as it would be or as it will be after you've trained for a couple
  of weeks so here's a couple of tips that can help you out with your first class
  the first thing is to get your cardio up that means going out there getting some
  road work like getting some jogs in some long runs or if you like go do some swimming
  right anything you can do to get that gas tank up will definitely go a long way
  to help you out in your first class so another tip i can give you guys is to brush
  up on your basic calisthenics so that means your push-ups your squats your bicycles
  if you're not familiar with those are there's a ton of resources online to educate
