transcript: '[Music] hey guys this Steph from Muay pros.com today I''m going to work
  on some of the basics of Muay Thai these are going to be tips that''ll help you
  improve your game now the first thing I''ll talk about is your stance the basic
  stance in Muay Thai is you want to have feet shoulder width apart you want to have
  a small step forward on your lead leg the weight of your feet will be balanced you''re
  going to have more weight on your back leg you don''t want to be leaning forward
  and you don''t want to be too upright sometimes you see guys their weight is up
  high and they''re not low to the to the ground you don''t want to be too low you
  want to have a balanced weight evenly distributed and you want to keep that weight
  on the balls of your feet shifting it back and forth so this is your basic footwork
  there will be some variation in the footwork from fighter to fighter but overall
  the basics remain the same the second thing I want to talk about today guys is the
  Muay Tha guard your guard is extremely important uh defensively because it''s going
  to prevent you from getting knocked out if you''re an orthodox fighter your left
  hand is going to go forward and your shoulder is going to be above your knee your
  rear arm is going to be near your chin and this arm is going to protect you in case
  anything gets past this front arm so remember in the guard the purpose is to keep
  your hands up cuz you will block most incoming attacks if your hands are up the
  final thing I want to talk about that is very essential in Muay Thai is your Rhythm
  now once you have the basics in your guard now you need to work on learning how
  to balance the transfer of your weight back and forth you''ll notice the rhythm
  is one thing that a lot of Western Fighters and foreigners have never mastered and
  that''s because they''re too flat footed and they don''t transfer weight you''ll
  see them bouncing around and they''re often too stiff and they''re not relaxed the
  Muay Tha Rhythm takes time think of it like a dance the first moment you try and
  learn a new dance you''re not going to learn it right away you have to work on it
  and you have to practice it first thing you want to do when you''re working on your
  Muti rhythm is you want to transfer the weight back and forth be inside of your
  guard and just work on trying to balance back and forth transferring the weight
  from the balls of your feet stepping back and forth I''ll demonstrate a few things
  when you''re in your guard you can do your basic block strikes and you can kick
  everything you do in Muay Thai you go back to your basic [Music] rhythm'
