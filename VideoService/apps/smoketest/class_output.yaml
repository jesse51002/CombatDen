classes:
  - name: Fundamentals
    image_url: https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Learning_Muay_Thai_with_Royal_Thai_Marines_160213-M-CX588-016.jpg/1280px-Learning_Muay_Thai_with_Royal_Thai_Marines_160213-M-CX588-016.jpg
    description: >-
      Build your base — stance, footwork, and the core punches and kicks, drilled
