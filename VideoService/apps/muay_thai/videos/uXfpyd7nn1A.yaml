transcript: So, hello again and here we are for the tutorial of basic Muay Thai combinations
  for the warrior collective and this section will be show basic clinch work of Muay
  Thai. Thank you. Again from the tie boxing stance about where your feet and position
  once you do clinch work. Obviously there are different ranges in Muay Thai. We mentioned
  we have like a boxing range, long knee range which is medium. We have long range
  which is basically kicking techniques and then we have close range things like elbow
  clinch work and knee. Basic clinch is when someone grabs hold of your Muay Thai.
  The person who has the clinch here usually has control. So the person on the inside
  here now who's okay the person has got that means I have to get from this position
  into more of a controlled position from here can actually move me around he can
  pull me around me into position take him into different directions to apply the
  knee so for example he pulls me backwards okay I could follow to a knee to the face
  or to the body he takes me to the side here same thing okay you can follow with
  a knee so what we try and do is gain position to gain position here the person is
  the stronger who's on the outside what we try to do here is try to get inside come
  through and apply the clinch. The clinch can be done as you can see now that I've
  got open hand. I can use my fingers with gloves. You need to trap the back of the
  wrist, the back of the hand for the clinch. Basically got two hand clinch. You have
  one and the same thing on the other side. One side and one side. There are many
  many different moves in clinch work of Muay Thai and it would take a whole series
  to explain about the clinch. It is basically an art within an art. What I'm going
  to do now is I'm going to bring in my other fighter which is Carlos and we're going
  to show you some basic clinch moves. Okay, together you can apply them in a form
  of we call this like sparring basic sparring or clinching. Okay, so we have Carlos
  and Wes. You can see here now we talked about how one will grab and hold position,
  the other fighter will v position using the clinch. It's a good form of exercise,
  a great way to improve on balance. You can see here, put pushing the head away,
  using the arms coming through and just basically looking for the knee into the body
  and to the midsection. If you're fighting full tie rules, the knees can also be
  applied to the head. This develops the fighter's ability to have a position balance
  and looking for effect of striking with the knee. You see the different onehanded
  grip, the two-handed, taking the arm over and under, applying both hands using the
  clinch, holding the back. And notice the head is kept upright for most of the time
  unless it's brought down to strike with the knee. It's always safer to keep the
  head up as much as possible and time. Thank you for watching. And for more information
  on Muay Thai and tie boxing here at the Bolton Tai Boxing Club, please contact us
  on www.tyboxing.co.uk UK or visit the YouTube channel and the website which is www.warriorcollective.com.
