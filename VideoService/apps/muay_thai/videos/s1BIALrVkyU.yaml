transcript: Hello guys, I'm Tony Olen, head trainer here at Lion Hart Muay Thai and
  Kosamui. Today with me I have Tepaskin, one of our fighters here on the Lion Hart
  team. We're going to show you three ways to deal with the Muay Thai clinch. First
  of all, when as soon as Quan locks, there's two things I need to think about. One
  is not getting the posture of my neck broken. As soon as my neck is here, the situation
  is way diff more difficult to deal with. So, straight away, I keep my neck strong
  with my strong hand. I come around, not inside, around the outside, and I push under
  his chin. At the same time, I pull my neck backwards to create space between our
  chests. With my free hand, I swim inside. I take the inside position on Quan. Release
  the hand under the chin. Swim inside. Now I have the dominant clinch. From here,
  I'm going to put my weight on Quan and pull my right knee back. Pull his head down.
  Boom. Right knee to the body. First thing we need to do when we get caught in the
  Thai plum like this is keep our neck strong. Now, I'm going to use my strong hand
  to come underneath Quan's chin. This is a really important detail. If I push his
  head, his neck is much stronger. When I come under the chin and push, pull my neck
  back at the same time. I create space between our chests. From here, I swim my free
  hand inside. Take the dominant clinch, release the hand underneath his chin inside.
  Now I have the dominant clinch. From here, I'm going to pull his head down, drop
  my weight, and pull my right leg back. Boom. Now, from here, my right leg is back,
  and I can right knee with power. Boom. Okay. Again, first thing I need to do is
  not let my neck get pulled down. So, I keep my neck strong. With this technique,
  I'm going to use my weak hand to push his chin back. So, from here, I push, create
  space between our chests. With my strong hand, I'm going to swim inside and trap
  his arm. From here, I'm going to bring my right foot back to create space between
  our chests. And I keep the the hand trapped. And from here, I can right elbow to
