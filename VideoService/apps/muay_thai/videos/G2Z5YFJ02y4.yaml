  many options there are here. Now, on arrival, you can get that 60-day visa automatically.
  And after that, you can extend for 30 more days by going to immigration. That'll
  run you about 60 bucks. Now, if you want more flexibility, the multiple entry tours
  visa covers six months and lets you leave and come back. That one is about 180 bucks.
  For longer stays, you've got the education visa. This means usually 6 months to
