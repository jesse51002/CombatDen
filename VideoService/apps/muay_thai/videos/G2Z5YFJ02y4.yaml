  [ __ ] picture. Visas, scooters, training gear, tipping your trainers, even bottled
  water when you're sweating through three shirts a day. Now, in this video, I'm breaking
  down exactly what you should budget for in 2025 and beyond. Whether you're coming
  for 2 weeks, 2 months, or a full 3 month traination. Now, quick background on me.
  I've lived, I've fought, and I've run retreats in Thailand. I've been that broke
  20-year-old backpacker staying in a fan room eating $1 pad thai. And now I'm going
  back with my wife, two kids, living a little bit more luxurious, if you will. So,
  basically, I've seen this lifestyle from every angle. And here's the truth. Your
  cost depends on two things. Where you go and what your goals are. Now, if you're
  here to fight, your schedule, your food, and your recovery all look completely different
  than if you're just here to train once a day and soak up the culture. So, let's
  walk through a full breakdown of everything and start from the top. Probably the
  most expensive thing is flights. That's the biggest upfront hit. Now, from the US,
  you're usually looking from anywhere between $800 to $1,300 round trip. From Europe,
  closer to 600 to 1,000. And from Australia, sometimes as cheap as 300 to 600. Now,
  if you book 2 to 3 months in advance, that's usually where you'll find a decent
  deal. If you wait until last minute, you might get smoked on price or you might
  find something that might make you a little happy. Now, here's a tip, though. Get
