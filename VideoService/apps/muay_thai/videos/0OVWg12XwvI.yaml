transcript: Master the Muay Thai clinch with this secret. If you're a beginner, learn
  how to control the inside of your opponent. Most of the time I see people like just
  going straight to the neck and they learn this double neck tie, which is like this
  plum position or one collar tie and one arm tie. Those are the positions that are
  taught. But in my opinion that what you should learn is how to tie up the arm. Because
  when I go in this position, look what happens. He can swim in and he can get my
  neck. And then I swim in, he can catch my neck. So, that's a 50/50 position. I don't
  want that. I want to control the arm. If I control his arm, he's not going to be
  able to grab me. You see? Take this part of my gloves and I want to post it in the
  inside of his bicep. You see that? And then I do the same thing with the other side.
  So, let's move a little bit here. Now, from here, I'm tying up his arm. Not only
  making him impossible to grab me, but also he cannot knee or punch me from here.
  From here, this is what I want to fight for. I don't want to fight for neck. I don't
  want to fight for body. I want to fight for to control his arm because his arm is
  the one that's going to grab me and clinch with me. So, one more time, if you don't
  remember anything, you're in a fighting position, he comes to grab, I just get my
  hand kind of like posting my hand on his bicep, okay? And keeping my elbow in. So,
  imagine, in other words, corner of box. I'm making a corner of box. So, if we draw
  a line from tip to my tip of the glove, that's one corner. And then the other side.
  So, making a square. So, one more time. I'm here. He comes to grab inside bicep
  control. We get in the clinch position. Now, from here, there's a variety of things
  that I could do. Knee, elbow, knee, jump, knee. A lot of things. If you don't remember
  anything in clinch and you want to make your clinch super good and super annoying
  to your opponent, learn to control the inside arm of your partner.
