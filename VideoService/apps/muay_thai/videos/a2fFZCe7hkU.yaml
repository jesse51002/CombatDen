transcript: This is how you punish Muay Thai in MMA. Traditional Muay Thai fighters
  stand tall and stay light on the lead leg because checking kicks is a key part of
  their defense. But fully committing to a check comes at a cost. The moment you lift
  your leg, you become stationary and that split second can get you punished. In this
  case, Mausal takes a traditional Muay Thai approach against Wonderboy, keeping his
  lead leg light. When Wonderboy is about to blitz, Mazda checks out of instinct.
  But because Wonderboy attacks in a straight line, Mausal is able to lean back in
  frame, avoiding significant damage. So Wonderboy makes an adjustment. This time,
  before blitzing, he takes a step at a sharp angle. As Mazda lifts his leg to check,
  he's frozen in place. So Wonder Boy blitzes in at the angle and lands a hard cross,
  dropping Mosid.
