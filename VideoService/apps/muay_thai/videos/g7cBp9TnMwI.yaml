transcript: what's going on guys Shane here so since I'm heading back to Singapore
  in August I've been freshening up on a lot of the techniques that the trainer's
  that evolve and then they told me earlier this year now Kru bent petra punku showed
  me a technique to close off the distance to get into clinch range so you can land
  your elbows knees and sweeps and this is where crew bends is most comfortable because
  he's arguably one of the best clinch fighters of all time and he beats an Chie three
  times so if you guys want to come train with me in Singapore in August there's details
  in the link in the description below but until then let's take a look at the technique
  okay so we cut up the distance we have to be smart about it let's say I'm standing
  at the end of these red lines and my opponent is at the other end if I just walk
  into range I'm gonna get caught with a punch with an elbow with a knee well most
  people recommend is stepping in with an attack and that can work right a double
  jab or maybe I walk into a switch knees boom this can absolutely work but if I'm
  fighting the guy who's higher level who's very evasive he's gonna cut an angle so
  if I do that same day I walk forward I throw the switch knee but he cuts an angle
  following that 45-degree black line right here and throws a left elbow I'm gonna
  get caught right that elbow beats the Nick so what crew bends recommends what he
  uses in his fights to close up the distance is he uses a long track so he takes
  his rear hands his right hand and as he walks forward he traps that left hand that
  does two things it stops the elbow from coming in and it stops them from creating
  that angle out to their left from here he uses a long guard his arm extends past
  the head and he grabs behind the head or behind the neck but this shoulder here
  is protecting my chin from the right hand so if they throw a right hand I'm blocked
  I'm protected from here I can throw that left knee just like we did I'm also in
  a great position now to sweep if I don't throw that knee I can walk forward trap
  the hand and sweep out that leg bringing their head directly down to the ground
  so don't pull them back right when I step in I'm sweeping and I'm pushing their
  head directly into the floor and another technique that we can do to set up the
  elbows one that was taught to me by a crew or rona another coach another spectacular
  coach at the Bob MMA so what he does is he does that similar movement trapping the
  hand to drop that right elbow so you're switching your stance trapping that hand
  boom and dropping the elbow on your opponent's face alright guys thanks for watching
  so remember if you want to close off the distance you can't just walk into your
  opponent try trapping that hand utilizing the long guard so you get in a dominant
  position and then control the fight from there if you want to train with me and
  crew bends we were doing a training seminar August 20th to the 26th at evolved MMA
  in Singapore and all are welcome to join all styles and all experience levels guys
  spots are filling up quick and there is extremely limited availability so if this
  is something you want to do click the link in the description below grab your tickets
  and we will see you guys in August until next time i'm shane with fighttips for
  the underdogs [Music]
