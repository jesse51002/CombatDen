transcript: 'Alright guys, [I''m] going to give you some real   basics for where to
  start in a clinch.

  Now, my aim in this video is like,  If you''re struggling with the clinch and

  You just got sort of no plan of attack, and you  Every day you go in and you just
  feel 

  like you''re getting ragged all around,  I''m hoping to give you a 

  couple little tricks to, like  If you implement this it should make 

  your clinch, like significantly better  Just off these couple little principles.

  And these are  These don''t often get taught for your first time 

  when you come into a gym and you start clinching.  What usually happens is like 

  "all right, go- go and clinch,"  And you''ve got nothing to start with.

  You don''t know where you''re supposed   to put your hands

  Don''t know where   you''re supposed to put your elbows or your 

  head or your feet or anything like that,  And you just get rag-dolled and basically 

  you learn on the job until, you know  You get your ass handed to you so many times

  Then you start to realize what not to do   through trial and error,

  But no one generally gives   much direction when it comes to clinch,

  So, with this, hopefully, I can give you   a few key basic ideas you can take away 

  and make everything dramatically improve.  So, I''m not going to cover too much
  in terms 

  of stance or balance or where to put your feet,  But I''m just going to solely focus
  on 

  what to do with your hands in this video.  So, when we''re clinching,

  Oftentimes like this,   I would call this a 50/50, meaning where no 

  one''s got the upper hand in terms of positioning,  We''re both in the very same
  position.

  One on the neck or behind the head,  I''ve got the same one down, and 

  one controlling the arm, alright.  So this- the reason why this is 50/50 

  is we both have one inside frame.  So everything in clinching boils down to me-

  Well, in the beginning  As you get more experience, you 

  can get more creative with it.  But in the beginning, everything boils down to 

  trying to get frames inside of your opponent.  So, if Dan''s got me, two hands on 

  the back of the neck like this,  Sometimes this is referred 

  to as the "plum" position,  I don''t know why, but yeah, 

  people call this the plum.  Two- two arms inside my, my shoulders and arms

  So this, he''s got two inside frames.  I''ll show you another few positions 

  where you can get inside frames.  On the neck,

  Also,   on the bicep or shoulder, around here.

  The bicep or elbow is a particularly good one,   because I''m framing for punches
  and elbows too.

  So, Dan now, he can''t really-  If he tries to hit me with a punch, I''ve 

  got my forearm here and my humerus bone  Stopping him from compressing.

  If I''m with here with my hand   and he throws that punch,

  It can compress my elbows.  So, try and use like my forearm 

  where it''s a bit stronger,  Closer to my elbow in order to frame like that

  and I hook a little T-rex style over the top  Rather than grabbing with my palm,
  so there.

  Same thing on the neck.  When I grab the neck, I don''t grab 

  like this, where Dan can grab a hold   behind my head and pull me in and compress
  me.

  But I have that forearm resting on the collarbone,   grabbing either the neck or
  behind the 

  head, depending on what you want to do.  So, just off that grip alone, 

  either forearm on the shoulder   or bicep, we have various grips we can use.

  Two arms inside the biceps,   one arm on the head, one arm on the 

  bicep, two arms on the neck, and just like  Different varieties of that which 

  make the world of difference   in terms of controlling your partner.

  Now, when you first start clinching,   you''re gonna see things like

  You can Saenchai sweeping   guys and sending them on their head, and it 

  looks spectacular and that''s all very good.  That''s what you can start doing as 

  you get a little more progressed.  In the beginning, you just 

  want to be able to control   distance and get that inside framing 

  position so that you don''t get swept.  So don''t worry about learning how 

  to sweep people and dump people.  Learn how to not get swept in the beginning.

  And once again, inside frames makes it very hard   for him to control me properly.

  So, a good drill would be-  A good drill would be, we start here in 50/50,

  I''m going to get two inside frames somewhere,  To this one, I''ve chosen to run
  the plum position.

  Dan is then going to pummel his hands   and find two inside frames.

  So he''s elected to go one on the-  One forearm on the collarbone, 

  and one inside the bicep.  I''m going to go two inside frames.

  I''ve done the same thing.  Dan goes for two inside frames, two-

  He''s got either elbow. This   is also a good position.

  I''m going to go two inside frames,   Dan goes frame, frame, frame, frame, frame, 

  frame, frame, frame, frame, frame, frame, frame.  This- notice this is starting 

  to look like clinching now, you  This is a great drill if you, you and a partner 

  want to just take it easy and just practice that,   there''s a really good place
  to start and 

  just where to put your hands with clinching.  We''re going to make another 

  video showing you about footwork,   distancing the hips and all that but  This is
  a very, very useful tool 

  if you have no idea where to start.'
