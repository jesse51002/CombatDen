transcript: Muay Thai sometimes referred to as Thai boxing it is known as the national
  sport of Thailand but unlike traditional boxing this is a whole other level of brutal
  this is me a guy who's an average gym goer and as far as martial arts go someone
  that's only attempted boxing once so considering the extreme lack of experience
  with fighting that I had it made me question what would it be like for a guy like
  me to try out to the National Sports in none other than a proper Muay Thai gym the
  gym we went to was located on the island of Co Samui and without question we had
  a warm welcome to come along for the class the session started off with a light
  warmup that involved jumping on tires and I can't lie my Cals were dead from this
  so I knew that this whole morning was going to be a long one we then continued to
  warm up with some skipping and is something that is a standard exercise for boxers
  then as a group we continued our warm-up with various movements in a circle very
  similar to a football is warm up however the main difference here being that compared
  to playing football back in the UK in colder WEA we were doing this in over 30°
  heat and you felt like you were dying every minute if you didn't have any water
  then we proceeded to do an exercise which was a kneeling jump straight into a box
  jump followed by 10 push-ups and despite most gyms having box jumps I've never actually
  used one before and I can't lie it was pretty fun well at least it was up until
  they made you do all of that for the 20th time at this point we continued to warm
  up this time with some stretching yeah I'm the least flexible person I know after
  the warmup was done we were finally ready to start we began with learning some of
  the basic fcing techniques like the elbow knee and kick and it became apparent very
  quickly that my technique wasn't the best see with Muay Thai despite it being called
  tie boxing it's not really boxing at all for starters The Stance is completely different
  with boxing majority being with one foot in front of the other Muay thaai is very
  much with your body Square on and with only my small experience with boxing this
  became the first bad habit that I kept repeating all the time when training The
  Next Step from The Stance was perfect the movements especially the kick remember
  what I said about me not being flexible yeah you can't get away with that the good
  thing about the coaches is that they literally forced you to repeat the movements
  over and over until you eventually somewhat got it right and at the point when you
  get something wrong or make a mistake you're forced to do push-ups and I loved it
  after learning the basics we then got into pairs to kick each other this is where
  I learned the first offense for a kick by simply stepping aside and grabbing the
  opponent's leg after eventually taking turns with it we went on to a very light
  Spar on trying to kick and catch which again was so much fun oh and what do we do
  every time you're told to stop sparring at this point it was time to put the gloves
  on and do some pad work this is where we got taught combos as well as perfecting
  the technique and I thought they tried working me a lot already by this point oh
  was I mistaken I lost count of how many times I was desperate for water but of the
  nature of the sports they did what they could to to condition you to go without
  it for a good amount of [Music] time and if you wanted a drink well you had to earn
  it with more press ups but with the pad work we did this for a while just to really
  try perfect the technique despite my best efforts but as well as learning to fight
  I soon learned that Muay Thai is much more than that I decided to put my gloves
  on the floor when I went for a drink and the coach soon came over to have a word
  he told me that the martial arts is all about respect whether it be your opponent
  your coach or the equipment and by Me by dropping the gloves on the floor instead
  by putting it back on the Shelf in their eyes they saw it as very disrespectful
  and he of course punished me by forcing me to do push-ups until he said I was done
  could tell by the look on his face that he was offended by how I treated their equipment
  and I instantly felt ashamed but to something that is so simple and wouldn't be
  looked down upon as disrespectful at least in the UK it really resonated with me
  with their culture and respect for one another and he got his way anyway by humbling
  me and by this point after training for well over 2 hours they really tried working
  me right to the very [Music] [Music] [Music] end [Music] [Music] yeah I at or 9
  see football in UK after the pad work and learning some of the basics it was time
  to jump into the ring but who was my opponent this is George my mate who's been
  living out in Thailand who's trained muai previously being in a public MMA fight
  and just so happens to be 6'5 not that that's much taller than me anyway for protection
  we used Shing guards but because I didn't have a mouthpiece we decided not to go
  for the head most of the time and I can't lie there was no hope for me like bro's
  legs are so long I couldn't get near him after a bit of extra practice with the
  coaches learning more now how to block decided it would be better just trying to
  kick each other [Music] oh and it's safe to say I'm proof that you can't learn a
  martial arts in 3 hours and to finish off we co down some more various exercises
  including some Coe work followed by some more hardcore conditioning you there go
  up up shut up hold yeah I thought away I [Music] don't and so as for my overall
  opinion on trying Muay Thai for the first time I'm so glad I did Fort only costs
  just under £1 for £3 hour session and as much as it can be intense to put on some
  gloves and start punching and kicking people in a ring it was a very humbling experience
  that not only gave me an insight into learning self-defense but more so what it
  really takes to work hard be disciplined and above all learn the true meaning of
  respect however during sparring I could feel that I'd injured my ankle and well
  that probably wasn't such a good idea I've currently got a really bad ankle we TR
