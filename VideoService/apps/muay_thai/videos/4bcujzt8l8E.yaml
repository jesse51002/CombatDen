transcript: I train mu Thai in Thailand and spent less than a meal back home I started
  the morning on a back of a bike and headed to a smaller gym here in shangai as soon
  as I walked in it was time to warm up and it's not what you think I spent 10 minutes
  bouncing on a tire it's weird but it works then I stretched while my coach wrapped
  up my hands and he went straight to checking my form to make sure I knew what I
  was doing then I worked on timing with a bag and band before we jumped in the ring
  and he put me through some serious pad work this is no joke it's the most exhausting
  thing you'll ever do and make sure you bring water because you're going toing need
  it next thing I know he throws me the shin guards and he's like it's time to spar
  and I was like yeah sweet until I realized it was against him I landed a few decent
  shots but about 89% of the session bro literally whooped my ass without trying and
  if he wanted to kill me he could in an instant for a whole 90-minute private session
  in a mini recovery banana I only paid $15 let me know would you try Muay Thai in
  Thailand
