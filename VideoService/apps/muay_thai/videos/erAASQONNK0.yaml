transcript: So you're facing a guy like Anderson Silva or like Vanlay Silva. What
  they do in the clinch is a very smart thing, right? They grab the neck and they
  start pushing it to the left, to the right constantly. They're putting stress on
  that neck. And especially when I grab him and I put high here. If he puts his head
  backwards now, it's very hard for me to pull it forward, right? But if I put my
  hand on top of his head, try to pull back, it's going to be very hard. So leverage
  is everything. And I'm pumping a lot in the upper body because they want to slow
  down the punches from the opponent. So they're stressing out your neck. How can
  you stop that? He grabs me by the neck. Immediately when he does that, I'm putting
  this hand over his biceps and now I put my forehead on my wrist. Pull as hard as
  you want. You You can do whatever you want. There's zero stress on my neck. Now,
  if he wants to start kneing, this is what I'm doing. I'm not going to stop it because
  I might hurt my hand. But I can simply do this because I let him slide to the side.
  You see? Now, if he keeps on kneeing me, how do I stop him from kneeing? Push. Go
  forward. If you put him on his heels, it's very hard for him to deliver punches
  with power. If I'm standing all the way here, he tries to knee me, I just start
  walking forward. There's nothing he can do once I start walking forward. And if
  you go really fast, you might even be able to take him down. And then you're going
  to get the upper hand.
