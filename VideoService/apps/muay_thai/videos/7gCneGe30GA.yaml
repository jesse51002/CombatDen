transcript: If you've been wanting to fight Muay Thai in Thailand, but you haven't
  taken the leap, I'm going to show you exactly what it's like. You'll begin meeting
  at the gym 1 hour before the fights start, where you'll make a blessing, and then
  you'll leave together and arrive at the venue between 8:30 and 9:00 p.m. First,
  a quick medical check to see your weight and blood pressure. Then, four to five
  fights before yours, your coach will begin wrapping your hands. Three fights before,
  your trainers will massage you with Thai oil to warm you up. This may hurt more
  than the actual fight itself. To stay warm, your shadow box and stretch all while
  standing next to your opponent. When the fight before yours ends, your coach places
  the mong on your head and it's time to go. You step into the ring, walk around,
  and get mentally ready. Then you can perform the Y crew to show respect and gratitude
  to your [music] coaches. The ref will then explain the rules to you. Your trainer
  will bless you and the fight begins. Muay Thai fights are five rounds of 3 minutes.
  Try to stay calm and relaxed. [music] And of course, winning is recommended. When
  it's all over, say thank you and apologize to your opponent. [music] If you like
  this and want to see more Muay Thai content, then drop a follow.
