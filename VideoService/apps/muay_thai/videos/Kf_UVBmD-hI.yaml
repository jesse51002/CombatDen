transcript: Hello and welcome back to the channel. Today we are in Bangkok. I don't
  usually come to Bangkok often because of the traffic and the air pollution, but
  for a Muay Thai enthusiast, Bangkok is a playground. Bangkok has some of the highest
  level gyms that Thailand has to offer. It's got some of the best quality gear you
  can get at the lowest prices and it obviously has top top top level fights at stadiums
  like Rajidam Nun, Limpini, and Channel 7. So, while I'm here, I want to check out
  some of these [music] famous gems for myself. I want to buy some new gear and I
  want to go and watch fights at Rajadamnan Stadium. But first things first, I am
  lucky [music] enough to be staying in a bougie bougie hotel right now, the Grand
  Center [music] Prestige Bangkok. So it is only right that we start with a small
  tour. Every morning there is an all you can eat buffet. So my strategy is to absolutely
  abuse that while it's open and then basically not have to eat for the rest of the
  day. On the top floor, there [music] is a gym with big windows and a view of the
  city, which is actually a nice switch up for me after living on the islands for
  [music] so long. They've also got a sauna. So, obviously, I'm going to sit in there
  and pretend that I'm in that TJ Dillashaw weight cutting edit. [music] >> And then
  on the roof, there is a pool overlooking Bangkok. So, it's not a bad base for our
  time [music] in Bangkok. Anyway, it's time to start mission one. And for that, we're
  going to hop on a grab [music] bike. >> [music] >> This is the first order of business.
  The super export shop in Bangkok. So in Thailand, specifically in Bangkok, you can
  get some of the best quality Muay Thai gear. twins, boon, top king, everything for
  the cheapest possible prices compared to back home in the west or in Europe. So,
  let's go check out some of this gear and see what we're going to buy today. If you're
  into Muay Thai and you come to Bangkok, you're probably going to end up in shops
  like this. They've literally got everything you could possibly want. Muay Thai shorts
  range anywhere from 800 to1,500 bar with twins and fertex being the [music] most
  expensive. So, that's around 20 to35. They've also got Fertex and Twin Sauna suits
  from 2,000 to 2,400 B, which is around 50 to60. Whereas in England, these would
  probably cost you around £100. Upstairs is where it really gets dangerous for your
  bank account. Gloves, shing guards, pads, bags, they've got everything. All these
  Fertex gloves back home are probably around 120 quid, but here they're like 50 to
  60. So, if you're in Thailand and you're flying from Bangkok, it's just a smart
  option to stay at least one night. stock up on Muay Thai gear for you and your mates
  if you got space in your bag and you'll be saving so much money compared to if you
  get these brands back home. >> So, I ended up going for some gray [music] 10oz Twins
  gloves and obviously I had to give them a quick test. Now that I've got my gear,
  the second mission has begun straight to Yokau training center for their afternoon
  session. And stepping into this gym was a really cool experience for me because
  I've spent years in England watching absolute legends training here. Sangshi and
  Singam 9 years ago, Liam Harrison, superle block out, rod tang, the list goes on
  and on. So, I was almost starruck just by looking at the ring. The class itself
  had a pretty classic structure. Warm-up drills, group stretching, then three rounds
  of pad work, and three rounds on the bag. But what made this session different from
  most gyms I've been to is that each round of pad work was with a different trainer.
  And I actually really like that because every trainer has their own style, a different
  rhythm, and different focus. on certain techniques. It was definitely more beginner
  friendly, which sometimes can make it challenging to get a good session in. But
  I enjoyed the pad work a lot. None of the trainers were lazy. And when you do pads
  in Thailand and the trainer is simply calling out instructions with no flow, it
  can be very disappointing. After the pads came three rounds of bag work, and I'm
  not going to lie, Bangkok right now is hot and the air pollution is brutal. So,
  I was gassing out very quick. Nevertheless, I did a couple rounds of sparring to
  finish off the session. And there were some very highlevel Thai kids in the gym,
  clearly in fight camp, [music] but they didn't really interact with the fang in
  the class, which honestly makes complete sense because sparring beginners doesn't
  really do anything for your technique at that level, and it's probably the most
  risky sparring you can do. Bigger, heavier foreigners with less control and sparring
  etiquette can easily accidentally injure you. But for me, it was very fun to get
  some light sparring in. After training, I somehow accidentally ended up getting
  pretty drunk at some of the rooftop bars in Bangkok. And as you can probably expect,
  I didn't get much footage. But fortunately, I am a big believer in earning your
  vices. So, the next morning, I wanted to kill two birds with one stone, make the
  most of the hotel gym, and punish myself for the sins of the previous night. As
  always, I warmed up with some skipping and then went straight into plyometric work.
  And I can genuinely feel a [music] big difference in sticking to these exercises.
  My explosiveness has improved a lot and I am jumping way higher now. I also did
  some exercises on the Bosu ball to work on my balance and stability as well as a
  bunch of other exercises for abs and footwork drills. And then I finished it all
  off with three 10-minute sauna rounds. All right, that sauna absolutely cooked me.
  I actually napped immediately as I got back to my room. So, I'm late, but the crab
  should be here any minute now. And hopefully I make it in time, probably around
  the end of the first fight. And now we're on to mission three. [music] Watch some
  fights at Rajidam Nun Stadium. I haven't been to Rajadam Nun in a while, and since
  I was last there, they've added this crazy dome projection across the ceiling, which
  I've wanted to see for myself. And I've actually never seen anything like it, especially
  in a Muay Thai stadium. It was insanely immersive and explained the history of Muay
  Thai, the traditions, the mysticism, and even the story of the stadium itself. I
  loved it and I can imagine that it would make the fight nights way more entertaining
  for people who aren't as into Muay Thai or fighting. Tonight was patching D promotion,
  which is high level and usually consists of tie on Thai fights, which is always
  fun to watch because you get to see that real traditional five round Muay Thai fighting
  style. Day three and it is my final day in Bangkok. So today I booked in a private
  session back at Yokau with former Lumpini champion Crew Chon. But before that, mission
  number four. I've heard about this shopping mall called MBK, which is basically
  famous for being full of fake designer stuff. So I'm going to use this opportunity
  to be nice and buy a few gifts for my friends. All right, so I can't film too much
  in here because most of the people working here are not Tai and don't have visas,
  I'm assuming. So they don't like it when I film, but I'll try to get some stuff.
  >> [music] >> And boom, we are back at Yokau with the one and only Crew Chong. He
  spoke literally zero English, but this session was so [music] fun. It consisted
  of a warm-up, some shadow boxing, then into five pad rounds, and some play sparring
  to finish it off. And what you really want when you come and do a private session
  in Thailand is not someone who's just calling out instructions like kick, kick,
  punch, elbow. You want someone who's actually invested into correcting your technique.
  And Crew Chong was on me the whole time. He corrected my hand positioning defensively,
  showed me how to make my kicks less telegraphed, and how to make my elbows land
  sharper by turning my palm more towards my opponent. And this is genuinely my favorite
  aspect of training in Thailand. Play sparring with ties where your brain is still
  working. You're defending. You're finding openings, but it's fun. There's no ego.
  There's no one trying to win. And the risk of injury is basically non-existent.
  For me, that is the best way to learn and to absorb knowledge from the skilled tie
  fighters that are here. away. >> Hello. Hello. Hello. We are back in Copanyang.
  [music] I got a cold pretty much immediately after filming that and it has taken
  it out of me for the last like week and a half. But yeah, we're back in Copanyang.
  I hope you enjoyed the vlog. I'm still kind of getting the hang of this YouTube
  thing. So, give me some time. And I'm gearing up for my next fight which is going
  to be in about 3 weeks. So, stay tuned for that. And if you enjoyed this video,
  please feel free to like, comment, and subscribe. I will see you in the next one.
