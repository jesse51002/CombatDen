transcript: This is prime Mike Tyson in a nutshell. He evades the one-two and gets
  really low, taking advantage of his shorter build. His opponent tries to frame and
  throw the left uppercut, but Tyson slips and does the same to avoid the right hand.
  He then pulls away from the left hook and goes into the clinch. Moments later, he
  slips under the left hook, changes angles, then delivers his own thunderous leaping
  left hook to drop his opponent. [Music]
