transcript: Mike Tyson, the most feared man in boxing history. But do you know the
  five fastest times he ended a man's night? This isn't just power. This is raw, merciless
  destruction. Let's count down Tyson's fastest knockouts ever. Number five, Ricardo
  Spain. It's 1985. Tyson's just a 19-year-old kid. He charges forward, fists flying
  with terrifying precision. Every punch lands like a hammer. Spain collapses in just
  39 seconds. Yes, it is. Number four, Michael Johnson. In less than 40 seconds, Tyson
  unleashes pure hell. Johnson never stood a chance. A monstrous right hand finishes
  it. 39 seconds. Another name added to Tyson's growing list of victims. 23 lb weight
  advantage and he put it all there. Number three, Lou Saves. Fast forward to 2000.
  Tyson's older, but his fists still lightning. Saves hits the canvas just 38 seconds
  into round one. The ref tries to stop it. Tyson keeps punching. Even time can't
  slow this man down. This is number two, Robert Cole. It's 1985. Tyson's just a 19-year-old
  kid, but when the bell rings, he's a predator. Cole can barely raise his hands before
  Tyson's on him like a storm. 37 seconds. That's all it took. Cole crumbles and the
  legend begins. Left hook. Good night. What a great shot. Number one, Marvis Frasier,
  the son of Joe Frasier, a young heavyweight with hope. But Tyson ends that hope
  in one of the most brutal displays you'll ever see. A savage uppercut followed by
  a blizzard of punches. Marvis is gone in just 30 seconds. [Applause] These weren't
  just wins, they were warnings to every man brave enough to step into the ring. Tyson
