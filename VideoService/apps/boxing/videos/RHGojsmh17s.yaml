transcript: There's things that every worldclass fighter does that coaches don't teach.
  This is Roy Jones Jr. Can you notice what he's doing here? This is during round
  10. He's another Roy May with it during a 10 round world title fight. Just look
  at his face and how fresh he looks. How about Canelo Alvarez here during a world
  title fight. They don't look tired one bit. And you might be thinking, well Tony,
  it's obvious because these are very fit and well conditioned. And yes, conditioning
  is a huge part of it, but there's something else that these guys doing that you
  can do too. These champions are experts at knowing how and when to breathe. Often
  when we're in a gym and on a heavy bag, we start getting a little bit tight, trying
  to get too much power in our punches. But what the champions are doing, they are
  really focusing on recovering when it's time to recover.
