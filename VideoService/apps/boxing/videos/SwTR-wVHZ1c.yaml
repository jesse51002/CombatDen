transcript: Quick, quick, quick. The jab for me starts with your back foot and your
  front foot. I like to tell the guys, "This is the gas. This is the brakes." Gas
  brakes. Stop yourself. Stop yourself. When you throw it, comes out. Comes right
  back. Right back to where it has to be. Don't shoot in. Don't rise up. Stay in that
  same spot. Boom. You can double it up. But everything starts with the feet. Jab,
  step to your right. Boom. Step to your left. Lean back. Step back. Step forward
  off that jab.
