  our lead leg down which we call one and our rear leg down which we call to this
  footwork is extremely effective because you can throw your shots on either the one
  or the two and you don't have to break your Rhythm whilst doing so which puts you
  in a perfect position to throw a combo as soon as you've landed double step back
  you can use this to avoid multiple shots from aggressive opponents coming at you
  stop throwing all of your onws with your rear leg stuck to the floor step your rear
