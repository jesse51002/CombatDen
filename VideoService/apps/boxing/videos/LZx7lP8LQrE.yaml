transcript: footwork one of the most important yet neglected aspects of boxing let's
  be honest anyone can throw a punch even if it's not a very good one but to be able
  to move your feet in a particular way to take you out of any danger and position
  you for your next shot now that's where the real skill is out I've been training
  my entire life and one of my biggest regrets was not learning footwork when I first
  started I would have saved myself hell of a lot of Blood Sweat and Tears in this
  video I'm going to take you through my entire syllabus of footwork and I promise
  to make your footwork at least 1% better with that being said if you did benefit
  at all from this video I'd appreciate the like the Subscribe and all that good stuff
  but without any further Ado let's jump straight in okay first things first let's
  learn to walk before we can fly your most basic Foundation of footwork is going
  to be forward back left and right this is what's going to set up all of that extra
  stuff in the future an easy rule of thumb to follow is no matter what direction
  you're move in the foot closest to that direction will move first this will make
  sure your feet stay out of line and you're always positioned to throw shot pivot
  these are essential for making a new angle getting you out of corners or off the
  ropes push your back foot into the floor and turn 90° the L step is also used to
  create a new angle hop back onto your lead leg and then use the rear leg stepping
  out horizontally to make a new angle and walk back to the center Rim Galloping is
  the one exception where you'll start with your rear leg to move forward with as
  that lead leg lands you'll be in a perfect position to throw those big shots step
  backs these are used to evade your opponent shots and regain a sensible range push
  your lead foot into the floor and simply hop backwards one two footwork we're using
  the lead leg for our Jabs and our faints and then we're simply bringing the rear
  leg up slightly as well this is going to allow you to move forward chaining multiple
  Jabs together it's going to let you move circular as well without breaking any momentum
  the rear pivot just like the lead pivot we're using this to make a new angle but
  instead of moving around the lead side this time we're pushing the rear leg into
  the floor and moving around our rear side rear side roll steps use this if someone
  throws a punch at you from their left arm roll underneath and make a new angle Ang
  Le exactly the same thing for the lead side but this is if someone throws a punch
  at you from their right arm The Hop reset a nice way to take the tension out your
  legs and stay loose on your feet make sure not to do this in punch and range with
  an opponent as it can be risky don't confuse this for the stepb this is not a way
  to evade a shot it's just simply a way to stay loose on your feet lead side quick
  movement we're combining the pivot the hot reset and The Stance and this is just
  generally a nice way to Circle back to the center ring while staying loose rear
