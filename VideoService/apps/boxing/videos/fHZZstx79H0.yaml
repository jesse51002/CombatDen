transcript: 'This is Rummy’s Corner. Good evening boxing fans, and welcome back. Here
  are the results from the latest Survey

  where 25 volunteers provided a list of what they each consider to be the Top 25
  most spectacular

  knockouts in filmed boxing history. A very special thanks to all 25 volunteers

  who participated in this mighty challenging endeavor. I did not personally participate
  in this survey,

  which used a similar scoring system from previous Surveys, because I did not want
  my opinions

  to influence the outcome. Without further ado, let’s jump right into

  the countdown. #50 - On June 20th, 1975, Carlos Zarate and

  Orlando Amores squared off in a bantamweight battle. In round 3, Zarate landed a
  quick right immediately

  followed by a double left hook that dropped Amores hard. It was a 3rd round knockout
  for Zarate. #49 - On February 16th, 1970, WBA heavyweight

  champion Jimmy Ellis went up against the NYSAC heavyweight champion Joe Frazier.
  The vacant WBC belt was also on the line,

  making this a battle for the undisputed heavyweight crown. In round 4, Smokin’ Joe
  landed a smokin’

  left hook that clobbered Ellis. Incredibly he beat the count, but was unable

  to continue, and it was a 4th round stoppage for Smokin’ Joe Frazier, the new undisputed

  world heavyweight champion. #48 - On May 23rd, 1981, WBC junior middleweight

  champion Maurice Hope put his title on the line against former 2-division champion
  Wilfred

  Benitez. In round 12, Benitez smashed Hope with a beautiful

  right hand that sent the champion down. Hope would not be beating the count. It
  was a 12th round knockout and Wilfren Benitez

  had just become a 3-division champion. #47 - On November 13th, 2021, IBF featherweight

  champion Kid Galahad put his belt on the line against former junior featherweight
  champion

  Kiko Martinez. Early in round 6, Martinez drilled Galahad

  with a sweet right hand that put the champion down, and the fight was over. It was
  a 6th round stoppage, marking Kiko

  Martinez as a 2-division champion. #46 - On November 30th, 1979, WBA light heavyweight

  champion Victor Galindez squared off against former WBC light heavyweight champion
  Marvin

  Johnson. Early in round 11, Johnson landed a looping

  left that sent Galindez down, and the referee waved it off. It was an 11th round
  stoppage for Marvin Johnson. #45 - On May 15th, 1992, Bert Cooper and former

  light heavyweight champion Michael Moorer battled it out in a heavyweight slugfest.
  Both boxers were dropped multiple times in

  this wild encounter, but in the end, Moorer ended matters with a left hand followed
  by

  a right uppercut to win the vacant WBO strap. #44 - On May 11th, 1981, former heavyweight

  champion Ken Norton squared off against undefeated contender Gentleman Gerry Cooney.
  This one was over quickly, as Cooney simply

  beat Norton down and overwhelmed him to score an impressive 1st round stoppage victory.
  #43 - On July 10th, 1971, world bantamweight

  champion Ruben Olivares went up against former flyweight champion Efren Torres in
  a non-title

  bout scheduled for 10. But this one would not be going 10. In round 4 Olivares landed
  a snappy left and

  Torres timbered down into a savage faceplant. It was a 4th round stoppage for Olivares.
  #42 - On September 25th, 1962, world heavyweight

  champion Floyd Patterson put his title on the line against top rated challenger
  Sonny

  Liston. A big left, a grazing right, and another monster

  left sent the champion down in the opening round, and the fight was over. It was
  a 1st round knockout, and Sonny Liston

  became the new world heavyweight champion. #41 - On April 15th, 1985, world middleweight

  champion Marvelous Marvin Hagler defended his crown against former 2-division world

  champion, Tommy ‘The Hitman’ Hearns. In one of the greatest matches during the

  long rich history of professional boxing. Marvelous Marvin Hagler ended matters
  in round

  3 when he landed a booming right hand that sent the Hitman timbering down. Marvelous.
  Simply marvelous. #40 - On October 19th, 1985, IBF cruiserweight

  champion Lee Roy Murphy put his title on the line against Chisanda Mutti. This one
  had a wild Rocky 2 style ending,

  where in round 12, both boxers simultaneously landed bludgeoning rights, both boxers
  went

  crashing down, the ref began a count on both of them, and Murphy managed to make
  it to

  his feet, but Mutti didn’t. It was a highly dramatic 12th round knockout

  victory for Lee Roy Murphy. #39 - On April 24th, 1931, world lightweight

  champion Tony Canzoneri put his title on the line against the reigning junior welterweight

  world champion Jack Kid Berg. This was their 2nd bout in a 3 fight series. In round
  3 Canzoneri nailed Berg with a left

  uppercut followed by a mean right that sent Berg down, and the fight was over. #38
  - On October 30th, 1974, undefeated world

  heavyweight champion Big George Foreman put his championship on the line against
  former

  heavyweight champion Muhammad Ali. In round 8, Ali unloaded with a crisp combination

  that sent Foreman staggering down to the canvas. The fight was over, and Muhammad
  Ali had just

  become a 2-time heavyweight champion of the world. #37 - On August 2nd, 1980, WBA
  welterweight

  champion Pipino Cuevas put his belt on the line against undefeated contender Thomas
  Hearns. In round 2, Hearns rattled Cuevas with a disgusting

  right hand and quickly followed up with another one to send the champion down. With
  the victory Hearns had won his first

  of many major world titles. #34 was actually a 3-way tie in the scoring. The first
  happened on March 28th, 1981, when

  former 2-time light heavyweight champion Marvin Johnson faced undefeated contender
  Michael

  Spinks. In round 4, Spinks launched a menacing left

  hook that nailed the mark, and the fight was over. It was a spectacular left hook
  delivery from

  Michael Jinx Spinks. Then on June 27th, 1972, world light heavyweight

  champion Bob Foster defended his crown against undefeated contender Mike Quarry.
  In a heated fast paced contest, Foster ended

  matters with just a second left in round 4 when he detonated a nuclear left that
  leveled

  Quarry. The fight was over. And that was one hell of a left! Finally on January
  13th, 1954, former world

  heavyweight champion Ezzard Chalres went up against Bob Satterfield in a scheduled
  10

  round contest. But this one would not be going 10 rounds. As the two were exchanging
  punches in round

  2, The Cincinnati Cobra struck with a lethal looking left-right-left that floored
  Satterfield,

  and the fight was over. #33 - On March 15th, 1996, undefeated heavyweight

  prospect David Tua flattened fellow prospect John Ruiz just 19 seconds into the
  opening

  round. #32 - On November 28th, 1980, WBC light heavyweight

  champion Matthew Saad Muhammad went up against the undefeated challenger Lottie
  Mwale. Muhammad brought things to an end in round

  4 when he landed an obscene right hand quickly followed by a crippling left uppercut.
  The mouthpiece went flying, Mwale toppled

  over to the canvas, and the fight was over. (Lot-tea Mo-walley) #31 - On April 4th,
  1990, former heavyweight

  champion Michael Dokes squared off against Donovan Razor Ruddock. In round 4 Razor
  landed a mean left hook,

  a grazing right, and another pair of jolting left hooks that sent Dokes crumbling
  down. The fight was over in a splendid display of

  power. #30 - On November 5th, 1994, unified WBA/IBF

  heavyweight champion Michael Moorer put his titles on the line against former heavyweight

  champion George Foreman. Trailing on the scorecards late in the fight,

  Big George made boxing history in round 10. Foreman hammered Moorer with a right
  hand

  that would make boxing history. Moorer was down, and he was counted out.. At 45
  years old, Big George Foreman had become

  the oldest boxer in history to win the world heavyweight championship, making him
  a 2-time

  champion in the process, more than 20 years after he first held the crown. #29 -
  On January 15th, 1990, former world

  heavyweight champion George Foreman battled it out in a scheduled 10-rounder against
  former

  title challenger Gerry Cooney. Foreman dropped Cooney in round 2, and moments

  later, Foreman had him down again with a legendary left uppercut followed by a sledgehammer
  right. The fight was over. #28 - On March 20th, 1982, WBC flyweight champion

  Antonio Alevar put his title on the line against Prudencio Cardona. A furious opening
  round assault from Cardona

  chopped Alevar down in devastating fashion for a highlight reel 1st round knockout.
  #27 - On November 17th, 2001, unified IBF/WBC

  heavyweight champion Hasim Rahman had an immediate rematch against the man he beat
  to become

  champion, Lennox Lewis. The former champion avenged his shocking knockout

  loss with an incredible knockout victory, when he clobbered Rahman in round 4 to
  regain

  the world heavyweight championship. #26 - On April 29th, 1995, IBF junior middleweight

  champion Vincent Pettway squared off against former welterweight champion Simon
  Brown. In round 6, Pettway blasted Brown with a counter

  left that sent him down and out. #25 - On July 18th, 1987, WBA junior middleweight

  champion Mike McCallum put his title on the line against former welterweight champion

  Donald Curry. In round 5 McCallum unloaded with a cracking

  left hook that sent Curry down. The fight was over, and McCallum retained

  his title. #24 - On April 16th, 1952, world middleweight

  champion Sugar Ray Robinson defended his crown against former middleweight champion
  Rocky

  Graziano. Early in round 3 Robinson fired off a sequence

  of speedy punches, and Graziano clipped him with a right hand that had Ray down.
  Later in the round Sugar Ray blasted Rocky

  with a savage combination that clobbered him. Graziano was down and he did not beat
  the

  count. It was a 3rd round knockout for Sugar Ray

  Robinson. #23 - On July 30th, 1988, WBA junior middleweight

  champion Julian Jackson went up against former junior middleweight champion Buster
  Drayton. In round 3 The Hawk bombarded Drayton with

  an obscene left hook that sent him crashing down like a felled tree. This one was
  over. #22 - On June 22nd, 1938, world heavyweight

  champion Joe Louis put his championship on the line against the only man who had
  previously

  beaten him, former heavyweight champion Max Schmeling. Cool as an assassin, Joe
  Louis made quick

  work of his former conqueror, dropping him 3 times before the fight was stopped
  just

  over 2 minutes into the opening round. #21 - On May 24th, 1968, light heavyweight

  world champion Dick Tiger squared off against challenger Bob Foster. In round 4
  Foster threw a quick combination

  that included a nasty left hook, and down went Tiger who would not beat the count.
  Bob Foster had just become the new world light

  heavyweight champion. #20 - On April 25th, 1998, WBC light heavyweight

  champion Roy Jones Jr went up against former 2-time light heavyweight champion Virgil
  Hill. This was a non-title bout scheduled for 12. In round 4 Roy landed a crippling
  right downstairs

  that sent Hill crumpling down to the canvas. The fight was over, and this was the
  first

  time Hill had ever been stopped inside the distance. #19 - On June 20th, 1960, world
  heavyweight

  champion Ingemar Johansson had an immediate rematch against the man he beat to become

  champion, Floyd Patterson. Patterson dropped Ingo in round 5, and near

  the end of that round, Patterson dropped him again with a picture perfect left hook
  that

  ended the fight. Patterson became the first boxer in history

  to regain the heavyweight crown. #18 - On June 27th, 1988, undisputed WBA/WBC/IBF

  heavyweight champion Iron Mike Tyson went up against lineal heavyweight world champion

  Michael Spinks, in a battle for undisputed heavyweight supremacy between two undefeated

  champions. Before long an uppercut followed by a crippling

  body shot sent Spinks down. He beat the count, but Tyson jumped on him

  immediately and a thunderous right hand had Spinks down again. This time Spinks
  would not beat the count. It was a sensational 1st round victory for

  Iron Mike Tyson. #17 - On July 26th, 1986, undefeated heavyweight

  contender Mike Tyson had a scheduled 10 round contest against Marvis Frazier, but
  this one

  would not be going 10. Right out of the gate, Tyson unleashed a furious

  assault with some vicious uppercuts that sent Frazier down and out. The fight was
  over. #16 - On March 25th, 1989, undefeated IBF

  middleweight champion Michael Nunn went up against former middleweight champion,
  Sumbu

  Kalambay, who had recently been stripped of the WBA preventing this from being a
  unification

  bout. Second to Nunn ended matters in the opening

  round compliments of a dynamite slingshot left hand. #15 - On February 11th, 1990,
  world heavyweight

  champion Iron Mike Tyson put his undisputed crown on the line against James Buster
  Douglas. Despite dominating most of the early action,

  Douglas was nearly knocked out by a Tyson uppercut in round 8. But Douglas persevered
  and reseized command

  of the action. Douglas landed a booming uppercut in round

  10 with a furious follow-up. Tyson was down, and he looked badly dazed

  and confused as he was grabbing for his mouthpiece. Mike slowly rose to his feet,
  but by then

  he had been counted out. It was a 10th round knockout for Tokyo Buster

  Douglas in what to this day is still the greatest upset in boxing history #14 -
  On December 6th, 1985, undefeated WBA/IBF

  welterweight champion Donald Curry squared off against undefeated WBC welterweight
  champion

  Milton McCrory. This battle for undisputed middleweight supremacy

  didn’t last long. A smashing left hook from Curry dropped McCrory

  in round 2. He got up, and moments later a smashing right

  hand from Curry finished the job. The Lone Star Cobra had just become the undisputed

  world welterweight champion. #13 - On November 22nd, 1986, WBC heavyweight

  champion Trevor Berbick squared off against undefeated contender Iron Mike Tyson.
  After being dropped by a combination in round

  2, Berbick beat the count and moments later, Tyson dropped him again with a short
  combination. Berbick rose too quickly, and he stumbled

  down again twice more during the course of the same knockdown. When Berbick finally
  gathered himself to his

  feet, the ref had seen enough, and Tyson became the youngest heavyweight to win
  a major world

  title #12 - On October 18th, 1991, undefeated heavyweight

  contenders Tommy Morrison and Merciless Ray Mercer battled it out for Morrison’s
  minor

  WBO belt. Morrison started the fight off strong, and

  looked good early. But in round 5, Mercer unloaded with one of

  the most fierce and vicious knockout combinations ever captured on film. Mercer
  lived up to his “merciless” moniker

  as he launched one big bomb after another with staggering precision. #11 - On March
  31st, 1980, undefeated WBA

  heavyweight champion John Tate went up against challenger Mike Weaver. Behind in
  the fight going into the 15th and

  final round, Weaver landed a zinger of a left hook right on the button. Big John
  Tate was down, and he would not be

  beating the count, making Weaver the new WBA champion. #10 - On May 15th, 2004,
  unified WBA/WBC light

  heavyweight champion Roy Jones Jr had an immediate rematch against Antonio Tarver.
  Roy won a close majority decision the first

  time around. But this time around, in round 2, Tarver landed

  a perfect left hand that flattened Roy. The fight was over, and The Magic Man had

  just won the unified light heavyweight crown in dramatic fashion. #9 - On March
  31st, 1980, undefeated WBC welterweight

  champion Sugar Ray Leonard squared off against challenger Dave Boy Green. In round
  4 Leonard unloaded with a quick right-left,

  immediately followed by another quick right hand and left hook, and Green went down
  hard. Green would not be beating the count, and

  Sugar Ray Leonard was the winner by 4th round knockout. #8 - On May 2nd, 2009, lineal
  junior welterweight

  champion Ricky Hatton squared off against former 5-division world champion Manny
  Pac-Man

  Pacquiao. Pacquiao dropped Hatton twice in the opening

  round, where a badly shaken Hatton managed to survive the round. As round 2 was
  coming near an end, Pacquiao

  launched a devastating left that connected on Hatton’s chin, right on the button.
  The fight was over. #7 - On November 20th, 2010, WBC middleweight

  champion Sergio Martinez had a rematch against his former conqueror Paul Williams.
  In round 2, when both boxers were simultaneously

  looking to land the left, Sergio’s found the mark first and Williams crashed down
  to

  the canvas. It was a spectacular 2nd round knockout for

  Sergio Martinez. #6 - On July 18th, 1951, world heavyweight

  champion Ezzard Charles squared off against a man he had already twice beaten, Jersey

  Joe Walcott. Amazingly this was the 5th chance at a title

  fight for Jersey Joe, and in this case, the 5th time’s a charm. In round 7, Jersey
  Joe Walcott hammered The

  Cincinnati Cobra with an obscene left hook that ended the fight. Jersey Joe had
  become the oldest man to ever

  win the world heavyweight championship at that time. #5 - On September 23rd, 1952,
  world heavyweight

  champion Jersey Joe Walcott went up against undefeated heavyweight contender, Rocky
  Marciano. In round 13, Walcott was looking to set a

  trap for a big right hand, and at that exact moment Marciano drilled Walcott with
  a sledgehammer

  right of his own. Walcott was down and he would not be beating

  the count. It was a 13th round knockout, and Rocky Marciano

  had just become the new world heavyweight champion. #4 - On December 8th, 2012,
  the 4th and final

  encounter between Manny Pac-Man Pacquiao and Juan Manuel Marquez. Officially, Pacquiao
  had 2 wins and a draw

  against Marquez to this point. This was a wild one that saw both fighters

  hit the canvas. As round 6 was drawing towards an end, Pacquiao

  began getting aggressive, and Marquez walked him directly into a smashing right
  hand. Pacquiao was down, and he would not be beating

  the count. The fight was over. #3 - On May 1st, 1957, world middleweight

  champion Gene Fullmer put his championship on the line against the man he beat to
  win

  the championship, Sugar Ray Robinson. In round 5, Robinson found the mark with a

  sensational left hook that sent Fullmer crashing down to the canvas, and he was
  counted out. The great Sugar Ray Robinson had just reclaimed

  the world middleweight championship making him a 4-time middleweight champion in
  the

  process. #2 - On November 24th, 1990, former junior

  middleweight champion Julian Jackson squared off against Herol Graham for the vacant
  WBC

  middleweight title. Graham was in complete control of the action

  through 3, and this trend continued into round 4 until it happened - Jackson landed
  a beautiful

  counter right hand that had Graham out cold before he crashed down hard. Oof madone!
  The fight was over, and The Hawk had just

  become a 2-time champion. And finally #1 - On June 15th, 1984, WBC junior

  middleweight champion Thomas ‘The Hitman’ Hearns went up against former 3-division
  champion

  Roberto Duran. Hearns dropped Duran twice in the opening

  round, and Duran was badly shaken but he survived the round. In round 2, Hearns
  launched a nuclear right

  that detonated right on Duran’s chin. Roberto fell face down onto the canvas and

  he would not be beating the count. The fight was over, and it was an absolutely

  spectacular knockout victory for Tommy ’The Hitman’ Hearns. Simply spectacular!
  Once again, I’d like to give a very special

  thanks to the 25 volunteers who participated in this Survey. Without them this video
  would have never been

  possible, so these are the real heroes behind this countdown video. Also a special
  thanks to the YouTube channel

  Smooth Legends. Smooth Legends does an absolutely awesome

  job restoring old fight footage, so if you aren’t familiar with the channel, you
  should

  definitely check it out! Smooth Legends. Thank you very much for watching everyone,

  I hope you enjoyed, and have a wonderful night. This is Rummy’s Corner.'
