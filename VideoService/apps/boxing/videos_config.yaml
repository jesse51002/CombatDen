company_name: Sweet Science Boxing Club
type: Boxing gym
videos_desc: |
  Classic boxing — the sweet science of footwork, head movement, and crisp
  punching for members from first-timers to amateur competitors. Worth
  surfacing: footwork and combination tutorials, the greatest professional
  knockouts and title-fight footage, mitt-work and trainer behind-the-scenes,
  and credible boxing news around big cards and weigh-ins.
avoid_desc: |
  Within-boxing content the club rejects: street-fight and backyard-brawl
  compilations passed off as boxing, contrarian "boxing is useless in a real
  fight" framing, sloppy or unsafe technique taught as gospel, and sketchy
  supplement or training bro-science.
