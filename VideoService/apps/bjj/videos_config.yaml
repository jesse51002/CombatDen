company_name: BJJLover
type: Brazilian Jiu-Jitsu academy (gi and no-gi)
videos_desc: |
  Welcoming gym-and-grappling content for adult beginners coming to BJJ for the
  first time. Worth surfacing: position-first fundamentals tutorials (mount,
  side control, guard retention, escapes) in gi and no-gi; safe-rolling and
  partner-etiquette explainers; white-belt-journey vlogs and longevity-minded
  BJJ-as-lifestyle stories; black-belt interviews on training culture and the
  why of the art; and credible breakdowns of BJJ working in real self-defense
  situations.
avoid_desc: |
  Within-BJJ content the gym pushes back on: heel-hook, neck-crank, and
  spinal-lock tutorials taught with no mention of control or tap safety;
  videos celebrating spazzy or injurious rolls with beginners ("white belt
  destroyed", "how to wreck a spaz"); and the recurring "BJJ doesn't work in
  a real fight" / "BJJ is useless on the street" debate and reaction videos.
searches:
  - query: bjj fundamentals for beginners step by step
  - query: white belt bjj journey vlog first year
  - query: bjj black belt interview training culture lifestyle
  - query: ibjjf world championship gi finals highlights
  - query: bjj in real self defense situation breakdown
priority_channels: []
