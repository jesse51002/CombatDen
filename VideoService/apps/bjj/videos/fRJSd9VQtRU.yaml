transcript: here's five white belt mistakes that you need to avoid number one when
  you're passing the guard No Hands on the mat hands on the mat allow him to attack
  kimuras and nomaplatas number two don't put two hands on one side of their body
  two hands to one side exposes your back allowing him to get behind you and potentially
  choking number three two hands in or two hands out one and one get you triangles
  number four when you're in the guard don't try and choke okay if you're reaching
  out for collars and doing things like this your arms are overextended which allows
  him to attack arm players number five don't grab the head from inside the guard
  if you're trying to hug his head like this okay you're off balance and also I'm
  trying to open his guard here so how am I gonna fight his legs if I'm holding onto
  his head
