transcript: what's going on everyone this is Vince from life with Vince Liu and it's
  been about two weeks since I was promoted from a white belt to a blue belt in Brazilian
  jiu-jitsu so I wanted to recap that journey up until now so all in all it's been
  about a year and a half since I first started Brazilian jiu-jitsu and then I was
  promoted about eighteen months later so honestly it doesn't really feel any different
  other than maybe the fact that people are gunning for me a little bit harder I mean
  before I was that white belt 130 pounds but now that I have a colored belt or a
  blue belt people seem to be going at me a little bit harder so no mercy right so
  um as far as my mindset I mean that hasn't really changed I mean I'm there in class
  to learn to grow to get better I'm the belt never really mattered to me anyways
  just cuz the mats don't lie so right now as a blue belt I still if I had to make
  a comparison I'd say I'd feel like a first or second grader I've learned the alphabet
  and then I'm now starting to put words together you know CatDog something simple
  but even then I still may may mess up on some of the basics I may mess up on you
  know formulating the words ie or you know executing the certain moves so the two
  big things that I feel that have helped me progress from a white belt to a blue
  belt is number one is going to be consistency and number two would be private lessons
  so as far as consistency was going about four to five days a week sometimes I would
  go twice a day that wasn't that often maybe I'd go twice a day maybe once a week
  or once every other week but you know I feel like going consistently improved my
  jiu-jitsu a lot just because I mean when you're going to class you are you know
  you're learning that knowledge and the knowledge that you accumulate the more that
  you go to class the more knowledge you accumulate not only that but you know after
  each class we usually do you know three five-minute rounds so live sparring so you
  can actually use the knowledge that you learned in class to see if it works if it
  doesn't work if certain things need a little bit of tweaking you know that's consistency
  I mean just go to class in addition the second thing would be the private lessons
  I mean the private lessons are probably the best investment that I've made in myself
  this year yes they cost extra money on top of your your gym fees but they are totally
  totally worth it I mean on average it takes you know someone a black belt ten years
  to go from a white belt to a black belt you know a black belt meaning that they
  are you know basically an expert in that field and they have a good command of jiu-jitsu
  right so with that being said this is how I think about it is that what else does
  it take ten years to achieve so a doctor a therapist I mean a medical professional
  so but a black belt that's you know they've taken ten years to achieve that so it's
  worth the money and even it's actually a steal because as you know it's only thirty
  forty fifty dollars an hour I mean it can go up to like a hundred to two hundred
  dollars depending on who you're with but you know thirty to forty dollars is super
  reasonable for an hour of their time that they're teaching you you know you can
  bring all your questions you can bring you know things that you're struggling with
  or just general questions that you have that you maybe can't cover in in the regular
  class so I mean most weeks we do about one private lesson some weeks we do two but
  it really just depends on our schedule I mean when we first started we started off
  with basic guard work and then week by week we built on that so basic guard work
  to breaking the guard to passing to della Hiva to reverse le Hiva - I mean spider
  lasso and then it all kind of built on one another and then now I feel like I have
  at least a few moves from each position you know so I'm not scrambling or I don't
  know what to do and certain positions I at least have one or two moves granted sometimes
  that one or two moves don't work or I need to get a more polished right so thanks
  for watching this video I hope you guys enjoy a recap of my personal jujitsu journey
  and if you're thinking about doing jujitsu I would highly highly recommend it I
  think I did other another video you know a few months ago detailing what why and
  you know why you should do jujitsu so it's been super beneficial for me it's not
  only a form of fitness but it's it's it's physical fitness but it's also a mental
  fitness as well so I'm go to your local jiu-jitsu school sign up for a trial usual
  have three to three to seven day trials or something like that so but yeah thanks
  for watching hope you guys enjoyed that video comment down below like subscribe
  see y'all soon
