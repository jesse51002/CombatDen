transcript: the first three Mount escapes that every beginner needs to mark it's going
  to take a lot of skill to hit this on good people but when you're rolling with other
  beginners this is going to be the easiest way to get out of mouth the very first
  Mount Escape that you need to know as a beginner is the basic bridge and roll all
  it is is a trap on both his limbs on this side of his body a bridge and then a look
  back over my shoulder like I'm gonna now there's a lot of ways to trap this hand
  you can have it pinned down here and collect his elbow on the back you can have
  it trapped with both hands or you could even have an overhook here like say he's
  grabbing around your head and you can overhook right here the other hand generally
  speaking I want you to kind of keep it to yourself and keep it tight you can do
  a bridge and roll with this big underhook but just know that you're going to be
  way more Exposed on the other side if you do it though what do I do with my feet
  walk a little bit just like this all right I want to trap the foot but I don't want
  to do it from the center right here because he can like stay low and try to hide
  that hide that foot trap from me that's I'm pretty flexible and I can I can touch
  him but I can't trap him but a simple little shift with your hip over boom and then
  you can turn your knees toward it and just pull your heel to your butt you should
  have a much more effective trap against his leg remember you don't have to hold
  these forever just long enough to start to make the momentum to the top so got him
  trapped here look back over your shoulder right don't try to roll sideways you're
  trying to go backwards at this angle here look over your shoulder and bridge that
  direction as you go ahead and make the turn when you make that bridge I want one
  movement in the beginning You're Gonna Go bridge and Roll But if you'll make it
  all one fluid movement your success rate is going to go way up the second amount
  of skate that you need to practice and in my opinion the one that makes the most
  sense as you move up the food chain is the knee elbow escape this happens when his
  weight is here and he's attacking your hand be careful you don't let this arm get
  out open like this I want you to shift your upper body and Tuck That Elbow inside
  okay so now I should have a frame on his opposite hip over here and you want to
  have a frame here on the inside note that I'm not pushing him away with my hands
  I want his weight up here because that makes his leg light and so now when I'm ready
  I want to look I want a bridge and roll him but he's hiding that position from me
  and so I move my hip away maybe twice if I need to because what I have to do is
  flatten this leg in between his legs and now I'm positioned to start to put my foot
  under his ankle and now I hit this knee elbow Escape pulling my knee and my elbow
  back together and dropping him into the half guard I should already have an under
  ready to go on this half guard side so I'm going to turn and get on my other hip
  the third Mount Escape is the Kipping Escape or the hip bump Escape so with the
  Kipping escape a lot of times it's done with both of the hands on the hips they
  make a big bump and they pull the knees on the inside that's not really how I use
  it I do want to use that knees inside concept but I keep the same survival posture
  in here with the frame across the far hip and the elbow on the inside this is important
  I've gotta hide this underhook from him I don't want him to be able to manipulate
  this into an arm triangle show him no I'm trying yeah I don't want him to be able
  to do that so elbow on the inside now I'm Gonna Bump him forward with my bottom
  knee and I'm gonna try to almost like I'm rolling backwards over my shoulder here
  and I'm gonna try to pull that one knee to the inside and now my guard is back right
  here this other leg can do a couple of things like if you if he gives a lot of space
  right here then maybe you can pull both butterfly hooks in and you'll have double
  unders that's a great attacking position but it might be that you just take your
  hands and shove them over here and start attacking a leg lock now these are the
