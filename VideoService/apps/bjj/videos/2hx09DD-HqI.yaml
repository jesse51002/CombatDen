transcript: so your first skill is the skill of being able to free yourself from positional
  pins most of the Escapes in Jitsu go to guard position and so once you get someone
  in your guard they're going to be looking to pass your guard and get back into those
  positional pins that you just escaped from and that's just as crushing as getting
  pinned you feel like every time you try to hold someone on guard they just evly
  pass you by so your first two skills you got about to get out of any pin and you
  got about hold someone in your guard so pin escapes and guard retention are your
  first two skills I generally Advocate the idea of learning to fight from your back
  first and then learning to fight from on top second why because the brute fact is
  when you first start off you just don't have enough skills to hold top position
  or gain top position through a takedown so inevitably you're going to end up underneath
  people for most of your training time your training should reflect that in the early
  days as a white belt start with the first two skills you need they're not the most
  exciting they're not sexy skills that are going to make you look like a stud in
  the training room but they're going to keep you alive long enough to learn those
  sexy skills in the future that will make you look like a start start with pen escapes
  go to guard retention and focus heavily on those two when you start to get into
  offense start with bottom position so there's a clear continuity between your PIN
  escapes your guard retention and then your guard itself okay you've got different
  options with God some of you going to like clo guard some of you are going to like
  variations of open God some of you going to like to be seated some of you going
  to like to be supine some of you are going to like half guard as a general rule
  this is a heavy generalization but I'm going to give it to you in my experience
  most people benefit the most by starting with half guard first I know that traditionally
  Jitsu has been taught close guard first and then all the other guards come after
  that I'm a big believer in the idea of start with pen escapes then go to guard retention
  and then start with half guard bottom that way you get a nice continuity between
  your first three skills and you make good progress over those first critical six
  months in Jiu-Jitsu
