transcript: welcome back to the channel if you have just started training jiu jitsu
  or maybe you've been doing it for a little bit you've gotten some positions down
  you've worked on some sweeps but you're having trouble getting off any submissions
  and finishing your matches then this video is for you because today we're gonna
  be going over the first 10 submissions that you should learn the submissions that
  we're going to be going over today are both high percentage and also they don't
  require a whole lot of skill and coordination in order to learn with a modest amount
  of practice even a complete beginner should start seeing some success with these
  submissions and since everybody is going to have their own style and pick up on
  different submissions easier than others i will be going over 10 submissions so
  hopefully you'll be able to pick up three that you'll be able to start working and
  hitting in class so if you guys are ready put on your thinking caps and let's get
  right into [Music] this the arm bar is one of the most basic and effective submissions
  in jiu jitsu from the guard grab your opponent's neck step on their hip and pinch
  your knee against their shoulder to keep them from pulling their arm out then bring
  your bottom leg across their shoulders as you rotate your body perpendicular to
  theirs then bring your top leg over their head and curl down with your foot this
  will prevent them from stacking and pulling their arm out to finish grab the wrist
  with both hands and hip in be sure to keep their thumb pointed up when you do this
  and it's important to cut an angle and be as smooth as possible when you throw that
  top leg over their head as any gaps may give them enough space to escape the submission
  you can also go for the arm bar from high mount when i do this i like to stay on
  top of my partner that way i keep my weight on him for maximal control and from
  side control if you slide your leg over their bottom arm you can use your underhook
  to transition to the spinning arm bar this is a great way of catching your opponents
  off guard [Music] the americana or key lock is a great submission for wipeouts and
  one of the first submissions that i learned when your opponent frames on your neck
  grab their shoulder and use your underhook to push their arm out then grab their
  wrists shove it to the mat and use your underhook to grab your own wrist to finish
  bring their elbow closer to their hip and rotate your grip when i go for this submission
  i like to put my elbow on the mat right next to their neck if you don't do this
  your opponent will have enough space to turn away from you to defend the submission
  the americana is a great submission for pressure passers that like to secure dominant
  positions before they go for the submission and you can also hit the americana from
  multiple positions including a mount also from mount if they turn to their side
  when you go for the key lock you can transition to the arm bar on the other arm
  for all of these reasons the americana is a great first submission to learn the
  gamora similar to the americana is another basic arm lock when my opponent pummels
  an underhook from bottom half guard i like to switch my hips putting weight on their
  underhook i'll then use my elbow to pry their wrist to the ground then i'll grab
  their wrist with my hand and grab my own wrist with my top hand from there i'll
  slide my knee up to their armpit to keep their shoulders on the mat and then i'll
  rotate my grip thinking about moving their hand up above their head like the arms
  of a clock [Music] i also like to keep their wrist away from their body if they
  grab their pants it can be very hard to break the grip and finish the submission
  as a beginner this is a great basic submission to learn and as you become more advanced
  if you master the kimura trap you'll be able to hit it from virtually any position
  from full guard if you can make your partner touch the mat turn to your side and
  attack that arm also from half guard when your partner pummels the underhook lock
  up the gamora trap if you have a good grip on it you can kick your leg free from
  their half guard pass the side control hop over to north south and finish it from
  there the triangle is another great submission at all levels from white belt through
  to top level black belts from closed guard grab your partner's neck to break down
  their posture then shove their wrist up against their chest throw your top leg over
  their neck cutting across their shoulder grab your shin and figure for your legs
  i like to walk back with my shoulders and pull their head down to finish the choke
  another way to finish the triangle is to turn yourself perpendicular to your partner
