  shoulder so that they can pull out and it's also important to keep your partner's
  posture broken down the entire time as a submission the triangle is about as versatile
  as they come if you have your fundamentals down you can hit it from just about anywhere
  from high mounts you can grab your partner's neck shove their wrists to their chest
  and attack a triangle much like you would from guard you can also roll to your back
