transcript: okay white belts here are some tips to help you suck a little bit less
  a common mistake when bridging is using tiny pops of your hips like you're a fish
  out of water instead bring your toes close to your hips and thrust your hips up
  diagonally until you can throw your leg over and get to your knees this is going
  to be very useful for a lot of different escapes including the arm trap and roll
  if you like this video make sure you follow for more
