transcript: Hi everyone, I'm Gustavo Gasperin, Brazilian jiu-jitsu instructor under
  the great Fabrico Verdum and you're watching jiu-jitsu for dance. So what is Brazilian
  jiu-jitsu? Jiu-jitsu is a grappling based martial art and self-defense system created
  by Carlos and Elio Gracie when they modified some techniques and philosophy of the
  traditional Japanese jiu-jitsu. Although Brazilian jiu-jitsu focuses primarily on
  grappling and more specifically on ground fighting, it is a comprehensive self-defense
  system that includes striking techniques, throws, and stand up techniques and strategies
  against surprising attacks. Like most martial arts, jiu-jitsu can also be practiced
  as a competitive sport. The rule set will vary from tournament to tournament, but
  generally striking techniques are not allowed in sport jiu-jitsu, and you can practice
  it whether or not you are wearing its uniform, which is called ghee or kimono. A
  legit Brazilian jiu-jitsu black belt instructor should be wellversed in all aspects
  of the art, ghee, no ghee, sport, and self-defense. Now, let's take a look at how
  jiu-jitsu works. Jiu-jitsu is a comprehensive self-defense system created to allow
  a smaller, weaker person to defend him or herself against a bigger, stronger, and
  more athletic opponent by using proper technique, leverage, and most notably taking
  the fight to the ground. By closing the distance and taking the fight to the ground,
  your opponent's ability to strike and inflict damage are greatly reduced. The strategy
  consists in taking away your opponent's strengths and ability to win while applying
  your own. The longer you stand and trade punches with someone who is bigger and
  stronger, the higher their chances of hitting you with a damaging strike. The stronger
  the opponent, the harder they will hit. The bigger the opponent, the more damage
  they can take and the longer the reach is, so they can hit you without getting hit.
  Superior reach and powerful strikes are both mitigated when grappling on the ground.
  Jiu-jitsu methodical self-defense and fighting system. And its application can be
  broken down into four phases. Phase one, closing the distance and clinching with
  the opponent. Phase two, taking the fight to the ground. Phase three, achieving
  a dominant position. Phase four, finishing the fight. So now, let's take a look
  at those four phases. Starting with phase one, closing the distance. Learning how
  to safely close the distance against someone who is trying to hit you is definitely
  one of the most important aspects of jiu-jitsu. The goal is to create or find an
  opening depending on what type of opponent you're facing. If you're going against
  someone who is very aggressive and is moving forward trying to hit you, half of
  the work is already done since he's helping you to close the distance. Just make
  sure you time it well and cover your face to avoid any unexpected blow. If you're
  facing someone who is more conservative and is trying to pick his shots, you might
  have to take the initiative and throw some strikes to distract your opponent while
  you close the distance. Closing the distance is also one of the main difference
  between jiu-jitsu for self-defense and sport. In sport jiu-jitsu, you don't worry
  about strikes when closing the distance and you are facing someone who is willing
  to grapple with you. As we discussed earlier, taking the fight to the ground is
  an important part of the system. That's how you mitigate your opponent's superior
  reach and powerful strikes. There are many ways you can take your opponent down
  after you have established the clinch, including leg trips, hip tosses, upper body
  takedowns, and lower body takedowns. Taking the fight to the ground and keeping
  top position is the primary option in a real fight situation since most of your
  opponent's strikes from the bottom position are ineffective. But it's not uncommon
  for jiu-jitsu practitioners to choose bottom position when taking the fight to the
  ground, a technique known as pulling guard, especially if you're having a hard time
  executing a takedown. Knowing your opponent's instinctive behaviors and immediately
  adjusting to them is what will make you succeed from the bottom position. Pulling
  guard is common in sport jiujitsu, and the bottom position is without a doubt one
  of the most sophisticated parts of the game. As a practitioner of the art, be equally
  skilled on the bottom and top positions. The next step after taking the fight to
  the ground is achieving a dominant position, which will give you great control of
  your opponent through proper use of body weight distribution, leverage, and gravity.
  A dominant position will not only allow you to set up your attacks, but also limit
  your opponent's escapes and potential of doing damage. We have four main positions
  in jiu-jitsu. The guard, side control, mount, and the back. 90% of the time, you
  will find yourself in one of those positions. They follow a hierarchy with some
  positions being more advantageous than others. So, let's take a look at the guard
  first. The guard is the ability of using your legs to manage the distance, control,
  and attack your opponent while fighting off your back. The guard separates jiu-jitsu
  from any other grappling based martial art. There is no martial art in the world
  with a guard as developed as the one we have in jiujitsu. A good guard will not
  only allow you to defend yourself against strikes, but also execute reversals to
  come on top and finish the fight. There are many types of guard you can use depending
  on how you manage the distance between you and your opponent, but the three main
  guards are closed, half, and open. Each one of those three guards can be subdivided
  into many more. As we talked before, keeping top position is the primary option
  in a real fight situation, but if you end up on bottom, the guard is your best friend.
  The guard is a dangerous position with a plethora of attacks and reversals in constant
  evolution, especially in sport jiujitsu where you have the freedom to create new
  moves without worrying about strikes. Side control is the first dominant position
  you should look for when you have top position. Your goal is to get around your
  opponent's legs, aka passing his guard, and achieve perpendicular position in relation
  to his body, making it difficult for him to recover his guard. From there, you have
  many attacks, especially in sport jiujitsu, where you can also use the ghee jacket
  as an offensive tool. In a real fight situation, side control is mostly used to
  smother and hold the opponent down while looking to improve positioning to the mount
  or back controls. There are also different ways to control your opponent while inside
  control. The main ones are chest on chest, kasagat, reverse kazagat, and north and
  south. The mount is the second most dominant position in the jiu-jitsu hierarchy.
  He offers great control of your opponent and a multitude of attacks in both self-defense
  and sport jiujitsu. The main reason the mount is such a dominant position is that
  you can inflict great damage via punches and elbows with little to no risk of being
  attacked back because of the reach advantage from the mount. Often your opponent
  will turn his back to protect his face or escape, making things worse for him. In
  sport jiu-jitsu, chokes are the equivalent of punches. If I can't choke you from
  the mouth, I can definitely punch you. The back is the most dominant position in
  jiu-jitsu. You have excellent control and your opponent can see where your attacks
  are coming from. The more he tries to punch you, the easier it is to choke you out
  since he's not defending his neck. The back control is the end of the line positioning
  wise. You only go back to side control or mount if you're losing control of the
  back. Stay there until you finish your opponent. After achieving a dominant position
  and establishing control of your opponent, the next step is finishing the fight
  with either a submission hold or strikes. Submissions can be categorized into two
  groups, chokes and joint locks. Chokes can be further classified into air chokes
  and blood chokes. Air chokes are executed by compressing the trachea which leads
  to asphixia. The compression can be applied using your legs or arms. Blood chokes
  are executed by compressing the carroted arteries, cutting or limiting the blood
  supply to the brain, which could cause unconsciousness or even death if the holds
  maintained for a prolonged period. Joint lock submissions can be applied to any
  joint of the human body by forcing the joint to move past its normal range of motion.
  Let's take a look at the application of some of the most popular submissions in
  Brazilian jiu-jitsu. Starting at the wrist joint, wrist locks are applied by hyperextending,
  hyperflexing, or rotating the joint. Wrist locks can be hit from almost any position.
  Moving up to the elbow joint, the most common attack is the armbar causing the hyperextension
  of the joint. Shoulder joint, kimuras, omoplatas, and americanas are the primary
  attacks against the shoulder joint and rotator cuff. Neck cranks can be applied
  in a variety of ways, attacking the neck in different angles. Most common submissions
  are the can opener and the twister. Banana split and crotch riaper are the most
  common attacks at the hip joint. At the knee joint, we have knee bars and heel hooks
  as the primary attacks. Last is the ankle joint where toe holds and straight ankle
  locks are the go-to submissions. All right, guys. So, this concludes our jiu-jitsu
  for dummies video. Hope you guys like it. Please check our website for new cool
  content and also subscribe to our YouTube channel.
