transcript: what's going on everyone this is Vince from life with Vince Liu and it
  has been ride around a year since I've started my jujitsu journey so I wanted to
  make this video if you're thinking about joining jiu-jitsu or maybe you just recently
  started here are 10 things to expect the very first year so the very first thing
  is the cost how much does it cost monthly to be a part of a jiu-jitsu gym so I've
  been at two different gyms one in Southern California and one in a Northern California
  so this only applies to a California but you can expect to pay anywhere from 75
  to 150 dollars a month you can maybe even strike a deal with the professor or the
  gym owner if you pay a year in advance or two years in advance or usually they'll
  have monthly plans as well so expect to pay anymore from 75 to 150 dollars a month
  for your monthly dues in addition you're gonna have to have your gear for jiu-jitsu
  so if you're gonna do noogie you're gonna have to get some new gear some compression
  gear and if you're gonna do a ghee ghee classes you're gonna need obviously Aggie
  so keys can cost anywhere from fifty to three hundred dollars and most of mine just
  because I wanted multiple I just got sixty to eighty dollar keys so I have 5g so
  60 that's three hundred to four hundred dollars just worth of G's and then obviously
  I have the nogi compression stuff I'd luckily I didn't have to pay for that just
  because I had it from trip when I did track in high school it look at least still
  fits me now but so I had that type of gear already but you know factor that all
  in there you go so going off of that number two is gonna be expect to do a lot of
  laundry especially if you're in a nogi gym every time I wore my Geeta class after
  class it's soaked it's wet it's gonna stink if I don't wash it and I don't want
  to be that guy so every time you wear your ghee you're gonna wash it you know and
  then if you go twice a day that's two keys that you have to wash so that's all I
  have multiple because then I can just cycle through I usually also like to hang
  dry mine so I don't put mine into the dryer so I wash it i dry usually takes about
  a day or two to hang and then also you got your no geek gear you know so the more
  that you go to jiu-jitsu the more that you're gonna have to do laundry number three
  is feeling lost and sometimes even overwhelmed you're basically learning how to
  walk again you're learning a whole brand new art there's an unlimited amount of
  moves attacks escaped so it's you're literally learning all of this information
  and then now you have to apply it and like whoa how do I do this and how do I do
  that and when do I use this and when do I use that and then it's can be overwhelming
  but take it one step at a time take it one day at a time the more often that you
  show up the more that it's gonna make sense the first day I went I saw them doing
  drills and I was like I don't even know how to do a shrimp I don't even know how
  to do a back row I don't even know how to do a hip escape or anything like that
  but the more you go the more often that you're gonna do those drills that you're
  gonna do those move some more that you're gonna see everything that you're gonna
  learn you're gonna get stuck in certain position then you're not gonna know how
  to get out but you're that's why you keep going to class and you keep learning and
  then a year later you're it still doesn't make a hundred percent sense but you just
  get it a little more so it's totally normal to feel lost and overwhelmed but take
  it one day and one step at a time one move at a time number four expect to get smashed
  and submitted frequently you're the brand-new white belt you're coming in with no
  experience and other people have six months more one year more two three four five
  years more they're gonna try to impose their will and then you're gonna try to impose
  your will but the thing is you're a brand-new white belt you don't know not to leave
  your arms out you don't know how to get out of those certain positions so expect
  to get smashed because you just haven't learned those moves yet or to get out of
  those certain moves but the cool thing is the more that you go you'll at least for
  me not that I want to get smashed but a certain point you're like well you know
  this is normal or I'm so used to this because when you first start you're like freaking
  out you're like oh I'm you know like get away from me and then you're trying to
  like benchpress them off and you're expending a lot of energy whereas now it's like
  they'll smash me and I'm just like okay how do I think through this situation how
  can I use leverage and fulcrums and manipulate their body parts to make them do
  or make them go a certain way that I want but in order to get to that point one
  you got to show up to you're gonna get smashed number five is gonna be the battle
  wounds that comes with jiu-jitsu it's you against someone else you're trying to
  impose your will they're trying to impose theirs you're gonna stop a thing you're
  gonna sub a toe and you're gonna get maybe even scratch so expect those bad ones
  that come with it currently right now my pinky toe I'm pretty sure there's a hematoma
  cuz they're I think I stubbed it and the nails black right now but and it just comes
  with it you're gonna you know maybe you're gonna be doing takedowns and then you
  could you know like your shoulder is gonna be sore or whatever it is I have my current
  I always have bruises I always have cuts that's why I take my fingers I'll tape
  my wrists right now like my wrist is a little funky so I make sure to tape preventative
  so expect those battle wounds number six expect to get in better shape you're gonna
  be using your entire body you're gonna be doing takedowns you're going to be doing
  drills you're gonna be trying to submit somebody you're gonna be trying to escape
  from somebody somebody's gonna be on top of you you're gonna be on top of them but
  they're not gonna want you to be on top of them so they're gonna try to push you
  off so you're it's basically a high-intensity cardio session a lot of the time so
  you're gonna sweat you're going use every part of your body and you're gonna be
  sword it just comes with the territory number seven mental fortitude so I just googled
  mental fortitude and the definition says this mental fortitude is defined as the
  ability to focus on and execute solutions when in the face of uncertainty or adversity
  you're gonna have to use more than your body but you're gonna have to use your mind
  you're going to say to yourself hey how do I do this or how do I manipulate that
  body part because it's gonna get your brain turning it's not just your body but
  it's gonna get your brain turning and you're gonna it's like a chess match like
  you're thinking three four or five steps ahead in just one or two because if you're
  just a one-trick pony you're gonna get con submissions every single time so expect
  to use your mind and use your mental toughness muscle number eight prepared to be
  humbled you're going to be going up against people half your size females males
  but it doesn't matter even if you're a 200 or 250 pound male I guarantee you I know
  a hundred and thirty pound females that would be able to put you into what I like
  to call a pretzel because they've been doing it longer they know leverage they know
  how to manipulate your body so prepare to be humbled and every time I go to class
  it's a humbling experience because all I know is that I don't know much and that's
  why I'm there I'm there to learn number 9 is going to be confidence and empowerment
  for me I am a hundred and thirty eight pound male I'm five five I've never had any
  type of martial arts background or even wrestling the most that I've done is a run
  track-and-field across countries so I mean I don't before this I didn't really know
  how to defend myself but even right now as a one year in white belt not that I would
  ever want to get in a fight and not saying that I could ever win a fight or anything
  like that but I feel I have a little bit of a skill to give certain situations should
  I ever be in those situations so for me also I know I'm only a year in but you know
  what about two three five ten years in the longer that I do this the more that I'm
  going to learn how to get out of certain situations so it's definitely a confidence
  booster and it's definitely super empowering because you what a one year white belt
  you know a newer wipeout comes in he's a hundred pounds heavier than me but I'm
