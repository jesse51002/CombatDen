transcript: You guys, I learned this on Instagram and I had to share it with the world
  because if anything embodies and exemplifies jiujitsu and healthcare, this is it.
  Let's say Grandpa Bob has fallen and he can't get up and it's your responsibility
  to get him from the ground back into his seat or his wheelchair. This is how you're
  going to do it with the highest level of efficiency. Number one, connect and bring
  him towards you. Take your bottom leg, tuck it under his hips, and you're good to
  go. Take your front hand, hug the body, hold his lat. Now take this hand over here
  and the arm that's around your neck, you're going to push it over like a simple
  duck under. Now I'm going to hug his lat. Keep my head close. And I'm going to rock
  back. Look, and load up my other leg as close as I can get it all the way in. Ankle
  to ankle as tight as possible. Now I'm going to push up on this hand. And look how
  easily I'm already up right here. And now look, he's already there. I got the connection.
  Whenever the chair, someone can roll it into position. Now all I got to do is this.
  Watch how easily I get up. I load him in. I sit him down. Grandpa Bob is safe. And
  don't get it twisted. He's a brown. He'll choke most of you guys, even half his
  age. I'll be back with your lunch soon. All right. Bring it on.
