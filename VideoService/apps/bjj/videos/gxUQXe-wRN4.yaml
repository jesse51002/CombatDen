transcript: my best advice for people who just start their Journeys YouTube do not
  focus on techniques sweeps takedowns guard passes submissions that take a long time
  to master and execute properly and proper execution has the risk to injure yourself
  or your training partner instead focus on the prerequisites of those techniques
  the first and foremost with the calm breath four seconds in 4 seconds out to your
  nose if you breathe wildly your brain goes into fight or flight and that is not
  a good state to learn anything secondly a good structure constructure allows you
  to withstand pressure structure without proper muscle engagement and you are like
  a pancake a pudding and you cannot fight focus on a good study structure and muscle
  engagement form pension and then you're ready to learn everything
