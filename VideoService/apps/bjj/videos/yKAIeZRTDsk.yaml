transcript: rating martial arts Effectiveness on a scale of 1 to 10 and today we're
  talking about Judo but before we get into that if you think something like this
  will not absolutely ruin someone's day in a street fight then you need to go outside
  and touch some grass because you have forgotten what reality is like now Judo is
  a great style for close quarter combat but there is some reasonable complaints one
  being that it's not as good at takedowns as a wrestler or as good at submissions
  as a Jiu-Jitsu player and two being the lack of striking knowledge or even just
  striking defense but what Judo does lack in these categories it does make up for
  in its versatility this is a combat style that teaches you how to fight whether
  you're standing up or sitting down wearing clothing or not and basically shows you
  how to hit someone with the surface of the Earth will you be able to take someone
  down like a wrestler no and nor can you submit someone like a Jiu-Jitsu guy but
  you do have the best of both worlds and you're well aware of how to do it from standing
  on your feet but those things combine with the fact that most fights start with
  space between each other where you guys have to throw hands in order to close the
  distance meaning that the first punch can knock you out is why Judo is only getting
  a six out of 10
