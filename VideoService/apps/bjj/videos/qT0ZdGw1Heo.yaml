transcript: guys a really great question that I hear from time to time is should I
  be focusing on techniques and this is from white belts in the brand new beginning
  part of their journey and they know so little and they're wondering like what should
  I be focusing on and the exact question was should I be focusing on techniques and
  live training and the answer is yes and I tend to be hyper analytical and I'm always
  having a purpose for my time so in training I would always have a focus of my own
  curriculum I'm working on this suite this guard pass this submission and while training
  it would be if I'm a white belt and I'm in the close guard I'm gonna do scissor
  sweep or Anubis week and I'm looking for ways to do that because you have this foundation
  of education that you're pulling from when you're training and in training we learn
  to expand that foundation so we have more tools to pull from and use in the moment
  when it's the right time but in the beginning you only have so few tools and your
  job is just to think okay I'm in the closed guard I know two sweeps how can I do
  these sweeps so I think it's really important to constantly be going through the
  Encyclopaedia of your understanding and trying to implement that in training but
  at the same time I think it's equally important to not think but to feel because
  the intellect is only so smart the wisdom of the body and the intelligence of the
  body far surpasses it when you're training I think the best thing you can do is
  feel so if I'm passing the guard I'm not so much thinking about okay I'm in half
  guard I'm doing a baseball slide I need to free my knee I need to pull up on that
  overhook and you slide through but I'm feeling where does my partner weak you know
  where are they trying to move to where am i strong where am i off balanced and I'm
  just paying attention rather than thinking and feeling what's happening because
  the feeling will tell you where to go you'll learn like if you're on bottom you're
  trying to sweep you'll feel where your partner doesn't have a post over there week
  and you'll capitalize on it and I think that for most people in the beginning a
  lot of your education is happening below the level of conscious thought your body
  is learning but you might not be able to articulate it and that learning is maybe
  even more valuable at least in the beginning so it's our job to feel in the training
  to understand what's happening to us intellectually to the degree that we can but
  really just to feel it and let body learned because it's amazing in the beginning
  guys kind of look silly when they first start training because they don't have any
  tools you're just kind of flailing around but once they settle down and they go
  through that initial spike of intensity and they kind of slow down that's when they
  really start to make their progress and it's because they slow down and they feel
  they're paying attention so I think that's what need to do you need to spend time
  in training thinking be purposeful what do I know from here I'm gonna try to do
  it but then you also need to spend time just feeling what's going on where is the
  path telling me where to go because a trajectory from white to black belt goes from
  a place of thinking to not thinking there's a saying in jujitsu if you think you're
  dead that's true but in the beginning you need to think just stay alive but down
  the road once you're just flowing and letting jujitsu happen you don't have time
  to think it's happening too fast the wisdom in you the jujitsu wisdom is calculating
  so many variables that you should know let the calculations happen and just keep
  feeling and let it work so that's a great question I think you need to think and
  I think you also need to feel they're both important and I think we can use both
  aspects and types of training to maximize our development on the mat hey friends
  hope you enjoyed the video if you did please subscribe to our page my goal is to
  share the positive aspects of jiu-jitsu with as many people as possible and my hope
  would be that we can serve you through this medium so that you keep training hard
  keep aiming up and you really understand what you Jitsu is in the context of your
