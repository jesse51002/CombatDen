transcript: so you want to know how long it should take you to get your first stripe
  on your white belt training brazilian jiu jitsu let's talk about it you're not going
  to like the answer to this but i'm going to be up front caveat on everything i'm
  about to talk about it only applies to white belt grading not any colored belt gradings
  different academies grade their students based on different criteria but it's easy
  to categorize them fairly simply into groups most academies grade their white belts
  based on either time or attendance with the third and probably the most rare being
  on actual progression in the sport now allow me to explain why and justify this
  position for the academies first up let's talk about people that are rated based
  on attendance or time this is fairly common amongst most jiu jitsu academies around
  the world and it's basically for a simple reason the academy at the end of the day
  is a business when that business grows to a point where there's either a lot of
  students to maintain or there's not a very strong instructor to student ratio it
  can be difficult to track all of those students and to grade them appropriately
  and fairly so if you have a system established where it gives the instructor alert
  when a particular white belt reaches say 20 30 or however many lessons they've set
  as their criteria per stripe then it's easy for each student to get graded as appropriate
  at the right time the other reason that this is probably the most common way to
  grade white belts is you have to imagine yourself in the shoes of the small business
  owner the head instructor or essentially from a business point of view you are a
  paying customer as a brand new person to the sport so effectively for a lack of
  a better phrasing and excuse my bluntness here they're trying to buy your love with
  stripes now don't get mad about it don't get frustrated or feel betrayed at the
  end of the day it's simply a business now don't get me wrong if you've attended
  25 lessons of jujitsu and you have or been awarded your first stripe yeah there's
  going to be a difference between you and someone that doesn't have a stripe because
  they haven't done 25 lessons so yeah you are going to progress in skill so how do
  you figure out when you're due for your first stripe or even your next stripe at
  a white belt well it's quite easy to crack the code if you've figured out how your
  academy or how your instructor grades their students if your instructor grades their
  students based on time it's pretty simple you just figure out the time interval
  between stripes and there you have it however if your instructor grades based on
  attendance that is arguably even more simple you just count how many sessions you've
  done in between stripes and you can almost predict to the day when your next stripe
  is due now there are academies out there that don't award their stripes based on
  time if you have a look through the youtube comments on the video i made when i
  received my first stripe way back in october of 2020 then you'll see that the time
  between someone joining and their first stripe is completely variable and dependent
  on their academy the earliest i saw it was about 12 days and the longest i saw was
  about two years now i'm not sure what that person that it took them two years i'm
  not sure what their situation was exactly i think from talking to them a little
  bit that they weren't training consistently in the one place that of course is going
  to affect your belt progression in general what some academies will do they'll take
  this one step further and they will award the first stripe much sooner than the
  others and that is to secure you your interest if you will in jiu jitsu and keep
  you coming back because it's a tangible physical representation of your progress
  in a sport that can seem incredibly overwhelming because remember going from white
  belt to black belt is on average over a 10 year journey and a lot of people don't
  make it so from a business point of view if they can award you your first stripe
  on your white belt in the first 12 days and that keeps you coming back for the next
  12 years that's a job well done from a business perspective so don't hate on the
  gyms for doing this it's simply a way to get people engaged with the sport and keep
  them coming back which is ultimately the benefit of the academy of you as a student
  in your jujitsu and of the sport in general now as i'm told by my instructor what
  some gyms will do is they'll actually use a blue belt to achieve the same aim effectively
  what the gyms do is they award the blue belt based on time or attendance rather
  than actual skill that way they secure their student almost for life because you
  are now blue belt under them you've now been graded under them because at the end
  of the day ibjjf doesn't really recognize stripes at all only stripes on a black
  belt so once you've been graded once you've been given your first colored belt that
  being the blue belt that's when you belong to that instructor and your brand loyalty
  or your academy loyalty will be a lot higher and like i was saying about the academies
  that award the first stripe early to ultimately secure you as an individual in the
  sport the blue belt is achieving the same thing so i cannot hate on those academies
  for it but as we all know there is skill within belts themselves so not all blue
  belts are created equally not all white belts are created equally so the key there
  for me is to not put my self-worth on the color of my belt or how many stripes are
  on my belt and simply put my focus in on bettering my skill from day to day versus
  my training partners and more importantly in competition so that's where i really
  test my skill is up against other people from other gyms in a competitive environment
  so let me know in the comments how long it took you to get your first stripe versus
  how long it took you to get all of your other stripes or even if you're a blue belt
  or higher how long was your journey between white belt and blue build i'm really
