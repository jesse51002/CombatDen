transcript: The first thing I try to teach a white belt is to relax. Because for some
  reason in fight sports, we just naturally get tense. You can have a guy who's been
  playing tennis, basketball for years, he knows how to relax. As soon as you bring
  him on a jiu-jitsu mat, they're tense because it feels like you're in a fight. So,
  the first word I want them to repeat in their head is to relax. Because by relaxing,
  you not only learn faster, but you flow better. and you're teachable. When you're
  really stiff, you're hard to teach. So, the first thing I teach a white belt, the
  very first thing is relax. Relax everything. Then, let's go over first technique
  that we will do, which is usually what do you do if a person reaches up and grabs
