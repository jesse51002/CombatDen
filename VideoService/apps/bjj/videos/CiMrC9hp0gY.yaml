transcript: hello again guys one of the first things that you realize when you start
  doing jiu jitsu is just how unnatural many of the moves feel like when you try to
  do them i remember when i first started training i was having just the hardest time
  learning how to do the triangle choke and while you have to accept the fact that
  it may take you a minute before you become proficient at these techniques there
  is a way that you can give yourself an advantage to learn these moves a lot quicker
  you see there are some movements that you're going to be using all the time because
  they're the building blocks of so many of jiu jitsu's moves so in this video we're
  going to be covering 12 drills that you can do on your own time that's going to
  give you an edge the next time that you're at class and you can think of this as
  the wax on wax off method that's going to help you program these movements into
  your subconscious making it easier for you to digest whatever moves your coach may
  be going over at class so go ahead roll out that yoga mat put on those spats and
  let's get right into this the shorter rule is one of the most basic movements in
  jiu jitsu good form can prevent you from injuring yourself be sure to take your
  head off the center line so that your shoulder takes your body's weight and the
  reverse shoulder roll is also a great movement to learn not only will this help
  you in certain escapes but it'll also add it to your overall coordination the lateral
  rule is another great movement to learn curl your body in a ball and tuck your chin
  so that your shoulders carry your body's weight this drill is a great way to improve
  your guard recovery the compass roll is very similar to this only you start on your
  knees instead of your hips again it's important to tuck your chin so that you don't
  hurt your neck this drill is great to improve your scrambling shrimping is one of
  the most versatile movements in jiu jitsu with your top foot based on the mat and
  use that to push your bottom hip away placing yourself on your side you can also
  shrimp from one side to the other side shrimping is a great way to get out from
  underneath your opponent's pressure the reverse shrimp is another basic movement
  that you're going to use just about everywhere use your top foot to dig in and pull
  yourself forward with your shoulder and hip this will help you get better angles
  from the bottom building off of the shrimp another super effective and underutilized
  movement is the buckle down drill shrimp your body through 90 degrees then turn
  your hips to the mat flatten out do a push-up and stand up this is a great way for
  escaping a really solid side control [Music] the bridge or hip bin will help you
  improve another fundamental movement of jiu jitsu bring your toes close to your
  butt and use that to drive your hips upward turning your body to one side this is
  a great way to create space that you can use to scramble and escape building off
  of the bridge you can also add the buckle down drill that we just covered just be
  sure to bring your hips out at a slight angle before you go for the bridge if shrimping
  doesn't work this can be enough to add the extra bit of power you need to stand
  up and escape and the bridge to regard is another movement you're going to be using
  all the time once you bridge pour your bottom leg underneath you then use your top
  leg to pull yourself forward this is a great way to create space that you can use
  to square up with your opponent the technical stand up is probably one of the most
  used drills in jiu jitsu based on the mat with your bottom hand and top foot then
  elevate your hips so you can pull your bottom leg out and stand up to your feet
  you also want to frame out with your lead hand to prevent your opponent from rushing
  you the stand up is useful because it allows you to reset if you don't feel comfortable
  on your back the stand up hip in is another movement you're going to be using all
  the time especially as you get more advanced rock your weight forward to come up
  on your knee and foot as you hip forward this will help you secure the top position
  out of those chaotic sweep attempts all right guys those are our 12 drills as promised
  if you start using these drills as little as 15 minutes a day two to three days
  out of the week i promise you will start seeing a noticeable difference and if you
  found this video helpful be sure to hit that thumbs up button so that youtube knows
  to show this video to help out other people as well if you guys are new around here
  i'm jedi nice to meet you i've been doing jiu jitsu for seven years and i draw from
  that experience to give you guys practical jujitsu advice every monday and friday
  that you don't want to miss out on so be sure to hit that subscribe button and turn
  on the notification bell i will talk to you guys in the next video remember anything
  is possible if you stay consistent [Music]
