transcript: You know, people say, "Well, what kind of self-defense?" You always say
  jiu-jitsu for self-defense, but you shouldn't let a street fight go to the ground.
  So, here's how it works out. If you come to me and you want to fight me and you
  square off in a boxing stance, I can run away from you. There's my primary self-defense
  is I'm just going to run away from you. When you grab a hold of me, now I have to
  actually know how to handle myself in a grappling situation. So that's why start
  with jiu-jitsu.
