  jiu-jitsu the guard position is when you're keeping your legs between yourself and
  the attacker from here you could look to submit get up or look for the sweep number
  two side control once you've passed your opponent's legs you're on top it's very
  stable position if they try to roll you boom you can post stay on top number three
  the mount position this is a great position if you want to do damage if it's just
  jiujitsu it's also great to set up arm bars number four this is neon belly here
  so Shin going across the belly it's a mobile position you can look around if there's
  multiple attackers it's also easy to disengage and get up number five the back position
  You Got Your Hooks in seat belt you also have the number one submission the rear
  naked choke nice bonus tip take Downs control where the fight takes place boom thanks
