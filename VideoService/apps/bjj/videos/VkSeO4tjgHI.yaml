transcript: crucial advice I wish I had had as a white belt one we've talked about
  super aggressive white belts earlier many of you aren't super aggressive white belts
  or maybe you were and you tone that down but as soon as you start rolling with a
  higher belt you feel like your only way to survive is to go back to that aggression
  go back to the spasing and it only gets you in trouble and it makes you more tired
  try to relax try to work your Jiu-Jitsu with the higher belts if they see you really
  trying to work your Jiu-Jitsu they'll let you work a little bit but if you're spazzing
  on them they're going to have to put you down because they got to protect you and
  they got to protect themselves from your aggression follow me for more Jiu-Jitsu
