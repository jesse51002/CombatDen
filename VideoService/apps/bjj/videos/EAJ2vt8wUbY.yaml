transcript: '- Today, I''m entering a

  Brazilian jiu-jitsu tournament to prove that it doesn''t work. Just proved my point.
  They say 90% of fights

  end up on the ground but 100% starts standing up and that''s where we want the fight
  to end, because this is the last place you wanna be in a street fight. Yet there''s
  a whole martial art dedicated to this worst-case scenario. That''s like my karate
  class practicing how to get knocked out. Just makes no sense. I think Brazilian
  jiu-jitsu only works if you play along with it. And to prove my point, I''m

  gonna enter a tournament on the street and simply stand up. But first I gotta practice.
  Okay... Turns out, standing up

  is much harder than I thought. Especially, when somebody

  wants to hold you down. I want a new opponent. My next opponent is just a brown
  belt, but he immediately chokes me out. They call this an Ezekiel choke. And now
  that I know how it

  works, I can easily avoid it. My last opponent is a black belt. Luckily, I''m both
  younger and stronger. But every time I try to stand up, it ends the same way. This
  is not what I had in mind. That''s when my brother Oliver appears. - Not as easy
  as you thought, huh? - [Jesse] As a professional fighter, he knows what works and
  what doesn''t. - Put this on and meet

  me upstairs tomorrow. And don''t forget what belt you are in BJJ. - [Jesse] And
  he''s got a plan. - Crash course in standing up. You smash me from top. Every second
  I spend here is

  a second I get more tired, while you get more rest. So I need to relieve this pressure.
  I''m gonna wiggle this arm in here, and this arm is gonna go in here. Now, I have
  a frame, but I can''t push you from

  here so I''m gonna use my strongest muscles and I''m gonna make a bridge. Now, we
  have a few options, this direction, this direction, this direction and that direction.
  You have to feel where

  your opponent is heavy. So don''t move against the resistance but use the easiest
  path available. Stay on the move all the time. If you''re on top, you can rest.
  But if you''re underneath,

  you need to work. - I better start training. ♪ I''m the best around ♪ ♪ No one''s
  ever gone hold me down ♪ ♪ I''m the best around ♪ ♪ I am not afraid of the ground
  ♪ ♪ I''m the best around ♪ ♪ No one''s ever gone to take me down ♪ Subscribe! ♪
  I''m the best around ♪ ♪ I am not afraid of the ground ♪ ♪ I''m the best around
  ♪ ♪ No one''s ever gone to take me down ♪ ♪ Stand up, stand up, stand up... ♪ It''s
  finally game day. After weighing in, they check my sleeves to make sure I''m not
  hiding any nunchucks. But what they don''t know

  is that I am a weapon. Unfortunately, the weather is not great and it looks like
  it might start raining. If that happens, my plan might not work. Unfortunately,
  I can''t

  control the weather. All I can do is start to warm

  up and hope for the best. That''s when they suddenly

  announce my name. It''s finally time to see if

  Brazilian jiu-jitsu works when you don''t play along. When the fight starts,

  my opponent immediately tries to grab my sleeves. All I wanna do is push his hands
  away. That''s when he does

  something I never imagined. He just lies down and tries

  to pull me on top of him. But of course it doesn''t

  work ''cause I just stand up. Now, my opponent grabs my lapel, so I try to strip
  his

  wrist off with both hands, but his grip is too good. That''s when he tries

  to pull me down again. But I just pop back up and move away. I can sense that my
  opponent

  is getting frustrated because I refuse to go down

  to the ground with him. That''s when he tries a new tactic. He goes for a foot sweep.
  I decide to return the

  favor, but it fails. But luckily he just lies down anyway. This is when I realize

  that all my training has made me overqualified

  for this tournament because I''m never ending up on the ground. - [Coach] Keep going,

  sweep, sweep, sweep. - [Jesse] That''s when the referee

  suddenly stops the action. Apparently, I''ve broken some kind of rule. He tells
  me that I''m

  not allowed to disengage and if I don''t start grappling,

  I''m gonna get disqualified. And now, my opponent

  refuses to even stand up. I doubt this is what the

  ancient samurai warriors had in mind when they invented jiu-jitsu, because it was
  supposed to

  be used as a last resort when your weapons fail. And the last place you want

  to go on the battlefield is the ground. But something changed when

  the art spread to Brazil. It became a sport. And the essence was lost. This is the
  exact same thing that happened to karate. Today, you can even

  become an Olympic champion by getting knocked out. So now, I am left with no other
  choice but to finish the fight. It''s time to put the martial

  back in martial arts. This was not part of the plan so I have to find a way to win.
  Luckily, my opponent gives me

  his leg, so I try to break it. But the referee tells me

  I''m not allowed to do that. So I have to let go. I''m trying my best to avoid

  my opponent''s attacks, but I''m afraid that if I''m too passive I will get disqualified.
  So I''m left with no other choice but to go down to the ground. And luckily I know
  exactly

  what to do from here. And just like that, I proved my point. Because no matter what

  martial art we practice it''s important that we don''t lose sight of its original
  purpose. If he would''ve just stood up that would never have happened. At the end
  of the day it''s not what you do, but how you do it. Because every martial art

  has its time and place. But one thing is for sure, those who don''t learn from the

  past are doomed to repeat it. Yup, it''s real. There are no second places on the
  street. So I did some research and it turns out that this statistic, is for law
  enforcement. Because their job is to take a suspect down to the ground and

  put handcuffs on them. It doesn''t apply to street fighting or self-defense for
  civilians. So the next time somebody

  tells you that "90% of fights end up on the ground" tell them, "yeah, if you''re
  a cop."'
