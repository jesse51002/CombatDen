transcript: '[Music] we got a question from Rich and rich is a Wipeout that''s been
  training for a bit and he''s curious about what does it mean to be or what does
  it mean to survive as a white belt because everybody in his gym all the higher belts
  his coaches everyone else says that the thing that he should be focused on since
  this is his first year of Jiu Jitsu is just surviving survive that''s all you got
  to do rich now his question is what does it even mean survive does that mean that
  I just don''t get submitted as much does it mean that I just keep showing up and
  he''s just looking invite or looking to get some clarification on what that idea
  of surviving as a white belt means and so rich thank you for the question brother
  and think about it this way there''s kind of this thing that''s true about any skill
  that you gain doesn''t Jiu Jitsu all of it all of it''s the same there you come
  into in the beginning and what brings you in is this excitement to get to this point
  that you''ve seen others get to right so again what attracts us into Jiu Jitsu it
  sure as hell not the white belts that are getting like flopping all over the place
  and not sure what the hell they''re doing right when I get in when I got into horse
  riding with my wife right my driving Factor was not watching people get chucked
  off the horse or people struggling to get um the right lead on the leg or anything
  it wasn''t that it was watching people like gallop and they''re running these horses
  and all this cool stuff right that''s what attracts us to these things and then
  we come in and we realize holy crap this is way more difficult than I even expected
  I know that when I got into Jiu Jitsu What attracted me to jiu jitsu was the thought
  of being one of these really badass Jiu Jitsu guys that was submitting people an
  MMA and competition wanted to be one of those guys and when I came in in Jiu Jitsu
  and early on I was a wrestler I was pretty good at it so I figured I''d be at least
  like a blue belt and I''d be smashing some of the people in the gym I was wrong
  I got smashed by even the smallest dude in the class which was good because I instantly
  thought to myself I need to be doing this because the small guy kicked my butt I
  got to do this but also it was tough because you''re going through this phase now
  where you wanted to be doing this but really what you''re doing is flopping around
  and fumbling and not being very good at something and that is tough to deal with
  I had that phase for about six months where I came into the gym and basically aside
  from the one guy that started with me I got smashed by everybody else I just kicked
  my butt and I got beat up over and over again and again I had to keep coming because
  there''s no other way to get around it also back in the day when I started 2003
  there weren''t a lot of new students coming in so when you were the new student
  you were the new student for a while and you were going to be at the bottom of the
  pecking order and so I had to go for that for about six months until I started to
  kind of creep up a little bit and start getting better but what I''m getting at
  here is that part that is so hard but if you can make it past that point then you
  get good and it''s fun right once you start to get some level of proficiency at
  something with a skill it becomes completely different and it''s so much more fun
  it''s exciting you get so excited because you can play around with stuff now and
  you can try things it''s so exciting but getting through that early phase is very
  difficult and most people when it comes to just about any skill it''s not just Jiu
  Jitsu just anything they don''t they don''t make it and I think again one of the
  reasons why is because if you''ve never unless you''ve gone through some really
  tough skill acquisition you don''t realize that it''s going to be tough like that
  once you''ve done it once you realize what you''re in for like when I got it against
  using the horse riding as a as a parallel here when I got into horse riding I knew
  I was going to suck I remember my wife was talking to me in my first day I was riding
  in the horse and I''m damn near getting thrown off I''m just hanging on to like
  the the uh uh the horn on the saddle and I''m like oh God just try not to get thrown
  off this damn horse and I remember afterwards she was like hey are you still going
  to come in and do it with me because she thought I was thinking about quitting I
  was like of course I knew I was going to be bad at this this is like I''m a white
  belt again like I was in Jiu Jitsu and anytime I do something new I completely understand
  that I''m looking to get here but where I''m Really Gonna Be is down here I think
  sometimes people maybe have a disconnect there so anyway going back to it I''m sure
  I''m talking fast because I''m getting excited right so getting back to your question
  when you start there is a technical sense of surviving which comes to you basically
  not getting submitted as much because in the beginning what do you do rich you come
  in and you get submitted by everyone when I was a white belt very early on my little
  mini goals for myself I sort of accepted that I was going to get my butt kicked
  by everybody so I was just balling up sometimes and saying okay I''d look up at
  the clock and say I''ve got one minute left let''s see if I can last for one minute
  you know or you know man this guy submitted me three times last week well maybe
  I can slow him down to two times you know little small goals like they''re just
  trying to survive a little bit longer than I did previously but then there is the
  big sort of thing which is you got to show up and that is part of surviving because
  again you''re going through that early phase of where it sucks and it''s not easy
  and sure it might be fun in the beginning but you''re gonna have to go through months
  of this stuff where you''re not going to be very good and that''s difficult to do
  and it''s that point where can you survive that because that''s hard it''s not easy
  your body''s sore you''ve got all these weird aches and pains you''ve never felt
  as your body adapts to training and then you know you''re going in you''re like
  God I just keep getting killed by everyone why am I even doing this damn thing again
  you know you start to self-question and then you can find a million reasons not
  to do it but can you find one to keep you going and can you just keep showing up
  because again at the end of the day when it comes to skill assuming you got a good
  coach and everything else it all comes down to just consistency you know it''s like
  a it''s like a leaky faucet if you will little drops you don''t look like much in
  the beginning but over time that damn thing fills up and it''s the same thing with
  your training those small little consistent days of training you don''t look like
  much in the beginning but it''s that is what you''re doing you''re putting that
  into your bank it''s you can think of it as a bank account in the beginning you''re
  building this thing up or maybe you''re building up some retirement account doesn''t
  look like much in the beginning but then it builds up to a big amount of money and
  all of a sudden it''s got some momentum it''s the same thing with your training
  you''re basically putting in that deposit if you will every time you train and again
  once you put in that deposit doesn''t look like much in the beginning but over time
  your technical account your training account builds up and then all of a sudden
  it''s got some sort of momentum in your blue belt to your purple belt and you''ve
  got some real weight behind you and you can really do something on the mats and
  it becomes exciting and fun because you have so much more freedom because of the
  technical skill that you''ve developed and so yeah you hit the nail on the head
  bro survival is getting submitted Less on the mats and just trying to survive like
  on a technical sense and then also sticking around longer not quitting because again
  most people are going to quit and it''s not just Jiu Jitsu it''s just anything that''s
  related to skill skill is hard it''s not easy and it you have to really dig into
  something and again you also have to be intrinsically motivated on some level to
  keep doing this thing if you''re doing it for some extrinsic thing that you think
  you want that''s not going to do it you''re going to have to drive and dig for something
  that makes you want to show up whether it''s going great or if it''s not going so
  great and that''s you know where I would think I would go with it so anyway Rich
  hope that helps you hope that helps you with your question maybe get you something
  to chew on on your drive home from training the next time and uh guys I''ll talk
  to you next time [Music]'
