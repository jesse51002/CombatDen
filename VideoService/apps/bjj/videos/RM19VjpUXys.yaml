transcript: the white belt is the most important belt you get in Jiu-Jitsu even though
  you get this belt just by signing up 99% of people won't achieve this step then
  once you get it you'll spend tons of years being put through trial by fire against
  all sorts of individuals but what if I told you there's a way to lessen this pain
  instead of becoming the first Target that everyone wants to try their new moves
  on you get to become well who am I kidding you're still going to get beat up a ton
  but this is how you can get your blue up faster and not be stck a white belt for
  3 to 4 years holy crap look at that the first thing I mentioned is to train you
  need to do this as much as you can and obviously anyone can just say just do it
  but it's a little bit more complicated than that while 99% of us have jobs being
  able to maximize our time at the gym and having consistent schedules will help us
  out a lot we don't want to be that guy that watched Conor McGregor win a UFC fight
  whenever that last was and then he goes to the gym does 30 classes in a row and
  then he's Mia the rest of the month do you remember being in high school and you
  try and cram everything you could right before a test how well did that work for
  you Jiu-Jitsu is the same way our brains don't retain information long form if we
  don't make a good habit out of it set up a schedule you know you can stick with
  and then show up to class personally I recommend doing something like Monday Wednesday
  and Friday this way you can rest your body for not shaping or you're new this type
  of sport and if you're feeling good and your gym offers it you might even be able
  to do weekend classes as well bonus days are great way to get better at the sport
  but a consistent schedule is better than anything now it's pretty easy for me to
  sit here and tell you to go to class but what should you do when you're actually
  there how can we get that blue belt faster now while it's true that doing the most
  training possible will help us out it's the complete opposite when it comes to technique
  I'm sure you all heard the expression less is more just hopefully not from your
  girlfriend but it applies to Jiu-Jitsu as well if we're stuck here at a novice level
  but we're trying to learn all the techniques possible in Jiu-Jitsu you're going
  to have a rough time now we do need to know all the positions and have a foundational
  knowledge of Jiu-Jitsu so we don't tremble at the words positional sparring but
  we are going to take a better approach to it for example if you're in guard but
  you're trying to master the pendulum sweep flower sweep over under sweep and all
  these other ones it's going to take you so much longer to progress the sport because
  you're so new to everything pick one sweeping guard such as the hip in sweep and
  just work at that constantly until you're good at it and if that one move applies
  to multiple positions such as half guard butterfly guard and full guard more power
  to you it's so easy for our monkey brains to see something shiny and think we just
  need to go do the next great thing when really we should just focus on one thing
  at a time and we'll Master it that much faster it's just like Bruce Lee said fear
  not the man that's practiced a thousand kicks but the man that's mastered one Guillotine
  a thousand times or something like that now I understand that your coach is going
  to show you a variety of techniques but he's just trying to show you things that
  could help you or you may be interested in it doesn't mean you need to go balls
  to the wall in all of them and when trying to choose more limited list of techniques
  let's try and pick one that's a higher percentage rate move for example if you have
  a technique that requires 10 steps from rubber guard just to get the sweep I'm not
  going to say it won't work but something like an under throw from butterfly guard
  might be more up your alley and this mentality of trying to focus on one thing isn't
  some grandiose advice it's just that most of us don't like to think this way now
  I get it I get it rolling may not always be fun when you're a brand new white belt
  you're going to get beat up you might be really out of shape or you may have taken
  way too much pre-workout and you got to go to the bathroom but static drilling does
  not compare at all to Dynamic rolling I have seen so many wipeouts through my years
  not want to roll because of anxiety or other reasons but you need to remember that
  everyone starts here and in order to get your blue belt faster or to be able to
  achieve this rank your coach is going to want to see the moves that he's taught
  you applied in a role and keep this in mind as well if you're a white belt a lot
  of your roles will be with other white belts there's no better way to show off your
  skill level to your coach than doing it to somebody around your skill level or somebody
  that's never even trained the sport a good breakdown of who you should be rolling
  with is 30% of the people should be worse than you 40% should be at your rank or
  about your skill level and 30% of them should be better than you it may not work
  that way if you're brand new or if you've had some previous combat experience but
  just try and align yourself on that chart as best as you can it's so easy to say
  that someone was bigger than you or that this guy was using too much muscle even
  though you know that you were too but we always should be going into our roles with
  a game plan whether it be that you're working sweeps from a specific position you're
  working on grip retention or being able to avoid their grips or maybe you're just
  working your takedowns you should always have a plan and that's not to say that
  sometimes the rooll doesn't turn into complete chaos but it's better to go into
  an exam having a little bit of knowledge beforehand versus just staring at the paper
  and not knowing what to do from here when I'm mapping my plan I typically have a
  position I need to start in a move that I need to do to get to the next position
  and then a finisher much like a beginning middle and end and the road maps will
  obviously vary but you'll become proficient faster and people will notice now this
  last piece of advice is a little bit different but it's being a good student it's
  very common that you'll see some people that are very good at Jutsu but they're
  complete dicks and part of the Journey of Bel the sport is that you should also
  be a good teammate to people the guy that goes out there and thanks you for every
  role and he tries to help you with techniques is worth more than four good people
  that are good at Jitsu but their attitude who drives everyone away win or lose I
  say good job to everybody that I roll with even if they're a white button I completely
  smash them or they're a better black belt than me and they crushed me small morale
  boosts go a long way to help you make friends a better gym and a stronger team for
  you to learn from don't feel like you need to clean the mats or do anything crazy
  remember this is a service that you pay for but being a good person costs nothing
  make your partner and others feel welcome to train with you and this will help you
  out a lot more in your Je to a career than you may believe but if you want to know
  how good you should be at every belt make sure to check out this video here
