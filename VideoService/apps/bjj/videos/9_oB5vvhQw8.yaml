transcript: '[Music] so got a good question from our buddy Jeff Jeff asks if there
  is a way to play the catch-up game so he is the newer white belt in his gym he''s
  been trained for about two months and everyone else in the gym is either a to strive
  white boater above mostly blue belts and he feels like he''s just getting frustrated
  because he can''t get anything to work he says that you know in the beginning was
  bearable because it was new it was fun but now he''s just taking the beatings and
  he''s just like I he feels like he should be able to get something going but it
  can''t and he''s wondering if there''s a way you know sort of get past this moment
  so first off Jeff thanks for the question brother I do appreciate it and let me
  start by sharing my experience in jujitsu and I''ll give you some advice at the
  end so I spent the first six months in my gym getting my face smashed that''s it
  right like when I started in May of 2003 pretty much everyone was either a really
  high ranking white belt which we would call back in that gym we called a green belt
  to sort of intermediary belt between white and blue everybody was either a green
  belt or a blue belt or a purple belt and that was my instructor was a purple belt
  and so basically when I came into the gym I was just getting smashed left and right
  that''s what I walked into every single day now I went to tournaments I actually
  competed two weeks after beginning jujitsu and I did really well it took a second
  but when I would go back to the gym again I went back to getting my face smashed
  over and over and over again I kept going though because I enjoyed it I enjoyed
  the camaraderie and joy being around the people that I was with and I was getting
  in better shape and I was learning stuff I wanted to do Jitsu and and mixed martial
  arts so badly it was fun that I was actually finally doing it right so I continued
  eventually like November of 2003 I started to get something going and by something
  going I mean that I would sit in someone''s garden just hang on for dear life right
  I wouldn''t pass I wouldn''t get any often schooling really I would just be able
  to sit there and slow down the submission or prevent them from doing something but
  that was about that I could stall out and then eventually I was able to start to
  win so in December of 2003 I remember this very vividly because I remember I was
  so stoked about I was so excited that I finally was getting something going just
  like you''re going to be if you continue to train I walked into the gym and I it
  was like nothing had changed really but I stepped in and all of a sudden the people
  that were beating me before I was able to slow him down or stop their submissions
  and the people that I was kind of like you know going right tit for tat with and
  really not you know no neither one of us was getting the better of each other boom
  I was able to get to better them and consistently and I remember my coach even said
  something to me he was like man have you been watching those videos I watched him
  some DVDs or something you''ve been training on the side because even he was pretty
  surprised and me and my friend / roommate we actually were doing that we bought
  some mats and we were drilling on the side and doing take some techniques and things
  like that but the point is I had this aha moment it''s like a light bulb went off
  in my brain right and everything clicked in my body and you know another analogy
  you can think of it that I like to use is think about a big puzzle right sometimes
  you have these big puzzles and you''re like looking for the pieces and you can''t
  really tell what the picture is and then you find the piece boom if that''s perfectly
  and then all of a sudden the picture becomes clear you can see what it is and that''s
  kind of what happened with my body right you know I''m going I''m doing all this
  stuff nothing''s really seeming to stick and then all of a sudden one day like my
  body just sort of lines up and it wasn''t something I consciously thought about
  it was just one day it came to the gym and I guess my you know my central nervous
  system had basically took taken in all that information and put it to use and then
  boom all of a sudden everything''s just firing off and I''m not even thinking about
  it and I had a hot woman had that moment where just everything clicked and I felt
  great anything you''ll have these I had these in wrestling I had these in jujitsu
  I had these boxing mixed martial arts and you my friend will have these in jujitsu
  if you can stick through this you''ve only been training for two months you''re
  barely scratching the surface and this is what separates people jujitsu can you
  stick through this part can you endure this part because this is what you know again
  we all say it as black belts the the you know black belt is just a white belt that
  didn''t quit right and again a lot of people kind of scoff at you think that there''s
  some underlying quality that some of us had but there wasn''t right a lot of us
  were just the same as you we''re getting our face smashed over and over and over
  again but we didn''t quit we kept going and that''s all you have to do you have
  to show up and I talk about this all the time in other videos right like if you
  want to do this stuff you just have to show up even if you don''t you don''t right
  really want to sometimes you just got to show up and to sort of work through this
  first for fresh stop and think about what else is going around you right we''re
