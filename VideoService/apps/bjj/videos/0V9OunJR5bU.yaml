transcript: So, Ka, what about you? How could you see this in terms of your game and
  how you train and even like I would imagine you probably coach a little bit too.
  >> Yeah, I think especially with this this new move, I don't have my coach there
  to watch me right away, right? And so having something like this would be just like,
  all right, I can't get a hold of Scaff right now. Let me just throw it into the
  into AI and see what feedback it's giving me and then maybe I can collaborate with
  my coach who's miles away and go like what do you think about what AI said? What
  do you think I need to be working on and just compare the notes I think would be
  super important. I think that's it's super dope and I would love to send over some
  footage and start using it honestly. >> Yeah. Yeah, for sure. Send send me whatever.
  I'm excited about it. I'm excited to use it. I have a handful of people at our gym
  who are using it and they all seem to like it and it's just going to go up from
  here. AI itself is improving so quickly. >> So, as the new models come out, I'll
  be able to get much better information than what we already have. I'm excited for
  all of it. >> Yeah. No, for sure. And I really, to your point, I like the fact that
  you said more so using it as a collaborative tool, right? Because just like in an
  episode we had like an hour ago, one of the things the the gentleman was talking
  about is you still have to use discernment, right? So, I really like the fact that
  you pointed out it could be more of a collaborative tool than an end- all beall.
