transcript: Jiu-Jitsu move that you should have learned as a white belm so everyone
  learns the bump sweep as a white belm pretty simple we're here we get the hands
  on the floor I come up hips up and I drive him over for the sweep sometimes it's
  difficult to get up sometimes it's difficult to finish so what I prefer is I like
  to add an element to it so instead of coming over the arm here I'm not so worried
  about the bump sweep as I am setting up the triangle for here so I'm going to come
  here I'm going to bump up I'm going to put my hand on this side of the head so we're
  here like this I bump I get him to post that hand now immediately this leg jumps
  up high right and the legate comes out I bring the arm over I tighten up my triangle
  and I squeeze and finish follow me for more Jiu-Jitsu tips
