transcript: how long does it take to get a white belt in Brazilian jiu-jitsu this
  question is a little more complicated than you may think of course there is the
  actual initial belt that you get when you sign up at a gym or Academy but you don't
  just get that when you're born right you first have to learn about Brazilian jiu-jitsu
  you have to know at least a little bit what it is and then you have to know that
  there's a gym or a c close to you and then you have to be motivated enough to go
  in there and this process can take a really long time it can be something that people
  debate about in their minds I've heard stories of people who would know that they
  want to train Brazilian ji- Jitsu they would drive up to the gym and they would
  sit in the parking lot nope can't do it and they would drive away and go home and
  then it took them like you know weeks to build up the courage to go into the gym
  I'm glad they eventually made it in for me what happened and the first time I heard
  about Brazilian jiu-jitsu was about a year before I ever tried it and it was from
  my mom she was like hey here's this thing called Brazilian jiu-jitsu and it was
  something I maybe was going to try but I just it never ended up working out but
  it took one of my friends to you know of course when you're 16 17 years old your
  friends make much more an impact on you than your mom but you know he was also willing
  to carpool with me there and I ended up going and I like the class so it took me
  about a year to decide that I wanted to go and I kind of sort of knew a little bit
  about what Brazilian jiu-jitsu was but I had nothing going on and I was like sure
  why not let's go try it out and I showed up and I wasn't given a white belt on that
  very first day I was actually given normal street clothes so in order to get my
  white belt I had to go into the gym and it took me you know let's say about 2 weeks
  to actually get my white belt during that time I was wearing short shorts and a
  t-shirt so I wasn't actually I didn't actually have a white belt and some schools
  actually have an official program I know a lot of the Gracie schools will put people
  through a month-long period where they're not allowed to spar and they learn the
  fundamentals before I'm not sure if they give them white belt but that's when they
  like officially get their white belt but then you're not done right because you
  have the white belt but in order to complete the white belt most gems will give
  you four Stripes so how long does it take you to go from a zero stripe white belt
  to a four stripe white belt it's going to be different for every gym and every instructor
  but I would say in general the first stripe you're going to get in Brazilian jiu-jitsu
  is one that's going to come I would say relatively quick in the grand scheme of
  things generally it's going to be after you've completed about a month to two months
  maybe three of class and you showed up pretty consistently and you have just you've
  learned some stuff you you you know a few things you don't you definitely don't
  have to know them well as a one stripe white belt but you're just generally a little
  bit more aware and you could do a couple things maybe not against like a fully resisting
  opponent but maybe you know you're getting there I'd say that takes probably ballpark
  a month and a half so now you're a one stripe white belt how long does it take to
  get you two stripe white belt I would say this is where you're going to have to
  start to actually understand some stuff now some gems give out Stripes to their
  white belts like it's candy but I think for the most part the difference between
  a one stripe white belt and a two stripe white belt is a two stripe white belt actually
  has some moves that they can do against a zero to one stripe white belt in a live
  roll and they don't have to do them well but you have to start actually developing
  a feel for how to do Brazilian jiujitsu in a live situation so then from two to
  three is basically up to the instructor well first how long does it take to get
  that second stripe I would say in general it would take this one's going to be a
  little bit longer than your first one because the first one's sort of like a a pep
  like a pat on the back like hey let's let's get you going the second stripe is probably
  going to come another three to four months depending on how consistently you train
  after that first stripe the third and the fourth stripe on the white belt are going
  to be really what's going to separate most white belts and if you've seen my videos
  on the great filters of Jiu-Jitsu this is kind of where they come in from people
  who drop out before blue and I think in order to get your third and fourth stripe
  this is where you have to start to go from someone who doesn't really know anything
  to like an almost intermediate player which is what a blue belt is so between the
  third and the fourth stripe I'm GNA lump these two together because it's very very
  subjective you're basically going from someone who doesn't know anything to someone
