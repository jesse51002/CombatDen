theme: PoleDance
videos:
  specification:
    short_videos_desc: 'Pole fitness and dance instruction — spins, climbs, inversions,
      transitions, and the strength and conditioning behind them — plus the performance
      side: showcase and competition routines, skill and combo clips, studio vlogs
      and behind-the-scenes, funny training moments, and poler interviews. Beginner
      to advanced, framed as a legitimate athletic art.'
    short_avoid_desc: No male-gaze / objectifying or sexually explicit framing, off-topic
      or clickbait videos, or "pole vs aerial / is pole a real sport" debate clips.
    videos_desc: |-
      # What we surface

      Pole fitness and dance content for athletes from total beginners to
      seasoned polers — technique and class content plus the fun, human side,
      so it's a feed members enjoy, not just a drill library.

      ## Technique & training
      - Spins, climbs, sits, inversions, and transitions — breakdowns and
        progressions at every level
      - Follow-along beginner-to-advanced classes from credible instructors
        and studios
      - Strength, grip, and flexibility conditioning that makes the tricks
        possible
      - Athletic practice details: drills, prep exercises, safe inversion
        and dismount technique
      - Artistry and performance: flow, choreography, floorwork, musicality

      ## The fun & human side
      - Showcase and competition routines
      - Skill and combo clips
      - Studio vlogs and "day in the life of a pole instructor"
      - Training behind-the-scenes and funny / relatable training moments
      - Poler interviews and progress / "first trick" reels
    avoid_desc: |-
      # What we avoid

      Anything not about pole fitness / pole dance as an athletic discipline;
      off-topic, genuinely low-quality, or clickbait videos.

      ## Reject
      - Male-gaze / objectifying or sexually explicit framing, and
        "stripper-tutorial" novelty content that treats the dancer's body
        rather than the craft as the subject
      - Gear / heel hauls and product shilling
      - Clickbait ("invert in a week", "first climb in one day")
      - "Pole vs aerial silks / which is harder" cross-discipline framings,
        and "is pole a real sport / pole dancing isn't fitness" debate and
        reaction videos

      ## Keep in mind
      A video is NOT rejected just for being short, a showcase, a clip, a
      vlog, or entertaining — fun and creator content that celebrates the
      craft is wanted.
  queries:
  - pole dance for beginners first lesson
  - basic pole spins tutorial for beginners
  - how to climb the pole technique tutorial
  - pole inversion tutorial step by step
  - beginner pole combo follow along
  - strength training for pole dancers at home
  - grip strength exercises for pole
  - pole dance transitions and flow tutorial
  - safe pole dismount and spotting technique
  - pole conditioning and flexibility routine
  - full pole fitness class follow along
  - pole dance competition routine performance
  - pole sport championship showcase highlights
  - pole skill combo clip athletic
  - day in the life of a pole instructor
  - pole studio vlog behind the scenes
  - funny pole training moments and fails
  - poler first invert celebration
  - pole dancer interview on the sport
  - pole student progress one year transformation
