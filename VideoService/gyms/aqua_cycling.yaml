videos:
  specification:
    short_videos_desc: 'Aqua cycling (aquabike) content — pool-based spin classes
      on submerged bikes, how water resistance shapes the workout, bike setup and
      form in the pool, plus the fun side: "what an aqua cycling class is really like",
      poolside studio vlogs and behind-the-scenes, instructor vibes, funny class moments,
      transformation stories, and instructor interviews.'
    short_avoid_desc: Off-topic, clickbait "slim down in the pool in 7 days" gimmicks,
      and "aqua cycling vs spin / aqua bike vs swimming which is better" or "is aqua
      cycling a real workout" debate clips.
    videos_desc: |-
      # What we surface

      Aqua cycling content for people who want real cardio without the joint
      impact — plus the fun, human side of the studio, so it's a feed members
      enjoy, not just a how-to library.

      ## Classes & technique
      - Pool-based spin / aquabike classes on submerged bikes
      - How water resistance changes the workout
      - Bike setup and positioning in the pool
      - Pedalling cadence and form
      - The upper-body and core moves aqua instructors add in the water
      - Low-impact benefits for joints, rehab and recovery
      - Beginner first-class walkthroughs and what to expect from a session

      ## The fun & human side
      - "What an aqua cycling class is really like"
      - Poolside studio vlogs and behind-the-scenes
      - Instructor vibes and playlists
      - Relatable class humour
      - Transformation stories and instructor interviews

      A bright, novel, poolside crossover for everyone from joint-surgery
      recovery to triathletes.
    avoid_desc: |-
      # What we avoid

      Anything not about aqua cycling / aquabike; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Land-based indoor cycling / spin classes
      - General swimming, water-aerobics or aqua-zumba content that isn't on a
        pool bike (this is bike-in-the-water cycling)
      - Calorie-bait "burn 1000 calories / melt fat fast" gimmick titles
      - "Aqua cycling vs spin / aqua bike vs swimming which is better"
        cross-discipline framings
      - "Is aqua cycling a real workout / aquabike does nothing" debate or
        reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
