classes:
  - name: "Wave Rider"
    image_url: "https://images.pexels.com/photos/264084/pexels-photo-264084.jpeg?auto=compress&cs=tinysrgb&w=1200"
    description: "High-energy interval class set to pumping music that builds power and cardiovascular endurance in the water. Expect intense sprints, climbs, and the kind of energy that makes time fly."
    instructor_name: "James Carter"
    instructor_bio: "Head coach with over a decade of experience helping members of every level train smarter, move better, and stay consistent."
    instructor_image_url: "https://upload.wikimedia.org/wikipedia/commons/6/68/Alec_Penix.jpg"
  - name: "Aqua Flow"
    image_url: "https://images.pexels.com/photos/4162595/pexels-photo-4162595.jpeg?auto=compress&cs=tinysrgb&w=1200"
    description: "Technical endurance class focused on proper form, cadence control, and sustainable pacing in the water. Learn how to ride smarter, not just harder, with personalized form correction."
    instructor_name: "Sarah Mitchell"
    instructor_bio: "Performance coach focused on building strength, mobility, and confidence through approachable, well-structured sessions."
    instructor_image_url: "https://upload.wikimedia.org/wikipedia/commons/8/8b/Athlete_portrait_Marianna_Gillespie.jpg"
  - name: "Splash Sprint"
    image_url: "https://images.pexels.com/photos/5851030/pexels-photo-5851030.jpeg?auto=compress&cs=tinysrgb&w=1200"
    description: "Structured interval training alternating between intense bursts and recovery periods. Perfect for building explosive power and training the anaerobic system in a low-impact environment."
    instructor_name: "Daniel Brooks"
    instructor_bio: "Certified instructor who breaks every movement down step by step so newcomers and regulars alike feel supported."
    instructor_image_url: "https://upload.wikimedia.org/wikipedia/commons/e/e3/Branden_Loera_Headshot.jpg"
  - name: "Dive Deep"
    image_url: "https://images.pexels.com/photos/26655637/pexels-photo-26655637.jpeg?auto=compress&cs=tinysrgb&w=1200"
    description: "Beginner-friendly fundamentals class covering bike setup, seat positioning, water safety, and proper pedalling technique. Build confidence and lay a strong foundation for your aqua cycling journey."
    instructor_name: "Maya Bennett"
    instructor_bio: "Coach passionate about creating an inclusive, high-energy room where members from all backgrounds can thrive."
    instructor_image_url: "https://upload.wikimedia.org/wikipedia/commons/2/2e/Torrie_Lewis_for_Signet_Packaging%2C_headshot.jpg"
