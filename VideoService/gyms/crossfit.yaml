gym_id: crossfit
gym_type:
- crossfit
theme: CrossFitBox
videos:
  specification:
    short_videos_desc: 'CrossFit technique and follow-along content — olympic-lift
      and gymnastics breakdowns, scaling, full WODs, and credible box coaching — plus
      the fun side: CrossFit Games and competition highlights, box vlogs and "a day
      of training", PR-celebration clips, funny WOD moments, and athlete interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      fail clips, sketchy supplement or steroid promos, or "CrossFit will wreck your
      body / CrossFit vs X" debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Technique, class, and competition content for CrossFit box members —
      plus the fun, human side, so it's a feed members enjoy, not just a how-to
      library. Warm, plain-spoken, scale-honest tone throughout.

      ## Technique & WODs
      - Olympic-lift breakdowns: snatch, clean and jerk
      - Gymnastics skills: pull-ups, toes-to-bar, muscle-ups, handstand
        push-ups, double-unders
      - Barbell and conditioning mechanics, plus scaling options for every lane
      - Full follow-along WODs and benchmark workouts (Fran, Murph, the Girls)
        from credible coaches and affiliate boxes

      ## The fun & human side
      - CrossFit Games and sanctioned-competition highlights and athlete profiles
      - Box vlogs and "a day of training", PR-celebration and first-muscle-up
        clips
      - Funny WOD moments and transformation stories
      - Athlete and coach interviews, and box-floor motivation montages
    avoid_desc: |-
      # What we avoid

      Anything not about CrossFit-style training; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "CrossFit vs powerlifting / running" and "is CrossFit dangerous /
        CrossFit will wreck your body" cross-discipline or anti-CrossFit debate
        and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
  queries:
  - crossfit snatch technique breakdown
  - clean and jerk tutorial for crossfit
  - kipping pull-up progression tutorial
  - bar muscle up progression for beginners
  - double under tutorial step by step
  - full crossfit wod follow along at home
  - fran workout strategy and pacing
  - murph workout tips and scaling
  - crossfit beginner foundations class
  - how to scale crossfit workouts
  - common crossfit movement mistakes and fixes
  - crossfit games event highlights
  - crossfit games best moments compilation
  - crossfit games athlete a day of training vlog
  - crossfit box gym vlog community
  - first muscle up celebration reaction
  - funny crossfit wod moments
  - crossfit transformation one year story
  - crossfit games athlete interview
  - crossfit training motivation montage
