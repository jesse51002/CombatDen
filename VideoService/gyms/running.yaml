gym_id: running
gym_type:
- running
theme: RunClub
videos:
  specification:
    short_videos_desc: 'Structured run-coaching content — running form and drills,
      pacing and tempo, easy / long-run and interval workouts, and full race-prep
      training (5k to marathon) from real coaches, plus the fun side: race and marathon
      highlights, run vlogs and "day in the life", funny running moments, transformation
      stories, and runner interviews.'
    short_avoid_desc: Off-topic, clickbait "run a marathon in 30 days with no training"
      gimmicks, and "running vs cycling / running vs lifting which is better" or "is
      running bad for your knees" debate clips.
    videos_desc: |-
      # What we surface

      Structured run-coaching content for runners who want a proper training
      programme, not a casual jog — plus the fun and human side, so it's a
      feed members enjoy, not just a how-to library.

      ## Running form & technique
      - Form fundamentals: cadence, footstrike, posture, arm carriage
      - Drills and warm-ups for runners

      ## Pacing & workouts
      - How to pace easy runs, tempo, threshold, and interval / track sessions

      ## Race prep & training plans
      - Full race-prep training for 5k, 10k, half and full marathon
      - Base building, long runs, taper, and race-day strategy
      - Injury-prevention mobility and strength for runners

      ## The fun & human side of running
      - Race and marathon highlights, pro / elite race footage
      - Race-day and training vlogs and "day in the life"
      - Relatable running humour and funny moments
      - Couch-to-marathon transformation stories
      - Runner and coach interviews
    avoid_desc: |-
      # What we avoid

      Anything not about running; off-topic, genuinely low-quality, or clickbait
      videos.

      ## Reject
      - Gimmick "run a marathon in 30 days with no training / instant PR"
        promises
      - "Running vs cycling / running vs lifting which is better"
        cross-discipline framings
      - "Is running bad for your knees / running is a waste of time" debate
        or reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun and creator content is wanted.
  queries:
  - proper running form and technique tutorial
  - running cadence and footstrike explained
  - running drills for beginners
  - dynamic warm up routine for runners
  - how to pace your easy runs
  - tempo run workout explained for runners
  - threshold and interval running workout
  - long run training for marathon
  - beginner 5k training plan explained
  - marathon race day pacing strategy
  - injury prevention strength workout for runners
  - marathon race highlights
  - race day vlog half marathon
  - day in the life of a distance runner
  - funny running moments relatable runners
  - couch to marathon transformation story
  - running coach interview on training and pacing
  - elite marathon finish line highlights
  - my first marathon experience vlog
  - what a run club is really like
