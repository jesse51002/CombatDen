gym_id: classic_barre
gym_type:
- classic_barre
theme: ClassicBarre
videos:
  specification:
    short_videos_desc: 'Precise, technique-led classic barre in the Pure Barre / Bar
      Method lineage — small isometric pulses, tucks and holds, ballet-trained posture,
      and follow-along full classes from credible instructors — plus the human side:
      instructor vlogs and "day in the life", studio behind-the-scenes, relatable
      "barre shakes" humour, aesthetic class edits, and member transformations.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "ballerina body
      in 30 days" videos, gymwear hauls and product shilling, and "barre vs pilates"
      or "is barre even a real workout" debate clips.
    videos_desc: |-
      # What we surface

      Technique and follow-along class content for classic barre members in the
      Pure Barre / Bar Method tradition — plus the fun, human side, so it's a
      feed members enjoy, not just a how-to library. The tone stays refined and
      exacting.

      ## Technique & classes
      - The small isometric pulses, tucks, lifts, and holds at the barre
      - Ballet-trained posture and alignment, and the precise one-inch-at-a-time
        form that defines the method
      - Full-length barre classes, and focused thigh, seat, abs, and arm segments
      - Proper use of the barre, ball, and light hand weights
      - Modifications for beginners through longtime devotees, from reputable
        barre teachers and studios

      ## The fun & human side
      - Instructor vlogs and "day in the life", and studio behind-the-scenes
      - "What a barre class is really like" and relatable "barre shakes" class
        humour done tastefully
      - Aesthetic full-class edits and instructor interviews
      - First-barre-class stories and one-year-of-barre transformations
    avoid_desc: |-
      # What we avoid

      Anything not about classic barre; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Clickbait body-transformation framing ("ballerina body / lean legs in 30
        days", "lose 10 lbs in a week")
      - Gymwear/leggings hauls and product shilling
      - "Barre vs pilates / which is better" or "barre vs yoga" cross-discipline
        framings (they advertise rivals)
      - "Is barre even a real workout / does barre work" debate or reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, or entertaining —
      fun and creator content is wanted.
  queries:
  - classic barre full length class follow along
  - pure barre style class at home
  - bar method full class beginner
  - barre tuck and pulse technique tutorial
  - barre thigh work isometric exercises
  - barre seat and glute segment workout
  - barre abs and core class
  - barre arms light weights workout
  - proper barre alignment and posture tutorial
  - common barre form mistakes and fixes
  - day in the life of a barre instructor
  - barre studio behind the scenes
  - what a barre class is really like
  - relatable barre shakes funny moments
  - aesthetic classic barre class edit
  - barre instructor vlog
  - barre instructor interview on the method
  - my first barre class experience
  - classic barre class with music vibe
  - one year of barre transformation
