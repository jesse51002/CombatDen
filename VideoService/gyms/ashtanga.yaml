gym_id: ashtanga
gym_type:
- ashtanga
theme: AshtangaShala
videos:
  specification:
    short_videos_desc: 'Ashtanga primary- and intermediate-series instruction and
      led full classes — posture-by-posture breakdowns, vinyasa count, the set sequence,
      and Mysore self-practice guidance — plus the human side: practitioner vlogs,
      shala behind-the-scenes, relatable practice humour, and teacher interviews.
      Traditional, disciplined, lineage-aware.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "yoga for weight
      loss / flat abs" videos, gear/leggings hauls and product shilling, and "yoga
      vs pilates" or "yoga is useless/dangerous" debate clips.
    videos_desc: |-
      # What we surface

      Ashtanga vinyasa instruction and led full classes for members from new
      Mysore students to long-time practitioners deep in the intermediate
      series — plus the human side of a daily practice, so it's something
      members enjoy scrolling, not just a how-to library. Devoted, disciplined
      tone throughout — the same set sequence at your own breath, six mornings
      a week.

      ## Instruction & led classes
      - Posture-by-posture breakdowns of the primary series
      - The led full primary and its vinyasa count
      - The seated sequence and finishing postures
      - How to build a consistent Mysore-style self-practice
      - Drishti and ujjayi breath, jump-back/jump-through, and bandha tutorials
      - Transitions into the harder primary and second-series postures

      ## The fun & human side
      - Practitioner vlogs and "day in the life of a Mysore practitioner"
      - Shala behind-the-scenes
      - Relatable practice humour and morning-practice moments
      - Aesthetic practice-with-music edits
      - Teacher interviews
      - Practice-journey transformation stories
    avoid_desc: |-
      # What we avoid

      Anything not about ashtanga vinyasa; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Calorie-burn "yoga for weight loss / flat abs in X days" promises
      - Heavy chanted-Sanskrit devotional sermons sold as the main point
      - Gear/leggings hauls and product shilling
      - "Yoga vs pilates / which is better" and "yoga is useless/dangerous"
        debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a highlight, or
      entertaining — fun and creator content is wanted.
