  - aerial yoga studio behind the scenes
  - beautiful aerial yoga flow with music aesthetic
  - playful aerial yoga skill clips compilation
  - aerial yoga instructor interview on inversions
  - my aerial yoga journey transformation
  - what is aerial yoga explained for beginners
