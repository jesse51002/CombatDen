gym_id: aerial_yoga
gym_type:
- aerial_yoga
theme: AerialYoga
videos:
  specification:
    short_videos_desc: 'Aerial-yoga classes and tutorials in a hanging silk hammock
      or hoop — supported postures, suspended flows, inversions and spinal decompression,
      plus hammock setup and safety — and the fun, human side: teacher vlogs, studio
      behind-the-scenes, playful skill and flow clips, funny first-time-in-the-silk
      moments, aesthetic flow-with-music, and instructor interviews. Suspended, supported,
      follow-along.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "aerial yoga
      for weight loss / flat abs" videos, gear/leggings hauls and product shilling,
      and "yoga vs pilates" or "is aerial yoga dangerous/pointless" debate clips.
    videos_desc: |-
      # What we surface

      Aerial-yoga instruction and full classes for members — from curious
      first-timers who saw an upside-down photo to seasoned aerialists training
      inversion work — plus the fun, human side, so it's a feed members enjoy,
      not just a how-to library. Theatrical, a little dramatic throughout: yoga
      lifted off the floor and into the silk.

      ## Classes & technique
      - Postures supported, suspended, or inverted in a hanging silk hammock or
        aerial hoop
      - Beginner foundations and hammock orientation
      - Supported flows, and gentle and deeper inversions
      - Spinal decompression and traction work
      - Hammock height and rigging/safety basics
      - Wrap and transition tutorials
      - Restorative aerial sequences (the cocoon/savasana)
      - Core and flexibility work in the silk

      ## The fun & human side
      - Instructor and practitioner vlogs and "what an aerial class is really
        like"
      - Studio behind-the-scenes
      - Playful aerial skill and flow clips
      - Funny first-time-in-the-silk moments
      - Aesthetic flow-with-music edits
      - Instructor interviews and aerial-journey transformation stories
    avoid_desc: |-
      # What we avoid

      Anything not about aerial / hammock yoga; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-burn "aerial yoga for weight loss / flat abs in X days" promises
      - Heavy chanted-Sanskrit devotional sermons sold as the main point
      - Gear/leggings hauls and product shilling
      - Dangerous untrained-rigging stunts
      - "Yoga vs pilates / which is better" or "is aerial yoga dangerous /
        pointless" debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a highlight, or
      entertaining — fun and creator content is wanted.
