theme: StairClimber
videos:
  specification:
    short_videos_desc: 'Stair-climber cardio sessions for people who treat stairs
      like a sport — follow-along StairMaster interval and endurance workouts, proper
      climbing form and pacing, plus the fun side: "what a StairMaster session is
      really like", climb-challenge highlights, relatable stairmaster humour, funny
      moments, transformation stories, and coach interviews.'
    short_avoid_desc: Off-topic, clickbait "burn 1000 calories on the stairs" gimmicks,
      and "stairmaster vs running / vs treadmill which is better" or "is the stairmaster
      useless" debate clips.
    videos_desc: |-
      # What we surface

      Stair-climber cardio content for people who treat stairs like a sport —
      follow-along workouts plus the fun, human side, so it's a feed members
      enjoy, not just a how-to library.

      ## Workouts & technique
      - Follow-along StairMaster / stepmill sessions: long endurance climbs,
        blocky intervals, speed and resistance sections
      - The heart-rate spike no other machine quite hits
      - Proper climbing posture, foot placement, and not leaning on the rails
      - Cadence control: how to set speed and pace a climb
      - Beginner first-session walkthroughs and lower-body / glute conditioning

      ## The fun & human side of stair climbing
      - "What a StairMaster session is really like" honest takes
      - Stair-climb challenge highlights
      - Relatable stairmaster humour and funny moments
      - Transformation stories
      - Coach interviews — urban, stadium-concourse grit for people who hate
        running but love climbing
    avoid_desc: |-
      # What we avoid

      Anything not about stair-climber / StairMaster cardio; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - VersaClimber / vertical-rail climbing and outdoor stadium / stair-running
        content (different machines and disciplines)
      - Calorie-bait "burn 1000 calories on the stairs / melt fat fast" gimmick
        titles
      - "Stairmaster vs running / vs treadmill which is better" cross-discipline
        framings
      - "Is the stairmaster useless / stair climbing wrecks your knees" debate
        or reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or entertaining
      — fun content is wanted.
