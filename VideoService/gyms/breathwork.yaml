gym_id: breathwork
gym_type:
- breathwork
theme: Breathwork
videos:
  specification:
    short_videos_desc: 'Guided breathwork sessions and technique explainers — box
      breathing, Wim Hof basics, coherent and diaphragmatic breathing, and downregulation
      for calm, sleep, and focus — plus the human side: "what a breathwork session
      is really like", first-time reactions, "I did breathwork every day for 30 days"
      stories, facilitator vlogs, and behind-the-scenes. Grounded, follow-along instruction.'
    short_avoid_desc: No unsafe breath-hold stunts or "hyperventilate then hold" dares,
      and no pseudoscience "breathwork cures disease / detoxes you" claims. Nothing
      off-topic, supplement promos, or "breathwork is fake / a scam" debate.
    videos_desc: |-
      # What we surface

      Guided breathwork and breathing-technique content for members from anxious
      first-timers to athletes using breath for recovery and focus — plus the
      fun, human side, so it's a feed members enjoy, not just a how-to library.

      ## Guided sessions & techniques
      - Box breathing, coherent/resonance breathing, and diaphragmatic breathing
      - Extended-exhale downregulation, and the basics of Wim Hof-style and
        circular/somatic breathing done safely
      - Targeted sessions for calm, stress relief, sleep, and focus
      - Short resets, and pre-performance and pre-sleep routines
      - Grounded, somatic and intentional follow-along instruction — calm and
        plain-spoken, always with safety cues

      ## The fun & human side
      - "What a breathwork session is really like"
      - Relatable beginner experiences and first-time reactions
      - "I did breathwork every day for 30 days" experience stories
      - Facilitator vlogs and "day in the life", studio behind-the-scenes
      - Calming aesthetic and ambiance edits
      - Credible facilitator or coach interviews
    avoid_desc: |-
      # What we avoid

      Anything not about breathwork or breathing techniques; off-topic,
      low-quality, or clickbait videos.

      ## Reject
      - Unsafe breath-hold stunts and dares ("hold your breath until you pass
        out", "longest breath hold", hyperventilate-then-submerge in water)
      - Pseudoscience and miracle-cure claims ("breathwork cures disease /
        detoxes your body / alkalizes your blood", "oxygen therapy heals
        everything")
      - New-age "activate your third eye / kundalini awakening" framing pitched
        as the main point
      - Supplement or breathing-gadget promos
      - "Breathwork vs meditation / which is better" framing, and "breathwork is
        fake / dangerous / a scam" debate or reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, short, or experiential — fun and
      human content is wanted.
