gym_id: strongman
gym_type:
- strongman
theme: Strongman
videos:
  specification:
    short_videos_desc: 'Strongman event technique and programming — atlas stones,
      yoke, log press, farmers carry, deadlift and loading from credible coaches —
      plus the fun side: World''s Strongest Man and competition footage, record-attempt
      highlights, gym vlogs, athlete interviews, and motivation montages.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      fail clips, sketchy supplement or steroid promos, or "strongman vs powerlifting
      / is strongman bad for you" debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Technique, programming, and competition content for strongman gym
      members — plus the fun, human side, so it's a feed members enjoy,
      not just a how-to library.

      ## Events & technique
      - Atlas stones and stone loading, yoke walk, log and axle press
      - Farmers carry, deadlift and frame, sandbag and keg loading,
        pressing medleys
      - Implement-specific drills, grip and conditioning work, event
        setup and strategy
      - Contest-prep programming from credible coaches

      ## The fun & human side of strongman
      - World's Strongest Man and pro-show competition footage
      - Record-attempt clips and biggest-lift jaw-drop highlights
      - Gym vlogs and "a day of training" behind-the-scenes
      - PR-celebration and funny gym clips
      - Athlete and coach interviews, and athlete profiles that celebrate
        the old-iron spectacle
    avoid_desc: |-
      # What we avoid

      Anything not about strongman; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "Strongman vs powerlifting / bodybuilding" and "is strongman bad
        for you / strongman will wreck your joints" cross-discipline or
        anti-discipline debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
  queries:
  - atlas stone loading technique tutorial
  - yoke walk technique and setup
  - log press technique strongman
  - farmers carry technique for strongman
  - strongman deadlift and frame technique
  - strongman grip training for events
  - strongman program for beginners
  - how to train for your first strongman competition
  - stone loading mistakes and fixes
  - strongman implement training at home
  - worlds strongest man event highlights
  - worlds strongest man best moments compilation
  - strongman atlas stone record attempt
  - strongman competition log press highlights
  - strongman gym a day of training vlog
  - strongman pr celebration clips
  - funny strongman gym moments
  - strongman athlete interview training
  - strongman coach interview on event training
  - strongman training motivation montage
