theme: PilatesCardio
videos:
  specification:
    short_videos_desc: 'Cardio pilates — reformer work spliced with jumpboard plyometric
      intervals, so controlled pilates sets and low-impact cardio bursts share one
      booking — plus the enjoyable side: instructor vlogs and "day in the life", studio
      behind-the-scenes, what a jumpboard class is really like, aesthetic class edits,
      transformations, and interviews.'
    short_avoid_desc: No plain pilates with no cardio or high-impact bootcamp/HIIT
      mislabeled as pilates cardio, no reckless jump landings with no form coaching,
      and no "burn 500 calories in X minutes" clickbait. Skip "pilates vs cardio"
      framings and "pilates is not real cardio / is useless" debate clips. (Fun vlogs,
      studio tours, class edits, and interviews are welcome.)
    videos_desc: |-
      # What we surface

      Technique, class, and follow-along content for cardio pilates members who
      want both the method and a real cardio engine — plus the fun, human side,
      so it's a feed members enjoy, not just a how-to library.

      ## Reformer & jumpboard technique
      - Reformer pilates work: footwork, core, leg and glute series, controlled tempo
      - Jumpboard plyometric intervals: setup, spring settings, safe landing mechanics
      - Interval structure: pilates set then cardio burst, and full cardio-pilates flows
      - Low-impact cardio-pilates mat alternatives for studios without a jumpboard
      - Full-length follow-along reformer-cardio classes and technique breakdowns from
        credible instructors

      ## The fun & human side
      - Instructor vlogs and "day in the life" of a cardio pilates teacher
      - Studio behind-the-scenes and "what a jumpboard pilates class is really like"
      - Relatable cardio-pilates humour and class moments, aesthetic class edits
      - Before/after and "30 days of cardio pilates" transformation stories
      - Teacher interviews; the tone is energetic but controlled
    avoid_desc: |-
      # What we avoid

      Anything not about cardio / jumpboard pilates; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Plain pilates classes with no cardio element
      - High-impact "bootcamp / HIIT / metcon" or running/spin workouts with no
        pilates principles mislabeled as pilates cardio
      - Jump sequences with reckless landings and no form coaching
      - Clickbait ("burn 500 calories in 20 minutes", "torch fat fast") and scams
        or misinformation
      - "Pilates vs cardio / vs HIIT which is better" cross-discipline framings
      - "Pilates is not real cardio / is useless" debate or reaction rage-bait

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, class edit, or entertaining —
      fun and creator content is wanted.
