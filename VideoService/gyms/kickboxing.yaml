gym_id: kickboxing
gym_type:
- kickboxing
theme: StrikeKickboxing
videos:
  specification:
    short_videos_desc: 'Approachable kickboxing technique and high-energy follow-along
      bag and pad classes — punches, kicks, knees, and combinations from credible
      coaches — plus the fun side: pro highlight reels, gym vlogs, fun sweat-it-out
      challenges, funny class moments, and coach and fighter interviews.'
    short_avoid_desc: Off-topic, clickbait, street-fight "one kick knockout" fantasy,
      "fight-ready in a week" promises, supplement scams, backyard-brawl footage,
      and "kickboxing vs muay thai / is kickboxing useless" anti-kickboxing debate
      clips.
    videos_desc: |-
      # What we surface

      Technique and follow-along class content for kickboxing members — plus the
      fun, human side, because the crowd here is the after-work, blow-off-steam
      crowd, so it's a feed members enjoy, not just a workout library.

      ## Technique & classes
      - Stance and footwork
      - Punches: jab, cross, hooks, uppercuts
      - Kicks: roundhouse, front, side; and knees
      - The combinations that string them together
      - High-energy heavy-bag and pad-work workouts, beginner-friendly drills,
        and kickboxing conditioning from credible coaches

      ## The fun & human side
      - Fun, feel-good follow-along sweat challenges
      - Pro highlight and best-combinations reels
      - Gym vlogs and "a day at the kickboxing gym"
      - Funny class and sparring moments
      - Member transformation stories
      - Coach and fighter interviews and motivation montages

      Approachable and social, never intimidating.
    avoid_desc: |-
      # What we avoid

      Anything not about kickboxing; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Street-fight / self-defense fantasy ("one kick to end any fight",
        "deadliest knockout")
      - McDojo-style "get fight-ready in a week / go pro fast" promises
      - Sketchy supplement promos and unsanctioned backyard-brawl footage
      - "Kickboxing vs muay thai", "is kickboxing useless in a real fight", and
        similar cross-discipline or anti-kickboxing debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
  queries:
  - kickboxing for beginners technique tutorial
  - kickboxing stance and footwork basics
  - how to throw a roundhouse kick kickboxing
  - kickboxing punch combinations for beginners
  - kicks and knees technique breakdown kickboxing
  - heavy bag kickboxing workout follow along
  - kickboxing pad work combinations drills
  - kickboxing defense and blocking basics
  - kickboxing conditioning and core workout
  - kickboxing teep and push kick tutorial
  - fun kickboxing workout to blow off steam
  - 30 minute kickboxing cardio class at home
  - pro kickboxing highlights and best knockouts
  - best kickboxing combinations of all time
  - a day at the kickboxing gym vlog
  - funny kickboxing class moments
  - kickboxing transformation story before and after
  - pro kickboxer training camp behind the scenes
  - kickboxing coach interview on the sport
  - kickboxing motivation training montage
