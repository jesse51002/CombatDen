gym_id: bjj_gi
gym_type:
- bjj_gi
theme: ZenBJJ
videos:
  specification:
    short_videos_desc: 'Gi Brazilian jiu-jitsu technique and drilling — guard, passing,
      sweeps, submissions, and gi-specific grips from credible black-belt instructors
      — plus the human side: competition highlights, academy vlogs, funny roll moments,
      belt-promotion stories, and black-belt interviews.'
    short_avoid_desc: Off-topic, clickbait, no-gi-only content, "blue belt in 3 months"
      McDojo promises, ego smash-everybody footage, street-fight fantasy, and "bjj
      vs wrestling / is bjj useless" anti-BJJ debate videos.
    videos_desc: |-
      # What we surface

      Technique, class, and study content for gi Brazilian jiu-jitsu members —
      plus the fun, human side, so it's a feed members enjoy, not just a how-to
      library. The culture here is disciplined and technique-first, so favour
      clear, controlled instruction that teaches HOW and WHY over flashy
      finishes. Calm, credible coaching for first-timers and competitors alike.

      ## Technique & classes
      - Guard work: closed, open, spider, de la riva
      - Guard passing, sweeps, and escapes
      - Submissions: chokes, armbars, triangles
      - The gi-specific grip and collar game
      - Follow-along drilling, positional rounds, and concept breakdowns from
        credible black-belt instructors

      ## The fun & human side
      - IBJJF-style competition match breakdowns and highlights
      - Academy vlogs and "a day on the mats"
      - Training and life-on-the-mat behind-the-scenes
      - Relatable and funny rolling moments
      - Belt-promotion and first-stripe stories
      - Black-belt instructor interviews — kept tasteful and on the calm,
        respectful side, never ego-driven highlight bait
    avoid_desc: |-
      # What we avoid

      Anything not about gi BJJ; off-topic, genuinely low-quality, or clickbait
      videos, and no-gi-only content (this is the gi gym).

      ## Reject
      - Street-fight / self-defense fantasy ("one submission to end any fight",
        "deadliest choke")
      - McDojo-style "get your blue belt in 3 months / go pro fast" promises
      - Ego-driven "smashing white belts" or backyard-roll footage
      - "bjj vs wrestling / judo", "is bjj useless in a real fight", and similar
        cross-discipline or anti-BJJ debate / reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or entertaining
      — fun content is wanted.
  queries:
  - bjj gi fundamentals for beginners
  - closed guard attacks and submissions gi
  - bjj guard passing technique gi
  - spider guard sweeps tutorial gi
  - de la riva guard for beginners
  - bjj collar choke from the back gi
  - armbar and triangle setups from guard gi
  - escaping side control and mount bjj
  - bjj gi grip fighting and grip breaks
  - half guard sweeps and recovery gi
  - bjj concepts pressure and weight distribution
  - ibjjf competition match breakdown analysis
  - black belt gi bjj competition highlights
  - clean gi submission highlights reel
  - a day at the bjj academy vlog
  - what a bjj class is really like
  - funny bjj rolling moments
  - bjj blue belt promotion story
  - bjj competitor day in the life gi
  - bjj black belt instructor interview
