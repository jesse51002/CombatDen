videos:
  specification:
    short_videos_desc: 'Sauna and cold-plunge protocols, contrast-therapy routines,
      and breathing for the cold — how-to guidance plus evidence-based explainers
      on recovery and health benefits — plus the human side: "what a cold plunge is
      really like", first-time reactions, "I cold plunged every day for 30 days" stories,
      sauna and spa behind-the-scenes, and calm ritual vlogs. Measured and credible.'
    short_avoid_desc: No extreme biohacker stunts, unsafe "stay in the ice until you
      pass out" challenges, or "cold plunge cures disease / melts fat" miracle claims.
      Nothing off-topic, supplement promos, or "cold plunge is a scam" debate.
    videos_desc: |-
      # What we surface

      Sauna, cold-plunge, and contrast-therapy content for members from
      longevity-curious first-timers to athletes using heat and cold for
      recovery — plus the fun, human side, so it's a feed members enjoy,
      not just a how-to library.

      ## Protocols, technique & science
      - Practical how-to on protocols and timing: heat duration, plunge
        temperature and time, how many rounds, when to use it around training
      - The contrast cycle itself, and breathing techniques to stay calm in
        the cold
      - Credible, evidence-based explainers on recovery, circulation, and
        well-being benefits
      - Safety and contraindications, and beginner cold-exposure guidance

      ## The fun & human side
      - "What a cold plunge is really like" — relatable beginner experiences
        and first-time reactions
      - "I cold plunged every day for 30 days" experience stories
      - Sauna and spa behind-the-scenes
      - Calm morning-ritual vlogs and "day in the life"
      - Calming aesthetic and ambiance edits
      - Practitioner, coach, or researcher interviews
    avoid_desc: |-
      # What we avoid

      Anything not about sauna, cold plunge, or contrast therapy; off-topic,
      low-quality, or clickbait videos.

      ## Reject
      - Extreme biohacker stunts and unsafe challenges ("longest ice bath
        ever", "stay in the cold until you pass out", hyperventilate-then-submerge
        dares)
      - Miracle-cure and pseudoscience claims ("cold plunge cures depression
        / disease / melts fat", "boost testosterone 1000%")
      - Ice-bath tub / sauna-gadget gear hauls and supplement promos
      - "Sauna vs cold plunge / which is better" framing pitched as a winner
      - "Cold plunge is useless / dangerous / a scam" debate or reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, short, a clip, a highlight,
      or entertaining — fun and human content is wanted.
