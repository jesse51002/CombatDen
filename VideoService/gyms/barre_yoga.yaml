gym_id: barre_yoga
gym_type:
- barre_yoga
theme: BarreYoga
videos:
  specification:
    short_videos_desc: 'Calm barre-and-yoga hybrid classes — mat warmups, breath-led
      flows, barre strength held at tempo, and a long savasana to close, in follow-along
      sessions from credible instructors — plus the human side: teacher vlogs, studio
      behind-the-scenes, relatable class moments, aesthetic flow edits, and practitioner
      transformations.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "yoga barre body
      in 30 days" videos, gymwear hauls and product shilling, and "barre vs pilates"
      or "is barre even a real workout" debate clips.
    videos_desc: |-
      # What we surface

      Follow-along and technique content for barre yoga members who want their
      barre work paired with a real yoga practice — plus the fun, human side, so
      it's a feed members enjoy, not just a how-to library.

      ## Classes & technique
      - Full-length barre yoga classes: mat warmups, breath-led flows, barre
        strength held at tempo, and a long savasana to close
      - Breath-led flows that fold into barre strength
      - Core, glute, and balance segments
      - Alignment and posture work, and beginner foundations
      - From reputable barre and yoga teachers, with a breath-led, quietly
        considered tone

      ## The fun & human side
      - Teacher and practitioner vlogs and "day in the life"
      - Studio behind-the-scenes and "what a barre yoga class is really like"
      - Relatable class moments done tastefully
      - Aesthetic flow-with-music edits
      - Instructor interviews, first-class stories, and one-year transformation
        journeys
    avoid_desc: |-
      # What we avoid

      Anything not about barre yoga; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Clickbait body-transformation framing ("yoga barre body / lean legs in
        30 days", "lose 10 lbs in a week")
      - Heavy chanted-Sanskrit devotional content sold as the main point
      - Gymwear/leggings hauls and product shilling
      - "Barre vs pilates / which is better" or "barre vs yoga" cross-discipline
        framings (they advertise rivals)
      - "Is barre even a real workout / does barre work" debate or reaction
        videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, or entertaining —
      fun and creator content is wanted.
  queries:
  - barre yoga full class follow along
  - yoga barre fusion class at home
  - barre and yoga hybrid full body workout
  - breath led barre flow class
  - barre yoga core and balance segment
  - barre yoga glutes and legs class
  - beginner barre yoga foundations
  - barre yoga alignment and posture cues
  - barre yoga savasana and relaxation close
  - barre yoga common form mistakes and fixes
  - day in the life of a barre yoga instructor
  - barre yoga studio behind the scenes
  - what a barre yoga class is really like
  - relatable barre yoga class moments
  - aesthetic barre yoga flow edit
  - barre yoga instructor vlog
  - barre yoga instructor interview
  - my first barre yoga class experience
  - barre yoga flow with music vibe
  - one year of barre yoga transformation
