gym_id: stretch
gym_type:
- stretch
theme: StretchStudio
videos:
  specification:
    short_videos_desc: 'Guided and assisted stretching plus flexibility and mobility
      routines — follow-along full-body, hips, hamstrings, shoulders, and neck/back
      relief for desk posture — plus the human side: "what a stretch session is really
      like", "I stretched every day for 30 days" stories, first-time reactions, coach
      vlogs, and flexibility transformations. Calm and credible.'
    short_avoid_desc: No "get the splits in a week" extreme-flexibility clickbait,
      miracle "fix your posture forever" claims, or unsafe ballistic forcing. Nothing
      off-topic, supplement/gear promos, or "stretching is useless / a waste of time"
      debate.
    videos_desc: |-
      # What we surface

      Guided and assisted stretching with flexibility and mobility routines for
      members from desk-bound beginners to weekend athletes — plus the fun,
      human side, so it's a feed members enjoy, not just a how-to library.

      ## Stretching technique & routines
      - Follow-along full-body sessions and targeted routines for tight hips,
        hamstrings, shoulders, lower back, and neck
      - Partner and assisted-stretch techniques, and PNF method explainers from
        credible coaches
      - Short desk-break and posture-relief routines
      - Gentle morning and evening stretches

      ## The fun & human side
      - "What an assisted stretch session is really like" experiences and
        first-time reactions
      - Relatable beginner stories and calming aesthetic edits
      - Coach and practitioner vlogs and "day in the life"
      - Studio behind-the-scenes
      - "I stretched every day for 30 days" experience stories
      - Flexibility-progress transformations and flexibility coach interviews
    avoid_desc: |-
      # What we avoid

      Anything not about stretching, flexibility, or mobility; off-topic,
      low-quality, or clickbait videos.

      ## Reject
      - Extreme-flexibility "get the full splits in a week / become a
        contortionist fast" clickbait and unsafe ballistic forcing
      - Miracle "fix your posture forever in 5 minutes / cure your back pain
        instantly" claims and pseudoscience medical promises
      - Gear/legging hauls and supplement promos
      - "Stretching vs yoga / which is better" cross-discipline framings
      - "Stretching is useless / a waste of time" debate or reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, short, a clip, a highlight,
      or entertaining — fun and human content is wanted.
