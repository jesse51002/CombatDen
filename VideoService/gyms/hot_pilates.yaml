classes:
- name: Core Ignition
  image_url: https://images.pexels.com/photos/25599825/pexels-photo-25599825.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: High-rep ab series and core burners in the heat. Expect the hundred,
    pulses, scissors, and controlled breathing as the warmth deepens your engagement
    and precision.
  instructor_name: James Carter
  instructor_bio: Head coach with over a decade of experience helping members of every
    level train smarter, move better, and stay consistent.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/6/68/Alec_Penix.jpg
- name: Flow & Flexibility
  image_url: https://images.pexels.com/photos/18136885/pexels-photo-18136885.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Dynamic mat work combining flowing sequences with deep stretches in
    a heated environment. Build functional strength and mobility while the heat opens
    your body.
  instructor_name: Sarah Mitchell
  instructor_bio: Performance coach focused on building strength, mobility, and confidence
    through approachable, well-structured sessions.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/8/8b/Athlete_portrait_Marianna_Gillespie.jpg
- name: Lower Body Burn
  image_url: https://images.pexels.com/photos/18136886/pexels-photo-18136886.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Intense leg, glute, and hip work designed to torch and sculpt. Control
    every pulse and squeeze as the heat amplifies the burn and builds lasting strength.
  instructor_name: Daniel Brooks
  instructor_bio: Certified instructor who breaks every movement down step by step
    so newcomers and regulars alike feel supported.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/e/e3/Branden_Loera_Headshot.jpg
- name: Full Body Heat
  image_url: https://images.pexels.com/photos/18136888/pexels-photo-18136888.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Total-body conditioning from arms to glutes. Flowing planks, side planks,
    and integrated strength work sustained in heat for maximum mind-muscle connection.
  instructor_name: Maya Bennett
  instructor_bio: Coach passionate about creating an inclusive, high-energy room where
    members from all backgrounds can thrive.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/2/2e/Torrie_Lewis_for_Signet_Packaging%2C_headshot.jpg
