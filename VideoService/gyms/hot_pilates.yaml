videos:
  specification:
    short_videos_desc: 'Hot pilates — mat pilates run in a heated room, with sweaty,
      low-impact, high-rep core and full-body work held precise in the heat — plus
      the enjoyable side: instructor vlogs and "day in the life", studio behind-the-scenes,
      what a hot pilates class is really like, aesthetic sweaty class edits, transformations,
      and interviews.'
    short_avoid_desc: No cool-room mat or reformer classes mislabeled as hot pilates,
      hot-yoga sequences passed off as pilates, or "sweat off 10 lbs in X days" clickbait.
      Skip "hot pilates vs hot yoga" framings and "hot pilates is dangerous / pointless"
      debate clips. (Fun vlogs, studio tours, class edits, and interviews are welcome.)
    videos_desc: |-
      # What we surface

      Hot pilates instruction for members who chase the heated burn — mat
      pilates run in a warm, mirrored room — plus the fun, human side, so it's a
      feed members enjoy, not just a how-to library. The tone is warm, intense
      and grown-up.

      ## Heated classes & technique
      - Sweaty, low-impact, high-rep core and full-body sequences: the hundred
        and ab series, planks and side planks, leg and glute work, controlled
        pulses — held precise as the heat opens the body and the mirror keeps
        form honest
      - Full-length follow-along heated classes
      - Single-exercise technique and modification breakdowns from credible
        instructors
      - Practical guidance on hydration, pacing and recovery for training in
        the heat

      ## The fun & human side
      - Instructor vlogs and "day in the life", studio behind-the-scenes
      - "What a hot pilates class is really like"
      - Relatable sweaty class humour and moments, aesthetic class edits
      - Before/after and "30 days of hot pilates" transformation stories
      - Teacher interviews
    avoid_desc: |-
      # What we avoid

      Anything not about hot pilates; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Cool-room mat or reformer classes mislabeled as hot pilates
      - Hot-yoga or Bikram sequences passed off as pilates
      - Generic "sweaty HIIT / ab burner" workouts with no pilates principles
      - Clickbait ("sweat off 10 lbs in a week", "flat tummy in 7 days"), scams
        and misinformation
      - "Hot pilates vs hot yoga / which is better" cross-discipline framings
      - "Hot pilates is dangerous / pointless" debate or reaction rage-bait

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a class edit, or
      entertaining — fun and creator content is wanted.
