gym_id: modern_hot
gym_type:
- modern_hot
theme: ModernHot
videos:
  specification:
    short_videos_desc: 'Modern hot-yoga and sculpt-flow classes — athletic hot-power
      flows, sculpt classes with weights, and the heat-driven, music-paced workout
      style — plus the fun, human side: studio vlogs, sweaty-class behind-the-scenes,
      funny hot-yoga moments, aesthetic flow-with-music, and teacher interviews. Strong,
      sweaty, follow-along, high-energy.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "hot yoga for
      weight loss / flat abs in X days" videos, gear/leggings hauls and product shilling,
      and "yoga vs pilates" or "is hot yoga dangerous/pointless" debate clips.
    videos_desc: |-
      # What we surface

      Hot-yoga and sculpt-flow content for members from athletic newcomers
      chasing the sweat to regulars who treat hot class like training —
      plus the fun, human side, so it's a feed members enjoy, not just
      a workout library.

      ## Hot-power & sculpt-flow technique
      - Hot-power vinyasa flows and core- and strength-focused flows
      - Sculpt classes that build in dumbbells and resistance training
      - Follow-along full classes of varying lengths
      - Sculpt-flow technique — safe weighted movement on the mat
      - Peak-pose and arm-balance build-ups
      - Mobility and recovery content that serves the hot practice

      ## The fun & human side
      - Studio vlogs and "what a hot sculpt class is really like"
      - Sweaty-class behind-the-scenes
      - Funny hot-yoga moments and class fails
      - Aesthetic hot-flow-with-music edits
      - Teacher interviews
      - Transformation and challenge stories
    avoid_desc: |-
      # What we avoid

      Anything not about modern hot or sculpt-flow yoga; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - Calorie-burn clickbait: "hot yoga for weight loss / flat abs
        in X days" promises
      - Heavy chanted-Sanskrit devotional sermons sold as the main point
      - Gear/leggings hauls and product shilling
      - "Yoga vs pilates / which is better" or "is hot yoga dangerous /
        pointless" debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a
      highlight, or entertaining — fun and creator content is wanted.
