theme: AerialSilks
videos:
  specification:
    short_videos_desc: 'Aerial silks, lyra and trapeze instruction — climbs, wraps,
      drops, transitions, plus conditioning and safety — alongside the performance
      and human side: cabaret and showcase routines, skill clips, studio vlogs and
      behind-the-scenes, funny training moments, and aerialist interviews. Beginner
      to advanced, credible studio coaching.'
    short_avoid_desc: No "aerial fitness" cardio rebrands that hide the apparatus,
      reckless "learn to drop in a day / no spotter needed" stunts ignoring safety,
      off-topic or clickbait videos, or "aerial vs pole / is aerial a real art" debate
      clips.
    videos_desc: |-
      # What we surface

      Aerial apparatus content for dancers from first-timers to seasoned
      aerialists across silks, lyra (hoop) and static trapeze — plus the
      performance and human side, so it's a feed members enjoy, not just a
      how-to library.

      ## Apparatus technique & classes
      - Silks, lyra (hoop) and static trapeze for first-timers through
        seasoned aerialists
      - Technique breakdowns of climbs, footlocks, wraps, inversions, beats,
        transitions and drops
      - Follow-along beginner-to-advanced classes
      - Core conditioning, grip and flexibility that make the work safe and
        possible
      - Apparatus safety, spotting, rigging awareness and clean dismounts
        alongside the skills, taught by credible instructors and studios that
        respect the lineage of the circus and the contemporary aerial stage

      ## The performance & human side
      - Cabaret and showcase routines
      - Skill and combo clips
      - Studio vlogs and "day in the life"
      - Training and rehearsal behind-the-scenes
      - Funny and relatable training moments
      - Aerialist interviews
      - Progress and "first drop" reels

      The performances inspire the training — kept to skilled work, never
      reckless no-spotter stunts.
    avoid_desc: |-
      # What we avoid

      Anything not about aerial silks / lyra / trapeze; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - "Aerial fitness / aerial yoga cardio" rebrands that hide the apparatus
        arts behind a hammock workout
      - Reckless "learn to drop in a day / no spotter needed" gimmick tutorials
        and unsafe stunts that ignore safety and rigging
      - Gear hauls and product shilling
      - Clickbait ("master the silks in a week")
      - "Aerial silks vs pole / which is harder" cross-discipline framings
      - "Is aerial too dangerous / aerial silks isn't a real art" debate or
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a showcase, a clip, a vlog, or
      entertaining — fun and creator content is wanted.
