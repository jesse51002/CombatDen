gym_id: functional_fitness
gym_type:
- functional_fitness
theme: FunctionalFitness
videos:
  specification:
    short_videos_desc: 'Non-affiliate functional training — barbell and compound-lift
      technique, carries, sprints, kettlebell and bodyweight work, smart programming,
      and full follow-along workouts from credible coaches — plus the fun side: hybrid-athlete
      and competition highlights, gym vlogs and "a day of training", PR clips, transformation
      stories, and coach interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      fail clips, sketchy supplement or steroid promos, or "functional fitness is
      useless / CrossFit vs functional" debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Technique, class, and programming content for functional fitness
      members who lift heavy one day and sprint, carry, and do strict
      pull-ups the next — plus the fun, human side, so it's a feed members
      enjoy, not just a how-to library.

      ## Technique & programming
      - Compound-lift mechanics: squat, deadlift, press, clean
      - Kettlebell and dumbbell work, loaded carries
      - Sled and conditioning intervals, and mobility
      - Gymnastics-style bodyweight skills
      - Full follow-along workouts and smart programming/periodization
        explainers from credible coaches

      ## The fun & human side
      - Hybrid-athlete and functional-competition highlights
      - Gym vlogs and "a day of training"
      - PR-celebration clips and funny gym-floor moments
      - Transformation stories
      - Athlete and coach interviews on training the generalist, and
        motivation montages
    avoid_desc: |-
      # What we avoid

      Anything not about functional / general physical preparedness
      training; off-topic, genuinely low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "Functional fitness vs CrossFit / bodybuilding" and "is functional
        training useless / functional fitness is a scam" cross-discipline or
        anti-discipline debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight,
      or entertaining — fun content is wanted.
  queries:
  - functional fitness full workout follow along
  - functional strength training program explained
  - kettlebell and dumbbell functional workout
  - loaded carry variations technique
  - compound lift technique squat deadlift press
  - functional fitness for beginners full class
  - strict pull-up progression tutorial
  - functional mobility routine for lifters
  - how to program functional training week
  - functional training movement mistakes and fixes
  - hybrid athlete competition highlights
  - functional fitness competition best moments
  - hybrid athlete a day of training vlog
  - functional training gym vlog community
  - pr celebration gym clips
  - funny gym training moments
  - functional fitness transformation story
  - functional fitness coach interview programming
  - hybrid athlete interview training
  - functional fitness training motivation
