theme: PrePostnatalPilates
videos:
  specification:
    short_videos_desc: 'Pre and postnatal pilates kept safe for pregnancy and recovery
      — trimester-safe modifications, pelvic floor and deep-core work, and gentle
      postnatal rebuild (diastasis-aware) — plus the enjoyable side: instructor and
      pregnant-mum vlogs and "day in the life", studio behind-the-scenes, what a prenatal
      class is really like, honest postnatal recovery-journey stories, and interviews.'
    short_avoid_desc: No general pilates with no pregnancy modifications, contraindicated
      moves (deep flexion/crunches, supine after first trimester, breath-holding),
      or "bounce back / lose the baby weight in X days" clickbait. Skip "pilates vs
      prenatal yoga" framings and "prenatal exercise is unsafe / pointless" debate
      clips. (Fun vlogs, studio tours, class edits, and interviews are welcome.)
    videos_desc: |-
      # What we surface

      Pre and postnatal pilates instruction for members training through pregnancy
      and rebuilding after birth — plus the fun, human side, so it's a feed
      members enjoy, not just a how-to library.

      ## Technique & classes
      - Trimester-by-trimester safe modifications and progression guidance
      - Pelvic-floor and deep transverse-core work, breath, posture, and
        hip/back relief for the changing body
      - Careful postnatal return that is diastasis-recti aware: pelvic-floor
        reconnection, core knitting, and gradual strength rebuild
      - Which moves to modify or avoid as pregnancy progresses (no deep
        flexion / crunches, no supine work past the first trimester), props
        for support, and how to progress safely
      - Full-length follow-along prenatal and postnatal mat classes and
        technique breakdowns from credible prenatal-trained and clinically
        literate teachers

      ## The fun & human side
      - Instructor and pregnant-mum vlogs and "day in the life"
      - Studio behind-the-scenes and "what a prenatal pilates class is really like"
      - Relatable pregnancy and new-mum humour and class moments
      - Honest postnatal recovery-journey stories
      - Prenatal-teacher interviews on training safely
    avoid_desc: |-
      # What we avoid

      Anything not about pre/postnatal pilates; off-topic, genuinely low-quality,
      or clickbait videos.

      ## Reject
      - General pilates classes with no pregnancy modifications
      - Content showing contraindicated moves for pregnancy (deep spinal
        flexion / full crunches, prolonged supine work after the first
        trimester, intense ab-isolation, breath-holding)
      - Uncredentialed advice that ignores safety
      - Clickbait ("bounce back in 7 days", "lose the baby weight in 2 weeks",
        "get your pre-baby body back fast"), scams and misinformation
      - "Pilates vs prenatal yoga / which is better" cross-discipline framings
      - "Prenatal exercise is unsafe / pointless" debate or reaction rage-bait

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, class edit, or
      entertaining — fun and creator content is wanted.
