gym_id: olympic_weightlifting
gym_type:
- olympic_weightlifting
theme: OlyLifting
videos:
  specification:
    short_videos_desc: 'Olympic weightlifting technique and programming — snatch,
      clean and jerk breakdowns, positions, mobility, and accessory work from credible
      coaches — plus the fun side: Olympic and World championship footage, big-lift
      and PR highlights, training-hall vlogs, lifter interviews, and motivation montages.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      fail clips, sketchy supplement or steroid promos, or "weightlifting vs powerlifting
      / is the snatch dangerous" debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Technique, programming, and competition content for Olympic weightlifting
      club members — plus the fun, human side, so it's a feed members enjoy,
      not just a how-to library.

      ## Technique & programming
      - Snatch and clean and jerk deep breakdowns: positions (start, pulls,
        turnover, receiving, overhead lockout)
      - Drills, squat and pulling variations, and mobility for the catch
      - Accessory work, programming, and peaking explainers from credible coaches

      ## The fun & human side
      - Elite competition footage — Olympics, World and national championships
      - Big-lift and PR highlights, slow-motion technique edits of top lifters
      - Training-hall and "a day of training" vlogs, PR-celebration clips
      - Lifter and coach interviews, athlete profiles, and platform motivation
        montages
    avoid_desc: |-
      # What we avoid

      Anything not about Olympic weightlifting; off-topic, genuinely low-quality,
      or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "Weightlifting vs powerlifting / CrossFit" and "is the snatch useless /
        Olympic lifting is dangerous / a waste" cross-discipline or
        anti-discipline debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or entertaining
      — fun content is wanted.
  queries:
  - snatch technique breakdown step by step
  - clean and jerk technique tutorial
  - olympic lifting positions and pulls explained
  - snatch mobility and overhead position drills
  - jerk technique split jerk tutorial
  - snatch drills for beginners
  - olympic weightlifting program for beginners
  - how to peak for a weightlifting meet
  - fixing common snatch mistakes
  - overhead squat technique for weightlifting
  - olympic weightlifting world championships highlights
  - olympics weightlifting biggest lifts
  - elite snatch slow motion technique analysis
  - weightlifting training hall day in the life vlog
  - weightlifting pr celebration clips
  - weightlifting competition platform footage
  - olympic weightlifter interview training
  - olympic weightlifting coach interview technique
  - funny weightlifting gym moments
  - weightlifting training motivation montage
