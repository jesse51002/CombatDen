gym_id: hatha
gym_type:
- hatha
theme: HathaStudio
videos:
  specification:
    short_videos_desc: 'Foundational hatha classes and pose tutorials with slow, patient
      instruction — single postures held long, clear alignment, and steady breathing
      — plus the gentle, human side: teacher vlogs, studio behind-the-scenes, relatable
      class humour, and calming flow-with-music. Beginner- and older-practitioner
      friendly, classical and unhurried.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "yoga for weight
      loss / flat abs" videos, gear/leggings hauls and product shilling, and "yoga
      vs pilates" or "yoga is useless/dangerous" debate clips.
    videos_desc: |-
      # What we surface

      Foundational hatha classes and pose-by-pose tutorials for members from
      first-timers to older and returning practitioners — plus the gentle,
      human side, so it's a feed members enjoy scrolling, not just a how-to
      library. Slow, welcoming, classical tone throughout: it teaches you how
      to breathe before it teaches you how to bend.

      ## Classes & foundations
      - Foundational hatha classes and pose-by-pose tutorials for first-timers
        through older and returning practitioners
      - Single postures held long enough to settle in, with clear alignment
        cues for standing, seated, and gentle backbend/forward-fold poses
      - The patient, classical sequencing hatha is built on
      - Foundational breathing: pranayama and basic breath awareness
      - Gentle mobility and joint-warmups that serve the practice

      ## The gentle & human side
      - Teacher and practitioner vlogs and "day in the life"
      - Studio behind-the-scenes
      - Relatable yoga humour and class moments
      - Aesthetic slow-flow-with-music edits
      - Teacher interviews and one-year-of-yoga transformation stories
    avoid_desc: |-
      # What we avoid

      Anything not about hatha or classical foundational yoga; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - Calorie-burn "yoga for weight loss / flat abs in X days" promises
      - Heavy chanted-Sanskrit devotional sermons sold as the main point
      - Gear/leggings hauls and product shilling
      - "Yoga vs pilates / which is better" cross-discipline framings
      - "Yoga is useless/dangerous" debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a highlight, or
      entertaining — fun and creator content is wanted.
  queries:
  - hatha yoga full class for beginners
  - classical hatha yoga 45 minute class
  - hatha yoga foundations standing poses
  - how to hold a pose with proper alignment
  - gentle hatha yoga for older adults
  - hatha yoga seated and forward fold poses
  - basic pranayama breathing for beginners
  - hatha yoga joint warm up routine
  - slow hatha yoga back pain relief
  - hatha yoga sun salutation slow tutorial
  - hatha yoga balance poses tutorial
  - day in the life of a hatha yoga teacher
  - what a hatha yoga class is really like
  - relatable yoga class moments funny
  - yoga teacher reacts to yoga fails
  - yoga studio behind the scenes
  - slow hatha flow with music aesthetic
  - hatha yoga evening wind down class
  - hatha yoga teacher interview on breath
  - one year of hatha yoga transformation
