  image_url: https://images.pexels.com/photos/8436589/pexels-photo-8436589.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Slow, methodical practice focusing on proper posture in standing and
    seated poses. Build a strong foundation with clear alignment cues.
  instructor_name: James Carter
  instructor_bio: Head coach with over a decade of experience helping members of every
    level train smarter, move better, and stay consistent.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/6/68/Alec_Penix.jpg
- name: Breathing & Balance
  image_url: https://images.pexels.com/photos/8436587/pexels-photo-8436587.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Pranayama work paired with balance poses to build stability and calm.
    Learn foundational breathing techniques while strengthening focus.
  instructor_name: Sarah Mitchell
  instructor_bio: Performance coach focused on building strength, mobility, and confidence
    through approachable, well-structured sessions.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/8/8b/Athlete_portrait_Marianna_Gillespie.jpg
- name: Gentle Backbends & Openness
  image_url: https://images.pexels.com/photos/8436426/pexels-photo-8436426.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Careful, supported backbends and gentle heart openers with long holds.
    Open up safely and build mobility in your spine and shoulders.
  instructor_name: Daniel Brooks
  instructor_bio: Certified instructor who breaks every movement down step by step
    so newcomers and regulars alike feel supported.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/e/e3/Branden_Loera_Headshot.jpg
- name: Restorative & Wind Down
  image_url: https://images.pexels.com/photos/8436605/pexels-photo-8436605.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Slower, supported practice with longer holds and gentle movements for
    deep relaxation. Wind down and ease tension from your day.
  instructor_name: Maya Bennett
  instructor_bio: Coach passionate about creating an inclusive, high-energy room where
    members from all backgrounds can thrive.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/2/2e/Torrie_Lewis_for_Signet_Packaging%2C_headshot.jpg
