gym_id: reformer_classical
gym_type:
- reformer_classical
theme: ReformerClassical
videos:
  specification:
    short_videos_desc: 'Classical reformer pilates in the Romana lineage — the traditional
      order, apparatus and breath taught faithfully, from footwork and the hundred
      through the full system — plus the enjoyable side: instructor vlogs and "day
      in the life", studio behind-the-scenes, what a classical class is really like,
      aesthetic class edits, and teacher interviews on the method.'
    short_avoid_desc: No mat-only or generic ab routines mislabeled as reformer, "Club-Pilates
      style" contemporary flows passed off as classical, or "transform your body in
      X days" clickbait. Skip "reformer vs mat / classical vs contemporary which is
      better" framings and "pilates is useless/overrated" debate clips. (Fun vlogs,
      studio tours, class edits, and interviews are welcome.)
    videos_desc: |-
      # What we surface

      Classical reformer pilates in the Romana / Joseph Pilates lineage for
      members learning the method correctly and longtime students refining it
      — plus the fun, human side, so it's a feed members enjoy, not just a
      how-to library.

      ## Classical technique & instruction
      - The traditional exercise order on the wooden reformer: footwork, the
        hundred, frog, leg circles, stomach massage, short and long box,
        long stretch series, knee stretches
      - Spring settings, transitions, breath, and the precision that define
        the classical system
      - Full-length classical reformer classes and single-exercise technique
        breakdowns from senior classically-trained teachers
      - Credible studio coaching that honors the original work

      ## The fun & human side
      - Instructor vlogs and "day in the life" of a classical pilates teacher
      - Studio behind-the-scenes and "what a classical reformer class is
        really like"
      - Relatable pilates humour and class moments
      - Aesthetic class edits and before/after transformation stories
      - "30 days of reformer" journeys and senior-teacher interviews on the
        method and lineage
    avoid_desc: |-
      # What we avoid

      Anything not about classical reformer pilates; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Mat-only routines or generic "core / ab burner" workouts mislabeled
        as reformer
      - "Club Pilates / contemporary reformer" flows passed off as the
        classical order
      - At-home "reformer alternative" band improvisations sold as the real
        apparatus
      - Clickbait ("longer leaner legs in 7 days", "snatched in 2 weeks"),
        scams and misinformation
      - "Reformer vs mat / classical vs contemporary which is better"
        cross-style framings
      - "Pilates is useless/overrated" debate or reaction rage-bait

      ## Keep in mind
      A video is not rejected just for being short, a vlog, a clip, a class
      edit, a highlight, or entertaining — fun and creator content is wanted.
  queries:
  - classical reformer pilates full class
  - classical reformer footwork series tutorial
  - the hundred on the reformer classical
  - reformer short box series breakdown
  - reformer long box series technique
  - long stretch series reformer classical
  - reformer stomach massage exercise tutorial
  - reformer leg circles and frog classical
  - classical reformer spring settings explained
  - beginner classical reformer pilates class
  - reformer pilates common mistakes and corrections
  - day in the life of a classical pilates teacher
  - what a classical reformer class is really like
  - classical pilates studio behind the scenes
  - 30 days of classical reformer transformation
  - relatable pilates class moments funny
  - aesthetic classical reformer class edit
  - classical pilates teacher interview on the method
  - senior classical pilates teacher reformer demo
  - joseph pilates original reformer work explained
