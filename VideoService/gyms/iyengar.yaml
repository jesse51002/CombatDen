gym_id: iyengar
gym_type:
- iyengar
theme: IyengarStudio
videos:
  specification:
    short_videos_desc: 'Iyengar-method instruction focused on precise alignment and
      prop use — blocks, straps, ropes, bolsters and blankets, exact pose setup, and
      therapeutic sequencing — plus the human side: teacher vlogs, studio and prop-room
      behind-the-scenes, relatable class humour, and teacher interviews. Detailed,
      craft-respecting teaching for all levels.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "yoga for weight
      loss / flat abs" videos, gear/leggings hauls and product shilling, and "yoga
      vs pilates" or "yoga is useless/dangerous" debate clips.
    videos_desc: |-
      # What we surface

      Iyengar-method instruction for members from beginners drawn by safety and
      clear teaching to long-time students chasing precision or managing
      injuries — plus the human side of the practice, so it's something members
      enjoy scrolling, not just a how-to library.

      ## Method & instruction
      - Exact alignment of standing, seated, and inverted poses
      - How to use blocks, straps, the rope wall, bolsters, chairs and blankets
        to set up a posture correctly
      - The methodical sequenced approach the method is known for
      - Prop-supported and restorative variations
      - Alignment breakdowns of key asanas (Trikonasana, Sirsasana, Sarvangasana)
      - Therapeutic sequences for back, neck and shoulders

      ## The human side
      - Teacher and practitioner vlogs and "day in the life of an Iyengar teacher"
      - Studio and prop-room behind-the-scenes
      - Relatable yoga humour and class moments
      - Aesthetic prop-practice edits
      - Teacher interviews on the method
      - Practice-journey transformation stories

      Precise, craft-respecting tone throughout — yoga taught with surgical
      attention to detail.
    avoid_desc: |-
      # What we avoid

      Anything not about Iyengar-method yoga; off-topic, genuinely low-quality,
      or clickbait videos.

      ## Reject
      - Calorie-burn "yoga for weight loss / flat abs in X days" promises
      - Heavy chanted-Sanskrit devotional sermons sold as the main point
      - Gear/leggings hauls and product shilling
      - "Yoga vs pilates / which is better" or "yoga is useless/dangerous"
        debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a highlight, or
      entertaining — fun and creator content is wanted.
