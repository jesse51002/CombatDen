gym_id: meditation
gym_type:
- meditation
theme: MeditationStudio
videos:
  specification:
    short_videos_desc: 'Guided meditation sessions and clear, secular instruction
      — breath awareness, body scans, mindfulness and focus techniques, plus sleep,
      anxiety and stress sessions — plus the human side: practitioner vlogs and "day
      in the life", retreat and studio behind-the-scenes, "what a sit is really like",
      first-time reactions, and "I meditated for 30 days" stories. Calm and unhurried.'
    short_avoid_desc: No guru/manifestation "raise your vibration" content, miracle-cure
      claims, or "meditation rewires your brain in 7 days" clickbait. Nothing off-topic,
      supplement promos, or "meditation is useless / a scam" debate videos.
    videos_desc: |-
      # What we surface

      Guided meditation and mindfulness content for members from total
      first-timers to seasoned sitters — plus the fun, human side, so it's
      a feed members enjoy, not just a how-to library.

      ## Guided sessions & technique
      - Followable guided sessions: breath awareness, body scan,
        loving-kindness, noting
      - Clear technique explainers on posture, attention, and working
        with a busy mind
      - Targeted sessions for sleep, anxiety, stress, and focus
      - Short morning and midday resets

      ## The fun & human side
      - Practitioner vlogs and "day in the life" of a meditation teacher
      - Meditation retreat and studio behind-the-scenes
      - "What a silent retreat is really like" and relatable beginner
        experiences and first-time reactions
      - Calming aesthetic and ambiance edits
      - "I meditated every day for 30 days" experience stories
      - Calm interviews from established secular meditation teachers
    avoid_desc: |-
      # What we avoid

      Anything not about meditation or mindfulness; off-topic, low-quality,
      or clickbait videos.

      ## Reject
      - Guru/new-age "manifest / raise your vibration / 777 frequency"
        content
      - Religious or devotional sermons presented as the main point
      - Miracle-cure or pseudoscience claims ("meditation cures depression /
        disease", "rewire your brain in 7 days")
      - Clickbait ("this one trick changes everything")
      - Sleep-aid or supplement promos
      - "Meditation vs therapy / which is better" or "meditation is useless /
        a scam" debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, short, a clip, a highlight,
      or entertaining — fun and human content is wanted.
