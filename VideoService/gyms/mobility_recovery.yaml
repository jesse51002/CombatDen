gym_id: mobility_recovery
gym_type:
- mobility_recovery
theme: MobilityRecovery
videos:
  specification:
    short_videos_desc: 'Joint mobility, foam rolling, and prehab/rehab-style routines
      plus active recovery — hips, shoulders, ankles, thoracic spine, and soft-tissue
      work for athletes and lifters — plus the human side: athlete recovery-day vlogs
      and "day in the life", "I did mobility every day for 30 days" stories, first-time
      reactions, behind-the-scenes, and progress transformations. Credible coaching.'
    short_avoid_desc: No "fix any pain instantly / one stretch cures sciatica" miracle
      claims or supplement/recovery-gadget promos. Nothing off-topic, no gym-bro hype,
      or "mobility work is a waste of time" debate.
    videos_desc: |-
      # What we surface

      Mobility, soft-tissue, and recovery content for athlete-coded members —
      runners, lifters, jiu-jitsu players, cyclists — who train hard and want
      to stay healthy enough to keep training, plus the fun and human side so
      it's a feed members enjoy, not just a how-to library.

      ## Technique & follow-along sessions
      - Follow-along joint mobility and banded mobility drills (hips, shoulders,
        ankles, thoracic spine, wrists)
      - Foam-rolling and lacrosse-ball soft-tissue routines
      - Prehab and rehab-style strengthening for common problem areas (knees,
        low back, rotator cuff)
      - Active-recovery sessions and warm-up/cool-down routines

      ## The fun & human side
      - Athlete recovery-day vlogs and "day in the life"
      - "What a recovery session is really like" honest walkthroughs
      - Relatable first-time foam-roll and mobility reactions
      - Physio and coach behind-the-scenes
      - "I did mobility every day for 30 days" experience stories
      - Mobility-progress transformations
      - Coach or physio-informed interviews
    avoid_desc: |-
      # What we avoid

      Anything not about mobility, recovery, or soft-tissue work; off-topic,
      low-quality, or clickbait videos.

      ## Reject
      - Miracle-cure and pseudoscience claims ("fix any pain instantly", "one
        stretch cures sciatica / herniated disc", "this realigns your spine")
      - Recovery-gadget, supplement, or massage-gun haul promos dressed up as
        instruction
      - Gym-bro hype ("crush your mobility")
      - "Mobility vs stretching / which is better" cross-discipline framings
      - "Mobility work is useless / a waste of time" debate or reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, short, a clip, a highlight, or
      entertaining — fun and human content is wanted.
