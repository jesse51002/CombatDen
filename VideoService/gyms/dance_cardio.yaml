gym_id: dance_cardio
gym_type:
- dance_cardio
theme: DanceCardio
videos:
  specification:
    short_videos_desc: 'High-energy dance cardio classes staged like a night out —
      full follow-along choreographed sweat sessions, move and combo breakdowns, plus
      the fun side: "what a dance cardio class is really like", studio vlogs and behind-the-scenes,
      instructor vibes and playlists, funny class moments, and transformation stories.'
    short_avoid_desc: Off-topic, clickbait "burn 1000 calories dancing" gimmicks,
      and "dance cardio vs Zumba / dance vs running which is better" or "is dance
      cardio a real workout" debate clips.
    videos_desc: |-
      # What we surface

      Dance cardio content for people who want a real workout dressed as a
      night out — and the fun, human side of the studio, so it's a feed
      members enjoy, not just a how-to library.

      ## Classes & choreography
      - Full follow-along choreographed cardio classes you can sweat through:
        cardio dance, hip-hop and pop routines, dance HIIT and toning combos
      - Step-by-step move and combination breakdowns so beginners can pick up
        the choreography

      ## The fun & human side
      - "What a dance cardio class is really like"
      - Studio vlogs and behind-the-scenes
      - Club-staged playlist and themed/artist routines
      - Instructor vibes and high-energy 305-style sets
      - Relatable class humour, transformation stories, and instructor
        interviews

      For people who hate the treadmill but will move for an hour if the music
      is right.
    avoid_desc: |-
      # What we avoid

      Anything not about dance cardio as a workout; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Competitive or technical dance training that isn't a cardio workout
        (ballet, recital choreography, dance-team routines)
      - Calorie-bait "burn 1000 calories dancing / melt fat fast" gimmick
        titles
      - "Dance cardio vs Zumba / dance vs running which is better"
        cross-discipline framings
      - "Is dance cardio a real workout / dancing won't get you fit" debate or
        reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
  queries:
  - dance cardio full workout follow along
  - hip hop dance cardio class beginners
  - 30 minute dance cardio workout at home
  - pop song dance cardio routine follow along
  - dance cardio moves and combos breakdown tutorial
  - beginner dance cardio class easy choreography
  - dance HIIT cardio workout
  - learn dance cardio choreography step by step
  - latin dance cardio workout follow along
  - low impact dance cardio class beginners
  - what a dance cardio class is really like
  - club themed dance cardio playlist workout
  - 305 style dance cardio class
  - dance cardio studio behind the scenes
  - funny dance cardio class moments
  - dance cardio transformation story
  - star dance cardio instructor full class
  - dance cardio instructor interview on coaching
  - day in the life dance cardio instructor
  - my first dance cardio class vlog
