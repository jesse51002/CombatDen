gym_id: group_pt
gym_type:
- group_pt
theme: GroupPT
videos:
  specification:
    short_videos_desc: 'Small-group personal training content — structured strength
      and conditioning follow-alongs, foundational lift and movement technique, and
      how semi-private coaching and individualised programming work, from credible
      coaches — plus the fun side: "what a small-group session is really like" vlogs,
      member transformation stories, community and PR moments, and coach interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      clips, sketchy supplement promos, or "personal training is a waste of money
      / group vs 1:1" debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Format, technique, and follow-along content for a small-group personal
      training studio — plus the fun, human side, so it's a feed members enjoy,
      not just a how-to library. Individualised, attentive, programmed
      small-group tone throughout.

      ## Format, technique & coaching
      - Structured full-body strength and conditioning workouts you can follow
        along with
      - Technique breakdowns for the foundational movements a coach programs:
        squat, hinge, press, row, lunge, carry, plus dumbbell, kettlebell and
        bodyweight work
      - Assessment and individualised-programming explainers
      - Progression and accountability coaching for four-to-six-person groups,
        from credible coaches

      ## The fun & human side
      - "What a small-group session is really like" walkthroughs
      - Member transformation and progress stories
      - Community and PR-celebration moments
      - Funny session clips
      - "A day in the life of a coach" vlogs and coach interviews
    avoid_desc: |-
      # What we avoid

      Anything not about group / personal-training-style strength and
      conditioning; off-topic, genuinely low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "Group training vs 1-on-1 / big-box gym" cross-discipline debate and
        reaction videos
      - "Is personal training a waste of money / a scam" anti-discipline debate
        and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
  queries:
  - small group personal training workout follow along
  - full body strength workout follow along
  - squat hinge press row technique breakdown
  - dumbbell full body workout follow along
  - how individualised programming works personal training
  - movement assessment for personal training clients
  - progressive strength program for beginners
  - foundational lifts technique for beginners
  - common lifting technique mistakes and fixes
  - small group training format explained
  - what a small group pt session is really like
  - my first personal training session vlog
  - group pt member transformation story
  - personal training studio community moments
  - pr celebration small group clips
  - funny group training moments
  - day in the life personal trainer vlog
  - personal trainer interview on programming
  - small group fitness coach interview
  - strength training motivation montage
