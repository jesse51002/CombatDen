gym_id: orangetheory
gym_type:
- orangetheory
theme: OrangeTheoryStyle
videos:
  specification:
    short_videos_desc: 'Heart-rate-zone HIIT content — treadmill, rower, and floor
      follow-alongs, zone-training and base/push/all-out explainers, and technique
      for the movements that recur in the format, from credible coaches — plus the
      fun side: "what an OTF-style class is really like" vlogs, member first-class
      and transformation stories, behind-the-scenes, and community and coach interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      clips, sketchy supplement promos, or "Orangetheory is a scam / OTF vs F45" debate
      videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Format, technique, and follow-along content for a zone-based HIIT studio
      in the Orangetheory-style mould — plus the fun, human side, so it's a
      feed members enjoy, not just a how-to library.

      ## Zone training & technique
      - Heart-rate-zone training explained (base, push, all-out, and time-in-zone)
      - Treadmill pacing and incline interval workouts you can follow along
      - Rowing technique, pacing, and common-mistake fixes
      - Floor-block strength and dumbbell technique
      - Warm-up and recovery content from credible coaches

      ## The fun & human side
      - "What an OTF-style class is really like" walkthroughs
      - Member first-class and transformation stories
      - Studio behind-the-scenes and community moments
      - Funny workout moments on treadmill and rower
      - Coach interviews — leaning on independent creator content rather than
        copyrighted branded class footage
    avoid_desc: |-
      # What we avoid

      Anything not about zone-based HIIT / interval cardio training; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "Orangetheory vs F45 / CrossFit" and "is Orangetheory worth it / OTF is
        a scam / overrated" cross-discipline or anti-discipline debate and
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or entertaining
      — fun content is wanted.
  queries:
  - heart rate zone training explained for hiit
  - base push all out interval workout explained
  - treadmill interval workout follow along
  - rowing technique and pacing tutorial
  - floor block dumbbell strength workout follow along
  - how to use heart rate zones to train harder
  - 30 minute treadmill and floor hiit follow along
  - time in zone training for fat loss explained
  - rowing machine common mistakes and fixes
  - full body hiit and cardio circuit follow along
  - what an orangetheory style class is really like
  - my first orangetheory class experience vlog
  - orangetheory transformation story
  - zone hiit studio behind the scenes
  - funny treadmill and rower workout moments
  - hiit studio community fitness motivation
  - day in the life group fitness coach
  - hiit coach interview on zone training
  - heart rate hiit workout day in the life vlog
  - zone training hiit motivation
