theme: TreadStrength
videos:
  specification:
    short_videos_desc: 'Tread-and-strength hybrid classes that trade between the treadmill
      and the weight floor — follow-along run intervals paired with dumbbell strength
      blocks, plus the fun side: "what a Barry''s-style class is really like", studio
      vlogs and behind-the-scenes, instructor vibes and playlists, funny class moments,
      and transformation stories.'
    short_avoid_desc: Off-topic, clickbait "get shredded in 7 days" gimmicks, and
      "running vs lifting / cardio vs weights which is better" or "cardio kills your
      gains" debate clips.
    videos_desc: |-
      # What we surface

      Tread-plus-strength hybrid content for members who want cardio and
      lifting in one charged room — plus the fun, human side, so it's a
      feed members enjoy, not just a how-to library.

      ## Tread & strength technique
      - Follow-along classes trading between treadmill run intervals (tempo,
        push paces, sprints, incline) and floor strength blocks
      - Dumbbell, bench, and bodyweight work for push, pull, legs, and core
      - Running form and pace selection on the tread
      - Clean lifting technique for the weight side
      - How the half-and-half format is structured, fast transitions, and
        how to scale both halves

      ## The fun & human side
      - "What a Barry's-style tread-and-lift class is really like"
      - Studio vlogs and behind-the-scenes
      - Instructor vibes and playlists
      - Relatable class humour and funny moments
      - Transformation stories and coach interviews — the charged,
        red-room energy members come for
    avoid_desc: |-
      # What we avoid

      Anything not about tread-plus-strength training; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-bait "burn 1000 calories / shred fat fast" gimmick titles
      - "Running vs lifting / cardio vs weights which is better"
        cross-discipline framings
      - "Cardio kills your gains / running makes you lose muscle" debate
        or reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
