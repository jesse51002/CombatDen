classes:
- name: Ramp Up
  image_url: https://images.pexels.com/photos/4662333/pexels-photo-4662333.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Master the fundamentals of station-based training. Learn proper form
    on core movements like kettlebell swings and dumbbell circuits in this beginner-friendly
    class designed to build confidence and endurance.
  instructor_name: James Carter
  instructor_bio: Head coach with over a decade of experience helping members of every
    level train smarter, move better, and stay consistent.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/6/68/Alec_Penix.jpg
- name: The Circuit
  image_url: https://images.pexels.com/photos/9958667/pexels-photo-9958667.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Experience the full F45 workout - 45 minutes of team-circuit intensity
    with timed station rotations. Combines power, cardio, and strength in a fast-paced
    group setting that pushes you to your limit.
  instructor_name: Sarah Mitchell
  instructor_bio: Performance coach focused on building strength, mobility, and confidence
    through approachable, well-structured sessions.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/8/8b/Athlete_portrait_Marianna_Gillespie.jpg
- name: Peak Performance
  image_url: https://images.pexels.com/photos/4720230/pexels-photo-4720230.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Advanced metabolic conditioning for the experienced athlete. High-rep
    circuits, battle ropes, sled work, and explosive movements that test your limits
    and unlock peak performance in a group team environment.
  instructor_name: Daniel Brooks
  instructor_bio: Certified instructor who breaks every movement down step by step
    so newcomers and regulars alike feel supported.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/e/e3/Branden_Loera_Headshot.jpg
- name: Recovery & Mobility
  image_url: https://images.pexels.com/photos/8381747/pexels-photo-8381747.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Active recovery through functional mobility and light circuit work.
    Restore your body between intense sessions with guided stretching, breathing,
    and low-impact movements that enhance overall performance.
  instructor_name: Maya Bennett
  instructor_bio: Coach passionate about creating an inclusive, high-energy room where
    members from all backgrounds can thrive.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/2/2e/Torrie_Lewis_for_Signet_Packaging%2C_headshot.jpg
