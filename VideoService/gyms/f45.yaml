gym_id: f45
gym_type:
- f45
theme: F45Indie
videos:
  specification:
    short_videos_desc: 'F45-style team-circuit content — station-based HIIT follow-alongs,
      exercise technique for circuit movements, and how to run and prep for 45-minute
      timed-station workouts from credible coaches — plus the fun side: "what an F45-style
      class is really like" vlogs, member first-class and transformation stories,
      behind-the-scenes, and community and coach interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      clips, sketchy supplement promos, or "F45 is a scam / F45 vs CrossFit" debate
      videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Format, technique, and follow-along content for an F45-style
      team-circuit studio — plus the fun, human side, so it's a feed members
      enjoy, not just a how-to library. Modern, programmed, station-to-station
      tone throughout.

      ## Format & technique
      - 45-minute station-based HIIT and functional circuits you can do at home
      - Technique breakdowns for the movements that recur on the floor:
        kettlebell swings, dumbbell work, rowing, sled, box jumps, sled pushes,
        battle ropes, bodyweight conditioning
      - Interval-timer and station-rotation formats
      - Warm-up, mobility, and prep that serve the circuit, from credible
        coaches

      ## The fun & human side
      - "What an F45-style class is really like" walkthroughs
      - Member first-class and transformation stories
      - Studio behind-the-scenes and community moments
      - Funny workout moments and coach interviews
      - Leaning on independent creator content rather than copyrighted branded
        class footage
    avoid_desc: |-
      # What we avoid

      Anything not about HIIT / functional circuit training; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "F45 vs CrossFit / Orangetheory" and "is F45 worth it / F45 is a scam /
        overpriced" cross-discipline or anti-discipline debate and reaction
        videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
