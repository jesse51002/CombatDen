gym_id: trx_suspension
gym_type:
- trx_suspension
theme: TRXSuspension
videos:
  specification:
    short_videos_desc: 'TRX / suspension-trainer technique and follow-along content
      — rows, presses, planks, single-leg and core work, angle and progression coaching,
      and full follow-along workouts from credible instructors — plus the enjoyable
      side: "what a TRX class is really like" walkthroughs, studio behind-the-scenes,
      member progress stories, aesthetic workout edits, and instructor interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-rep / fake-PR clips,
      sketchy supplement promos, or "TRX is useless / suspension vs weights" debate
      videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Technique, class, and progression content for a TRX / suspension-training
      studio — plus the fun, human side, so it's a feed members enjoy, not just
      a how-to library.

      ## Technique & training
      - Exercise breakdowns for suspension-trainer movements: rows, chest and
        shoulder presses, single-leg squats and lunges, hamstring curls, planks,
        pikes, and rotational core work
      - How to set the anchor, adjust body angle, and use stability to scale
        difficulty
      - Full follow-along low-impact strength and conditioning workouts from
        credible instructors
      - Mobility work and beginner-to-advanced progressions for members from
        rehab graduates to intermediate athletes

      ## The fun & human side
      - "What a TRX class is really like" walkthroughs and first-class experiences
      - Studio behind-the-scenes and community moments
      - Member progress and comeback stories
      - Aesthetic workout edits
      - Instructor interviews
    avoid_desc: |-
      # What we avoid

      Anything not about TRX / suspension training; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-rep and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "TRX vs weights / resistance bands" and "is TRX useless / suspension
        training is a waste" cross-discipline or anti-discipline debate and
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or entertaining
      — fun content is wanted.
  queries:
  - trx row technique tutorial
  - trx chest press technique
  - trx exercises for beginners full guide
  - trx single leg squat technique
  - trx plank and pike core exercises
  - trx full body workout follow along
  - how to adjust trx difficulty body angle
  - trx anchor setup and safety
  - trx core workout follow along
  - trx common mistakes and fixes
  - what a trx class is really like
  - my first trx class experience vlog
  - trx studio behind the scenes
  - trx member progress transformation story
  - aesthetic trx workout edit
  - trx full body workout follow along 20 minutes
  - trx low impact comeback after injury story
  - suspension training community studio moments
  - suspension training coach interview technique
  - trx workout motivation follow along
