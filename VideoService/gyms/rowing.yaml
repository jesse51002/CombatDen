gym_id: rowing
gym_type:
- rowing
theme: RowingStudio
videos:
  specification:
    short_videos_desc: 'Indoor rowing technique and follow-along erg workouts — the
      stroke, catch, drive and recovery broken down on the Concept2, plus the fun
      side: 2k race highlights, "what an erg class is really like", studio behind-the-scenes,
      relatable rowing humour, funny moments, transformation stories, and coach interviews.'
    short_avoid_desc: Off-topic, clickbait "burn 1000 calories rowing" gimmicks, and
      "rowing vs running / erg vs treadmill which is better" or "is the rowing machine
      useless" debate clips.
    videos_desc: |-
      # What we surface

      Technique, class, and follow-along content for indoor rowing members —
      plus the fun, human side, so it's a feed members enjoy, not just a
      how-to library.

      ## Technique & training
      - The rowing stroke broken down on the Concept2 / erg: catch, drive,
        finish, recovery, sequencing and timing
      - Common-fault fixes, and how to set the damper, read your splits,
        and pace by stroke rate
      - Follow-along erg workouts and interval classes: steady pieces,
        pyramids, intervals, and benchmark distances like 2k and 5k
      - Beginner first-row walkthroughs and rowing-specific conditioning

      ## The fun & human side
      - 2k race and erg-sprint event highlights
      - "What an erg class is really like" and studio behind-the-scenes
      - Relatable rowing humour and class moments, funny clips
      - One-year-on-the-erg transformation stories
      - Coach interviews
    avoid_desc: |-
      # What we avoid

      Anything not about indoor rowing; off-topic, genuinely low-quality,
      or clickbait videos.

      ## Reject
      - On-the-water sweep / sculling boat-rowing content (this is an erg
        studio, not open water)
      - Calorie-bait "burn 1000 calories rowing / melt fat fast" gimmick
        titles
      - "Rowing vs running / erg vs treadmill which is better"
        cross-discipline framings
      - "Is the rowing machine useless / rowing wrecks your back" debate
        or reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
  queries:
  - indoor rowing technique for beginners Concept2
  - rowing stroke catch drive finish recovery breakdown
  - common rowing machine mistakes and fixes
  - how to set the damper on a rowing machine
  - how to read splits on a Concept2 monitor
  - stroke rate and pacing rowing explained
  - 20 minute indoor rowing workout follow along
  - rowing interval workout pyramids erg
  - 2k row strategy and pacing tutorial
  - beginner first indoor rowing class what to expect
  - 2k erg race highlights
  - what an erg rowing class is really like
  - indoor rowing studio behind the scenes
  - funny indoor rowing moments
  - relatable rowing machine class moments
  - indoor rowing race event highlights
  - rowing coach interview on stroke technique
  - day in the life indoor rowing coach
  - my first rowing class vlog
  - one year of indoor rowing transformation
