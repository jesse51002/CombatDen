gym_type:
- pilates_sculpt
theme: PilatesSculpt
videos:
  specification:
    short_videos_desc: 'Pilates sculpt — pilates work stacked with hand-weight strength
      sets, so the method''s precision and the dumbbell''s load build long-and-strong
      together — plus the enjoyable side: instructor vlogs and "day in the life",
      studio behind-the-scenes, what a sculpt class is really like, aesthetic class
      edits, transformations, and interviews.'
    short_avoid_desc: No plain pilates with no weights or pure bodybuilding/HIIT-with-dumbbells
      mislabeled as pilates sculpt, and no "toned arms in X days" clickbait. Skip
      "pilates vs weights" framings and "pilates does nothing / is a waste" debate
      clips. (Fun vlogs, studio tours, class edits, and interviews are welcome.)
    videos_desc: |-
      # What we surface

      Pilates sculpt instruction for members who want pilates with real load on
      top — sessions that stack precision with hand-weight strength so the two
      build a body that is both long and strong.

      ## Technique & classes
      - Pilates side: mat and reformer core, glute and leg series, controlled
        tempo and breath
      - Dumbbell sculpt work: weighted arm series, shoulder and bicep/tricep
        sets, weighted squats and lunges, pulses
      - How to sequence the two so they stack instead of fight
      - Full-length follow-along pilates sculpt classes, weighted-pilates
        technique breakdowns, and weight-selection guidance from credible
        instructors

      ## The fun & human side
      - Instructor vlogs and "day in the life"
      - Studio behind-the-scenes
      - "What a pilates sculpt class is really like"
      - Relatable pilates humour and class moments
      - Aesthetic class edits
      - Before/after and "30 days of pilates sculpt" transformation stories
      - Teacher interviews
    avoid_desc: |-
      # What we avoid

      Anything not about pilates sculpt; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Plain pilates classes with no weights at all
      - Pure bodybuilding / "dumbbell HIIT / metcon" workouts with no pilates
        principles mislabeled as pilates sculpt, and heavy-powerlifting or
        hypertrophy programming
      - Clickbait ("toned arms in 7 days", "snatched in 2 weeks"), scams, and
        misinformation
      - "Pilates vs weightlifting / which is better" cross-discipline framings
      - "Pilates does nothing / is a waste" debate or reaction rage-bait

      ## Keep in mind
      A video is NOT rejected just for being short, a vlog, a clip, a class
      edit, or entertaining — fun and creator content is wanted.
