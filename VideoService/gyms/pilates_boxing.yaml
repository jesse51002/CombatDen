theme: PilatesBoxing
videos:
  specification:
    short_videos_desc: 'Pilates boxing — reformer/mat pilates spliced with non-contact
      boxing rounds: controlled pilates sets alternating with footwork, combinations
      and bag/shadow work — plus the enjoyable side: instructor vlogs and "day in
      the life", studio behind-the-scenes, what a class is really like, aesthetic
      class edits, transformations, and interviews.'
    short_avoid_desc: No plain pilates with no boxing, no contact sparring or pro/amateur
      fight footage (this is non-contact), and no "fighter abs in X days" clickbait.
      Skip "pilates vs boxing" framings and "pilates is useless / boxing cardio is
      fake" debate clips. (Fun vlogs, studio tours, class edits, and interviews are
      welcome.)
    videos_desc: |-
      # What we surface

      Technique, class, and crossover content for members who want pilates
      with a sharper edge — plus the fun, human side, so it's a feed members
      enjoy, not just a how-to library.

      ## Pilates boxing technique & classes
      - Reformer and mat pilates work: core, glute and leg series, controlled
        tempo, breath and posture
      - Non-contact boxing rounds: stance and footwork, jab-cross-hook-uppercut
        combinations, slips and rolls, shadow boxing and heavy-bag work
      - How the two halves connect — hips, breath, and posture as shared
        foundations
      - Follow-along boxing-pilates conditioning rounds and pilates technique
        that supports the boxing
      - How to structure a session that alternates the carriage and the gloves
      - Full-length follow-along crossover classes and technique breakdowns
        from credible coaches

      ## The fun & human side
      - Instructor vlogs and "day in the life" of a pilates boxing coach
      - Studio behind-the-scenes and "what a pilates boxing class is really like"
      - Relatable class humour and moments
      - Aesthetic bag-and-carriage class edits
      - Before/after and "30 days of pilates boxing" transformation stories
      - Instructor interviews on the crossover between pilates and boxing
    avoid_desc: |-
      # What we avoid

      Anything not about pilates boxing; off-topic, genuinely low-quality,
      or clickbait videos.

      ## Reject
      - Plain pilates classes with no boxing element
      - Contact sparring, amateur/pro fight footage, and street-fight /
        self-defense "one punch knockout" fantasy
      - Generic "boxing HIIT / metcon" workouts with no pilates principles
        mislabeled as pilates boxing
      - Clickbait ("fighter abs in 7 days", "snatched in 2 weeks"), scams,
        and misinformation
      - "Pilates vs boxing / which is better" cross-discipline framings
      - "Pilates is useless / boxing cardio is fake" debate or reaction rage-bait

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, class edit, or
      entertaining — fun and creator content is wanted.
