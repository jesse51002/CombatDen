gym_id: kettlebell
gym_type:
- kettlebell
theme: Kettlebell
videos:
  specification:
    short_videos_desc: 'Hardstyle kettlebell technique and follow-along content —
      swings, get-ups, cleans, presses, snatches and flows in the StrongFirst / RKC
      tradition, plus credible programming from established instructors — and the
      fun side: satisfying kettlebell flow edits, sport/competition lifting, cert-journey
      and PR clips, athlete showcases, and instructor interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      fail clips, sketchy supplement promos, or "kettlebells are useless / kettlebell
      vs barbell" debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Technique, class, and programming content for kettlebell members in the
      hardstyle StrongFirst / RKC tradition — plus the fun, human side, so it's
      a feed members enjoy, not just a how-to library. Craft-minded, one-bell,
      technique-first tone throughout.

      ## Technique & programming
      - Deep breakdowns of the core patterns: the swing, the Turkish get-up,
        the clean, the military press, the snatch, the front squat
      - Flows and complexes
      - Breathing and bracing
      - Single-bell and double-bell work
      - Full follow-along workouts and programming from certified instructors

      ## The fun & human side
      - Satisfying kettlebell flow and complex edits
      - Kettlebell-sport and competition lifting
      - Certification-journey and snatch/press-test stories
      - PR-celebration clips
      - Athlete and instructor showcases, and interviews
      - Training motivation montages
    avoid_desc: |-
      # What we avoid

      Anything not about kettlebell training; off-topic, genuinely low-quality,
      or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid / SARMs promos
      - "Kettlebell vs barbell / dumbbell" and "are kettlebells useless /
        kettlebell swings are dangerous" cross-discipline or anti-discipline
        debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
  queries:
  - kettlebell swing technique hardstyle tutorial
  - turkish get up step by step tutorial
  - kettlebell military press technique
  - kettlebell snatch technique tutorial
  - kettlebell flow and complex follow along
  - double kettlebell workout follow along
  - kettlebell swing common mistakes and fixes
  - strongfirst kettlebell programming explained
  - simple and sinister kettlebell routine follow along
  - kettlebell workout for beginners full session
  - satisfying kettlebell flow edit
  - kettlebell sport competition lifting highlights
  - strongfirst certification journey story
  - kettlebell snatch test pr celebration clip
  - kettlebell athlete skill showcase
  - funny kettlebell gym moments
  - kettlebell a day of training vlog
  - kettlebell instructor interview on technique
  - kettlebell athlete interview training
  - kettlebell training motivation montage
