gym_id: no_gi_grappling
gym_type:
- no_gi_grappling
theme: FrictionGrappling
videos:
  specification:
    short_videos_desc: 'No-gi submission grappling technique and drilling — wrestling,
      scrambles, guard, leg locks, and back attacks from credible coaches — plus the
      fun side: ADCC-style competition highlights, leg-lock finish reels, gym vlogs,
      funny scramble moments, and grappler interviews.'
    short_avoid_desc: Off-topic, clickbait, gi-only content, "submission grappling
      in a street fight" fantasy, "comp-ready fast" promises, ego smash-room footage,
      and "no-gi vs gi / which is better" debate clips.
    videos_desc: |-
      # What we surface

      Technique, class, and study content for no-gi submission grappling
      members — plus the fun, human side, so it's a feed members enjoy,
      not just a how-to library.

      ## Technique & training
      - Wrestling and takedowns, scrambles and transitions
      - No-gi guard: single leg X, butterfly, half guard
      - Guard passing, back control, and positional drilling
      - The modern leg-lock game: heel hooks, ashi garami,
        entries and finishes
      - Follow-along drilling, positional rounds, and grappling
        conditioning from credible coaches

      ## The fun & human side
      - ADCC-style and EBI/submission-only competition match
        breakdowns and highlights
      - Leg-lock and submission finish reels
      - Gym vlogs and "a day on the mats", comp-prep behind-the-scenes
      - Funny scramble and rolling moments, first-tournament stories
      - Pro-grappler and coach interviews
    avoid_desc: |-
      # What we avoid

      Anything not about no-gi grappling; off-topic, genuinely low-quality,
      or clickbait videos.

      ## Reject
      - Gi-only and traditional-dojo content (this is the no-gi club)
      - Street-fight / self-defense fantasy ("one submission to end any
        fight", "deadliest choke")
      - McDojo-style "get comp-ready fast / go pro quick" promises
      - Ego-driven smash-everybody or backyard-roll footage
      - "No-gi vs gi / which is better", "is grappling useless in a real
        fight", and similar cross-discipline or anti-grappling debate
        and reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
  queries:
  - no gi grappling fundamentals for beginners
  - wrestling takedowns for no gi grappling
  - no gi guard passing technique
  - leg lock entries for beginners no gi
  - heel hook finishing mechanics tutorial
  - ashi garami and saddle position breakdown
  - no gi back take and rear naked choke
  - single leg x guard sweeps no gi
  - no gi guillotine and front headlock series
  - body lock passing no gi tutorial
  - adcc match breakdown analysis
  - submission only grappling highlights
  - best no gi leg lock finishes reel
  - a day at the grappling gym vlog
  - funny no gi rolling and scramble moments
  - grappler first submission only tournament story
  - pro grappler comp prep behind the scenes
  - pro grappler day in the life no gi
  - submission grappler interview on the game
  - no gi grappling coach interview on the modern meta
