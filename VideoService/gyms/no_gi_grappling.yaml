classes:
- name: Leg Lock Mastery
  image_url: https://images.pexels.com/photos/8612009/pexels-photo-8612009.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Deep dive into heel hooks, ashi garami, and modern leg-lock progressions.
    Learn entries, positioning, and finishing mechanics from fundamental to competition-ready.
  instructor_name: James Carter
  instructor_bio: Head coach with over a decade of experience helping members of every
    level train smarter, move better, and stay consistent.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/6/68/Alec_Penix.jpg
- name: Scramble & Transitions
  image_url: https://images.pexels.com/photos/29956727/pexels-photo-29956727.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Master explosive movement and weight distribution in scrambles and
    guard recovery. Build athleticism and timing for transitions between positions.
  instructor_name: Sarah Mitchell
  instructor_bio: Performance coach focused on building strength, mobility, and confidence
    through approachable, well-structured sessions.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/8/8b/Athlete_portrait_Marianna_Gillespie.jpg
- name: Guard Passing Drills
  image_url: https://images.pexels.com/photos/8612465/pexels-photo-8612465.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Systematic progressions for breaking guards and advancing position.
    Drill pressure mechanics, hand placement, and hip movement for safe, technical
    passing.
  instructor_name: Daniel Brooks
  instructor_bio: Certified instructor who breaks every movement down step by step
    so newcomers and regulars alike feel supported.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/e/e3/Branden_Loera_Headshot.jpg
- name: Back Control & Finishes
  image_url: https://images.pexels.com/photos/6765021/pexels-photo-6765021.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Achieve and maintain back control; explore hooks, seatbelt control,
