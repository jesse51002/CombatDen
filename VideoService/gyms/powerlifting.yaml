gym_id: powerlifting
gym_type:
- powerlifting
theme: Powerlifting
videos:
  specification:
    short_videos_desc: 'Powerlifting technique and programming — squat, bench, and
      deadlift breakdowns, cues, accessories, and meet-prep from credible coaches
      — plus the fun side: meet footage and big-total highlights, record attempts,
      PR clips, training vlogs, lifter interviews, and motivation montages.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      fail clips, sketchy supplement or steroid promos, or "powerlifting vs bodybuilding
      / is deadlifting bad for you" debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Technique, programming, and competition content for powerlifting gym
      members — plus the fun, human side, so it's a feed members enjoy, not
      just a how-to library.

      ## Technique & programming
      - Squat, bench press, and deadlift breakdowns: setup, bracing, bar path,
        cues, and sticking points
      - Conventional and sumo deadlift variations
      - Accessory and weak-point work
      - Programming, peaking, and meet-prep explainers from credible coaches

      ## The fun & human side of powerlifting
      - Meet footage, record attempts, and big-total highlights from federation
        platforms
      - PR-celebration clips
      - Training and "a day of lifting" vlogs
      - Funny gym moments
      - Lifter and coach interviews, and lifter profiles that celebrate the
        slow, patient work of adding weight to the bar
    avoid_desc: |-
      # What we avoid

      Anything not about powerlifting; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "Powerlifting vs bodybuilding / weightlifting" and "is deadlifting bad
        for your back / powerlifting will wreck your body" cross-discipline or
        anti-discipline debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
  queries:
  - squat technique breakdown for powerlifting
  - bench press technique tutorial powerlifting
  - deadlift technique conventional setup
  - sumo deadlift technique tutorial
  - low bar squat cues and setup
  - fixing squat sticking points
  - powerlifting program for beginners
  - how to peak for a powerlifting meet
  - bracing and breathing for heavy lifts
  - powerlifting meet day what to expect
  - all time world record squat bench deadlift
  - powerlifting meet biggest total highlights
  - powerlifting record attempt footage
  - powerlifting pr celebration clips
  - powerlifting training day in the life vlog
  - first powerlifting meet experience story
  - funny powerlifting gym moments
  - powerlifter interview training and meet prep
  - powerlifting coach interview on programming
  - powerlifting training motivation montage
