videos:
  specification:
    short_videos_desc: 'Lagree-method Megaformer training — slow, controlled, high-intensity
      tempo under heavy spring load, with the signature moves and time-under-tension
      that define the burn — plus the enjoyable side: instructor vlogs and "day in
      the life", studio behind-the-scenes, what a Megaformer class is really like,
      the relatable shake, aesthetic class edits, transformations, and interviews.'
    short_avoid_desc: No classical/contemporary reformer pilates mislabeled as Lagree,
      fast bouncy reps that break the slow controlled tempo, or "shred fat in X days"
      clickbait. Skip "Lagree vs pilates / vs reformer which is better" framings and
      "Lagree is overrated/a scam" debate clips. (Fun vlogs, studio tours, class edits,
      and interviews are welcome.)
    videos_desc: |-
      # What we surface

      Lagree-method Megaformer instruction for grown-up athletes — plus the fun,
      human side, so it's a feed members enjoy, not just a how-to library.

      ## Technique & class content
      - Full-length Megaformer classes and follow-along sessions
      - Single-move technique breakdowns: catfish, wheelbarrow, bear, scrambled
        eggs, mega-plank, lunges, teaser
      - Form corrections and spring-load adjustment coaching from certified
        Lagree instructors
      - Slow, deliberate tempo and time-under-tension guidance; no-rest
        transitions that keep the muscle under fire

      ## The fun & human side
      - Instructor vlogs and "day in the life" content
      - Studio behind-the-scenes and "what a Megaformer class is really like"
      - The relatable mid-set shake and class humour
      - Aesthetic class edits and before/after transformation stories
      - "30 days of Lagree" challenges and instructor interviews on the method
    avoid_desc: |-
      # What we avoid

      Anything not about Lagree / Megaformer training; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Classical or contemporary reformer pilates mislabeled as Lagree
      - Fast bouncy or jerky reps that break the slow controlled tempo
      - Generic "core / HIIT burner" workouts dressed up as Megaformer
      - Clickbait ("shred fat in 7 days", "snatched in 2 weeks"), scams, and
        misinformation
      - "Lagree vs pilates / vs reformer which is better" cross-method framings
      - "Lagree is overrated / a scam" debate or reaction rage-bait

      ## Keep in mind
      A video is not rejected just for being short, a vlog, a clip, a class
      edit, or entertaining — fun and creator content is wanted.
