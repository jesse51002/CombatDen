gym_id: mma
gym_type:
- mma
theme: ApexMMA
videos:
  specification:
    short_videos_desc: 'MMA technique and follow-along content across every range
      — striking, wrestling, clinch, and ground — from credible coaches, plus the
      fun side: knockout and finish highlight reels, pro-fight breakdowns, gym vlogs,
      funny sparring moments, and fighter interviews.'
    short_avoid_desc: Off-topic, clickbait, street-fight "one move ends any fight"
      fantasy, "go pro in months" McDojo promises, supplement scams, backyard-brawl
      footage, and "MMA vs boxing / is MMA useless" anti-MMA debate clips.
    videos_desc: |-
      # What we surface

      Technique, class, and film-study content for MMA members across every
      range — plus the fun, human side, so it's a feed members enjoy, not just
      a drill library.

      ## Technique & training
      - Striking: boxing, kicks, knees, elbows
      - Wrestling and takedowns, and the clinch
      - Ground game: guard, passing, submissions, ground-and-pound
      - Follow-along drilling, sparring, and fight-specific conditioning from
        established coaches and competition gyms

      ## The fun & human side
      - Classic and current pro-fight breakdowns
      - Knockout and finish highlight reels
      - Gym vlogs and "a day at the MMA gym", training-camp behind-the-scenes
      - Funny sparring moments and amateur first-fight stories
      - Fighter and coach interviews, and motivational montages
    avoid_desc: |-
      # What we avoid

      Anything not about MMA; off-topic, genuinely low-quality, or clickbait
      videos.

      ## Reject
      - Street-fight / self-defense fantasy ("one move to end any fight",
        "deadliest technique")
      - McDojo-style "learn MMA in 30 days / go pro fast" promises
      - Sketchy supplement promos and unsanctioned backyard-brawl footage
      - "MMA vs boxing", "is MMA useless in a street fight", and similar
        cross-discipline or anti-MMA debate / reaction videos

      ## Keep in mind
      Don't drop a video just for being a highlight, a vlog, or entertaining —
      fun content is wanted.
  queries:
  - mma fundamentals for beginners tutorial
  - mma striking combinations breakdown
  - wrestling for mma takedowns tutorial
  - takedown defense and sprawl drills mma
  - mma clinch work and dirty boxing
  - bjj for mma guard and submissions
  - ground and pound technique from top position
  - kicks and knees for mma technique
  - mma follow along shadow boxing workout
  - how to transition striking to takedown mma
  - classic ufc fight breakdown analysis
  - greatest mma knockouts and finishes highlights
  - best mma submissions and finishes compilation
  - a day at the mma gym vlog
  - pro mma fighter training camp behind the scenes
  - funny mma sparring moments
  - amateur mma fighter first fight experience
  - mma coach interview on the fight game
  - mma fighter interview on training camp life
  - mma motivation training montage
