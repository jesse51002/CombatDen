gym_id: hip_hop
gym_type:
- hip_hop
theme: HipHopDance
videos:
  specification:
    short_videos_desc: 'Hip-hop and urban dance instruction — choreography tutorials,
      foundations and grooves, freestyle — plus the fun: dance battles and cyphers,
      showcase performances, dance challenges and trends, crew vlogs and behind-the-scenes,
      funny dance moments, and dancer interviews. Beginner to advanced, respecting
      the culture.'
    short_avoid_desc: No "learn to dance in 10 minutes / look like a pro overnight"
      gimmicks, off-topic or clickbait videos, or "hip hop vs ballet / is hip hop
      real dance / breaking shouldn't be in the Olympics" debate clips.
    videos_desc: |-
      # What we surface

      Choreography, class, and foundations content for hip-hop and urban
      dancers from first-timers to working choreographers — plus the fun,
      human side, so it's a feed dancers enjoy, not just a how-to library.

      ## Choreography & training
      - Choreography tutorials broken down count by count
      - Foundations and grooves: bounce, rock, the two-step, isolations
      - Freestyle practice and musicality drills
      - The styles under the umbrella — popping, locking, breaking, house —
        and the basics each is built on
      - Follow-along beginner-to-advanced classes from credible instructors
        and studios that respect the culture the dance came from

      ## The fun & human side
      - Dance battles and cypher footage
      - Showcase and crew performances
      - Viral dance challenges and trends
      - "Day in the life" and crew-rehearsal vlogs, behind-the-scenes
      - Funny and relatable dance moments
      - Dancer and choreographer interviews, and progress reels
    avoid_desc: |-
      # What we avoid

      Anything not about hip-hop / urban dance; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - "Learn to dance in 10 minutes / look like a pro overnight" gimmick
        promises
      - Gear hauls and product shilling
      - Clickbait ("this move will change your dancing forever")
      - "Hip hop vs ballet / contemporary — which is harder" cross-discipline
        framings
      - "Is hip hop real dance / breaking shouldn't be in the Olympics" debate
        or reaction videos

      ## Keep in mind
      Don't drop a video just for being a battle, a clip, a vlog, a challenge,
      or entertaining — fun and creator content is wanted.
  queries:
  - hip hop dance tutorial for beginners step by step
  - beginner hip hop foundations and grooves
  - hip hop choreography tutorial slow then fast
  - how to freestyle hip hop dance for beginners
  - popping basics tutorial
  - locking dance tutorial fundamentals
  - breaking toprock and footwork for beginners
  - house dance basics jacking and footwork
  - hip hop dance class follow along full length
  - body isolations tutorial for hip hop dancers
  - hip hop dance battle compilation
  - breaking battle highlights
  - cypher freestyle session compilation
  - choreographer urban dance showcase performance
  - viral hip hop dance challenge
  - hip hop dance crew rehearsal behind the scenes
  - day in the life of a professional dancer
  - funny dance practice moments and fails
  - hip hop choreographer interview
  - dancer progress reel before and after
