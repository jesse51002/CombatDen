classes:
- name: Foundational Grooves
  image_url: https://images.pexels.com/photos/12312/pexels-photo-12312.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Learn the core rhythms and body isolations that form the foundation
    of hip-hop. Master the bounce, rock, and two-step with expert breakdown and rhythm
    drills.
  instructor_name: James Carter
  instructor_bio: Head coach with over a decade of experience helping members of every
    level train smarter, move better, and stay consistent.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/6/68/Alec_Penix.jpg
- name: Freestyle Flow
  image_url: https://images.pexels.com/photos/3775566/pexels-photo-3775566.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Unlock your musicality and improvisation skills through guided freestyle
    practice. Build confidence in your own style while discovering new movements and
    expression.
  instructor_name: Sarah Mitchell
  instructor_bio: Performance coach focused on building strength, mobility, and confidence
    through approachable, well-structured sessions.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/8/8b/Athlete_portrait_Marianna_Gillespie.jpg
- name: Battle & Style
  image_url: https://images.pexels.com/photos/8957645/pexels-photo-8957645.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Dive into cypher-ready moves and signature style expression. Learn
    how to command the floor and develop your own hip-hop flavor with confidence and
    control.
  instructor_name: Daniel Brooks
  instructor_bio: Certified instructor who breaks every movement down step by step
    so newcomers and regulars alike feel supported.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/e/e3/Branden_Loera_Headshot.jpg
- name: Choreography Lab
  image_url: https://images.pexels.com/photos/12086690/pexels-photo-12086690.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Study and master complete choreography pieces, breaking them down count
    by count. Build strength, coordination, and the ability to execute full routines.
  instructor_name: Maya Bennett
  instructor_bio: Coach passionate about creating an inclusive, high-energy room where
    members from all backgrounds can thrive.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/2/2e/Torrie_Lewis_for_Signet_Packaging%2C_headshot.jpg
