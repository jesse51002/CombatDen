gym_id: prenatal_yoga
gym_type:
- prenatal_yoga
theme: PrenatalYoga
videos:
  specification:
    short_videos_desc: 'Pregnancy-safe prenatal and postpartum yoga — classes by trimester,
      safe pose modifications, gentle mobility, breath and labour prep, plus postpartum
      and mom-and-baby practice — and the gentle, human side: mom-to-be and teacher
      vlogs, studio behind-the-scenes, relatable pregnancy class moments, and teacher/midwife
      interviews. Nurturing, gentle, body-adapting.'
    short_avoid_desc: No generic intense vinyasa/power/hot flows or deep twists, strong
      inversions and other positions unsafe in pregnancy; no "bounce back / lose the
      baby weight" clickbait, gear/leggings hauls, or "yoga vs pilates" debate clips.
    videos_desc: |-
      # What we surface

      Pregnancy-safe and postpartum yoga for members moving through pregnancy
      and the early months after — plus the gentle, human side, so it's a
      feed members enjoy scrolling, not just a how-to library.

      ## Prenatal & postpartum classes
      - Full classes adapted by trimester (first, second, and third)
      - Safe pose modifications and props for the changing body
      - Gentle mobility for hips, back, and pelvis
      - Breathwork and relaxation for labour preparation
      - Pelvic-floor and core-safe work
      - Postpartum recovery and diastasis-recti-aware classes
      - Baby-friendly mom-and-baby flows
      - Prenatal restorative and birth-prep sequences

      ## The gentle & human side
      - Mom-to-be and teacher vlogs and "what a prenatal class is really like"
      - Studio behind-the-scenes and day-in-the-life content
      - Relatable pregnancy and new-mom class moments
      - Pregnancy yoga journey stories
      - Aesthetic gentle-flow edits
      - Warm interviews with prenatal-certified teachers, midwives,
        or pelvic-health professionals
    avoid_desc: |-
      # What we avoid

      Anything not about prenatal / postpartum yoga; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Generic intense vinyasa, power, or hot flows not adapted for pregnancy
      - Classes teaching deep closed twists, strong inversions, prone
        (belly-down) poses, deep backbends, or other positions contraindicated
        in pregnancy
      - "Bounce back / lose the baby weight in X weeks" and "easiest natural
        birth ever" clickbait
      - Gear/leggings hauls and product shilling
      - "Yoga vs pilates / which is better" or "is prenatal yoga safe /
        pointless" debate and reaction videos

      ## Keep in mind
      Don't drop a safe, pregnancy-appropriate video just for being short, a
      vlog, a highlight, or entertaining — gentle fun and creator content is
      wanted.
