  - pregnancy yoga journey vlog by trimester
  - relatable pregnancy yoga class moments
  - mom and baby yoga class behind the scenes
  - prenatal yoga studio day in the life teacher
  - gentle prenatal flow with calming music aesthetic
  - prenatal yoga teacher interview on safe practice
  - my postpartum yoga recovery journey story
  - what is prenatal yoga explained for beginners
