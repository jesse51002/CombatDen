classes:
- name: Power Burst
  image_url: https://images.pexels.com/photos/264084/pexels-photo-264084.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Explosive max-effort sprints and fast-twitch power development. Build
    your top-end watts with short, all-out bursts and sharp recovery to prepare your
    legs for the hardest efforts.
  instructor_name: James Carter
  instructor_bio: Head coach with over a decade of experience helping members of every
    level train smarter, move better, and stay consistent.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/6/68/Alec_Penix.jpg
- name: Tabata Redline
  image_url: https://images.pexels.com/photos/4162595/pexels-photo-4162595.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Structured 20-seconds-on 10-seconds-off intervals pushing you to the
    edge. This demanding format builds anaerobic capacity and teaches you how to find
    and sustain max effort.
  instructor_name: Sarah Mitchell
  instructor_bio: Performance coach focused on building strength, mobility, and confidence
    through approachable, well-structured sessions.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/8/8b/Athlete_portrait_Marianna_Gillespie.jpg
- name: 20-Minute Grinder
  image_url: https://images.pexels.com/photos/5851030/pexels-photo-5851030.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: No fluff, just hard work. A fast-paced express ride mixing varied sprint
    intervals into twenty punishing minutes. Perfect for busy days when you want maximum
    output.
  instructor_name: Daniel Brooks
  instructor_bio: Certified instructor who breaks every movement down step by step
    so newcomers and regulars alike feel supported.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/e/e3/Branden_Loera_Headshot.jpg
- name: Recovery & Peaks
  image_url: https://images.pexels.com/photos/26655637/pexels-photo-26655637.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Strategic intervals paired with deliberate recovery windows. Learn
    how to ride smart, manage intensity across a longer session, and come back strong
    for the next effort.
  instructor_name: Maya Bennett
  instructor_bio: Coach passionate about creating an inclusive, high-energy room where
    members from all backgrounds can thrive.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/2/2e/Torrie_Lewis_for_Signet_Packaging%2C_headshot.jpg
