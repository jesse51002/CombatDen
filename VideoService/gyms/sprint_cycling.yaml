theme: SprintCycling
videos:
  specification:
    short_videos_desc: 'Short-format HIIT cycling built on max-effort sprints and
      sharp rest — Tabata and 20-second-on bursts, all-out interval rides, and coaching
      on how to redline safely, plus the fun side: ride vlogs, "what a sprint class
      is really like", instructor vibes and playlists, funny class moments, challenge
      highlights, and transformation stories.'
    short_avoid_desc: Off-topic, clickbait "get shredded in 7 days with HIIT" gimmicks,
      and "HIIT vs steady state / sprint vs endurance which is better" or "HIIT is
      overrated" debate clips.
    videos_desc: |-
      # What we surface

      Sprint-format indoor cycling content for riders who come to redline —
      plus the fun, human side, so it's a feed members enjoy, not just a
      how-to library.

      ## Sprint technique & training
      - Short, high-intensity follow-along sessions built on max-effort bursts
        and sharp recovery (Tabata, 20-on/10-off, 30/30, and all-out sprint
        intervals)
      - Instruction on sprint mechanics, how hard to push a true max effort,
        how to recover between bursts, and how to set resistance for a real
        sprint
      - Top-end power and anaerobic conditioning, work-to-rest structure, and
        quick express HIIT rides

      ## The fun & human side
      - Ride vlogs and "what a sprint class is really like"
      - Instructor vibes and playlists, relatable class humour
      - Sprint-challenge highlights and transformation stories
      - Instructor interviews — the hardest, most electric thirty minutes of
        the week
    avoid_desc: |-
      # What we avoid

      Anything not about sprint / HIIT indoor cycling; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-bait "burn 1000 calories / torch fat fast" gimmick titles
      - "HIIT vs steady state / sprint vs endurance which is better"
        cross-discipline framings
      - "HIIT is overrated / sprint cycling wrecks your knees" debate or
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
