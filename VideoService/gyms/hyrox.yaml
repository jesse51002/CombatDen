gym_id: hyrox
gym_type:
- hyrox
theme: HyroxPrep
videos:
  specification:
    short_videos_desc: 'HYROX race-prep content — station technique (sled push/pull,
      wall balls, burpee broad jumps, sandbag lunges, ski-erg, row, farmers carry),
      running and pacing strategy, and full simulations — plus the fun side: elite
      and age-group race footage, finish-line highlights, race-day vlogs, first-HYROX
      stories, and athlete interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      clips, sketchy supplement promos, or "HYROX vs CrossFit / is HYROX worth it"
      debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Race-specific prep content for HYROX athletes — split-driven, race-format
      technique — plus the fun, human side, so it's a feed members enjoy, not
      just a how-to library.

      ## Stations, running & race prep
      - Technique for each of the eight stations: sled push and pull, ski-erg,
        rowing, burpee broad jumps, sandbag lunges, wall balls, farmers carry
      - The 1km runs between stations, plus compromised-running training
      - Pacing and split strategy, and transition efficiency
      - Full race simulations and follow-along prep workouts from credible
        coaches and HYROX athletes

      ## The fun & human side
      - Elite and age-group race footage
      - World Championship and finish-line highlights
      - Race-day vlogs and first-HYROX stories
      - PR and finish-line celebration clips
      - Athlete breakdowns of how they trained and split the floor
      - Athlete interviews and race-day motivation montages
    avoid_desc: |-
      # What we avoid

      Anything not about HYROX or its race-format stations; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "HYROX vs CrossFit / marathon" and "is HYROX worth it / HYROX is
        overrated" cross-discipline or anti-discipline debate and reaction
        videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or entertaining
      — fun content is wanted.
  queries:
  - hyrox sled push technique and pacing
  - hyrox sled pull technique tutorial
  - hyrox wall ball technique and strategy
  - hyrox burpee broad jump efficiency tips
  - hyrox compromised running training
  - hyrox full race simulation workout
  - hyrox pacing and split strategy explained
  - hyrox training plan for beginners
  - hyrox station transition tips
  - hyrox 8 week prep program
  - hyrox elite race highlights
  - hyrox world championships footage
  - hyrox best moments compilation
  - hyrox race day vlog experience
  - my first hyrox race story
  - hyrox finish line celebration clips
  - hyrox pro athlete race breakdown
  - hyrox athlete interview training
  - funny hyrox race moments
  - hyrox race day motivation
