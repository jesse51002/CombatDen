gym_id: ballet
gym_type:
- ballet
theme: AdultBallet
videos:
  specification:
    short_videos_desc: 'Adult ballet instruction — full barre and centre classes,
      technique and terminology breakdowns, and variations, taught with patience for
      grown-up, mixed-ability dancers — plus the human side: company and dancer vlogs,
      backstage and rehearsal footage, classic variation performances, and dancer
      interviews. Refined, technique-first tone.'
    short_avoid_desc: No "ballet body / lose weight with ballet" fitness rebrands
      or "ballet-inspired" sculpt workouts that skip the form, off-topic or clickbait
      videos, or "ballet vs contemporary / is ballet outdated" debate clips.
    videos_desc: |-
      # What we surface

      Adult ballet content for grown-ups returning to or starting at the barre
      — plus the human, inspiring side, so it's a feed dancers enjoy, not just
      a technique library. The tone stays heritage and technique-first — a real
      studio that takes the craft seriously and treats mixed-ability adult
      dancers with patience — so the fun stays refined and on-brand.

      ## Classes & technique
      - Full-length barre and centre classes
      - Technique breakdowns of the core vocabulary (plié, tendu, dégagé, rond
        de jambe, frappé, adagio, pirouettes, petit and grand allégro)
      - Clear explanations of ballet terminology and positions
      - Beginner-through-intermediate progressions, alignment and turnout work
        done safely for adult bodies, and port de bras and épaulement
      - Walk-throughs of classic variations from the repertoire

      ## The fun & human side
      - Tasteful performance footage of classic variations
      - Company and professional-dancer vlogs and "day in the life"
      - Backstage and rehearsal behind-the-scenes
      - Dancer interviews and adult-returner progress stories
    avoid_desc: |-
      # What we avoid

      Anything not about ballet; off-topic, genuinely low-quality, or clickbait
      videos.

      ## Reject
      - "Ballet body / get long lean dancer legs / lose weight with ballet"
        fitness-rebrand framings
      - "Ballet-inspired" barre-sculpt workouts that borrow the name but skip
        real technique
      - Dancewear hauls and product shilling
      - Clickbait ("get your splits / pointe-ready in 7 days")
      - "Ballet vs contemporary / which is harder" cross-discipline framings,
        and "is ballet bad for your body / ballet is outdated" debate and
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a performance, a vlog, backstage
      footage, or entertaining — refined fun and human content is wanted.
  queries:
  - adult beginner ballet class full length
  - ballet barre workout follow along
  - ballet terminology explained for beginners
  - tendu and dégagé technique breakdown
  - how to do a pirouette ballet tutorial
  - ballet centre adagio for beginners
  - port de bras and épaulement tutorial
  - ballet turnout for adults done safely
  - intermediate ballet barre class
  - classical ballet variation tutorial
  - ballet positions of the feet and arms explained
  - swan lake variation performance
  - famous classical ballet variations performance
  - day in the life of a professional ballet dancer
  - ballet company rehearsal behind the scenes
  - ballet backstage before a performance
  - ballet dancer interview on their journey
  - returning to ballet as an adult story
  - adult ballet progress over one year
  - corps de ballet performance highlights
