classes:
  - name: "Silks & Suspension"
    image_url: "https://images.pexels.com/photos/30131194/pexels-photo-30131194.jpeg?auto=compress&cs=tinysrgb&w=1200"
    description: "Learn aerial silks from the ground up with proper rigging and safety protocols. Build the shoulder strength and grip techniques needed to flow elegantly through the air."
    instructor_name: "James Carter"
    instructor_bio: "Head coach with over a decade of experience helping members of every level train smarter, move better, and stay consistent."
    instructor_image_url: "https://upload.wikimedia.org/wikipedia/commons/6/68/Alec_Penix.jpg"
  - name: "Partner Foundations"
    image_url: "https://images.pexels.com/photos/9306115/pexels-photo-9306115.jpeg?auto=compress&cs=tinysrgb&w=1200"
    description: "Master the essential base and flyer skills, trust-building exercises, and communication patterns that make acro yoga possible. Perfect for couples or friends just starting their partner journey."
    instructor_name: "Sarah Mitchell"
    instructor_bio: "Performance coach focused on building strength, mobility, and confidence through approachable, well-structured sessions."
    instructor_image_url: "https://upload.wikimedia.org/wikipedia/commons/8/8b/Athlete_portrait_Marianna_Gillespie.jpg"
  - name: "Conditioning for Acro"
    image_url: "https://images.pexels.com/photos/4323299/pexels-photo-4323299.jpeg?auto=compress&cs=tinysrgb&w=1200"
    description: "Build the foundational strength, balance, and body awareness that acro demands. Solo conditioning work designed to prepare you safely for partner balances and aerial skills."
    instructor_name: "Daniel Brooks"
    instructor_bio: "Certified instructor who breaks every movement down step by step so newcomers and regulars alike feel supported."
    instructor_image_url: "https://upload.wikimedia.org/wikipedia/commons/e/e3/Branden_Loera_Headshot.jpg"
  - name: "Restorative Inversions"
    image_url: "https://images.pexels.com/photos/8713850/pexels-photo-8713850.jpeg?auto=compress&cs=tinysrgb&w=1200"
    description: "Float upside down in the gentle support of aerial hammocks while building flexibility and decompression through your spine. A peaceful, meditative approach to inversion practice."
    instructor_name: "Maya Bennett"
    instructor_bio: "Coach passionate about creating an inclusive, high-energy room where members from all backgrounds can thrive."
    instructor_image_url: "https://upload.wikimedia.org/wikipedia/commons/2/2e/Torrie_Lewis_for_Signet_Packaging%2C_headshot.jpg"
