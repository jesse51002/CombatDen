videos:
  specification:
    short_videos_desc: 'Acro and partner-yoga tutorials and flows — base and flyer
      foundations, spotting and safety, L-basing, standing acro, washing-machines
      and transitions — plus the fun, human side acro is famous for: partner vlogs,
      festival and jam behind-the-scenes, funny acro bloopers, partner-flow reels
      with music, and teacher interviews. Playful, communal, two-person practice.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "acro yoga for
      weight loss / flat abs" videos, gear/leggings hauls and product shilling, dangerous
      untrained no-spotter stunts, and "yoga vs pilates" or "is acro yoga dangerous/pointless"
      debate clips.
    videos_desc: |-
      # What we surface

      Acro and partner-yoga instruction for members from curious couples and
      friends drawn by the trust and silliness of partner work to seasoned
      practitioners chasing advanced flows — plus the playful, human side acro
      is famous for, so it's a feed members enjoy, not just a how-to library.

      ## Acro & partner-yoga instruction
      - Base-and-flyer foundations, spotting and safety
      - L-basing poses, standing acro, washing-machines and sequences
      - The communication and counterbalance two-body practice depends on
      - Step-by-step pose tutorials (bird, throne, whale, front/back bird)
      - Transition and washing-machine breakdowns
      - Partner warm-ups and Thai-massage cool-downs
      - Conditioning and balance drills for basing and flying

      ## The fun & human side
      - Partner and couple vlogs and "what an acro class is really like"
      - Festival and jam behind-the-scenes
      - Funny acro bloopers and "couples try acro" moments
      - Partner-flow reels set to music
      - Teacher interviews on partner trust
      - Couples-learning transformation stories

      Playful, communal, warm tone throughout — yoga shared between two people,
      lifting each other off the ground.
    avoid_desc: |-
      # What we avoid

      Anything not about acro / partner yoga; off-topic, genuinely low-quality,
      or clickbait videos.

      ## Reject
      - Calorie-burn "acro yoga for weight loss / flat abs in X days" promises
      - Dangerous untrained no-spotter stunts
      - Gear/leggings hauls and product shilling
      - "Yoga vs pilates / which is better" or "is acro yoga dangerous /
        pointless" debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a highlight, a blooper,
      or entertaining — the playful, fun side of acro is exactly what's wanted.
