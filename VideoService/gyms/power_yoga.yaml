gym_id: power_yoga
gym_type:
- power_yoga
theme: PowerSculptYoga
videos:
  specification:
    short_videos_desc: 'Power-yoga and sculpt-hybrid classes where the mat meets the
      dumbbell — strong vinyasa flows, weighted sculpt sequences, tempo holds, and
      yoga-based strength and conditioning — plus the fun, human side: studio vlogs,
      sculpt-class behind-the-scenes, funny class moments, aesthetic flow-with-music,
      and teacher interviews. Athletic, contemporary, follow-along.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "yoga for weight
      loss / flat abs in X days" videos, gear/leggings hauls and product shilling,
      and "yoga vs pilates" or "yoga doesn't build strength / is useless" debate clips.
    videos_desc: |-
      # What we surface

      Power-yoga and sculpt-hybrid content for members from athletic newcomers
      to crossover lifters using the mat for mobility and conditioning — plus
      the fun, human side, so it's a feed members enjoy, not just a workout
      library.

      ## Technique & classes
      - Strong, athletic vinyasa flows and sculpt sequences with dumbbells,
        glide-discs, and tempo holds
      - Yoga-based strength, core, and conditioning work
      - Follow-along full classes of varying lengths
      - Proper form for weighted movement on the mat
      - Peak-pose and arm-balance strength build-ups
      - Mobility and recovery flows that serve lifting and athletics

      ## The fun & human side
      - Studio vlogs and "what a sculpt class is really like"
      - Sculpt-class behind-the-scenes and funny class moments and fails
      - Aesthetic strong-flow-with-music edits
      - Teacher interviews and strength and transformation stories
    avoid_desc: |-
      # What we avoid

      Anything not about power or sculpt-hybrid yoga; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-burn "get shredded with yoga in 7 days / flat abs" promises
      - Heavy chanted-Sanskrit devotional sermons sold as the main point
      - Gear/leggings hauls and product shilling
      - "Yoga vs pilates / which is better" or "yoga doesn't build strength /
        is useless" debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a highlight, or
      entertaining — fun and creator content is wanted.
