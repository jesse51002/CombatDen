theme: BikramHot
videos:
  specification:
    short_videos_desc: 'Bikram 26-and-2 instruction and full hot classes — the traditional
      sequence of 26 postures and two breathing exercises, posture breakdowns, dialogue,
      and hot-room practice tips — plus the human side: practitioner vlogs, studio
      behind-the-scenes, relatable hot-room humour, 30-day challenge stories, and
      teacher interviews. Ritualised, intense, old-school.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "hot yoga for
      weight loss / flat abs" videos, gear/leggings hauls and product shilling, and
      "yoga vs pilates" or "hot yoga is dangerous/pointless" debate clips.
    videos_desc: |-
      # What we surface

      Bikram-method instruction and full hot classes for members from
      first-timers braving the heat to long-time practitioners who time their
      lives around the 90-minute set — plus the human side of the hot-room
      ritual, so it's something members enjoy scrolling, not just a how-to
      library.

      ## The 26-and-2 method & hot-room practice
      - The traditional 26-and-2 sequence (26 postures plus the two breathing
        exercises) taught in order
      - Posture-by-posture breakdowns and alignment, and the Bikram dialogue
      - How to safely practice in a hot, mirror-walled room, with hydration
        and heat-acclimation tips
      - Modifications for common postures (Standing Bow, Camel, Eagle,
        Triangle)
      - Follow-along full and shortened 26-and-2 classes

      ## The fun & human side
      - Practitioner vlogs and "surviving my first Bikram class"
      - Studio behind-the-scenes
      - Relatable hot-room humour and class moments
      - 30-day-challenge and transformation stories
      - Aesthetic practice edits and teacher interviews

      Ritualised, old-school tone throughout — the same room, the same
      sequence, every class.
    avoid_desc: |-
      # What we avoid

      Anything not about Bikram / the 26-and-2 sequence; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-burn "hot yoga for weight loss / flat abs in X days" promises
      - Heavy chanted-Sanskrit devotional sermons sold as the main point
      - Gear/leggings hauls and product shilling
      - "Yoga vs pilates / which is better" cross-discipline framings
      - "Is hot yoga dangerous / Bikram is bad" debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a highlight, or
      entertaining — fun and creator content is wanted.
