gym_id: flow_barre
gym_type:
- flow_barre
theme: Barre3Flow
videos:
  specification:
    short_videos_desc: 'Modern flow barre in the Barre3 lineage — mat movement, light
      strength, balance work, and the barre woven together with breath in warm, approachable
      follow-along classes — plus the human side: instructor vlogs, studio behind-the-scenes,
      relatable barre humour, aesthetic class edits, and member transformations.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "lean barre body
      in 30 days" videos, gymwear hauls and product shilling, and "barre vs pilates"
      or "is barre even a real workout" debate clips.
    videos_desc: |-
      # What we surface

      Follow-along and technique content for flow barre members in the Barre3
      tradition — friendly sequences that move mat work, light strength,
      balance, and the barre together with breath — plus the fun, human side,
      so it's a feed members enjoy, not just a how-to library.

      ## Classes & technique
      - Full-length flow barre classes
      - Core, glute, and full-body balance segments
      - Standing blocks and posture work
      - Beginner foundations from reputable barre teachers and studios; the tone
        stays approachable, modern, and warmly wellness-coded

      ## The fun & human side
      - Instructor vlogs and "day in the life", studio behind-the-scenes
      - "What a flow barre class is really like"
      - Relatable barre class humour done tastefully, aesthetic full-class edits
      - Instructor interviews, first-class stories, and one-year-of-barre
        transformations
    avoid_desc: |-
      # What we avoid

      Anything not about flow barre; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Clickbait body-transformation framing ("lean barre body / flat abs in 30
        days", "lose 10 lbs in a week")
      - Gymwear/leggings hauls and product shilling
      - "Barre vs pilates / which is better" or "barre vs yoga" cross-discipline
        framings (they advertise rivals)
      - "Is barre even a real workout / does barre work" debate or reaction
        videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, or entertaining —
      fun and creator content is wanted.
  queries:
  - flow barre full class follow along
  - barre3 style class at home
  - modern flow barre full body workout
  - flow barre balance and core class
  - flow barre glutes and seat segment
  - light strength barre class with breath
  - beginner flow barre foundations
  - flow barre standing leg work tutorial
  - flow barre posture and alignment cues
  - flow barre common form mistakes and fixes
  - day in the life of a flow barre instructor
  - flow barre studio behind the scenes
  - what a flow barre class is really like
  - relatable barre shakes funny moments
  - aesthetic flow barre class edit
  - flow barre instructor vlog
  - flow barre instructor interview
  - my first flow barre class experience
  - flow barre class with music vibe
  - one year of barre transformation
