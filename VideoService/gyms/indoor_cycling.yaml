gym_id: indoor_cycling
gym_type:
- indoor_cycling
theme: IndoorCycling
videos:
  specification:
    short_videos_desc: 'Rhythm-led indoor cycling rides you can follow on the beat
      — full candlelit-style classes, climbs and sprints choreographed to the music,
      plus the fun side: ride vlogs, "what a SoulCycle class is really like", instructor
      vibes and playlists, studio behind-the-scenes, and funny class moments.'
    short_avoid_desc: Off-topic, clickbait "burn 1000 calories on a bike" gimmicks,
      and "spin vs running / Peloton vs SoulCycle which is better" or "is spinning
      bad for you" debate clips.
    videos_desc: |-
      # What we surface

      Rhythm-led indoor cycling content for riders who come to dance on the
      bike — plus the fun, human side of the studio, so it's a feed members
      enjoy, not just a how-to library.

      ## Rides & foundations
      - Full follow-along rides choreographed to the beat: climbs out of the
        saddle, sprints, jogs, taps-back and choreography
      - Beginner first-class walkthroughs
      - Form cues for posture, cadence and resistance that keep the ride safe
        and on-tempo

      ## The fun & human side
      - Ride vlogs and "what a SoulCycle / rhythm class is really like"
      - Instructor vibes, playlists, and themed/artist rides
      - Studio behind-the-scenes and relatable class humour
      - Transformation stories and instructor interviews — the high-energy,
        lights-down club atmosphere members come for
    avoid_desc: |-
      # What we avoid

      Anything not about rhythm indoor cycling; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-bait "burn 1000 calories / torch fat fast" gimmick titles
      - "Spin vs running / Peloton vs SoulCycle which is better"
        cross-discipline framings
      - "Is spinning bad for you / spinning ruins your legs" debate or reaction
        videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
  queries:
  - rhythm indoor cycling class full ride 45 minutes
  - beginner indoor cycling first class what to expect
  - 30 minute beat based spin class follow along
  - indoor cycling climb and sprint choreography tutorial
  - how to set up your spin bike properly
  - correct posture and form on an indoor bike
  - cadence and resistance basics for rhythm cycling
  - candlelit rhythm ride full class
  - low impact indoor cycling class for beginners
  - indoor cycling class with weights arms section
  - what a SoulCycle class is really like
  - hip hop themed spin class playlist ride
  - best spin class music playlist for riders
  - star spin instructor full class
  - spin instructor interview on coaching the room
  - day in the life of an indoor cycling instructor
  - indoor cycling studio behind the scenes
  - funny spin class moments
  - my first SoulCycle class vlog
  - one year of indoor cycling transformation
