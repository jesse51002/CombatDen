- dance_fitness
theme: DuckDancer
videos:
  specification:
    short_videos_desc: 'Fun, follow-along dance-workout classes and easy choreography
      tutorials — cardio dance, beginner routines, and dance-along sessions you can
      sweat to — plus the playful side: dance challenges and trends, feel-good routine
      showcases, class vlogs, funny relatable dance moments, and instructor interviews.
      Upbeat, all-levels, joyful energy.'
    short_avoid_desc: No "lose 10 lbs in a week" diet-bait, off-topic or clickbait
      videos, or "is Zumba a real workout / dance fitness is useless" debate and "Zumba
      vs aerobics" cross-discipline clips.
    videos_desc: |-
      # What we surface

      Fun, follow-along dance-workout content for members of every age and
      level — plus the playful, human side, so it's a feed members enjoy, not
      just a workout library. The tone is playful and joyful: moving your body
      should feel like fun, not a chore.

      ## Classes & choreography
      - Full cardio-dance and dance-fitness classes (Zumba-style, dance HIIT,
        dance cardio)
      - Beginner-friendly choreography tutorials broken down step by step
      - Dance-along routines set to popular music you can really move to
      - Short express workouts, low-impact options, and warm-ups and cool-downs
      - Upbeat instructor-led sessions from credible dance-fitness teachers

      ## The fun & human side
      - Feel-good full-routine showcases and performances
      - Viral dance challenges and trends
      - Class and "day in the studio" vlogs, and behind-the-scenes
      - Funny and relatable dance moments
      - Instructor interviews, and progress and transformation reels
    avoid_desc: |-
      # What we avoid

      Anything not about dance fitness; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Diet-bait "lose 10 lbs in a week / drop a dress size with this dance"
        weight-loss promises
      - Gear/activewear hauls and product shilling
      - "Zumba vs aerobics / which burns more" cross-discipline framings
      - "Is dance cardio a real workout / dance fitness is useless" debate and
        reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a challenge, a vlog, a showcase,
      or entertaining — fun and creator content is wanted.
