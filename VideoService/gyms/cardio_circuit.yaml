gym_id: cardio_circuit
gym_type:
- cardio_circuit
theme: CardioCircuit
videos:
  specification:
    short_videos_desc: 'Multi-machine cardio circuit classes — timed station rotations
      across rower, bike, ski, tread and more, follow-along interval workouts on a
      clock, plus the fun side: "what a cardio circuit class is really like", studio
      vlogs and behind-the-scenes, instructor vibes, funny class moments, transformation
      stories, and coach interviews.'
    short_avoid_desc: Off-topic, clickbait "burn 1000 calories" gimmicks, and "circuit
      training vs steady cardio / circuits vs HIIT which is better" or "is circuit
      training a waste" debate clips.
    videos_desc: |-
      # What we surface

      Multi-machine cardio circuit content for people who hate doing the same
      machine twice — plus the fun, human side of the studio, so it's a feed
      members enjoy, not just a how-to library.

      ## Circuits & stations
      - Follow-along station-rotation workouts on a timer across the cardio
        floor: rower, assault / air bike, ski erg, treadmill, stair climber,
        and bodyweight conditioning stations
      - Instruction on each station's form
      - How to set work-to-rest and the master timer, and how to structure and
        rotate a circuit
      - Beginner first-class walkthroughs and station scaling

      ## The fun & human side
      - "What a cardio circuit class is really like"
      - Studio vlogs and behind-the-scenes
      - Instructor vibes and high-energy sets
      - Relatable class humour and transformation stories
      - Coach interviews — full-body conditioning that covers a whole cardio
        week in one class, with the energy to match
    avoid_desc: |-
      # What we avoid

      Anything not about multi-machine cardio circuits; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Pure-strength / weights-only circuits with no cardio machines (this is a
        multi-machine cardio format)
      - Calorie-bait "burn 1000 calories / melt fat fast" gimmick titles
      - "Circuit training vs steady cardio", "circuits vs HIIT which is better",
        and similar cross-discipline framings
      - "Is circuit training a waste", "cardio circuits do nothing", and similar
        debate or reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
