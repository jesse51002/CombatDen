gym_id: yoga_meditation
gym_type:
- yoga_meditation
theme: YogaMeditation
videos:
  specification:
    short_videos_desc: 'Yoga-and-meditation hybrid practice — slow flows that lead
      into a long, real seated meditation, breathwork, and guided sitting and body-scan
      sessions — plus the gentle, human side: teacher vlogs, studio and retreat behind-the-scenes,
      relatable practice moments, aesthetic flow-into-stillness edits, and teacher
      interviews. Contemplative, quiet, dual-practice serious.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "yoga for weight
      loss / flat abs" videos, gear/leggings hauls and product shilling, and "yoga
      vs pilates" or "is meditation useless / yoga is fake" debate clips.
    videos_desc: |-
      # What we surface

      Yoga-and-meditation hybrid content for members at every stage — from
      busy professionals using the practice as a daily nervous-system reset
      to long-time practitioners deepening their seated work.

      ## Slow flows & breathwork
      - Slow, mindful yoga flows that arrive at a long, real seated meditation
        rather than a quick savasana
      - Breathwork (pranayama, box breathing, coherent breathing) that bridges
        movement and stillness
      - Gentle mobility and grounding sequences that prepare the body to sit
      - Posture and set-up tips for comfortable seated meditation

      ## Guided meditation
      - Full guided mindfulness meditations
      - Body scan and yoga nidra sessions
      - Loving-kindness meditations
      - Combined yoga-and-meditation class formats

      ## The gentle & human side
      - Teacher and practitioner vlogs and "what a yoga-and-meditation class
        is really like"
      - Studio and retreat behind-the-scenes
      - Relatable practice moments
      - Aesthetic flow-into-stillness edits with music
      - Teacher interviews on stillness and the practice
      - Meditation-journey transformation stories
    avoid_desc: |-
      # What we avoid

      Anything not about yoga plus meditation; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-burn "yoga for weight loss / flat abs in X days" promises
      - Lineage-heavy devotional or religious sermon content presented as the
        main point rather than a guided sit
      - Gear, leggings hauls, and product shilling
      - "Yoga vs pilates / which is better" or "is meditation useless / yoga
        is fake" debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight,
      or entertaining — gentle fun and creator content is wanted.
