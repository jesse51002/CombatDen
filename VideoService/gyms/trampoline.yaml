gym_id: trampoline
gym_type:
- trampoline
theme: TrampolineCardio
videos:
  specification:
    short_videos_desc: 'Mini-trampoline rebounder cardio classes — bouncy, low-impact
      follow-along workouts on a fitness trampoline, basic bounce moves and form,
      plus the fun side: "what a rebounder class is really like", studio vlogs and
      behind-the-scenes, instructor vibes and playlists, funny bounce moments, and
      transformation stories that make cardio feel like recess.'
    short_avoid_desc: Off-topic, clickbait "burn 1000 calories bouncing" gimmicks,
      and "rebounding vs running / trampoline vs treadmill which is better" or "is
      rebounding a waste" debate clips.
    videos_desc: |-
      # What we surface

      Rebounder cardio content for people who want a low-impact, high-spirits
      workout — plus the fun, human side of the studio so it's a feed members
      enjoy, not just a how-to library.

      ## Classes & technique
      - Follow-along mini-trampoline / rebounder classes: bounce cardio, health
        bounce, jogging and dance-style sequences, interval rebounding
      - Instruction on the basic bounce, foot placement, and posture
      - How to set up and stay safe on a fitness trampoline
      - Beginner first-class walkthroughs for people returning from injury or
        who can't run

      ## The fun & human side
      - "What a rebounder class is really like" and my-first-class vlogs
      - Studio vlogs and behind-the-scenes
      - Upbeat playlist and themed rebounding sessions
      - Relatable class humour and funny bounce moments
      - Transformation stories
      - Instructor interviews and day-in-the-life content
    avoid_desc: |-
      # What we avoid

      Anything not about rebounder / fitness-trampoline cardio; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - Gymnastics or big-trampoline flips, tricks, and trampoline-park stunts
        (this is rebounder cardio, not gymnastics)
      - Calorie-bait "burn 1000 calories bouncing / melt fat fast" gimmick titles
      - "Rebounding vs running / trampoline vs treadmill which is better"
        cross-discipline framings
      - "Is rebounding a waste / trampoline cardio does nothing" debate or
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or entertaining
      — fun content is wanted.
