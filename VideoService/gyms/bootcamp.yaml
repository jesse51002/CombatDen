gym_id: bootcamp
gym_type:
- bootcamp
theme: BurnBootCamp
videos:
  specification:
    short_videos_desc: 'Outdoor boot-camp style group HIIT content — follow-along
      circuits with minimal kit (bodyweight, sandbags, dumbbells, bands), exercise
      technique, and partner/team formats from credible coaches — plus the fun side:
      "what a boot camp is really like" vlogs, member transformation stories, behind-the-scenes,
      funny camp moments, and community and coach interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      clips, sketchy supplement promos, or "boot camp is a scam / boot camp vs gym"
      debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Format, technique, and follow-along content for an outdoor / hybrid
      boot-camp gym in the Burn Boot Camp tradition — plus the fun, human side,
      so it's a feed members enjoy, not just a how-to library. Small-group,
      fresh-air, encouraging tone throughout.

      ## Circuits, technique & formats
      - Full follow-along group HIIT circuits you can do outside or at home with
        minimal kit (bodyweight, sandbags, dumbbells, kettlebells, resistance
        bands)
      - Technique for the movements that recur in a camp (squats, lunges,
        push-ups, burpees, sandbag carries, sprints)
      - Partner, AMRAP and station/team workout formats
      - Warm-up, mobility and recovery, from credible coaches

      ## The fun & human side
      - "What a boot camp is really like" walkthroughs
      - Member transformation and progress stories
      - Behind-the-scenes and warm community-and-accountability moments
      - Funny camp clips
      - Coach interviews
    avoid_desc: |-
      # What we avoid

      Anything not about boot-camp / outdoor group HIIT training; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "Boot camp vs gym / CrossFit" and "is boot camp worth it / boot camp is
        a scam / a waste" cross-discipline or anti-discipline debate and
        reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
  queries:
  - outdoor boot camp workout follow along
  - bodyweight boot camp circuit no equipment
  - sandbag workout circuit follow along
  - dumbbell boot camp full body workout
