  - kyokushin karate technique breakdown
  - goju ryu sanchin kata tutorial
  - karate kumite sparring drills
  - karate timing and distance in kumite
  - traditional karate etiquette and dojo basics
  - tournament kata performance highlights
  - wkf kumite match analysis
  - kyokushin knockdown tournament highlights
  - a day at the karate dojo vlog
  - karate black belt grading test story
  - karate black belt demonstration
  - life as a karate sensei vlog
  - karate sensei interview on karate-do
  - karate student first competition experience
