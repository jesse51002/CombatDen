theme: KarateDojo
videos:
  specification:
    short_videos_desc: 'Traditional karate-do technique and practice — kihon, kata,
      kumite, stances and etiquette in the lineage styles (Shotokan, Kyokushin, Goju-ryu)
      from credible senseis — plus the human side: tournament kata and kumite footage,
      dojo vlogs, belt-test stories, demonstrations, and sensei interviews.'
    short_avoid_desc: Off-topic, clickbait, McDojo "black belt fast / colour-belt-every-six-weeks"
      promises, cartoon "hi-YAA" karate-kid parody, street-fight "deadliest move"
      fantasy, and "karate vs X / is karate useless" anti-karate debate clips.
    videos_desc: |-
      # What we surface

      Technique, class, and study content for traditional karate members —
      taught by credible senseis and dojos — plus the human side of karate-do,
      so it's a feed members enjoy, not just a how-to library.

      ## Technique & study
      - Kihon basics: stances, blocks, strikes, kicks
      - Kata and bunkai application
      - Kumite and sparring drills
      - Posture, breathing, and the etiquette of karate-do in the lineage
        styles (Shotokan, Kyokushin, Goju-ryu)
      - The culture here is traditional, disciplined and respectful — favour
        calm, careful instruction on technique, kata detail and grading
        standards over hype, for white belts through black belts

      ## The fun & human side
      - Properly executed tournament kata and kumite footage
      - Black-belt demonstrations
      - Dojo vlogs and "a day at the dojo"
      - Belt-test and grading stories, training behind-the-scenes
      - Sensei interviews on the way of karate
      - Kept composed and respectful, never gimmicky parody
    avoid_desc: |-
      # What we avoid

      Anything not about karate; off-topic, genuinely low-quality, or clickbait
      videos.

      ## Reject
      - McDojo-style "get your black belt fast", "new coloured belt every six
        weeks", or "go pro quick" promises
      - Cartoon "hi-YAA" karate-kid parody and board-breaking gimmick stunts
      - Street-fight / self-defense fantasy ("one move to end any fight",
        "deadliest karate technique")
      - "karate vs muay thai / taekwondo", "is karate useless in a real fight",
        and similar cross-discipline or anti-karate debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, a
      demonstration, or entertaining — fun and human content is wanted.
  queries:
  - karate kihon basics for beginners
  - shotokan karate stances tutorial
  - heian kata step by step shotokan
