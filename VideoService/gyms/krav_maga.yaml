  image_url: https://images.pexels.com/photos/7991668/pexels-photo-7991668.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Build a solid foundation with proper stance, footwork, and striking
    technique. Marcus breaks down hand and body mechanics for consistent, powerful
    strikes.
  instructor_name: James Carter
  instructor_bio: Head coach with over a decade of experience helping members of every
    level train smarter, move better, and stay consistent.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/6/68/Alec_Penix.jpg
- name: Release & Escape
  image_url: https://images.pexels.com/photos/6296002/pexels-photo-6296002.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Master releases from grabs, chokes, headlocks, and bear hugs. Learn
    functional strength and technique to escape dangerous positions under pressure.
  instructor_name: Sarah Mitchell
  instructor_bio: Performance coach focused on building strength, mobility, and confidence
    through approachable, well-structured sessions.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/8/8b/Athlete_portrait_Marianna_Gillespie.jpg
- name: Pressure Drills
  image_url: https://images.pexels.com/photos/4761788/pexels-photo-4761788.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Train decision-making and technique under realistic stress. David coaches
    you through progressively challenging defenses and situational responses.
  instructor_name: Daniel Brooks
  instructor_bio: Certified instructor who breaks every movement down step by step
    so newcomers and regulars alike feel supported.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/e/e3/Branden_Loera_Headshot.jpg
- name: Self-Defense Scenario
  image_url: https://images.pexels.com/photos/7991616/pexels-photo-7991616.jpeg?auto=compress&cs=tinysrgb&w=1200
  description: Apply your skills to real-world scenarios. Train multiple-attacker
    awareness, tactical spacing, and the calm problem-solving that defines Krav Maga.
  instructor_name: Maya Bennett
  instructor_bio: Coach passionate about creating an inclusive, high-energy room where
    members from all backgrounds can thrive.
  instructor_image_url: https://upload.wikimedia.org/wikipedia/commons/2/2e/Torrie_Lewis_for_Signet_Packaging%2C_headshot.jpg
