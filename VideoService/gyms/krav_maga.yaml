theme: KravMagaSchool
videos:
  specification:
    short_videos_desc: 'Practical Krav Maga self-defence technique and pressure drills
      — strikes, releases from grabs and chokes, defences against common attacks,
      and stress-test scenario training from credible, qualified instructors — plus
      the human side: school vlogs, drill-of-the-week clips, scenario-test footage,
      and instructor and student interviews.'
    short_avoid_desc: Off-topic, clickbait, "one move ends any fight / deadliest technique"
      fantasy, tactical / operator cosplay, weapon-fetish content, macho posturing,
      and "krav maga vs X / is it useless / fake / a scam" anti-Krav debate clips.
    videos_desc: |-
      # What we surface

      Technique, class, and drill content for Krav Maga members focused on
      practical self-protection — plus the human side of training so it's a
      feed members enjoy, not just a how-to library.

      ## Technique & self-protection
      - Fundamental strikes and combatives from credible, qualified instructors
      - Releases from grabs, chokes, headlocks, and bear hugs
      - Defences against punches, kicks, and common attacks
      - Ground defence and getting back to your feet
      - De-escalation, situational awareness, and under-pressure decision-making
      - Stress-tested scenario and pressure drills (favour grounded, realistic
        instruction over theatrics)

      ## The fun & human side of the school
      - "A day at the Krav Maga school" vlogs and drill-of-the-week clips
      - Scenario and pressure-test footage
      - Behind-the-scenes from instructor courses and seminars
      - Why-I-train stories and student progress journeys
      - Instructor and student interviews — composed and realistic, never
        street-fight fantasy or operator cosplay
    avoid_desc: |-
      # What we avoid

      Anything not about Krav Maga; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Street-fight fantasy and "one move to end any fight / deadliest
        technique" clickbait
      - Tactical-operator / "tacticool" cosplay and weapon-fetish content
      - Macho "I'd destroy anyone" posturing
      - "Krav maga vs bjj / mma", "is krav maga useless / fake / a scam",
        and similar cross-discipline or anti-Krav debate and reaction videos

      ## Keep in mind
      A video is NOT rejected just for being short, a vlog, a clip, or
      entertaining — fun and human content is wanted.
  queries:
  - krav maga for beginners technique tutorial
  - krav maga basic strikes and combatives
  - krav maga defense against punches
  - krav maga choke release defense tutorial
  - krav maga escape from bear hug
  - krav maga wrist grab releases tutorial
  - krav maga headlock escape technique
  - krav maga ground defense and getting up
  - krav maga 360 defense drill
  - krav maga situational awareness and de-escalation
  - krav maga multiple attacker defense principles
  - krav maga drill of the week clip
  - krav maga scenario stress test footage
  - a day at the krav maga school vlog
  - krav maga pressure test reality check
  - why i train krav maga student story
  - krav maga seminar behind the scenes
  - krav maga combatives training montage
  - krav maga instructor interview on training
  - krav maga student interview on confidence
