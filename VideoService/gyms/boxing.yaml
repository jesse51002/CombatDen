gym_id: boxing
gym_type:
- boxing
theme: SweetScienceBoxing
videos:
  specification:
    short_videos_desc: 'Boxing technique and follow-along class content — fundamentals,
      footwork, defense, combinations, and bag/pad work from credible coaches — plus
      the fun side: fight highlights and knockout reels, gym vlogs, funny sparring
      moments, and fighter interviews.'
    short_avoid_desc: Off-topic, clickbait, street-fight "one-punch knockout" fantasy,
      "learn to box in 7 days" promises, supplement scams, and "boxing vs MMA / is
      boxing useless" or anti-boxing debate clips.
    videos_desc: |-
      # What we surface

      Technique, class, and film-study content for boxing members — plus the
      fun, human side, so it's a feed members enjoy, not just a drill library.

      ## Technique & training
      - Fundamentals: stance, footwork, jab, cross, hooks, uppercuts
      - Defense: slips, rolls, blocks, parries
      - Combinations
      - Follow-along heavy-bag, pad-work, and footwork drills, plus
        boxing-specific conditioning, from established coaches and gyms

      ## The fun & human side
      - Classic and modern fight breakdowns
      - Knockout and combination highlight reels
      - Gym vlogs and "a day at the boxing gym", training-camp behind-the-scenes
      - Funny sparring moments and amateur first-fight stories
      - Fighter interviews and motivational montages
    avoid_desc: |-
      # What we avoid

      Anything not about boxing; off-topic, genuinely low-quality, or clickbait
      videos.

      ## Reject
      - Street-fight / self-defense fantasy ("one punch to end any fight",
        "deadliest knockout move")
      - McDojo-style "learn to box in 7 days / go pro fast" promises
      - Sketchy supplement promos and unsanctioned backyard-brawl footage
      - "boxing vs MMA", "is boxing useless in a street fight", and similar
        anti-boxing debate / reaction videos

      ## Keep in mind
      Don't drop a video just for being a highlight, a vlog, or entertaining —
      fun content is wanted.
  queries:
  - boxing fundamentals stance and footwork tutorial
  - how to throw a jab correctly
  - cross hook and uppercut technique breakdown
  - boxing defense slip roll and parry drills
  - heavy bag boxing workout follow along
  - boxing pad work combinations
  - footwork drills for boxing beginners
  - shadow boxing routine for technique
  - boxing conditioning and strength workout
  - how to wrap your hands for boxing
  - counter punching tactics explained
  - classic championship fight breakdown analysis
  - greatest boxing knockouts highlights
  - best boxing combinations of all time
  - a day at the boxing gym vlog
  - funny boxing sparring moments
  - amateur boxer first fight experience
  - pro boxer training camp behind the scenes
  - boxing coach interview on the sweet science
  - boxing motivation training montage
