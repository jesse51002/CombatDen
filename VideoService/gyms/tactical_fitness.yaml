gym_id: tactical_fitness
gym_type:
- tactical_fitness
theme: TacticalPrep
videos:
  specification:
    short_videos_desc: 'Tactical / military and first-responder fitness prep — rucking,
      run and PT test prep, work capacity, and selection-standard training from credible
      coaches and operators — plus the fun side: selection and ruck-event footage,
      challenge attempts, "a day of training" vlogs, veteran and operator interviews,
      and honest mission-minded motivation.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      clips, sketchy supplement promos, fashion-tacticool gear hauls, or "this PT
      test is useless" debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Prep, technique, and programming content for tactical / military and
      first-responder fitness members training to a real standard — plus the
      fun and human side, so it's a feed members enjoy, not just a how-to
      library.

      ## Technique & standards training
      - Rucking technique and progression
      - Run and ruck-run pacing
      - PT-test prep: push-ups, pull-ups, sit-ups, 1.5–2 mile run, beep test
      - Work-capacity and load-bearing conditioning
      - Strength for durability
      - Selection-course and academy entrance prep from credible coaches,
        veterans, and operators

      ## The fun & human side
      - Selection and ruck-event footage
      - Fitness-test and challenge attempts, pass-the-test celebration clips
      - "A day of training" vlogs
      - Veteran and operator interviews and stories
      - Mission-minded motivation montages built around a pass-or-fail bar
    avoid_desc: |-
      # What we avoid

      Anything not about tactical / military / first-responder fitness prep;
      off-topic, genuinely low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - Fashion-tacticool gear hauls that aren't about training
      - "Tactical fitness vs CrossFit / bodybuilding" and "is this PT test
        useless / rucking will destroy your knees" cross-discipline or
        anti-discipline debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
  queries:
  - rucking technique and form tutorial
  - how to start rucking for beginners
  - military pt test preparation plan
  - improve your 2 mile run time for selection
  - pull-up and push-up improvement program
  - work capacity conditioning workout tactical
  - selection course physical preparation
  - police academy fitness test prep
  - tactical fitness full workout follow along
  - how to train for military selection
  - military selection course footage
  - ruck event race day vlog
  - i passed the fitness test celebration
  - tactical athlete a day of training vlog
  - special forces selection prep story
  - veteran interview military fitness journey
  - operator fitness challenge attempt
  - firefighter academy fitness experience vlog
  - veteran coach interview tactical training
  - tactical fitness training motivation montage
