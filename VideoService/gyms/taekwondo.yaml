gym_id: taekwondo
gym_type:
- taekwondo
theme: TaekwondoAcademy
videos:
  specification:
    short_videos_desc: 'Olympic-style taekwondo technique and sparring training —
      kicks, footwork, combinations, and competition tactics (WT/Kukkiwon) from credible
      coaches — plus the fun side: Olympic sparring highlights, spinning-kick KO reels,
      demo-team performances, gym vlogs, and coach and athlete interviews.'
    short_avoid_desc: Off-topic, clickbait, kids' belt-factory / "black belt in months"
      McDojo promises, cartoon "hi-YAA" karate-kid parody, street-fight "deadliest
      kick" fantasy, and "taekwondo vs X / is it useless" anti-taekwondo debate clips.
    videos_desc: |-
      # What we surface

      Technique, class, and study content for Olympic-style taekwondo members —
      plus the fun, human side, so it's a feed members enjoy, not just a drill
      library.

      ## Technique & training
      - Kicks: roundhouse, side, back, axe, spinning and jumping kicks
      - Chamber mechanics, footwork, and stance transitions
      - Sparring combinations, counters, and distance/timing management
      - WT/Kukkiwon scoring tactics and competition strategy
      - Poomsae (forms) practice, follow-along kicking drills, and conditioning
        from credible coaches and competitive academies

      ## The fun & human side
      - Olympic and tournament sparring highlights
      - Spinning- and jumping-kick knockout reels
      - Demo-team and breaking performances
      - Gym vlogs and "a day at the taekwondo academy"
      - Funny training moments and first-tournament stories
      - Coach and athlete interviews and motivation montages
    avoid_desc: |-
      # What we avoid

      Anything not about taekwondo; off-topic, genuinely low-quality, or clickbait
      videos.

      ## Reject
      - Kids' belt-factory and McDojo-style "get your black belt in months /
        new belt every few weeks" promises
      - Cartoon "hi-YAA" karate-kid parody content
      - Street-fight / self-defense fantasy ("one kick to end any fight",
        "deadliest taekwondo kick")
      - "Taekwondo vs karate / kickboxing", "is taekwondo useless in a real
        fight", and similar cross-discipline or anti-taekwondo debate and
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, demonstration,
      or entertaining — fun content is wanted.
  queries:
  - taekwondo kicks tutorial for beginners
  - taekwondo roundhouse kick technique
  - taekwondo side kick and back kick breakdown
  - spinning hook kick tutorial taekwondo
  - taekwondo footwork and stepping drills
  - olympic taekwondo sparring combinations
  - taekwondo sparring counters and timing
  - poomsae taegeuk forms tutorial
  - taekwondo scoring tactics wt rules explained
  - axe kick and push kick technique taekwondo
  - olympic taekwondo match analysis
  - taekwondo competition sparring highlights
  - best taekwondo spinning kick knockouts reel
  - taekwondo demo team performance
  - a day at the taekwondo academy vlog
  - funny taekwondo training moments
  - taekwondo athlete first tournament experience
  - taekwondo black belt demonstration
  - taekwondo coach interview on competition
  - taekwondo athlete training motivation montage
