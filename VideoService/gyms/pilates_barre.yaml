gym_type:
- pilates_barre
theme: PilatesBarre
videos:
  specification:
    short_videos_desc: 'Pilates barre — the long line of barre fused with the control
      of pilates: ballet-rooted small pulses and isometric holds blended with pilates
      core and reformer work — plus the enjoyable side: instructor vlogs and "day
      in the life", studio behind-the-scenes, what a barre class is really like, aesthetic
      class edits, transformations, and interviews.'
    short_avoid_desc: No plain pilates with no barre or pure dance/ballet technique
      mislabeled as pilates barre, and no "ballerina body in X days" clickbait. Skip
      "barre vs pilates" framings and "barre is useless / does nothing" debate clips.
      (Fun vlogs, studio tours, class edits, and interviews are welcome.)
    videos_desc: |-
      # What we surface

      Technique, class, and method content for pilates barre members who want
      both the long line of the barre and the precise control of pilates — plus
      the fun, human side, so it's a feed members enjoy, not just a how-to library.

      ## Technique & classes
      - Ballet-rooted barre work: pliés, relevés, small pulses, isometric holds,
        leg lifts at the rail, and turn-out
      - Pilates core, glute, and reformer sequences fused with barre
      - Posture and alignment work shared across both methods
      - Full-length follow-along pilates barre classes
      - Single-exercise technique breakdowns: proper tuck/neutral, micro-pulses,
        port de bras, and common corrections from credible barre/pilates teachers
      - Props-optional variations using light weights, ball, and band

      ## The fun & human side
      - Instructor vlogs and "day in the life" of a pilates barre teacher
      - Studio behind-the-scenes and "what a pilates barre class is really like"
      - Relatable barre humour and class moments (the mid-pulse shake)
      - Aesthetic class edits
      - Before/after and "30 days of barre" transformation stories
      - Teacher interviews on the method
    avoid_desc: |-
      # What we avoid

      Anything not about pilates barre; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Plain pilates classes with no barre element
      - Pure ballet or dance-technique content and center-floor combinations
        mislabeled as pilates barre
      - Generic "booty / HIIT" gym workouts with no barre or pilates principles
      - Clickbait ("ballerina body in 7 days", "tiny dancer legs in 2 weeks")
        and scams or misinformation
      - "Barre vs pilates / which is better" cross-discipline framings
      - "Barre is useless / does nothing" debate or reaction rage-bait

      ## Keep in mind
      Don't drop a video just for being a vlog, a clip, a class edit, a highlight,
      or entertaining — fun and creator content is wanted.
