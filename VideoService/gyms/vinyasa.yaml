gym_id: vinyasa
gym_type:
- vinyasa
theme: VinyasaFlow
videos:
  specification:
    short_videos_desc: 'Led, full-length vinyasa flows with clear, breath-paced instruction
      — sun salutations, transitions, and alignment — plus the enjoyable side: teacher
      vlogs, studio and retreat behind-the-scenes, relatable class humour, and calming
      flow-with-music. Calm, studio-quality, beginner-to-intermediate.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "yoga for weight
      loss / flat abs" videos, gear hauls and product shilling, and "yoga vs pilates"
      or "yoga is useless/dangerous" debate clips.
    videos_desc: |-
      # What we surface

      Led, breath-paced vinyasa and flow content for members from first-timers
      to seasoned practitioners — plus the fun, human side of a flow practice
      so it's a feed members enjoy scrolling, not just a how-to library.

      ## Vinyasa technique & classes
      - Full-length led classes with clear breath-paced sequencing
      - Sun salutation (A and B) breakdowns and alignment
      - Key transitions and poses that recur in flow: chaturanga, the vinyasa
        transition, standing and balancing series
      - Short morning and evening flows
      - Foundational breath (ujjayi) and mobility that serve the practice

      ## The fun & human side of flow
      - Teacher and practitioner vlogs and "day in the life"
      - Studio and retreat behind-the-scenes
      - Relatable yoga humour and class moments
      - Aesthetic flow-with-music edits
      - Teacher and practitioner interviews
      - One-year-of-yoga transformation stories
    avoid_desc: |-
      # What we avoid

      Anything not about yoga or the flow lifestyle; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-burn "yoga for weight loss / flat abs in X days" clickbait
        promises
      - Heavy chanted-Sanskrit devotional sermons sold as the main point
      - Gear and leggings hauls and product shilling
      - "Yoga vs pilates / which is better" or "yoga is useless/dangerous"
        debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a highlight, or
      entertaining — fun and creator content is wanted.
  queries:
  - vinyasa flow full class 30 minutes
  - beginner vinyasa yoga foundations
  - sun salutation A and B breakdown tutorial
  - chaturanga to upward dog alignment
  - vinyasa transition tutorial step by step
  - morning energizing vinyasa flow
  - evening slow vinyasa wind-down flow
  - vinyasa flow for tight hips and hamstrings
  - crow pose and arm balance prep flow
  - common vinyasa mistakes and fixes
  - advanced strong vinyasa practice
  - day in the life of a yoga teacher
  - what a vinyasa class is really like
  - yoga teacher reacts to yoga fails
  - relatable yoga class moments funny
  - yoga retreat vlog
  - yoga studio behind the scenes
  - vinyasa flow with music aesthetic
  - yoga teacher interview on finding flow
  - one year of yoga transformation
