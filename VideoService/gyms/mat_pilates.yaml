gym_id: mat_pilates
gym_type:
- mat_pilates
theme: MatPilates
videos:
  specification:
    short_videos_desc: 'Equipment-free mat pilates with classical roots — the original
      mat order and exercises (the hundred, roll-up, single/double leg stretch, teaser)
      taught with breath and precision — plus the enjoyable side: instructor vlogs
      and "day in the life", studio behind-the-scenes, what a mat class is really
      like, aesthetic class edits, "30 days of pilates" transformations, and interviews.'
    short_avoid_desc: No reformer/apparatus classes mislabeled as mat, generic "ab
      workout / core shred" routines passed off as pilates, or "flat tummy in X days"
      clickbait. Skip "pilates vs yoga" framings and "mat pilates is useless / does
      nothing" debate clips. (Fun vlogs, studio tours, class edits, and interviews
      are welcome.)
    videos_desc: |-
      # What we surface

      Equipment-free mat pilates with classical roots for members from
      first-timers to longtime practitioners — technique and class content
      plus the fun, human side, so it's a feed members enjoy, not just a
      how-to library.

      ## Classical mat technique & classes
      - The original mat order and exercises: the hundred, roll-up, roll-over,
        single and double leg stretch, criss-cross, spine stretch, saw, swan,
        teaser, side-kick series, seal
      - Full-length follow-along mat classes (15-minute through 45-minute)
      - Single-exercise technique breakdowns and modifications from credible
        classically-trained teachers
      - Props-optional variations (small ball, magic circle, band) with the
        breath, control, and precision that define the method

      ## The fun & human side
      - Instructor vlogs and "day in the life" of a pilates teacher
      - Studio behind-the-scenes and "what a mat pilates class is really like"
      - Relatable pilates humour and class moments
      - Aesthetic class edits and before/after transformation stories
      - "30 days of pilates" journey videos and teacher interviews
    avoid_desc: |-
      # What we avoid

      Anything not about mat pilates; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Reformer / apparatus classes mislabeled as mat pilates
      - Generic "ab workout / core shred / six-pack" gym routines passed off
        as pilates that lack pilates principles
      - Clickbait ("flat tummy in 7 days", "tiny waist in 2 weeks"), scams,
        and misinformation
      - "Pilates vs yoga / which is better" cross-discipline framings
      - "Mat pilates is useless / does nothing" debate or reaction rage-bait

      ## Keep in mind
      A video is not rejected just for being a vlog, a clip, a class edit,
      or entertaining — fun and creator content is wanted.
