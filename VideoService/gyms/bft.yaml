theme: BFTIndie
videos:
  specification:
    short_videos_desc: 'BFT-style group strength-and-conditioning content — progressive
      strength and HIIT follow-alongs, barbell and dumbbell technique, and how programmed
      training blocks build week over week, from credible coaches — plus the fun side:
      "what a BFT-style class is really like" vlogs, member progress and transformation
      stories, behind-the-scenes, and community and coach interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-lifting / fake-PR
      clips, sketchy supplement promos, or "BFT is a scam / BFT vs F45" debate videos.
      Nothing off-topic.
    videos_desc: |-
      # What we surface

      Format, technique, and follow-along content for a group strength-and-
      conditioning studio in the BFT-style mould — plus the fun, human side, so
      it's a feed members enjoy, not just a how-to library.

      ## Strength & conditioning
      - Progressive strength sessions and HIIT conditioning circuits you can do
        at home
      - Barbell, dumbbell and kettlebell technique for the movements that recur
        on the floor: squat, deadlift, press, hinge, carries
      - Explainers on how progressive twelve-week training blocks and
        progressive overload stack week over week
      - Warm-up, mobility and recovery, from credible coaches
      - Measurable, programmed, block-by-block tone throughout

      ## The fun & human side
      - "What a BFT-style class is really like" walkthroughs
      - Member progress and transformation stories
      - Studio behind-the-scenes and community moments
      - PR-celebration and funny workout moments
      - Coach interviews — leaning on independent creator content rather than
        copyrighted branded class footage
    avoid_desc: |-
      # What we avoid

      Anything not about group strength-and-conditioning / HIIT training;
      off-topic, genuinely low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-lifting and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "BFT vs F45 / CrossFit" and "is BFT worth it / BFT is a scam /
        overpriced" cross-discipline or anti-discipline debate and reaction
        videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
  queries:
  - progressive strength training program explained
  - group strength and conditioning workout follow along
  - barbell squat deadlift press technique breakdown
  - dumbbell strength workout follow along
  - how progressive overload works over weeks
  - 12 week strength training block explained
  - hiit conditioning circuit follow along
  - full body strength workout for beginners
  - group hiit workout 45 minutes follow along
  - strength training movement mistakes and fixes
  - what a bft style class is really like
  - my first group strength class experience vlog
  - group strength training transformation story
  - strength studio behind the scenes
  - pr celebration group workout clips
  - funny group strength workout moments
  - day in the life group fitness coach
  - strength coach interview on block programming
  - group strength workout day in the life vlog
  - progressive strength training motivation
