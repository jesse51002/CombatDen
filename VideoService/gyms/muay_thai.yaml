gym_id: muay_thai
gym_type:
- muay_thai
theme: KillerMuayThai
videos:
  specification:
    short_videos_desc: 'Serious Muay Thai technique and follow-along training — the
      eight limbs, clinch, and fight drills from credible coaches and Thai camps —
      plus the fun side: stadium knockout and highlight reels, pro bout breakdowns,
      Thailand camp vlogs, funny sparring moments, and fighter and coach interviews.'
    short_avoid_desc: Off-topic, clickbait, street-fight "one elbow ends any fight"
      fantasy, "get fight-ready fast" promises, supplement scams, backyard-brawl footage,
      and "muay thai vs kickboxing / is it useless" anti-Muay-Thai debate clips.
    videos_desc: |-
      # What we surface

      Technique, class, and film-study content for serious Muay Thai members —
      plus the fun, human side, so it's a feed members enjoy, not just a drill
      library.

      ## Technique & training
      - The art of eight limbs: punches, elbows, knees, kicks, and teeps
      - The clinch and clinch-knee game, checking and countering
      - Timing and ring craft of the sport
      - Follow-along bag and pad rounds, sparring drills, and fighter-grade
        conditioning from established coaches and Thai camps

      ## The fun & human side of Muay Thai
      - Breakdowns of classic and current pro bouts
      - Lumpinee/Rajadamnern and ONE-style stadium highlight and knockout reels
      - Thailand training-camp vlogs and "a day at the gym"
      - Behind-the-scenes from fight camp
      - Funny sparring moments and amateur first-fight stories
      - Fighter and coach interviews, and motivation montages
    avoid_desc: |-
      # What we avoid

      Anything not about Muay Thai; off-topic, genuinely low-quality, or clickbait
      videos.

      ## Reject
      - Cardio-kickboxing or "bag-fitness" classes dressed up as Muay Thai
      - Street-fight / self-defense fantasy ("one elbow to end any fight",
        "deadliest technique")
      - McDojo-style "get fight-ready fast / go pro in months" promises
      - Sketchy supplement promos and unsanctioned backyard-brawl footage
      - "Muay thai vs kickboxing", "is muay thai useless in a street fight", and
        similar cross-discipline or anti-Muay-Thai debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being a highlight, a vlog, or entertaining —
      fun content is wanted.
  queries:
  - muay thai fundamentals technique tutorial
  - muay thai teep and push kick breakdown
  - muay thai roundhouse kick technique
  - muay thai elbow strikes tutorial
  - muay thai knee strikes and clinch entries
  - muay thai clinch control and sweeps tutorial
  - how to check a kick muay thai
  - muay thai punch and kick combinations
  - heavy bag muay thai workout follow along
  - muay thai counters and timing breakdown
  - classic lumpinee stadium fight breakdown
  - best muay thai knockouts and highlights
  - greatest muay thai elbow knockouts reel
  - training muay thai in thailand camp vlog
  - a day at the muay thai gym vlog
  - funny muay thai sparring moments
  - amateur muay thai first fight experience
  - thai fighter training camp behind the scenes
  - muay thai coach interview on the art of eight limbs
  - muay thai training motivation montage
