gym_id: treadmill
gym_type:
- treadmill
theme: TreadmillRun
videos:
  specification:
    short_videos_desc: 'Treadmill running-studio classes for people who come to actually
      run — follow-along tempo, interval and hill sessions with a coach calling splits,
      plus the fun side: "what a treadmill studio class is really like", run vlogs,
      instructor vibes and playlists, funny class moments, race-prep stories, and
      coach interviews.'
    short_avoid_desc: Off-topic, clickbait "walk to burn 1000 calories" gimmicks,
      and "treadmill vs outdoor running which is better" or "is the treadmill bad
      for you" debate clips.
    videos_desc: |-
      # What we surface

      Treadmill running-studio content for people who come to run, not
      jog while watching TV — plus the fun, human side of the studio so
      it's a feed members enjoy, not just a how-to library.

      ## Coached classes & technique
      - Follow-along coached sessions: tempo runs, speed intervals, hill /
        incline sessions, progression and endurance runs
      - Pace and incline cues you can dial in during class
      - Instruction on running form, cadence and footstrike
      - How to pick paces, warm up, use incline, and read the belt
      - Beginner first-class walkthroughs and treadmill-specific conditioning

      ## The fun & human side
      - "What a treadmill studio class is really like" experiential videos
      - Run vlogs and "day in the life" at a running studio
      - Instructor vibes and playlists
      - Relatable class humour and funny treadmill moments
      - Race-prep and transformation stories
      - Coach interviews — running-culture energy, not a fitness-class gimmick
    avoid_desc: |-
      # What we avoid

      Anything not about treadmill running; off-topic, genuinely low-quality,
      or clickbait videos.

      ## Reject
      - Calorie-bait "walk this incline to burn 1000 calories / melt fat fast"
        gimmick titles
      - "Treadmill vs outdoor running / treadmill vs running which is better"
        cross-discipline framings
      - "Is the treadmill bad for you / treadmills ruin your form" debate or
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or entertaining
      — fun content is wanted.
  queries:
  - treadmill running interval workout follow along
  - treadmill tempo run class with a coach
  - treadmill hill incline workout session
  - beginner treadmill running class what to expect
  - treadmill speed intervals workout
  - how to run with proper form tutorial
  - running cadence and footstrike explained
  - how to pick your treadmill paces
  - 30 minute treadmill running workout
  - how to use incline on a treadmill for training
  - what a treadmill studio class is really like
  - best treadmill class running playlist
  - treadmill studio behind the scenes
  - funny treadmill class moments
  - star treadmill running instructor full class
  - treadmill running race prep vlog
  - running coach interview on treadmill training
  - day in the life running studio coach
  - my first treadmill studio class vlog
  - one year of treadmill running transformation
