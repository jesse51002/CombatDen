theme: PowerCycling
videos:
  specification:
    short_videos_desc: 'Power-meter-led indoor cycling that trains by the numbers
      — FTP testing, structured watt-target intervals, zone work and threshold sessions,
      plus the fun side: pain-cave ride vlogs, FTP-test reaction clips, coach interviews,
      community challenge highlights, and structured-training progress stories.'
    short_avoid_desc: Off-topic, clickbait "gain 50 watts in a week" gimmicks, and
      "power vs rhythm spin / which is better" or "is FTP testing pointless" debate
      clips.
    videos_desc: |-
      # What we surface

      Technique, training, and metric-driven content for riders who come to
      train by the numbers — plus the fun, human side, so it's a feed members
      enjoy, not just a how-to library.

      ## Structured training & technique
      - Follow-along sessions built around watts and heart-rate zones: FTP /
        threshold tests, VO2 max and over-unders, sweet-spot and endurance
        base rides
      - How to set FTP, calibrate a power meter, read the power curve, and
        pace an interval to a target
      - Cadence drills, pedal-stroke efficiency, and using zones to build
        measurable progress

      ## The fun & human side
      - Pain-cave ride vlogs and "day in the life" of structured training
      - FTP-test reaction and attempt videos
      - Community challenge and event highlights
      - Coach interviews and the satisfying-progress stories that keep
        numbers fun
    avoid_desc: |-
      # What we avoid

      Anything not about power / metrics indoor cycling; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-bait "burn 1000 calories / melt fat fast" gimmick titles
      - "Power cycling vs rhythm spin / which is better" cross-discipline
        framings
      - "Is FTP testing pointless / power meters are a waste" debate or
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
  queries:
  - FTP test indoor cycling 20 minute protocol
  - how to set your FTP for indoor cycling
  - power based interval workout follow along
  - sweet spot training ride structured workout
  - VO2 max intervals indoor cycling session
  - threshold intervals cycling workout with targets
  - endurance base ride zone 2 follow along
  - how to read a power curve cycling
  - cycling power zones explained for beginners
  - pedal stroke technique for power on the bike
  - 45 minute power intervals indoor cycling class
  - heart rate vs power training cycling explained
  - FTP test attempt and reaction vlog
  - pain cave indoor cycling setup tour
  - cycling coach interview on power training
  - day in the life structured cycling training
  - indoor cycling power challenge highlights
  - what an FTP test is really like
  - one year of structured cycling progress
  - funny moments during an FTP test
