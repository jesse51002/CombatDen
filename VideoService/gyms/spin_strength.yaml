gym_id: spin_strength
gym_type:
- spin_strength
theme: SpinStrength
videos:
  specification:
    short_videos_desc: 'Hybrid spin-and-strength classes that cross from the saddle
      to the dumbbell rack — follow-along rides paired with floor strength blocks,
      plus the fun side: "what a spin-and-strength class is really like", studio vlogs
      and behind-the-scenes, instructor vibes and playlists, funny class moments,
      and transformation stories.'
    short_avoid_desc: Off-topic, clickbait "get toned in 7 days" gimmicks, and "spin
      vs lifting / cardio vs weights which is better" or "cardio kills your gains"
      debate clips.
    videos_desc: |-
      # What we surface

      Hybrid cycle-plus-strength content for members who want both engines
      trained in one class — plus the fun, human side, so it's a feed members
      enjoy, not just a how-to library.

      ## Spin & strength technique
      - Follow-along sessions that alternate spin intervals on the bike with
        floor strength blocks
      - Dumbbell, kettlebell, and bodyweight work for legs, push, pull, and core
      - Instruction on bike setup, cadence, and resistance
      - Clean lifting form for the off-bike moves
      - How to structure a bike-and-bench session, transition efficiently
        between the two, and pair conditioning with strength

      ## The fun & human side
      - "What a spin-and-strength class is really like" videos
      - Studio vlogs and behind-the-scenes
      - Instructor vibes and playlists
      - Relatable class humour and funny moments
      - Transformation stories and instructor interviews
    avoid_desc: |-
      # What we avoid

      Anything not about cycle-plus-strength training; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-bait "burn 1000 calories / shred fat fast" gimmick titles
      - "Spin vs lifting / cardio vs weights which is better" cross-discipline
        framings
      - "Cardio kills your gains / spinning makes you skinny-fat" debate or
        reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
  queries:
  - spin and strength hybrid class full workout
  - bike and dumbbell hybrid workout follow along
  - cycle and weights interval class 45 minutes
  - how to structure a spin and strength session
  - dumbbell strength block after cycling workout
  - upper body strength routine for spin class
  - lower body dumbbell workout for cyclists
  - bike setup and posture for spin class beginners
  - proper dumbbell squat and lunge form
  - transitioning from bike to floor in hybrid class
  - low impact cycle and strength class beginners
  - what a spin and strength class is really like
  - best spin and strength class playlist
  - hybrid studio behind the scenes
  - funny spin and strength class moments
  - star hybrid spin instructor full class
  - hybrid fitness coach interview cardio and strength
  - day in the life hybrid studio coach
  - my first spin and strength class vlog
  - one year of spin and strength transformation
