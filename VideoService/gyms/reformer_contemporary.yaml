gym_id: reformer_contemporary
gym_type:
- reformer_contemporary
theme: ReformerContemporary
videos:
  specification:
    short_videos_desc: 'Contemporary reformer pilates classes for every level and
      body — flowing sequences, modern variations, and clear cueing for footwork,
      planks, lunges and core — plus the enjoyable side: instructor vlogs and "day
      in the life", studio behind-the-scenes, what a reformer class is really like,
      aesthetic class edits, transformations, and teacher interviews.'
    short_avoid_desc: No mat-only or generic ab routines mislabeled as reformer, "strict
      classical order only" purist lectures passed off as the point, or "drop a dress
      size in X days" clickbait. Skip "reformer vs mat" framings and "pilates is useless/overrated"
      debate clips. (Fun vlogs, studio tours, class edits, and interviews are welcome.)
    videos_desc: |-
      # What we surface

      Contemporary reformer pilates instruction for the broad modern audience
      — first-timers and regulars stringing a few classes a week — plus the
      fun, human side so it's a feed members enjoy, not just a how-to library.

      ## Technique & classes
      - Flowing, athletic sequences on the reformer: footwork variations, leg
        and feet in straps, reformer planks and pike, lunges, side-lying and
        standing work, and core series
      - Modern progressions and modifications for every body
      - Full-length follow-along reformer classes (express 20-minute through
        45-minute full-body)
      - Single-exercise tutorials and form cues from credible contemporary
        teachers
      - Spring-setting and level-up guidance

      ## The fun & human side
      - Instructor vlogs and "day in the life"
      - Studio behind-the-scenes
      - "What a reformer class is really like"
      - Relatable pilates humour and class moments
      - Aesthetic class edits
      - Before/after and "30 days of reformer" transformation stories
      - Teacher interviews
    avoid_desc: |-
      # What we avoid

      Anything not about contemporary reformer pilates; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Mat-only routines or generic "ab / core burner" workouts mislabeled
        as reformer
      - At-home "reformer alternative" band improvisations sold as the real
        apparatus
      - Strict-classical purist lectures presented as the only right way
      - Clickbait ("drop a dress size in 7 days", "snatched waist in 2 weeks"),
        scams and misinformation
      - "Reformer vs mat / contemporary vs classical which is better"
        cross-style framings
      - "Pilates is useless/overrated" debate or reaction rage-bait

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, class edit, or
      entertaining — fun and creator content is wanted.
