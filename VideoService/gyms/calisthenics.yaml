gym_id: calisthenics
gym_type:
- calisthenics
theme: Calisthenics
videos:
  specification:
    short_videos_desc: 'Calisthenics skill and follow-along content — muscle-up, planche,
      front lever, handstand and human-flag progressions, foundational strength, and
      credible coaching — plus the fun side: athlete and street-workout skill showcases,
      competition battles, first-skill PR clips, transformation stories, vlogs, and
      athlete interviews.'
    short_avoid_desc: No "get shredded in 30 days" clickbait, ego-rep / fake-PR fail
      clips, sketchy supplement promos, or "calisthenics is useless / calisthenics
      vs weights" debate videos. Nothing off-topic.
    videos_desc: |-
      # What we surface

      Skill, class, and progression content for calisthenics studio members —
      plus the fun, human side, so it's a feed members enjoy, not just a how-to
      library. Movement-first, patient, skill-driven tone throughout.

      ## Skills & progressions
      - Step-by-step progressions for the bodyweight skills: muscle-up, front
        and back lever, planche, handstand and handstand push-up, human flag,
        pistol squat, one-arm pull-up
      - Foundational strength: pull-ups, dips, rows, push-ups
      - Ring and bar work
      - Mobility and prehab for the wrists and shoulders
      - Full follow-along workouts and structured programming from credible
        coaches

      ## The fun & human side
      - Athlete and street-workout skill showcases
      - Calisthenics competition and battle footage
      - First-muscle-up and first-skill celebration clips
      - Transformation stories and "a day of training" vlogs
      - Athlete interviews and training motivation montages that celebrate the
        slow patient mastery of the body itself
    avoid_desc: |-
      # What we avoid

      Anything not about calisthenics / bodyweight skill training; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - "Get shredded / abs in 30 days" clickbait
      - Dangerous ego-rep and fake-PR fail compilations
      - Sketchy supplement or steroid/SARMs promos
      - "Calisthenics vs weights / gym" and "is calisthenics useless /
        calisthenics will wreck your joints" cross-discipline or
        anti-discipline debate and reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted.
  queries:
  - muscle up progression tutorial
  - front lever progression step by step
  - planche progression for beginners
  - handstand progression tutorial
  - human flag progression tutorial
  - first pull-up progression for beginners
  - ring strength training for calisthenics
  - calisthenics full body workout follow along
  - calisthenics beginner routine no equipment
  - wrist and shoulder mobility for calisthenics
  - calisthenics skill showcase athlete
  - street workout competition battle highlights
  - first muscle up celebration reaction
  - calisthenics transformation one year story
  - satisfying calisthenics skills edit
  - calisthenics athlete a day of training vlog
  - funny calisthenics gym moments
  - park calisthenics community session
  - calisthenics athlete interview on training
  - calisthenics training motivation montage
