theme: VersaClimber
videos:
  specification:
    short_videos_desc: 'VersaClimber vertical-climber intervals — follow-along climb
      workouts, proper climbing form and cadence, and timed-ascent / metres-climbed
      sessions, plus the fun side: "what a VersaClimber class is really like", studio
      vlogs and behind-the-scenes, metres-climbed challenge highlights, funny class
      moments, transformation stories, and coach interviews.'
    short_avoid_desc: Off-topic, clickbait "burn 1000 calories climbing" gimmicks,
      and "VersaClimber vs treadmill / vs stair climber which is better" or "is the
      VersaClimber worth it" debate clips.
    videos_desc: |-
      # What we surface

      Vertical-climber cardio content for people who want the hardest
      twenty-five minutes of their week — plus the fun, human side, so
      it's a feed members enjoy, not just a how-to library.

      ## Technique & climb training
      - Follow-along VersaClimber workouts and classes: climb intervals,
        EMOM and Tabata-style efforts, metres-climbed challenges, and
        endurance ascents
      - Instruction on proper climbing form, hand-and-foot coordination,
        stroke length, cadence, and how to set resistance and pace a climb
      - Full-body, low-impact conditioning and beginner first-climb
        walkthroughs

      ## The fun & human side
      - "What a VersaClimber class is really like" and studio vlogs
      - Behind-the-scenes at the studio
      - Metres-climbed challenge highlights
      - Relatable class humour and funny moments
      - Transformation stories and coach interviews
    avoid_desc: |-
      # What we avoid

      Anything not about VersaClimber / vertical-climber training; off-topic,
      genuinely low-quality, or clickbait videos.

      ## Reject
      - Rock climbing, outdoor climbing, and bouldering (different discipline)
      - Stair-climber / StairMaster machine content (different discipline)
      - Calorie-bait "burn 1000 calories climbing / melt fat fast" gimmick
        titles
      - "VersaClimber vs treadmill / vs stair climber which is better"
        cross-discipline framings
      - "Is the VersaClimber worth it / vertical climbers are pointless"
        debate or reaction videos

      ## Keep in mind
      Don't drop a video just for being a vlog, clip, highlight, or
      entertaining — fun content is wanted.
