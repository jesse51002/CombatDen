gym_id: dance_barre
gym_type:
- dance_barre
theme: BootyBarre
videos:
  specification:
    short_videos_desc: 'Dancey, playful booty-barre / dance-barre — full choreography,
      hip work, and plié-and-pulse sequences where the barre is the stage, in follow-along
      classes and routine breakdowns — plus the fun side: instructor vlogs, studio
      behind-the-scenes, funny dance bloopers, performance edits, and transformation
      stories.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "twerk your way
      to a booty in 14 days" videos, gymwear hauls and product shilling, and "barre
      vs pilates" or "is dance barre even a real workout" debate clips.
    videos_desc: |-
      # What we surface

      Follow-along and choreography content for dance barre members in the
      BootyBarre tradition — barre work that feels like dance, with the barre
      treated as a partner — plus the fun, human side, so it's a feed members
      enjoy, not just a routine library. The tone is theatrical and playful.

      ## Choreography & classes
      - Full-length dance barre classes
      - Choreography and eight-count breakdowns
      - Glute, hip, and leg sculpting blocks
      - Full choreography, hip and booty work, and plié-and-pulse sequences
      - Beginner-to-dancer modifications from reputable barre teachers and
        studios

      ## The fun & human side
      - Instructor vlogs and "day in the life", studio behind-the-scenes
      - "What a dance barre class is really like"
      - Funny class bloopers and moments
      - High-energy playlist classes and motivational montages
      - Aesthetic performance edits, instructor interviews, and transformation
        stories
    avoid_desc: |-
      # What we avoid

      Anything not about dance barre; off-topic, genuinely low-quality, or
      clickbait videos.

      ## Reject
      - Clickbait body-transformation framing ("twerk your way to a booty /
        Brazilian butt in 14 days", "lose 10 lbs in a week")
      - Gymwear/leggings hauls and product shilling
      - "Barre vs pilates / which is better" or "barre vs Zumba / dance cardio"
        cross-discipline framings (they advertise rivals)
      - "Is dance barre even a real workout / does barre work" debate or
        reaction videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun and creator content is wanted.
