theme: CardioBoxing
videos:
  specification:
    short_videos_desc: 'No-contact rhythm boxing for fitness — follow-along combo
      workouts timed to the music on free-standing bags or shadow, with form cues
      for clean punches, plus the fun side: "what a cardio boxing class is really
      like", studio vlogs and behind-the-scenes, instructor vibes and playlists, funny
      class moments, and transformation stories. Fitness boxing only: never sparring,
      never partner contact.'
    short_avoid_desc: No real sparring, self-defense, fight technique or competition
      footage — this is no-contact fitness boxing. Also off-topic, "knockout in one
      punch" fantasy, calorie-bait gimmicks, and "boxing vs X / is cardio boxing useless"
      debate clips.
    videos_desc: |-
      # What we surface

      No-contact rhythm boxing content for people who want the workout of
      boxing without ever sparring a partner — plus the fun, human side of the
      studio, so it's a feed members enjoy, not just a how-to library.

      ## Workouts & form
      - Follow-along combo workouts timed to the music: jab-cross-hook
        combinations, shadow boxing rounds, free-standing-bag and heavy-bag
        cardio drills
      - Form cues for clean punches, stance, guard, and footwork done for
        fitness
      - For total beginners through seasoned fitness-boxing regulars

      ## The fun & human side
      - "What a cardio boxing class is really like"
      - Studio vlogs and behind-the-scenes
      - Beat-coded playlist and themed workouts
      - Instructor vibes and high-energy sets
      - Relatable class humour, transformation stories, and instructor
        interviews

      The point is rhythm boxing — combo plus beat — purely as a workout, never
      sparring, never harm.
    avoid_desc: |-
      # What we avoid

      Anything not about no-contact fitness boxing; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Real-combat content: sparring, partner drills, self-defense, and
        competitive / amateur / pro fight footage and fight-technique
        breakdowns
      - Street-fight / "one punch knockout" / "deadliest" fantasy clips
      - Calorie-bait "burn 1000 calories boxing / melt fat fast" gimmick titles
      - "Boxing vs MMA / cardio boxing vs real boxing which is better"
        cross-discipline framings
      - "Is cardio boxing useless / fitness boxing is fake" debate or reaction
        videos

      ## Keep in mind
      Don't drop a video just for being short, a vlog, a clip, a highlight, or
      entertaining — fun content is wanted, as long as it stays no-contact
      fitness boxing.
