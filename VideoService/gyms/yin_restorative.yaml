gym_id: yin_restorative
gym_type:
- yin_restorative
theme: YinRestorative
videos:
  specification:
    short_videos_desc: 'Yin and restorative classes built on long, supported holds
      — bolsters, blankets and props, deep stillness, and slow breathing for the parasympathetic
      nervous system — plus the gentle, human side: teacher vlogs, studio behind-the-scenes,
      soft relatable class moments, calming candlelit flow-with-music, and teacher
      interviews. Gentle, quiet, deeply restful.'
    short_avoid_desc: Off-topic, genuinely low-quality, or clickbait "yoga for weight
      loss / flat abs" videos, gear/leggings hauls and product shilling, and "yoga
      vs pilates" or "yoga is useless/dangerous" debate clips.
    videos_desc: |-
      # What we surface

      Yin and restorative content for members from burnt-out professionals
      chasing real rest to long-time practitioners using yin as the slow
      other-half of their practice — plus the gentle, human side, so it's
      a feed members enjoy scrolling, not just a how-to library.

      ## Yin & restorative practice
      - Long, passive floor holds that target connective tissue and fascia
      - Fully supported restorative poses with bolsters, blankets, and props
      - Deep stillness and slow breathing that down-regulate the nervous system
      - Yin sequences by target area: hips, spine, and shoulders
      - Restorative classes for stress, sleep, and recovery
      - Breathwork, body-scan, and yoga nidra guided relaxation
      - Prop set-up tutorials

      ## The gentle & human side
      - Teacher and practitioner vlogs and "what a yin class is really like"
      - Studio behind-the-scenes
      - Soft, relatable class moments
      - Aesthetic candlelit practice-with-music edits
      - Teacher interviews on stillness
      - Restful practice-journey stories
    avoid_desc: |-
      # What we avoid

      Anything not about yin or restorative yoga; off-topic, genuinely
      low-quality, or clickbait videos.

      ## Reject
      - Calorie-burn "melt fat while you relax / yoga for weight loss"
        promises
      - Heavy chanted-Sanskrit devotional sermons sold as the main point
      - Gear and leggings hauls and product shilling
      - "Yoga vs pilates / which is better" or "yoga is useless/dangerous"
        debate and reaction videos

      ## Keep in mind
      A video is NOT rejected just for being short, a vlog, a clip, a
      highlight, or entertaining — gentle fun and creator content is wanted.
  queries:
  - yin yoga full class for beginners
  - restorative yoga with bolsters full class
  - yin yoga for hips long holds
  - yin yoga for the spine and back
  - restorative yoga for stress and anxiety
  - yin yoga for deep sleep before bed
  - how to set up restorative yoga props
  - yin yoga shoulders and neck release
  - yoga nidra guided relaxation full length
  - yin yoga for fascia and connective tissue
  - yin yoga meridians explained
  - what a yin yoga class is really like
  - day in the life of a yin yoga teacher
  - relatable slow yoga class moments gentle
  - yin yoga studio behind the scenes
  - candlelit yin yoga practice with music aesthetic
  - how yin yoga changed my life calm practice journey
  - yin restorative yoga teacher interview on stillness
  - body scan relaxation guided yoga
  - what is yin yoga explained for beginners
