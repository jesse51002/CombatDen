font_set:
  fonts:
    display:
      family: Sora
      category: sans-serif
      display_name: Modern Athletic Display
      description: A confident, geometric sans-serif built for headlines with a distinctly
        contemporary edge — rounded but sharp, geometric but warm. Sora reads as premium
        and kinetic at large sizes without the grim heaviness of condensed athletic
        clichés; it carries Strike's electric, approachable energy and pairs naturally
        with a quieter body sans. The clear numerals perform beautifully on celebration
        screens.
    body:
      family: DM Sans
      category: sans-serif
      display_name: Quiet Professional Grotesque
      description: A humanist grotesque with a generous x-height, open counters, and
        neutral personality optimized for UI legibility at small sizes on dark screens.
        DM Sans sits confidently in Sora's shadow — it's from the same modern, geometric
        school but at body weight it disappears into the interface, letting display
        and colour lead. Strong weight ladder (Regular through Bold) enables clean
        hierarchy without the noise of a competing personality.
