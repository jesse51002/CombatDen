app: combatden
display_name: CombatDen
image_set:
  images:
    logo_primary:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/logo_primary.png
      prompt: A clean circular emblem logo with a bold stylized boxing glove silhouette
        centred inside a thin ring, single front-facing mark, crisp neon edge-light
        tracing the glove and ring on their own contours, glossy modern finish, acid-lime
        glove with a single electric-violet rim accent, flat solid pure-black background,
        professional gym brand mark style
      complexity: medium
    rank_belt:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/rank_belt.png
      prompt: A championship martial-arts belt coiled into a centred symmetrical emblem
        with a polished metal centre plate embossed with a bold strike insignia, straight-on
        and perfectly balanced, glossy 3D leather and chrome materials with vivid
        neon rim-light tracing its edges, acid-lime and electric-violet glow pooling
        across its own surfaces with a touch of lens-flare pop, flat solid pure-black
        background, premium neon-lit emblem style
      complexity: medium
    celebration_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/celebration_image.png
      prompt: A bold stylized mascot character — a confident cartoon fox in red boxing
        gloves throwing a forward jab — with a glowing class-pass ticket and a small
        calendar token floating beside it, balanced floating composition with a controlled
        neon burst radiating from the centre, glossy modern 3D with vivid acid-lime
        rim-light and electric-violet edge-glow, crisp neon spotlight shading on each
        object's own surfaces, acid-lime and electric-violet palette, flat solid pure-black
        background, kinetic neon-signage 3D illustration style
      complexity: high
    trophy_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/trophy_image.png
      prompt: A bold chunky 3D trophy with a wide cup and twin handles on a stout
        base, balanced floating composition with an energetic burst of small angular
        sparks and light streaks radiating outward from behind it, glossy chrome and
        acid-lime neon edge-lit surfaces with violet rim-glow and a touch of lens-flare
        pop, crisp reflections on its own curved metal, flat solid pure-black background,
        glowing neon-signage 3D style
      complexity: high
    points_stars_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/points_stars_image.png
      prompt: A tight cluster of glossy 3D four-point sharp stars bursting outward
        from a central brighter hero star, balanced floating composition with a controlled
        radial burst of slim neon streaks and a few small sparks, glossy acid-lime
        bodies with crisp neon rim-glow and faint electric-violet edge-light tracing
        their facets, dramatic stage-lit specular highlights on their own beveled
        surfaces, flat solid pure-black background, sleek neon-signage 3D style
      complexity: high
    next_rank_belt_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/next_rank_belt_image.png
      prompt: A higher-tier martial-arts belt coiled into a centred symmetrical emblem
        with a polished metal centre plate embossed with a stylised tier insignia
        and small rank stripes at its tip, straight-on and perfectly balanced, glossy
        3D leather and chrome materials with vivid neon rim-light tracing its edges,
        electric-violet glow pooling across its own surfaces with a restrained acid-lime
        accent, flat solid pure-black background, premium neon-lit aspirational emblem
        style
      complexity: medium
    giftbox:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/giftbox.png
      prompt: A wrapped cube gift box tied with a crisp ribbon and a bold top bow,
        single hero object floating front-and-centre with a slight dynamic tilt mid-spin,
        glossy 3D electric-violet box wrapping and a vivid acid-lime ribbon and bow,
        neon rim-glow tracing every edge with a faint lime spill across the box's
        own faces and a touch of lens-flare pop on the bow knot, flat solid pure-black
        background, sleek neon-signage 3D style
      complexity: medium
    single_point:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/single_point.png
      prompt: A single four-point sharp star token, one symmetrical front-facing object
        centred in frame, glossy 3D acid-lime body with a crisp neon rim-glow and
        a faint violet edge-light tracing its facets, clean beveled surfaces catching
        a small specular highlight, flat solid pure-black background, sleek neon-signage
        3D style
      complexity: low
    icon_qrcode:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/icon_qrcode.png
      prompt: A stylized square QR-code glyph with rounded modular squares and three
        corner finder marks, single object front-facing and perfectly centred, clean
        glossy 3D surface with a thin acid-lime neon rim-glow tracing its outer edge,
        crisp even light shading its own faceted modules, deep near-black face with
        one quiet violet inner highlight, flat solid pure-black background, minimal
        app-icon style
      complexity: low
    streak_icon:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T045545Z/final_images/streak_icon.png
      prompt: A bold lightning bolt glyph, single object front-facing and centred,
        glossy 3D with vivid acid-lime surface and a clean neon rim-glow tracing its
        own edge, crisp form with smooth bevels and subtle violet edge-light on one
        side for depth, flat solid pure-black background, sharp neon-signage icon
        style legible at tiny sizes
      complexity: low
