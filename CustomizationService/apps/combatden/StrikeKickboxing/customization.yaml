design_direction:
  name: Strike Kickboxing
  short_desc: 'Throw hands, charge up — a neon-lit kickboxing gym for the after-work
    crowd who come to punch out the day and feel alive: bright, fast, and social.'
  long_desc: "Strike Kickboxing is a high-energy kickboxing gym and companion app\n\
    for the after-work crowd — younger working people in their 20s and\n30s who come\
    \ to blow off steam, punch out the day and feel alive, not\nto chase a pro-fight\
    \ record. Total first-timers are as welcome as\nregulars: it is approachable,\
    \ social and ego-free, never an\nintimidating fighters-only room. The brand sits\
    \ in a deliberate spot —\nthere is real punch and intensity here, but it is bright\
    \ and fun\nrather than grim. It is emphatically NOT the gritty old-school fight\n\
    gym (dark basement, blood, sweat-stains, snarling hardcore grit), and\nequally\
    \ NOT a soft, mindful wellness studio (spa calm, zen emptiness,\nno edge). It\
    \ is loud, electric and feel-good — kickboxing as a night\nout.\n\nThe voice is\
    \ cheeky and social — witty, in-on-the-joke and\ncommunity-flavoured, like a fun\
    \ coach who is also your mate: \"Same\ntime tomorrow?\" It celebrates the user\
    \ with energy and a wink, never\ntaking itself too seriously. It must never sound\
    \ like a barking drill\nsergeant, a screaming hype-bro, a preachy motivational\
    \ poster, or\nsterile corporate copy.\n\nStrike's anchor is an energetic mascot\
    \ character — cool and charged,\nnever cute or kiddie-cartoonish — that carries\
    \ the brand. The mascot\nanchors the primary logo and stars in the celebratory\
    \ heroes (booking\nsuccess, the rank belt, the points burst, the gift, the wins\
    \ trophy),\nbringing personality to the big moments. The tiny persistent tokens\
    \ —\nthe single point-star, the streak mark, the QR check-in icon — stay\nclean,\
    \ abstract and razor-legible at small size, living in the\nmascot's world through\
    \ its colour and energy rather than being the\ncharacter itself. The logo stays\
    \ a clean, professional mark a real\ngym would use, never a busy illustrated scene.\n\
    \nVisual system — the shared look every generated asset must wear:\n\n- Feel:\
    \ bright, kinetic and electric — alive with motion, speed and\n  glow. Charged\
    \ and upbeat, the opposite of grimy or calm; energy you\n  can feel even when\
    \ nothing is moving.\n- Medium & materials: glossy modern 3D with vivid neon edge-light\
    \ and\n  rim-glow, like lit signage and LED tubing. Punchy, saturated, clean\n\
    \  surfaces. Never matte forged grit, never pastel pillowy softness,\n  never\
    \ flat clip-art.\n- Finish & light: a dark stage lit by colourful neon spotlights\
    \ —\n  glowing pools of lime and violet light, rim-glow and a touch of\n  lens-flare\
    \ pop, club / night-class energy. Dramatic and fun, never\n  moody-grim.\n- Energy\
    \ by role: celebratory heroes (booking success, rank belt,\n  points burst, gift,\
    \ wins trophy) hit big, kinetic and glowing —\n  loud, electric payoff, the night\
    \ lighting up. Persistent UI (the\n  logo, the tiny point-star, streak mark, QR)\
    \ stays clean, sharp and\n  quiet — charged but still, reading instantly at small\
    \ size.\n- Hard nos: no grimy fight-gym clichés (blood, sweat-stains, snarling\n\
    \  faces, skulls, grunge, dark-basement grit); no soft wellness\n  blandness (spa\
    \ pastels, weightless pillowy forms, zen emptiness);\n  nothing childish, cutesy\
    \ or Saturday-morning-cartoon; nothing flat,\n  generic-stock, clip-arty or sterile.\n"
colors_direction:
  description: "A dark, high-energy palette — colour reads as electric, kinetic\n\
    charge against a deep night-stage canvas. Neon pop on a controlled\ndark ground,\
    \ never washed out.\n\n- Primary: a punchy, vivid acid-green / lime for primary\
    \ CTAs and key\n  accents — bright, charged and unmistakably neon, the electric\
    \ heart\n  of the brand. Saturated and loud, but held just clear of literal\n\
    \  radioactive glare so it stays usable.\n- Background: a deep cool near-black\
    \ with the faintest brand-tinted\n  undertone — a dark club / night-class stage\
    \ that lets the neon glow\n  lift off it, never a flat pure black, with tonal\
    \ room for cards and\n  sheets to read.\n- Text: a clean cool off-white for headings\
    \ and body copy — crisp and\n  legible, comfortably above AA against the dark\
    \ canvas, never a harsh\n  pure white.\n- Accent: an electric violet / purple\
    \ for selections, active states\n  and highlights — a clearly different hue from\
    \ the lime primary,\n  vivid and used sparingly on active nav, pills and tabs,\
    \ never a\n  fill.\n"
  mode: dark
