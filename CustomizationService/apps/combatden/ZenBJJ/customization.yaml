design_direction:
  name: Zen BJJ
  short_desc: Focused and powerful — a Brazilian jiu-jitsu academy app built on focus,
    where a clear mind brings out immense strength.
  long_desc: "Zen BJJ is a Brazilian jiu-jitsu academy app for a mix of seasoned\n\
    competitors and total first-timers — bound by the same creed:\nrespect, technique,\
    \ and releasing the strength inside you in a\ncontrolled, focused way. The audience\
    \ trains to get physically\nstronger and mentally sharper, carrying that focus\
    \ into every part\nof their lives, not just the mat. The brand sits in a precise\
    \ middle:\nreal intensity, but disciplined and controlled. It is emphatically\n\
    NOT the loud, ego-driven, smash-everybody gym where only finishing\nmatters —\
    \ here, HOW it is done matters most, and technique is\neverything. Equally it\
    \ is not a soft, no-edge wellness studio: the\npower is real, just held under\
    \ control.\n\nThe voice is calm and confident — controlled intensity. It speaks\n\
    like composed power: \"Controlled power — you left it all on the mat\nthe right\
    \ way.\" Grounded, never exclaiming, it credits the work and\ninvites the user\
    \ back. It must never sound like gym-bro hype (\"BEAST\nMODE, CRUSH IT\"), saccharine\
    \ wellness (\"you're amazing just for\nshowing up\"), a barking drill sergeant,\
    \ or hollow corporate\nsales-speak.\n\nZen BJJ has no mascot. Its anchor is a\
    \ knot / weave motif — a\njiu-jitsu belt-knot and interlocking weave standing\
    \ for control,\ntechnique, and things locked together — carried into the logo\
    \ and\nechoed through the object heroes (belt, trophy, gift, point-stars).\nThe\
    \ logo itself stays a clean, professional mark a real academy\nwould use, never\
    \ an illustrated scene.\n\nVisual system — the shared look every generated asset\
    \ must wear:\n\n- Feel: calm on the surface, deep power underneath — the\n  zen-meets-force\
    \ tension made literal. Focused, composed, grounded;\n  controlled strength at\
    \ rest, never frantic, never soft.\n- Medium & materials: forged and woven — matte\
    \ forged metal, woven\n  gi and belt-weave fabric, leather, chalk. Tactile and\
    \ earned, with\n  the knot motif living in the weave. Never plastic, candy, neon\
    \ or\n  pillowy.\n- Finish & light: low-key and focused — controlled directional\n\
    \  light, a focused pool, deep but not harsh shadow. Intensity held\n  in check,\
    \ like a quiet training hall after hours.\n- Energy by role: celebratory heroes\
    \ (booking success, the rank\n  belt, trophy, gift, points burst) land with solid,\
    \ grounded weight\n  and a focused glow — earned, controlled impact, never confetti\n\
    \  chaos. Persistent UI (the logo, the tiny point-star, QR, streak\n  icon) stays\
    \ dead calm, precise and quiet.\n- Hard nos: no hype-combat clichés (flames, skulls,\
    \ lightning,\n  blood, snarling faces, screaming energy); nothing cute, cartoon,\n\
    \  pastel or bubbly; no soft wellness blandness (spa pastels,\n  weightless pillowy\
    \ forms, clinical emptiness); no neon, RGB,\n  holographic or sci-fi sheen.\n"
colors_direction:
  description: "A dark, focused palette built on cool composure — colour reads as\n\
    disciplined control, not noise. Quiet strength over a dim-dojo\ncanvas.\n\n- Primary:\
    \ a deep, gently desaturated steel / slate-blue for primary\n  CTAs and key accents\
    \ — cool, composed and focused, the\n  calm-surface side of the brand. Confident\
    \ but never bright, neon\n  or electric.\n- Background: a deep cool near-black\
    \ with the faintest blue-grey\n  undertone — a dimly lit dojo after hours, never\
    \ a flat pure black,\n  with tonal room for cards and sheets to lift off it.\n\
    - Text: a cool off-white for headings and body copy — clean and\n  composed, comfortably\
    \ above AA against the dark canvas, never a\n  harsh pure white.\n- Accent: a\
    \ restrained gold / brass for selections, active states\n  and highlights — the\
    \ earned championship-belt note, a clearly\n  different hue from the steel-blue\
    \ primary, premium and used\n  sparingly, never a fill.\n"
  mode: dark
