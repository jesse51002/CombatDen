font_set:
  fonts:
    display:
      family: DM Serif Display
      category: serif
      display_name: Forged Serif
      description: 'A high-contrast serif with architectural precision and quiet confidence
        — the controlled power made typographic. It carries intensity without shouting,
        landing big numbers and celebration titles with earned, grounded weight. Not
        a luxury-blog reflex, but a serif that reads like composed strength: technique
        over noise.'
    body:
      family: DM Sans
      category: sans-serif
      display_name: Neutral Workhorse
      description: A grotesque sans optimised for UI legibility at small sizes, with
        a generous x-height, open counters, and tabular figures for the info bar's
        stacked counters. It sits invisible and precise behind the display serif and
        brand accents — exactly what a focused, technical discipline demands. Regular
        through Bold weight range holds hierarchy cleanly.
