app: combatden
display_name: CombatDen
image_set:
  images:
    logo_primary:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/logo_primary.png
      prompt: A clean professional logo mark of an interlocking jiu-jitsu belt knot
        forming a tight symmetrical weave, single emblem front-facing and centred,
        matte forged-steel surface with a subtle brass inlay along one strand, low-key
        directional light shading the knot's own woven facets, deep forged slate-blue
        and restrained championship-brass palette, flat solid pure-black background,
        minimal premium monogram style
      complexity: medium
    rank_belt:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/rank_belt.png
      prompt: A neatly tied Brazilian jiu-jitsu belt coiled into a centred symmetrical
        knot with two short tails, straight-on and perfectly balanced, woven matte
        cotton weave with visible warp and weft and a forged brass tip-bar inset on
        one tail, low-key directional pool of light shading the knot's own folds with
        deep controlled shadow on its surface, forged slate-blue belt with a single
        championship-brass accent stripe, flat solid pure-black background, premium
        tactile emblem style
      complexity: medium
    celebration_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/celebration_image.png
      prompt: A folded jiu-jitsu belt tied in a tight square knot with a small brass-engraved
        date tag threaded through the weave, balanced floating composition with two
        short woven gi strips arcing outward from the knot in a controlled grounded
        burst, matte forged-steel tag and tactile woven belt fabric in deep slate-blue
        with a single warm championship-brass accent on the tag, low-key directional
        light pooling on the knot and shading each object's own weave and folds, flat
        solid pure-black background, grounded tactile 3D illustration style
      complexity: high
    trophy_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/trophy_image.png
      prompt: A forged matte-steel trophy with a woven belt-weave knot wrapped around
        its cup and a small brass plaque at its base, balanced floating composition
        with a controlled radial burst of fine brass particles and chalk-dust sparks
        outward from behind it, low-key directional pool of light shading the trophy's
        own facets and weave, deep slate-blue body with a single warm championship-brass
        accent rim, flat solid pure-black background, grounded tactile 3D style
      complexity: high
    points_stars_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/points_stars_image.png
      prompt: A tight cluster of forged four-point star tokens with crisp straight
        edges and central facet ridges, one larger hero star front and centre flanked
        by smaller stars in a balanced floating burst radiating outward, matte forged
        brass with a focused directional pool of light catching their own bevels and
        a deeper steel-blue rim on their facets, restrained championship-brass and
        forged-slate accents, flat solid pure-black background, grounded precise emblem
        style
      complexity: high
    next_rank_belt_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/next_rank_belt_image.png
      prompt: A neatly coiled Brazilian jiu-jitsu belt tied into a centred symmetrical
        knot with two short tails, straight-on and perfectly balanced, woven matte
        cotton with visible warp and weft and a forged brass tip-bar inset on one
        tail, low-key directional pool of light shading the knot's own folds with
        deep controlled shadow on its surface, deep championship-brass belt with a
        single forged slate-blue accent stripe, flat solid pure-black background,
        premium tactile emblem style
      complexity: medium
    giftbox:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/giftbox.png
      prompt: A closed square gift box wrapped in woven dark indigo gi-fabric with
        a hand-tied flat belt-knot ribbon in forged brass crossing its top, single
        object floating front-and-slightly-above, mid-spin tilt suggesting kinetic
        anticipation, low-key directional light pooling on the knot and catching the
        fabric weave on its own surfaces, deep forged-slate-blue body with restrained
        championship-brass ribbon, flat solid pure-black background, tactile forged-and-woven
        3D style
      complexity: medium
    single_point:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/single_point.png
      prompt: A single four-point star token with crisp straight edges and a subtle
        central facet ridge, one object front-facing centred and perfectly symmetrical,
        forged matte brass material with a focused directional highlight catching
        its own bevels, restrained championship-brass tone, flat solid pure-black
        background, minimal precise emblem style
      complexity: low
    icon_qrcode:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/icon_qrcode.png
      prompt: A stylized square QR-code glyph with rounded modules and three corner
        finder squares, single object front-facing and centred, subtle forged-metal
        etched finish with one small brass module as a quiet accent, low-key focused
        directional light shading its own surface, deep forged slate-blue and restrained
        championship-brass palette, flat solid pure-black background, minimal precise
        app-icon style
      complexity: low
    streak_icon:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T042358Z/final_images/streak_icon.png
      prompt: A single bold knot-weave mark shaped from two interlocking woven bands
        forming an upward momentum chevron, one continuous closed silhouette front-facing
        and centred, matte forged-steel core with a thin restrained brass rim catching
        a focused directional light on its own bevels, deep slate-blue and championship-brass
        palette, flat solid pure-black background, precise minimal emblem style
      complexity: medium
