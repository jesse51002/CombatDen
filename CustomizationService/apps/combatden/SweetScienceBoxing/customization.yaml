design_direction:
  name: Sweet Science Boxing
  short_desc: Hands up, chin down — a boxing gym built on the sweet science, where
    footwork, timing and craft beat raw power every round.
  long_desc: "Sweet Science Boxing is a boxing gym and companion app rooted in the\n\
    craft of the sport — \"the sweet science\" of distance, timing, footwork\nand\
    \ the counter, not just throwing hard. The audience runs from total\nbeginners\
    \ learning to hold their hands up to seasoned amateurs sharpening\ntheir game,\
    \ drawn by the discipline and rhythm of real boxing. The brand\nsits in a deliberate\
    \ spot: it carries the heritage and grit of a classic\nfight gym, but elevated\
    \ and refined — so it is NOT the loud, neon,\nafter-work fitness-boxing club chasing\
    \ a party vibe, and it is equally\nNOT a grimy, glorified-violence basement trading\
    \ on blood and menace.\nThis is the timeless, earned craft of boxing: leather,\
    \ rope, the bell,\nand the quiet respect of people who put in the rounds.\n\n\
    The voice is seasoned and understated — a veteran trainer who says a lot\nin a\
    \ few words: \"Sharp work tonight. Hands up, chin down — see you\ntomorrow.\"\
    \ Economical, grounded and warm under the gruffness, it\nrespects the craft and\
    \ the grind without ever shouting. It must never\nsound like screaming gym-bro\
    \ hype, saccharine wellness, a barking drill\nsergeant, or hollow corporate sales-speak.\n\
    \nSweet Science Boxing has no mascot. Its anchor is the squared circle —\nthe\
    \ ring ropes and corner geometry, with the brass ring-bell and laced\nleather\
    \ glove as recurring object notes — standing for the arena, the\nround, and earned\
    \ craft. It is carried into the logo and echoed through\nthe object heroes (the\
    \ championship title belt, the trophy, the gift,\nthe point-stars). The celebratory\
    \ heroes bring the personality through\nwarm, heritage-lit, weighty compositions,\
    \ never a character. The tiny\npersistent tokens — the single point-star, the\
    \ streak mark, the QR\ncheck-in icon — stay clean, abstract and razor-legible\
    \ at small size.\nThe logo stays a clean, professional mark a real gym would use,\
    \ never a\nbusy illustrated scene.\n\nVisual system — the shared look every generated\
    \ asset must wear:\n\n- Feel: timeless, grounded and earned — the quiet weight\
    \ of an old\n  fight gym with the craft kept sharp. Heritage and discipline, solid\n\
    \  and unhurried, never frantic and never soft.\n- Medium & materials: warm, premium\
    \ 3D in laced leather, brushed brass,\n  braided ring-rope, taut canvas and chalk.\
    \ Tactile, weighty and\n  vintage-athletic, with the squared-circle geometry in\
    \ the structure.\n  Never neon, never plastic candy, never pastel softness, never\
    \ flat\n  clip-art.\n- Finish & light: warm and low-key — a focused incandescent\
    \ pool like\n  the light over a ring, deep but not harsh shadow, an old-gold glow\
    \ on\n  brass and leather. Atmospheric heritage staging, never grimy-grim and\n\
    \  never flat.\n- Energy by role: celebratory heroes (booking success, the title\
    \ belt,\n  trophy, gift, points burst) land with solid, grounded weight and a\n\
    \  warm earned glow — the bell, the raised glove, the title won, never\n  confetti\
    \ chaos. Persistent UI (the logo, the tiny point-star, streak\n  mark, QR) stays\
    \ clean, precise and quiet, reading instantly at small\n  size.\n- Hard nos: no\
    \ gore or menace clichés (blood, cuts, snarling faces,\n  skulls); no grimy dark-basement\
    \ grit, grunge or sweat-stains; no\n  neon, RGB or club-glow energy; nothing cute,\
    \ cartoon, pastel or\n  bubbly; no mascot, character, creature or face of any\
    \ kind; nothing\n  flat, generic-stock or clip-arty.\n"
colors_direction:
  description: "A dark, warm palette built on heritage craft — colour reads as old\n\
    brass and laced leather under a warm ring light, weighty and earned\nagainst a\
    \ deep canvas.\n\n- Primary: a warm brass / amber-gold for primary CTAs and key\
    \ accents —\n  the ring bell and old-gold heritage note, rich and premium, saturated\n\
    \  enough to lead and comfortably above AA on the dark canvas, never a\n  pale\
    \ or washed-out yellow.\n- Background: a deep, near-black with the faintest warm-brown\
    \ undertone\n  — a dim heritage gym after the last round, never a flat pure black,\n\
    \  with tonal room for cards and sheets to lift off it.\n- Text: a warm off-white\
    \ for headings and body copy — clean and\n  readable with a faint warmth, comfortably\
    \ above AA against the dark\n  canvas, never a harsh pure white.\n- Accent: a\
    \ deep classic boxing-glove red for selections, active states\n  and highlights\
    \ — the laced leather glove, a clearly different hue\n  family from the brass\
    \ primary, premium and used sparingly on active\n  nav, pills and tabs, never\
    \ a fill.\n"
  mode: dark
