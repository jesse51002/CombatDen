font_set:
  fonts:
    display:
      family: Bricolage Grotesque
      category: sans-serif
      display_name: Confident Structural Grotesk
      description: A modern geometric grotesque with architectural precision and athletic
        confidence — built for headlines with clean, grounded geometry that reads
        instantly at large sizes. The sharp proportions and confident stem weight
        carry the brand's earned discipline without the cliché of condensed all-caps
        gym fonts.
    body:
      family: DM Sans
      category: sans-serif
      display_name: Refined Geometric Body
      description: A humanist sans with warm geometric bones and generous x-height,
        optimised for small-size legibility on dark UI. Quiet enough to stay out of
        the way of display typography and accents, but with enough character to echo
        Bricolage Grotesque's structural confidence rather than feeling generic. Strong
        weight range supports hierarchy without distraction.
