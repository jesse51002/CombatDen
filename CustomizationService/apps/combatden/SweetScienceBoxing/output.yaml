app: combatden
display_name: CombatDen
design_name: Sweet Science Boxing
image_set:
  images:
    logo_primary:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/logo_primary.png
      prompt: A circular emblem logo mark, a squared boxing ring viewed straight-on
        inside a brass ring with the wordmark arc "SWEET SCIENCE BOXING" embossed
        around its border, taut braided rope and a small corner post centred within,
        single coherent badge front-facing and perfectly symmetrical, brushed old-brass
        and laced-leather-red accents, warm low-key incandescent shading on the mark's
        own surfaces, flat solid pure-black background, premium heritage emblem style
      complexity: medium
    rank_belt:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/rank_belt.png
      prompt: A championship title belt with a broad laced-leather strap and a large
        central brass medallion embossed with a squared-ring-and-ropes emblem flanked
        by two smaller brass side plates, straight-on, centred, perfectly symmetrical,
        aged laced-leather red strap and brushed old-gold brass with subtle engraving,
        focused warm incandescent light shading the belt's own curved metal and leather
        grain with deep low-key shadow on its surfaces, flat solid pure-black background,
        premium heritage emblem style
      complexity: medium
    celebration_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/celebration_image.png
      prompt: A brass ring-side bell with its striker mid-ring, a laced red leather
        boxing glove, and a folded ticket stub with an embossed seal, balanced floating
        composition with a warm low-key burst of old-gold light radiating from the
        centre, brushed brass and aged laced leather and taut canvas materials, focused
        incandescent ring-light shading each object's own surfaces with deep warm
        shadow, old brass gold and deep boxing-glove red palette, flat solid pure-black
        background, heritage 3D fight-gym style
      complexity: high
    trophy_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/trophy_image.png
      prompt: A weighty brushed-brass boxing trophy on a laced-leather base with a
        small ring-bell and a single braided rope laurel arcing beside it, balanced
        floating composition with a controlled warm spark burst from the centre, focused
        incandescent ring-light glow shading each object's own surfaces, old-gold
        brass and deep laced-leather red palette, flat solid pure-black background,
        premium heritage 3D illustration style
      complexity: high
    points_stars_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/points_stars_image.png
      prompt: A balanced floating cluster of five-point brass stars at varied sizes
        and angles, one large hero star front and centre with smaller stars arcing
        outward in a controlled radial burst, smooth brushed-brass surfaces with softly
        bevelled facets and a deep laced-leather-red rim catching one star's edge,
        warm low-key incandescent ring-light glow shading each star's own planes,
        deep old-gold amber palette, flat solid pure-black background, heritage 3D
        emblem style
      complexity: high
    next_rank_belt_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/next_rank_belt_image.png
      prompt: A championship title belt of a clearly higher tier, a broad laced-leather
        strap with a large central brass medallion embossed with a squared-ring-and-ropes
        emblem flanked by two engraved side plates and small inset gem accents, straight-on,
        centred, perfectly symmetrical, deep oxblood laced-leather strap and richer
        brushed old-gold brass with finer engraving, focused warm incandescent ring-light
        shading the belt's own curved metal and leather grain with deep low-key shadow
        on its surfaces, flat solid pure-black background, premium heritage emblem
        style
      complexity: medium
    giftbox:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/giftbox.png
      prompt: A closed wrapped gift box with a laced leather-red lid and brushed brass-gold
        ribbon tied in a crisp bow on top, caught mid-spin in a dynamic floating tilt
        with a controlled warm burst of light radiating from its seams, weighty premium
        3D in taut leather and polished brass hardware, focused incandescent ring-light
        pooling on its own facets with deep low-key shadow on its surfaces, old-gold
        amber and deep laced-red palette, flat solid pure-black background, heritage
        3D emblem style
      complexity: high
    single_point:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/single_point.png
      prompt: A single five-point star token, front-facing centred and perfectly symmetrical,
        smooth brushed-brass surface with softly bevelled facets catching a warm low-key
        incandescent highlight on its own planes, deep old-gold amber tone, flat solid
        pure-black background, minimal heritage 3D emblem style
      complexity: low
    icon_qrcode:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/icon_qrcode.png
      prompt: A stylized square QR-code glyph with rounded modules and three corner
        finder squares, single object front-facing and centred, subtle brushed-brass
        finish with a faint warm rim light on its own edges, restrained old-gold tone
        on a deep matte body, flat solid pure-black background, clean minimal app-icon
        style
      complexity: low
    streak_icon:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T144100Z/final_images/streak_icon.png
      prompt: A bold lightning-bolt mark forged in solid brushed brass, single object
        front-facing and centred, crisp clean silhouette built for legibility at tiny
        sizes, soft warm ring-light glow catching its bevelled edges with deep low-key
        shadow on its own faceted surfaces, old-gold brass palette with a hairline
        aged-leather red inlay running its length, flat solid pure-black background,
        premium heritage emblem style
      complexity: medium
