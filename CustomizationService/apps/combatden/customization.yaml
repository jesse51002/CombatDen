design_direction:
  name: Duck Groove
  short_desc: "Dance it out — a light, fun, bubbly dance-workout club app where the Duck Groove duck cheers you on."
  long_desc: |
    Duck Groove is a playful dance-workout club app for people who want
    moving their body to feel like joy, not a chore — all ages, all
    skill levels, here to have fun. The audience is upbeat and
    unintimidated: they want a tool that makes them smile and keeps them
    coming back. The voice is warm, bubbly and encouraging — a friend
    hyping you up on the dance floor, never drill-sergeant, never hype-y
    sales.

    The Duck Groove duck mascot is the HERO of this visual system: a
    rounded, friendly, expressive cartoon duck that stars in every
    celebratory moment — dancing, cheering, presenting rewards. It is
    the recurring face of the brand, not a background accent.

    Visual system — the shared look every generated asset must wear:

    - Feel: light, fun, bubbly and welcoming. Joyful and energetic,
      playful over polished. Delight over restraint — it should make
      you grin.
    - Medium & materials: soft, rounded, plump 3D — squishy matte
      plastic, soft inflated balloon-like forms, candy and felt
      textures, gently bouncy. Friendly and tactile, never sharp,
      never gritty. Never battle-worn metal, leather or canvas.
    - Finish & light: bright, soft studio lighting, gentle soft
      shadows that keep forms rounded and approachable. No harsh key
      light, no deep gloom — everything stays airy and clear.
    - Energy by role: rewards, wins, streaks and celebrations land
      with bounce, sparkle and confetti — joyful pop, the duck mid-
      celebration. Persistent UI icons and indicators stay clean,
      friendly and simple — cheerful but calm, never busy.
    - Hard nos: nothing gritty, dark, heavy or battle-worn; no muted
      or desaturated palettes; nothing intimidating, corporate-serious
      or cold. Cute is the point.

colors_direction:
  mode: light
  description: |
    A bright, light, bubbly palette — cheerful and inviting. Color is
    the point here: it should feel warm, playful and full of energy.

    - Primary: a sunny, joyful duck-yellow — warm and inviting, the
      brand's signature pop. Used confidently for primary CTAs and the
      moments that delight.
    - Accent: a playful bubblegum or sky pop for selections, highlights
      and active states — a clearly different, cheerful hue from the
      yellow primary, fun but never muddy. One confident accent that
      complements the primary without competing with it.
