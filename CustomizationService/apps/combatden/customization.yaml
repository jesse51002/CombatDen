design_direction:
  name: Killer Muay Thai
  short_desc: "Train like you mean it — a fight-team Muay Thai gym for people who came to get dangerous, not to dabble."
  long_desc: |
    Killer Muay Thai is a fight-team Muay Thai gym and companion app for
    people who came to get dangerous — committed amateurs, competitors and
    serious hobbyists who train at a fighter's intensity. It teaches the
    real art of eight limbs and holds a fighter's standard; newcomers are
    welcome only on the understanding that they rise to that bar, not that
    it bends for them. The brand sits in a deliberate spot — it is
    emphatically NOT cardio-kickboxing or bag-punching fitness theatre
    dressed up as "boxing-inspired", and equally NOT a soft wellness or
    lifestyle brand (spa calm, mindfulness positioning, an
    Instagram-aesthetic gym). It is serious, severe and combative: Muay
    Thai as a fight discipline, not a workout class.

    The voice is cold and commanding — terse, direct and imperative, the
    way a corner talks to a fighter between rounds. No filler, no
    cheerleading, no cushioning. It respects the work without coddling. It
    must never sound warm-and-fuzzy, chatty, motivational-poster,
    hype-bro, cute, or sterile-corporate; when it speaks it gives an
    order, not encouragement.

    Killer Muay Thai's anchor is a dynamic fighter silhouette caught
    mid-strike — a flying knee, an elbow, a teep — explosive, aggressive
    and unmistakably Muay Thai. The silhouette anchors the primary logo as
    a bold, high-contrast action mark and drives the celebratory heroes
    (booking success, the rank belt, the points burst, the gift, the wins
    trophy), which land kinetic and heavy. The tiny persistent tokens —
    the single point-star, the streak mark, the QR check-in icon — stay
    abstract, minimal and razor-legible at small size, living in the
    fighter's world through colour and severity rather than being the
    figure itself. The logo stays a clean, professional mark a real fight
    gym would use, never a busy illustrated scene.

    Visual system — the shared look every generated asset must wear:

    - Feel: hard, sharp and dangerous — coiled power and explosive strike
      energy, serious and severe. Charged with threat, the opposite of
      bright-and-fun or soft-and-calm.
    - Medium & materials: dramatic, high-contrast 3D and strong
      silhouette work with premium metallic surfaces — the gold of earned
      belts and trophies — set on a dark ground. Hard edges and real
      weight. Never glossy neon, never pillowy or pastel-soft, never flat
      clip-art.
    - Finish & light: dark and dramatic, with hard directional light
      carving strong form and deep shadow — a fighter under the ring
      lights, never a soft daylit scene.
    - Energy by role: celebratory heroes (booking success, rank belt,
      points burst, gift, wins trophy) hit hard, heavy and dramatic — a
      real payoff with weight behind it. Persistent UI (the logo, the
      single point-star, streak mark, QR) stays minimal, severe and
      blade-sharp, reading instantly at small size.
    - Hard nos: no soft or wellness blandness (spa pastels, pillowy
      forms, zen calm, lifestyle gloss); nothing cute, cartoonish or
      Saturday-morning (no mascots, no friendly rounded characters); no
      neon club brightness, candy colour or bright-fun party energy; no
      generic combat clip-art (stock gloves, flat clip-art fighters,
      sterile gym-chain look, fake-tough clichés).

colors_direction:
  mode: dark
  description: |
    A dark, severe palette — earned gold against a deep near-black
    ground, with danger held in reserve. Premium and combative, never
    bright or festive.

    - Primary: a rich championship gold / bronze for primary CTAs and key
      accents — earned, premium and warm-metallic, the colour of belts and
      trophies. Confident and saturated against the dark ground, never a
      pale or washed-out yellow.
    - Background: a deep cool near-black with the faintest warm
      brand-tinted undertone — a dark, dramatic ground that lets the gold
      lift off it, never a flat pure black, with tonal room for cards and
      sheets to read.
    - Text: a crisp warm off-white for headings and body copy — clean and
      legible, comfortably above AA against the dark canvas, never a harsh
      pure white.
    - Accent: a deep blood-red for selections, active states and
      highlights — a clearly different hue from the gold primary, hard and
      dangerous, used sparingly on active nav, pills and tabs as borders or
      a single active label, never a fill.
