design_direction:
  name: Friction Grappling
  short_desc: >-
    Grip, scramble, finish — a no-gi grappling club where there is nothing to hold
    onto but technique, and every roll is a problem to solve.
  long_desc: |
    Friction Grappling is a no-gi submission grappling club and companion
    app for the modern grappling scene — competitors and hobbyists who chase
    the ADCC-style game of scrambles, leg locks and relentless pace. With no
    gi to grip, the sport comes down to skin, sweat, leverage and
    timing — friction is the literal physics of it, and the name says so.
    The audience treats rolling like a live chess match: athletic,
    technical, problem-solving. The brand sits in a clear spot: it is
    modern, sporty and performance-driven, the opposite of a dusty
    traditional dojo — so it is NOT the formal, ceremony-heavy gi academy
    with its lineage and ritual, and it is equally NOT a grimy
    smash-everybody room where only ego matters. Here the appeal is the
    sport science of it: clean, fast, athletic, smart.

    The voice is sharp and technical — a coach who talks in angles,
    leverage and timing: "Good scramble. You read the angle and took it."
    Modern, precise and a little cerebral, it respects the puzzle and
    credits the read, never the brute force. It must never sound like
    screaming gym-bro hype, saccharine wellness, a barking drill sergeant,
    or stiff traditional-dojo formality.

    Friction Grappling has no mascot. Its anchor is an interlocking-grip
    motif — two clean forms locked, hooked and scrambling against each
    other, standing for the no-gi game of control without a collar to
    hold — carried into the logo and echoed through the object heroes (the
    rank band, the trophy, the gift, the point-stars). Because this is
    no-gi, the rank "belt" reads as a sleek modern competition rank band /
    patch rather than a traditional gi belt. The celebratory heroes bring
    the personality through clean, dynamic, athletic compositions, never a
    character. The tiny persistent tokens — the single point-star, the
    streak mark, the QR check-in icon — stay clean, abstract and
    razor-legible at small size. The logo stays a clean, professional mark
    a real club would use, never a busy illustrated scene.

    Visual system — the shared look every generated asset must wear:

    - Feel: athletic, kinetic and modern — the fast, slippery energy of a
      live scramble. Performance-driven and precise, motion you can sense
      even at rest; sport, not ceremony.
    - Medium & materials: clean, sporty 3D in matte grappling-mat rubber,
      technical rashguard fabric and a cool, dry athletic sheen — never a
      grimy sweat-soaked look, just crisp performance surfaces. The
      interlock motif lives in the geometry. Never traditional gi-and-belt
      fabric, never neon, never pillowy softness, never flat clip-art.
    - Finish & light: bright, clean and open — even, airy daylight studio
      light on a light canvas, soft contact shadows, a fresh modern-gym
      feel. Crisp and energetic, never moody, dim or grimy.
    - Energy by role: celebratory heroes (booking success, the rank band,
      trophy, gift, points burst) land dynamic and athletic — the finish,
      the hand raised, kinetic but clean. Persistent UI (the logo, the tiny
      point-star, streak mark, QR) stays clean, sharp and quiet, reading
      instantly at small size.
    - Hard nos: no traditional gi, collar or belt-knot imagery (that is the
      gi world, not no-gi); no grime, blood, sweat-stains or
      dark-basement grit; nothing cute, cartoon, pastel or bubbly; no
      mascot, character, creature or face of any kind; no neon-club glow;
      nothing flat, generic-stock or clip-arty.
colors_direction:
  description: |
    A light, clean palette built on athletic performance — colour reads as
    crisp, modern sport on a bright canvas, with a hot edge of friction
    against a cool, dry base.

    - Primary: a deep, saturated athletic teal for primary CTAs and key
      accents — cool, modern and performance-driven, pushed dark enough to
      read crisply and clear AA on the light canvas. The clean,
      sport-science heart of the brand.
    - Background: a bright, near-white with the faintest cool undertone — a
      clean modern-studio canvas, never a flat pure white, with tonal room
      for cards and sheets to read.
    - Text: a deep cool near-black with a faint brand tint for headings and
      body copy — crisp and legible, comfortably above AA against the light
      canvas, never a pure black.
    - Accent: a warm coral / burnt-orange for selections, active states and
      highlights — the heat of friction and the scramble, a clearly
      different hue family from the teal primary, pushed deep enough to
      clear AA on the light canvas, used sparingly on active nav, pills and
      tabs, never a fill.
  mode: light
