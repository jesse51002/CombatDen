id: combatden
display_name: CombatDen

images:
  # Shared (tenant-wide)
  - id: logo_primary
    description: >-
      The gym's primary brand logo / identity mark. Lives in the persistent
      app top bar (GymHeader), shown roughly 100x100 and centred directly
      above the gym name and the info bar (which holds the rank, streak,
      points and QR items). It is present on every main tab — Home,
      Profile, Rewards, Videos — and at the top of every post-class
      celebration screen. It is the first thing the user sees on app open
      and is on screen almost constantly. Purpose: pure brand anchor and
      gym identity; it is never tied to an event or a reward. Role is calm
      and permanent, not celebratory — it must read instantly and stay
      legible at small size as a single coherent logo mark. Keep it simple
      and realistic — a clean, professional logo an actual business would
      really use as its mark, not an illustrated scene, a busy composition,
      or a rendered mascot.
  - id: rank_belt
    description: >-
      Depicts the user's CURRENT rank as a martial-arts / championship
      style belt — the visual token of the tier they have earned. Used in
      three places: (1) a tiny ~39x24 indicator in the persistent top info
      bar next to the rank label; (2) ~77x50 in the Profile screen's rank
      header beside the rank name and subtitle; (3) the animated hero of
      the post-class Rank celebration screen — the 2nd of five post-class
      cards (Streak, Rank, Points, Rewards, Wins) — where it flies in large
      and centred (~280px), holds, then shrinks down into the profile
      header slot as stats fade in. So it must work both as a calm, tiny
      status indicator and as a bold, proud celebratory hero. The moment is
      achievement and earned status.

  # Page-specific
  - id: celebration_image
    description: >-
      The single hero that celebrates a successful class booking. Fills the
      ClassBookedScreen as a full-bleed centred hero (~50-60% of the
      viewport), revealed with a scale-in pop after a brief loading +
      done-check sequence, with a "Class Booked" headline directly below it
      and a Continue button at the bottom. It appears the instant the user
      commits to booking a class and is the ONLY place a booking success is
      celebrated — the first positive payoff for that action and a key
      retention moment. The emotion is peak, energetic, congratulatory
      success: "you're in, your spot is locked".
  - id: trophy_image
    description: >-
      A trophy that headlines the end-of-session "Today's Wins" recap.
      Sits ~230x230, centred inside a sparkle/particle burst, on the
      WinsScreen — the 5th and final card of the post-class flow — with a
      "Today's Wins" headline, subtitle and three summary stat tiles
      cascading in below it. This is the closing high note as the user
      leaves the gym after their session is recapped. The emotion is
      victory and accomplishment: the reward for showing up and finishing.
  - id: points_stars_image
    description: >-
      The hero that celebrates the points earned during a session. On the
      PointsScreen — the 3rd post-class card — a kinetic 3D sphere of
      orbiting point-stars first collapses inward, and then this ~238x238
      stars graphic is revealed centred with a "+N POINTS" count-up and a
      running total caption pinned below. It is the payoff at the end of
      the points animation. The emotion is rewarding and high-energy — the
      climax of the points reveal, a burst of earned value.
    depends_on:
      - single_point
  - id: next_rank_belt_image
    description: >-
      A preview of the NEXT rank's belt — the tier the user is working
      toward, deliberately distinct from rank_belt (their current tier).
      Lives in the Profile screen's "Next Rank" section, inset inside a
      ~100x100 circular progress badge: an animated progress arc rings the
      badge and the image sits within it with ~22px padding, above a "Next
      Rank" title and an "X / Y classes to next tier" progress label. The
      moment is calm, between-classes browsing — motivational, not
      celebratory. It must read clearly inside a small circular badge
      without fighting the progress ring, and should clearly feel like a
      higher, aspirational belt tier the user has not reached yet.
    depends_on:
      - rank_belt
  - id: giftbox
    description: >-
      A closed gift box — the visual metaphor for unlocking rewards and the
      SOURCE of an unwrap-then-burst animation. On the RewardsCardScreen
      (4th post-class card) the box flies in with a spin, holds briefly,
      then scales away as point-stars burst outward from its centre, after
      which a rewards carousel takes over. It is never shown statically for
      long — it exists to be opened. The moment is anticipation releasing
      into payoff: "you've earned something, claim it". Playful, kinetic,
      high-energy; it must read instantly as a wrapped gift even mid-motion.
    depends_on:
      - single_point
  - id: single_point
    description: >-
      The app's signature single point-star particle — the atomic unit of
      the points / rewards visual language. Three uses: (1) a ~22px points
      icon in the persistent top info bar next to the points balance; (2)
      fourteen instances forming the orbiting 3D sphere on the Points
      screen; (3) fourteen instances bursting radially out of the giftbox
      on the Rewards screen. So it is simultaneously a tiny permanent
      utility icon AND a mass-instanced motion particle: it must be simple,
      perfectly legible at ~22px, symmetrical, and look right when
      repeated, rotated, depth-sorted and scaled in motion. A single clean
      star token, never a scene or a cluster.
  - id: icon_qrcode
    description: >-
      A QR-code graphic that signals in-gym check-in / sign-up. It is the
      right-most item of the persistent top info bar, ~30px tall and
      tappable; per the product it serves the at-the-gym check-in moment —
      scanned one-thumbed, sometimes with sweaty hands and variable gym
      lighting (the dedicated full check-in screen is not built yet, so for
      now it lives only as this top-bar entry point). Role is a calm,
      functional, navigational utility — it must read unmistakably as a
      scannable QR affordance at small size, never celebratory. It is a
      stylised QR-style graphic standing for "check in here", not a real
      scannable code.
  - id: streak_icon
    description: >-
      The streak indicator — it communicates that the user has an active
      attendance streak going. Three contexts: (1) ~22x30 in the persistent
      top info bar beside the streak day count; (2) ~12x15 in the Home
      screen's upcoming-sessions card footer next to "You're on an X week
      streak!"; (3) the ~240px icon hero of the post-class Streak screen
      (the 1st post-class card) that grows in after a lightning-strike
      animation. So it is mostly a small, ever-present utility that must
      stay sharp when tiny, but is occasionally a celebratory hero. A
      single bold streak / momentum mark that reads at a glance and
      survives heavy downscaling.

colors:
  - id: primary
    description: Dominant brand color. Used for primary CTAs and key accents.
  - id: background
    description: App background color. Usually dark for a gym aesthetic.
    role: background
  - id: text
    description: Main text color for headings and body copy.
    role: text
  - id: accent
    description: Selection / active-state highlight. MUST be a visibly distinct
      hue from `primary` (a different hue family, not a tint or clone of it),
      premium and coherent on the dark gym canvas, and meet WCAG AA against the
      background. Drives the active nav item, active timeframe pill, and active
      tab — used as borders / one active label, never a fill.

fonts:
  - id: display
    description: >-
      Headline / hero / celebration typography — the "Class Booked"
      title, post-class card titles (Streak / Rank / Points / Rewards /
      Wins), points count-ups, and screen titles. Used at large sizes
      (24–64px) and short bursts. Must carry the brand's athletic
      energy and feel distinctive at a glance — confident, modern,
      premium. Numerals must read cleanly because every celebration
      screen pairs the title with a big number.
  - id: body
    description: >-
      All running UI text — buttons, list rows, info-bar labels (rank /
      streak / points), stat tiles, body copy. Used at 13–18px in long
      sessions on a dark canvas. Must be highly legible at small sizes,
      have a generous x-height, hold up at every weight from regular to
      bold, and feel visually quiet so the display font and the
      accents lead. Numerals must be tabular-friendly because the info
      bar stacks several side-by-side counters.

texts:
  - id: class_booked_headline
    description: >-
      The full-bleed celebration headline shown the moment a class
      booking succeeds. Sits directly below the celebration hero on
      ClassBookedScreen, ~36–48px display weight. The single high
      point of the booking flow — the user just committed, this is
      their first positive payoff. Should land like the brand
      cheering — combative gyms read like a fighter locking in,
      grappling academies like stepping on the mat, premium studios
      like a calm confirmation. Title-case or sentence case; never
      ALL CAPS unless the brand demands it.
    min_words: 1
    max_words: 3
    min_chars: 4
    max_chars: 22
  - id: reserve_cta
    description: >-
      The primary booking button on a class detail / reservation
      screen — the action that commits the user to attend. Reads as
      a verb phrase in the brand's voice (combat gym: "Lock it in.";
      grappling academy: "Claim your mat."; calmer studio: "Reserve
      a spot."). Has to fit a single-line pill button without
      wrapping. Imperative, present tense, no trailing period unless
      the brand reads punchy with one.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 22
  - id: wins_title
    description: >-
      The headline of the post-class "wins" recap screen — the 5th
      and final post-class card. Pairs with a sparkle / trophy hero
      and three summary stat tiles. The closing high note of the
      session: it should celebrate the user's effort in the brand's
      voice without being saccharine. Combat-leaning brands lean
      punchy ("Today's wins"); calmer brands lean reflective
      ("Today's progress"). Short, declarative, never a full
      sentence.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 20
  - id: wins_subtitle
    description: >-
      The one-line subtitle directly under the wins headline on the
      same end-of-session recap screen. This is the single chattiest
      line of brand voice in the app — a short motivational beat
      that pushes the user back into the next session. Combat gyms
      read aggressive ("The grind never stops"), BJJ academies more
      technique-led ("Every roll sharpens you"), premium studios
      calm ("Each session counts"). One short clause; no exclamation
      mark unless the brand genuinely shouts.
    min_words: 2
    max_words: 6
    min_chars: 8
    max_chars: 40
  - id: book_next_class_cta
    description: >-
      The CTA at the bottom of the post-class wins recap that takes
      the user back into the booking flow for their next session.
      Same button shape as ``reserve_cta`` but the moment is
      different — the user just finished training and is being
      nudged to commit again. Should read like the brand inviting
      them back, not pleading. Imperative, verb-led, no trailing
      period.
    min_words: 2
    max_words: 5
    min_chars: 8
    max_chars: 28

# The persistent bottom-nav tab icons — the most repeated, brand-defining
# glyphs in the member app (present on Home, Rank/Profile, Rewards and
# Videos). Monochrome; the MobileApp tints them per theme (active = accent,
# inactive = muted text), so no colour belongs here. Each falls back to a
# Material Symbol in the app if the pipeline doesn't supply one.
icons:
  - id: nav_home
    description: >-
      The Home tab icon in the persistent bottom navigation bar — the first,
      left-most tab and the app's default landing destination (upcoming
      sessions, the day's schedule). A calm, instantly-legible house glyph
      that reads as "home / dashboard" at ~24px. Functional and permanent,
      never celebratory; must stay sharp and unambiguous when small and when
      shown in both an active (highlighted) and inactive (muted) state.
  - id: nav_rank
    description: >-
      The Rank tab icon in the persistent bottom navigation bar — opens the
      profile / rank screen where the user sees their current belt tier,
      rating graph and progress to the next rank. Should read as achievement
      / earned status (a medal, badge or ranking mark) at ~24px, matching the
      gym's progression theme. Permanent navigation utility, not a
      celebration; legible and clear in both active and inactive states.
  - id: nav_reward
    description: >-
      The Reward tab icon in the persistent bottom navigation bar — opens the
      points store / rewards area where earned points are redeemed. Should
      read unmistakably as a reward or gift (a gift box, present or token) at
      ~24px, tying into the app's points-and-rewards language. A calm,
      functional navigation affordance; clear and sharp in active and
      inactive states.
  - id: nav_videos
    description: >-
      The Videos tab icon in the persistent bottom navigation bar — opens the
      technique / level-up video library. Should read as "play / watch
      videos" (a play affordance or media glyph) at ~24px. Functional
      navigation, never celebratory; must stay legible and obvious at small
      size in both active and inactive states.

# Two standalone celebration animations for the member app's two real
# animation moments. Standalone = plays on its own; neither reveals or
# depends on an image, so neither sets depends_on. The MobileApp recolours
# each preset's regions to the live palette at render time and falls back to
# a bundled .json if the pipeline doesn't supply one.
lotties:
  - id: booking_celebration
    description: >-
      A celebratory burst that plays on the ClassBookedScreen the moment a
      booking succeeds — a short, energetic flourish around the "Class
      Booked" beat, directly tied to the booking-success payoff. Standalone
      and self-contained: it does not reveal or depend on any image. Peak
      congratulatory energy: "you're in, your spot is locked".
    required_type: standalone
  - id: streak_celebration
    description: >-
      The animation hero of the post-class Streak screen (the 1st post-class
      card) — an energetic, momentum-themed flourish (a strike or rising
      flame feel) that plays as the streak is celebrated. It REVEALS the
      streak icon: the badge pops out of the strike partway through. Reveal
      type, depending on the streak_icon image it composites. Persistent,
      driving, "keep it going" energy.
    required_type: reveal
    depends_on: streak_icon
