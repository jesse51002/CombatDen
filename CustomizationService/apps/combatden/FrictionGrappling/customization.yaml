design_direction:
  name: Friction Grappling
  short_desc: Grip, scramble, finish — a no-gi grappling club where there is nothing
    to hold onto but technique, and every roll is a problem to solve.
  long_desc: "Friction Grappling is a no-gi submission grappling club and companion\n\
    app for the modern grappling scene — competitors and hobbyists who chase\nthe\
    \ ADCC-style game of scrambles, leg locks and relentless pace. With no\ngi to\
    \ grip, the sport comes down to skin, sweat, leverage and\ntiming — friction is\
    \ the literal physics of it, and the name says so.\nThe audience treats rolling\
    \ like a live chess match: athletic,\ntechnical, problem-solving. The brand sits\
    \ in a clear spot: it is\nmodern, sporty and performance-driven, the opposite\
    \ of a dusty\ntraditional dojo — so it is NOT the formal, ceremony-heavy gi academy\n\
    with its lineage and ritual, and it is equally NOT a grimy\nsmash-everybody room\
    \ where only ego matters. Here the appeal is the\nsport science of it: clean,\
    \ fast, athletic, smart.\n\nThe voice is sharp and technical — a coach who talks\
    \ in angles,\nleverage and timing: \"Good scramble. You read the angle and took\
    \ it.\"\nModern, precise and a little cerebral, it respects the puzzle and\ncredits\
    \ the read, never the brute force. It must never sound like\nscreaming gym-bro\
    \ hype, saccharine wellness, a barking drill sergeant,\nor stiff traditional-dojo\
    \ formality.\n\nFriction Grappling has no mascot. Its anchor is an interlocking-grip\n\
    motif — two clean forms locked, hooked and scrambling against each\nother, standing\
    \ for the no-gi game of control without a collar to\nhold — carried into the logo\
    \ and echoed through the object heroes (the\nrank band, the trophy, the gift,\
    \ the point-stars). Because this is\nno-gi, the rank \"belt\" reads as a sleek\
    \ modern competition rank band /\npatch rather than a traditional gi belt. The\
    \ celebratory heroes bring\nthe personality through clean, dynamic, athletic compositions,\
    \ never a\ncharacter. The tiny persistent tokens — the single point-star, the\n\
    streak mark, the QR check-in icon — stay clean, abstract and\nrazor-legible at\
    \ small size. The logo stays a clean, professional mark\na real club would use,\
    \ never a busy illustrated scene.\n\nVisual system — the shared look every generated\
    \ asset must wear:\n\n- Feel: athletic, kinetic and modern — the fast, slippery\
    \ energy of a\n  live scramble. Performance-driven and precise, motion you can\
    \ sense\n  even at rest; sport, not ceremony.\n- Medium & materials: clean, sporty\
    \ 3D in matte grappling-mat rubber,\n  technical rashguard fabric and a cool,\
    \ dry athletic sheen — never a\n  grimy sweat-soaked look, just crisp performance\
    \ surfaces. The\n  interlock motif lives in the geometry. Never traditional gi-and-belt\n\
    \  fabric, never neon, never pillowy softness, never flat clip-art.\n- Finish\
    \ & light: bright, clean and open — even, airy daylight studio\n  light on a light\
    \ canvas, soft contact shadows, a fresh modern-gym\n  feel. Crisp and energetic,\
    \ never moody, dim or grimy.\n- Energy by role: celebratory heroes (booking success,\
    \ the rank band,\n  trophy, gift, points burst) land dynamic and athletic — the\
    \ finish,\n  the hand raised, kinetic but clean. The booking-success celebration\
    \ hero specifically is an explosive outward burst of no-gi grappling gear — a\
    \ rashguard, fingerless grips/spats, a mouthguard and a slice of mat — scattering\
    \ kinetically from the centre as the \"you're in, your spot is locked\" payoff:\
    \ energetic and instantly recognizable as the sport, but still strictly no-gi\
    \ (never a gi, collar or belt). Persistent UI (the logo, the tiny\n  point-star,\
    \ streak mark, QR) stays clean, sharp and quiet, reading\n  instantly at small\
    \ size.\n- Hard nos: no traditional gi, collar or belt-knot imagery (that is the\n\
    \  gi world, not no-gi); no grime, blood, sweat-stains or\n  dark-basement grit;\
    \ nothing cute, cartoon, pastel or bubbly; no\n  mascot, character, creature or\
    \ face of any kind; no neon-club glow;\n  nothing flat, generic-stock or clip-arty.\n"
colors_direction:
  description: "A light, clean palette built on athletic performance — colour reads\
    \ as\ncrisp, modern sport on a bright canvas, with a hot edge of friction\nagainst\
    \ a cool, dry base.\n\n- Primary: a deep, saturated athletic teal for primary\
    \ CTAs and key\n  accents — cool, modern and performance-driven, pushed dark enough\
    \ to\n  read crisply and clear AA on the light canvas. The clean,\n  sport-science\
    \ heart of the brand.\n- Background: a bright, near-white with the faintest cool\
    \ undertone — a\n  clean modern-studio canvas, never a flat pure white, with tonal\
    \ room\n  for cards and sheets to read.\n- Text: a deep cool near-black with a\
    \ faint brand tint for headings and\n  body copy — crisp and legible, comfortably\
    \ above AA against the light\n  canvas, never a pure black.\n- Accent: a warm\
    \ coral / burnt-orange for selections, active states and\n  highlights — the heat\
    \ of friction and the scramble, a clearly\n  different hue family from the teal\
    \ primary, pushed deep enough to\n  clear AA on the light canvas, used sparingly\
    \ on active nav, pills and\n  tabs, never a fill.\n"
  mode: light
