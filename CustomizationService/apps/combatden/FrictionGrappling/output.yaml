app: combatden
display_name: CombatDen
design_name: Friction Grappling
image_set:
  images:
    logo_primary:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/logo_primary.png
      prompt: Two interlocking hook-shaped forms locked and scrambling against each
        other into a single compact emblem, front-facing, centred, perfectly balanced,
        matte rubber finish with a cool dry athletic sheen, deep competition teal
        with one quiet coral edge accent, even airy studio light shading only its
        own curved surfaces, flat solid pure-white background, clean modern professional
        logo mark
      complexity: medium
    rank_belt:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/rank_belt.png
      prompt: A sleek modern competition rank band, a flat curved patch-style strip
        with two interlocking hooked forms locked at its centre as an embossed emblem,
        straight-on, centred, perfectly symmetrical, matte rubberised band with a
        subtle technical rashguard weave and a crisp metallic edge trim, deep competition
        teal with a single coral accent stripe, even airy studio daylight shading
        its own surfaces, flat solid pure-white background, clean athletic 3D emblem
        style
      complexity: medium
    celebration_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/celebration_image.png
      prompt: An explosive outward burst of no-gi grappling gear from the centre —
        a folded technical rashguard, a pair of fingerless grips, a compact mouthguard,
        and a curved slice of grappling mat — scattering kinetically in a balanced
        floating composition, matte rubber and dry rashguard fabric with a cool athletic
        sheen, even airy studio daylight shading each object's own surface, deep competition
        teal with a single coral accent, flat solid pure-white background, clean sporty
        3D illustration style
      complexity: high
    trophy_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/trophy_image.png
      prompt: A sleek modern competition trophy with an interlocking twin-loop grip
        motif forming its cup and a low geometric plinth, flanked by a few drifting
        angular shards and crisp spark particles in a balanced floating burst outward
        from the centre, matte grappling-mat rubber and technical rashguard-weave
        surfaces with a cool dry athletic sheen, even airy daylight studio light shading
        each object's own facets, deep competition teal with a single warm friction-coral
        accent edge, flat solid pure-white background, clean kinetic sporty 3D style
      complexity: high
    points_stars_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/points_stars_image.png
      prompt: A balanced floating cluster of five four-point sharp stars with crisp
        concave facets at varied sizes and angles, one larger hero star centred with
        smaller stars orbiting outward in a kinetic burst, smooth matte rubber surfaces
        with a cool dry athletic sheen, even airy studio light shading each star's
        own facets, deep competition teal with a single warm coral accent star, flat
        solid pure-white background, clean sporty 3D illustration style
      complexity: high
    next_rank_belt_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/next_rank_belt_image.png
      prompt: A sleek modern competition rank band one tier above, a flat curved patch-style
        strip with two interlocking hooked forms locked at its centre as an embossed
        emblem, straight-on, centred, perfectly symmetrical, matte rubberised band
        with a subtle technical rashguard weave and a polished metallic edge trim,
        deep graphite charcoal with a brushed silver emblem and a single coral accent
        stripe, even airy studio daylight shading its own surfaces, flat solid pure-white
        background, clean athletic 3D emblem style
      complexity: medium
    giftbox:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/giftbox.png
      prompt: A wrapped gift box mid-spin with a crisp ribbon and a bold bow on top,
        caught in dynamic floating motion with a faint kinetic streak trailing one
        corner, matte grappling-mat rubber body and technical rashguard-fabric ribbon
        with a cool dry athletic sheen, even airy studio light shading its own facets,
        deep competition teal box with a confident friction-coral ribbon, flat solid
        pure-white background, clean sporty 3D hero style
      complexity: medium
    single_point:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/single_point.png
      prompt: A single four-point sharp star token with crisp concave facets, one
        object front-facing centred and perfectly symmetrical, smooth matte rubber
        surface with a cool dry athletic sheen, even airy studio light shading its
        own facets, deep competition teal with a subtle coral edge accent, flat solid
        pure-white background, clean sporty 3D icon style
      complexity: low
    icon_qrcode:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/icon_qrcode.png
      prompt: A stylized square QR-code glyph with rounded modular squares and three
        corner finder marks, single object front-facing and perfectly centred, subtle
        interlocking notch in the central modules hinting at two hooked forms, clean
        matte rubber finish with a cool dry athletic sheen on its own surface, deep
        competition teal on a flat solid pure-white background, minimal sporty 3D
        icon style
      complexity: low
    streak_icon:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143613Z/final_images/streak_icon.png
      prompt: A bold lightning-bolt mark with a subtle interlocking notch where the
        zag hooks back on itself, single object front-facing and centred, matte grappling-mat
        rubber finish with a faint dry athletic sheen on its own bevelled edge, even
        airy studio light, deep competition teal with one crisp coral edge accent,
        flat solid pure-white background, clean sporty 3D icon style
      complexity: low
