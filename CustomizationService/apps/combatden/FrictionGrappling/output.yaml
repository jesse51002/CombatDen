font_set:
  fonts:
    display:
      family: Syne
      category: sans-serif
      display_name: Athletic Grotesk
      description: A geometric sans with confident weight and a distinctly modern,
        kinetic character — the kind of sharp, precise letterforms that read athletic
        without resorting to the reflex condensed-all-caps. Works at display sizes
        (24–64px) to carry celebration and hero screens (Class Booked, Rank, Points,
        Streak) with energy and premium polish, never gym-hype bluster. The strong
        geometric construction mirrors the interlocking-grip motif of the brand.
    body:
      family: IBM Plex Sans
      category: sans-serif
      display_name: Technical Humanist
      description: 'A humanist sans with generous x-height, open counters and a quiet,
        professional presence — built for legibility at 13–18px in long UI sessions.
        Strong weight ladder (Regular through Bold) supports hierarchy without noise.
        Tabular-friendly numerals suit the info bar stacking rank / streak / points
        counters side-by-side. Pairs confidently with Syne because the two share a
        modern, performance-driven mood but inhabit clearly different roles: one announces,
        the other informs, neither fights the other.'
