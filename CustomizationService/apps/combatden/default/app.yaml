id: combatden
display_name: CombatDen

images:
  # Shared (tenant-wide)
  - id: logo_primary
    description: Main brand logo, full color. Shown on splash and home header.
  - id: rank_belt
    description: Belt graphic shown in profile rank progression and rank celebration.

  # Page-specific
  - id: celebration_image
    description: Hero illustration on the class-booked celebration screen.
  - id: trophy_image
    description: Trophy graphic on the wins celebration screen.
  - id: points_stars_image
    description: Stars graphic on the points celebration screen.
  - id: next_rank_belt_image
    description: Preview of the next-rank belt on the profile screen.
  - id: giftbox
    description: Gift-box graphic in the rewards intro / unwrap animation.
  - id: single_point
    description: Single point-star particle used in the points burst animation.
  - id: icon_qrcode
    description: QR-code graphic shown on the check-in / sign-up screen.
  - id: icon_streak
    description: Streak flame graphic on the streak celebration screen.
  - id: streak_icon
    description: Small streak indicator icon shown in the top bar.

colors:
  - id: primary
    description: Dominant brand color. Used for primary CTAs and key accents.
  - id: background
    description: App background color. Usually dark for a gym aesthetic.
    role: background
  - id: text
    description: Main text color for headings and body copy.
    role: text
  - id: accent
    description: Selection / active-state highlight. MUST be a visibly distinct
      hue from `primary` (a different hue family, not a tint or clone of it),
      premium and coherent on the dark gym canvas, and meet WCAG AA against the
      background. Drives the active nav item, active timeframe pill, and active
      tab — used as borders / one active label, never a fill.
