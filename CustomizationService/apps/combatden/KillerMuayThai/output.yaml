font_set:
  fonts:
    display:
      family: Archivo
      category: sans-serif
      display_name: Sharp Geometric Grotesk
      description: A confident, modern grotesque with tight proportions and geometric
        clarity—reads cold and commanding at display sizes (24–64px) without the clichéd
        condensed gym reflex. Built for impact at scale with clean numerals for celebration
        screens. The weight ladder and geometric geometry match the brand's coiled,
        dangerous energy.
    body:
      family: IBM Plex Sans
      category: sans-serif
      display_name: Technical Humanist
      description: A quiet, legible sans optimized for small-size UI text (13–18px)
        with generous x-height, open counters, and full weight support (Regular through
        Bold). Supports tabular numerals for side-by-side info-bar stacks. Stays neutral
        and severe on dark canvas, letting display hierarchy lead without warmth or
        chatter.
