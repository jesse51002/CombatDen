    rank_belt:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T053420Z/final_images/rank_belt.png
      prompt: A championship Muay Thai belt with a polished gold central plate embossed
        with crossed elbows, flanked by smaller gold side plates on a deep black leather
        strap, straight-on, centred, perfectly symmetrical, hard directional ring
        light carving sharp highlights and deep shadow across the metal's own facets,
        championship-gold and black-leather palette, flat solid pure-black background,
        premium emblem style
      complexity: medium
    celebration_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T053420Z/final_images/celebration_image.png
      prompt: A bold stylized fighter silhouette mid flying-knee strike forged from
        solid championship gold, framed by a struck calendar tile and a shattered
        burst of angular gold shards radiating outward, balanced floating composition
        with explosive controlled energy from the centre, hard directional ring-light
        raking across polished metallic surfaces with deep carved shadow on their
        own forms, championship gold with one blood-red edge accent, flat solid pure-black
        background, dramatic high-contrast 3D fight-poster style
      complexity: high
    trophy_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T053420Z/final_images/trophy_image.png
      prompt: A heavy championship trophy with twin angular handles and a broad cup
        rising from a stepped pedestal, framed by a radiating burst of sharp gold
        shards and fine sparks erupting outward from behind it, forged championship
        gold with brushed and polished facets, hard directional ring-light carving
        deep contrast and shadow across its own metal surfaces, championship gold
        with a single thin blood-red band at the base, flat solid pure-black background,
        dramatic high-contrast 3D render
      complexity: high
    points_stars_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T053420Z/final_images/points_stars_image.png
      prompt: An explosive burst of sharp four-point gold stars radiating outward
        from a single larger hero star at the centre, kinetic floating composition
        with smaller stars trailing along the blast lines, championship-gold metallic
        surfaces with crisp tapered blade-like points, hard directional ring light
        carving deep shadowed facets on each star's own form, flat solid pure-black
        background, severe heavy 3D emblem style
      complexity: high
    next_rank_belt_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T053420Z/final_images/next_rank_belt_image.png
      prompt: A higher-tier Muay Thai championship belt with a tall faceted gold central
        plate embossed with a rising flying-knee silhouette, flanked by smaller gold
        side plates on a deep black leather strap, straight-on, centred, perfectly
        symmetrical, hard directional ring light carving sharp highlights and deep
        shadow across the metal's own facets, championship-gold and black-leather
        palette, flat solid pure-black background, premium emblem style
      complexity: medium
    giftbox:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T053420Z/final_images/giftbox.png
      prompt: A wrapped cube gift box tied with a crisp ribbon and a sharp four-loop
        bow on top, caught mid-spin at a dynamic three-quarter tilt, machined championship-gold
        metallic body with a deep blood-red ribbon cutting hard across its faces,
        hard directional ring light carving bevelled edges and deep shadowed facets
        on its own surfaces, flat solid pure-black background, severe high-contrast
        3D emblem style with coiled kinetic weight
      complexity: high
    single_point:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T053420Z/final_images/single_point.png
      prompt: A single sharp four-point star token with crisp tapered blade-like points,
        front-facing, centred and perfectly symmetrical, solid championship-gold metallic
        surface with one hard directional highlight and a deep shadowed facet carving
        its form, flat solid pure-black background, severe minimal 3D emblem style
      complexity: low
    icon_qrcode:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T053420Z/final_images/icon_qrcode.png
      prompt: A stylized square QR-code glyph with crisp finder squares in three corners
        and a sparse grid of sharp modules, single object front-facing and centred,
        razor-clean hard edges with a subtle brushed-gold metallic finish, hard directional
        rim light carving its own bevel, championship-gold on flat solid pure-black
        background, minimal severe icon style
      complexity: low
    streak_icon:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260521T053420Z/final_images/streak_icon.png
      prompt: A bold lightning bolt glyph, single object front-facing and centred,
