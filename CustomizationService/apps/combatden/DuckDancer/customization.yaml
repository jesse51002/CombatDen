design_direction:
  name: Duck Groove
  short_desc: Dance it out — a light, fun, bubbly dance-workout club app where the
    Duck Groove duck cheers you on.
  long_desc: "Duck Groove is a playful dance-workout club app for people who want\n\
    moving their body to feel like joy, not a chore — all ages, all\nskill levels,\
    \ here to have fun. The audience is upbeat and\nunintimidated: they want a tool\
    \ that makes them smile and keeps them\ncoming back. The voice is warm, bubbly\
    \ and encouraging — a friend\nhyping you up on the dance floor, never drill-sergeant,\
    \ never hype-y\nsales.\n\nThe Duck Groove duck mascot is the HERO of this visual\
    \ system: a\nrounded, friendly, expressive cartoon duck that stars in every\n\
    celebratory moment — dancing, cheering, presenting rewards. It is\nthe recurring\
    \ face of the brand, not a background accent.\n\nVisual system — the shared look\
    \ every generated asset must wear:\n\n- Feel: light, fun, bubbly and welcoming.\
    \ Joyful and energetic,\n  playful over polished. Delight over restraint — it\
    \ should make\n  you grin.\n- Medium & materials: soft, rounded, plump 3D — squishy\
    \ matte\n  plastic, soft inflated balloon-like forms, candy and felt\n  textures,\
    \ gently bouncy. Friendly and tactile, never sharp,\n  never gritty. Never battle-worn\
    \ metal, leather or canvas.\n- Finish & light: bright, soft studio lighting, gentle\
    \ soft\n  shadows that keep forms rounded and approachable. No harsh key\n  light,\
    \ no deep gloom — everything stays airy and clear.\n- Energy by role: rewards,\
    \ wins, streaks and celebrations land\n  with bounce, sparkle and confetti — joyful\
    \ pop, the duck mid-\n  celebration. Persistent UI icons and indicators stay clean,\n\
    \  friendly and simple — cheerful but calm, never busy.\n- Hard nos: nothing gritty,\
    \ dark, heavy or battle-worn; no muted\n  or desaturated palettes; nothing intimidating,\
    \ corporate-serious\n  or cold. Cute is the point.\n"
colors_direction:
  description: "A bright, light, bubbly palette — cheerful and inviting. Color is\n\
    the point here: it should feel warm, playful and full of energy.\n\n- Primary:\
    \ a sunny, joyful duck-yellow — warm and inviting, the\n  brand's signature pop.\
    \ Used confidently for primary CTAs and the\n  moments that delight.\n- Accent:\
    \ a playful bubblegum or sky pop for selections, highlights\n  and active states\
    \ — a clearly different, cheerful hue from the\n  yellow primary, fun but never\
    \ muddy. One confident accent that\n  complements the primary without competing\
    \ with it.\n"
  mode: light
