font_set:
  fonts:
    display:
      family: Bricolage Grotesque
      category: sans-serif
      display_name: Confident Modern Grotesque
      description: A distinctive, self-assured grotesque with slightly geometric softness
        that reads bold and premium at large sizes (24–64px) without the coldness
        of a pure tech sans. The rounded apertures and confident weight ladder feel
        energetic and forward-moving — matching the athletic, joyful mood — while
        the well-drawn letterforms ensure numerals read cleanly on celebration screens.
        Not Inter (the reflexive tech default) and not Bebas (the fitness cliché);
        instead, a genuinely confident grotesque that lands as 'modern premium dance
        app' on sight.
    body:
      family: Outfit
      category: sans-serif
      display_name: Friendly Geometric Workhorse
      description: A humanist geometric sans with generous x-height, warm rounded
        terminals, and an extensive weight range (100–900) that delivers the quiet,
        legible backbone for all running UI at 13–18px. The geometric warmth echoes
        the duck mascot's roundness without being cutesy or distracting. Tabular figures
        support the stacked side-by-side counters in the info bar. Paired with Bricolage
        Grotesque, Outfit stays visually calm and lets the display font and brand's
        joyful accents lead — the coherence comes from shared geometric friendliness
        across very different roles.
