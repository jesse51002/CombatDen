image_set:
  images:
    logo_primary:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/logo_primary.png
      prompt: A simple rounded duck-head logo mark in a soft circular badge, single
        object front-facing and centred, smooth matte finish with a tiny clean highlight
        on its own curve, warm sunshine-yellow duck with a small bubblegum-violet
        dot accent and warm-charcoal eye, flat solid pure-white background, minimal
        modern brand logo style
      complexity: low
    rank_belt:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/rank_belt.png
      prompt: A plump championship belt curled into a soft ring, a rounded squishy
        buckle at its centre embossed with a tiny duck silhouette and a single small
        star, straight-on, centred, perfectly symmetrical, soft matte plastic and
        candy-felt materials with gentle inflated volume, bright soft studio light
        shading its own rounded surfaces, sunshine duck-yellow belt with a crisp bubblegum-violet
        trim accent, flat solid pure-white background, cheerful rounded 3D emblem
        style
      complexity: medium
    celebration_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/celebration_image.png
      prompt: A plump rounded cartoon duck mascot mid-celebratory dance pose with
        wings thrown up, a glossy ticket stub and a small calendar card floating beside
        it, looping confetti ribbons and sparkle bursts radiating outward from the
        centre, squishy matte plastic and soft balloon-like materials, bright soft
        studio light shading each object's own curved surfaces, sunshine duck-yellow
        with bubblegum-violet confetti accents, flat solid pure-white background,
        bouncy rounded 3D illustration style
      complexity: high
    trophy_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/trophy_image.png
      prompt: A plump rounded cartoon trophy with a wide smiling cup, chunky handles
        and a squishy star on top, the Duck Groove duck as a simple stylized cartoon
        mascot peeking out of the cup with wings raised in cheer, balanced floating
        composition with a soft confetti and sparkle burst radiating outward from
        the centre, soft inflated balloon-like matte plastic materials, bright airy
        studio light shading each object's own curved surface, sunshine duck-yellow
        with bubblegum-violet sparkle accents, flat solid pure-white background, rounded
        bouncy 3D illustration style
      complexity: high
    points_stars_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/points_stars_image.png
      prompt: A joyful cluster of plump four-point stars in varied sizes bursting
        outward from the centre with tiny confetti specks and a few small sparkle
        dots, balanced floating composition with an energetic outward pop, soft inflated
        balloon-like bodies in squishy matte plastic, bright even studio light with
        gentle highlights on each star's own rounded surface, warm sunshine duck-yellow
        stars with a few bubblegum-violet confetti accents, flat solid pure-white
        background, rounded 3D illustration style
      complexity: high
    next_rank_belt_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/next_rank_belt_image.png
      prompt: A plump championship belt curled into a soft ring, a rounded squishy
        buckle at its centre embossed with a tiny duck silhouette flanked by three
        small stars, straight-on, centred, perfectly symmetrical, soft matte plastic
        and candy-felt materials with gentle inflated volume, bright soft studio light
        shading its own rounded surfaces, bubblegum-violet belt with crisp sunshine
        duck-yellow trim and pale gold buckle accents, flat solid pure-white background,
        cheerful rounded 3D emblem style
      complexity: medium
    giftbox:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/giftbox.png
      prompt: A plump wrapped gift box with a big looping ribbon bow on top, tilted
        mid-spin in a balanced floating pose, soft inflated balloon-like form in squishy
        matte plastic with a candy-like sheen on its own rounded surfaces, bright
        even studio light and gentle soft shading that keeps it rounded, warm sunshine
        duck-yellow box with a bubblegum-violet ribbon, flat solid pure-white background,
        clean rounded 3D illustration style
      complexity: medium
    single_point:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/single_point.png
      prompt: A single plump four-point star token, one object front-facing and perfectly
        centred, symmetrical with softly rounded points and a gently inflated balloon-like
        body, soft matte squishy finish, bright even studio light with a subtle highlight
        on its own surface, warm sunshine duck-yellow, flat solid pure-white background,
        clean rounded 3D icon style
      complexity: low
    icon_qrcode:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/icon_qrcode.png
      prompt: A rounded-square QR-style glyph with chunky soft-edged modules and three
        corner finder squares, single object front-facing and centred, soft matte
        plastic finish with gentle rounded shading on each module's own surface, warm
        sunshine-yellow tiles on a cream rounded plaque with one small bubblegum-violet
        finder square as a single accent, even soft studio light, flat solid pure-white
        background, clean friendly 3D app-icon style
      complexity: medium
    streak_icon:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260520T234553Z/final_images/streak_icon.png
      prompt: A bold rounded lightning bolt glyph, single object front-facing and
        centred, soft squishy matte plastic with a gently inflated balloon-like form,
        bright soft studio light with gentle shading on its own curved surface, saturated
        sunshine duck-yellow body with a crisp bubblegum-violet edge highlight, flat
        solid pure-white background, friendly rounded 3D app-icon style
      complexity: low
