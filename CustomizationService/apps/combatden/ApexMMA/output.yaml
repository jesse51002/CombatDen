font_set:
  fonts:
    display:
      family: Poppins
      category: sans-serif
      display_name: Modern Athletic Display
      description: A confident geometric sans-serif with strong presence at display
        sizes. Poppins carries the modern, engineered energy of Apex MMA without the
        clichéd condensed-all-caps reflex—its generous proportions and upright stance
        read premium and controlled, like a fighter's focus under the lights. The
        numerals are clean and distinctive for celebration screens.
    body:
      family: IBM Plex Sans
      category: sans-serif
      display_name: Engineered Body
      description: A quiet, grounded grotesque with an excellent weight ladder (Regular
        through Bold) and strong optical clarity at 13–18px on dark backgrounds. IBM
        Plex Sans's neutral, measured personality steps back to let display and accent
        drive the hierarchy, while its generous counters and tabular figures support
        the side-by-side info-bar stacks. Together with Poppins, it forms a modern,
        engineered pairing that feels purposeful without feeling generic.
