app: combatden
display_name: CombatDen
design_name: Apex MMA
image_set:
  images:
    logo_primary:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/logo_primary.png
      prompt: A clean octagonal emblem with a sharp inset chevron forming a stylized
        A at its core, single mark front-facing and centred, perfectly symmetrical,
        brushed steel and chrome with one controlled deep-red bevel along the inner
        edge, crisp directional studio light shading the emblem's own facets, flat
        solid pure-black background, premium professional logo mark style
      complexity: low
    rank_belt:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/rank_belt.png
      prompt: A championship martial arts belt coiled into a bold octagonal silhouette
        with a central engraved medallion bearing an eight-sided cage motif and flanking
        embossed side plates, straight-on centred and perfectly symmetrical, glossy
        championship-gold leather with brushed-chrome hardware, hard directional spotlight
        with hot red key and cool cyan rim-light shading its own surfaces, deep crimson
        and gold palette with electric-blue edge accent, flat solid pure-black background,
        premium arena-lit 3D emblem style
      complexity: high
    celebration_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/celebration_image.png
      prompt: A polished chrome octagonal ticket stub with an embossed gold seal at
        its center, paired with a brushed-steel key-fob token and a small champion-red
        banner curling outward, balanced floating composition with a controlled light
        burst from the center, glossy 3D in chrome and championship-gold leather with
        taut cage-mesh detailing on the seal, hard directional spotlight with a hot
        red key and cool cyan rim shading each object's own surfaces, deep crimson
        and gold palette with a single electric-blue accent edge, flat solid pure-black
        background, arena-lit kinetic 3D style
      complexity: high
    trophy_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/trophy_image.png
      prompt: A polished championship trophy with an octagonal chrome cup on a brushed-steel
        base, flanked by a small championship-gold medallion and a slim engraved nameplate,
        balanced floating composition with a controlled spark burst radiating from
        the centre, hard directional spotlight pooling on each object's own surfaces
        with a hot red key and cool cyan rim, deep falloff into black, fight-night
        red and chrome with a single electric-blue accent, flat solid pure-black background,
        glossy arena-lit 3D style
      complexity: high
    points_stars_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/points_stars_image.png
      prompt: A kinetic cluster of four-point chrome stars with sharp tapered points
        and crisp ridged facets, one large hero star centred and several smaller stars
        bursting outward in a balanced floating arrangement, polished brushed-chrome
        bodies with thin electric cyan-blue rim light on their edges and a hot red
        key glinting across their facets, hard directional arena spotlights with deep
        falloff, flat solid pure-black background, clean glossy 3D mark style
      complexity: high
    next_rank_belt_image:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/next_rank_belt_image.png
      prompt: A championship martial arts belt coiled into a bold octagonal silhouette
        with a central engraved medallion bearing an eight-sided cage motif, straight-on
        centred and perfectly symmetrical, polished platinum-chrome leather with brushed-silver
        hardware and a single inset sapphire chip, hard directional spotlight with
        a cool cyan rim-light and faint red key shading its own facets, cool silver
        and electric-blue palette reading as a higher aspirational tier, flat solid
        pure-black background, premium arena-lit 3D emblem style
      complexity: medium
    giftbox:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/giftbox.png
      prompt: A wrapped gift box caught mid-spin with a championship-gold leather
        lid, brushed-steel sides with subtle octagonal panel geometry, and a taut
        electric cyan-blue ribbon crossing into a crisp bow, tilted dynamically as
        if flying in, hard red key light raking the lid and a cool cyan rim catching
        one edge, deep falloff into the canvas, fight-night red and gold accents against
        polished chrome, flat solid pure-black background, kinetic glossy 3D arena-lit
        style
      complexity: high
    single_point:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/single_point.png
      prompt: A single four-point star token with sharp tapered points and crisp ridged
        facets, one object front-facing centred and perfectly symmetrical, polished
        chrome body with a thin electric cyan-blue rim catching the light and a hot
        red key glinting on its facets, flat solid pure-black background, clean glossy
        3D mark style
      complexity: medium
    icon_qrcode:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/icon_qrcode.png
      prompt: A stylized square QR-code glyph with rounded modules and three bold
        corner finder squares, single object front-facing and centred, razor-legible
        at small size, brushed chrome modules on a subtle octagonal inner frame, crisp
        directional light catching its own edges, cool off-white modules with one
        electric cyan-blue corner marker, flat solid pure-black background, clean
        minimal 3D icon style
      complexity: low
    streak_icon:
      path: /var/home/jm/Documents/CombatDen/codebase/CustomizationService/apps/combatden/20260522T143203Z/final_images/streak_icon.png
      prompt: A single bold lightning bolt mark with octagonal facets along its edge,
        one object front-facing and centred, polished chrome body with a hot red inner
        core, hard directional spotlight catching one cut edge and a cool cyan rim
        on the opposite edge, deep falloff shading on its own surfaces, flat solid
        pure-black background, clean glossy 3D emblem style razor-legible at small
        size
      complexity: medium
