# Golden dataset for the cutout validator (background_check.md).
#
# Hand-labeled. `expected_ok` is the verdict a correct validator must give.
# The eval (`make test-golden`) is tag-gated and live — it calls the real
# vision model per image. Keep this set small; every entry costs one call.
#
# The validator judges a cutout against the image it was cut from, so each
# entry pairs a BEFORE (pre-removal) with an AFTER (the remover's result).
#
# fields:
#   name        stable id used in the scorecard
#   before       BEFORE filename: the generated image as produced, the
#                subject on its flat solid backdrop (deterministically
#                built by scripts/build_cutout_fixtures.py)
#   file         AFTER filename: the background remover's result (always
#                PNG — the validator only ever sends image/png)
#   expected_ok  the correct BackgroundCheck.ok for this before→after pair
#   category     good | failed_removal | damaged
#   origin       pipeline | synthetic | web
#   regression   true => hard-asserted individually (the exact bug we fixed)
#   license/source  provenance (web origin only)
#   note         why this label

images:
  - name: pipeline_composed_subject
    before: celebration_image.before.png
    file: celebration_image.cutout.png
    expected_ok: true
    category: good
    origin: pipeline
    regression: true
    note: >-
      The bug this all started from. A checkmark inside a pale disc badge:
      the disc is part of the composed subject, not leftover backdrop. A
      correct validator passes it.

  - name: pipeline_cycling_saddle
    before: pipeline_cycling_saddle.before.png
    file: pipeline_cycling_saddle.cutout.png
    expected_ok: true
    category: good
    origin: pipeline
    note: >-
      A real smoketest pipeline BEFORE/AFTER pair (cycling-studio brand: a
      cream saddle and a dried leaf). Clean isolation — subject intact,
      backdrop fully removed. The corpus's first fully real (non-synthesized)
      pipeline pair.

  - name: synthetic_clean_tight
    before: celebration_image.before.png
    file: synthetic_clean_tight.png
    expected_ok: true
    category: good
    origin: synthetic
    note: Subject tightly cropped on full transparency. Unambiguous pass.

  - name: web_clean_icon
    before: web_pd_clean_icon.before.png
    file: web_pd_clean_icon.png
    expected_ok: true
    category: good
    origin: web
    license: Public domain (simple geometry, ineligible for copyright)
    source: https://commons.wikimedia.org/wiki/File:Sample_User_Icon.png
    note: Real-world clean cutout — silhouette on transparency.

  - name: synthetic_failed_full
    before: celebration_image.before.png
    file: synthetic_failed_full.png
    expected_ok: false
    category: failed_removal
    origin: synthetic
    note: Subject flattened back onto an opaque solid canvas; nothing removed.

  - name: synthetic_failed_band
    before: celebration_image.before.png
    file: synthetic_failed_band.png
    expected_ok: false
    category: failed_removal
    origin: synthetic
    note: A wide opaque band of the flat backdrop still clings along the bottom.

  - name: synthetic_damaged_holes
    before: celebration_image.before.png
    file: synthetic_damaged_holes.png
    expected_ok: false
    category: damaged
    origin: synthetic
    note: Transparent holes punched through the subject body.

  - name: synthetic_damaged_halfcut
    before: celebration_image.before.png
    file: synthetic_damaged_halfcut.png
    expected_ok: false
    category: damaged
    origin: synthetic
    note: The right ~45% of the subject erased — a major part is gone.

  - name: web_photo_unremoved
    before: web_pd_photo_unremoved.png
    file: web_pd_photo_unremoved.png
    expected_ok: false
    category: failed_removal
    origin: web
    license: Public domain (PD-NASA — solely created by NASA)
    source: https://commons.wikimedia.org/wiki/File:NASA-Apollo8-Dec24-Earthrise.jpg
    note: >-
      Real opaque photograph, full background intact — nothing removed, so
      BEFORE and AFTER are the same image (the remover no-opped).
