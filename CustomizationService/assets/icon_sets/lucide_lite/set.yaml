id: lucide_lite
name: Lucide Lite
vibe: >
  A clean, modern line-icon style: even 2px strokes, rounded caps and
  joins, generous open shapes, and a friendly-but-neutral geometry.
  Monochrome and currentColor throughout, so the app tints them per
  theme. Reads as crisp, contemporary and unobtrusive — at home in
  utility UI, navigation and settings rather than playful or
  illustrative contexts. A small starter subset of the Lucide icon
  family.
icons:
  - home
  - search
  - settings
