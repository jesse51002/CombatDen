# Bug report for @lottiefiles/dotlottie-web — file upstream
# (https://github.com/LottieFiles/dotlottie-web/issues)

title: >-
  setThemeData crashes the wasm (heap corruption) when theming multiple
  gradient slots; non-deterministic errors

package: "@lottiefiles/dotlottie-web"
version: "0.74.0"   # JS and wasm both 0.74.0 (CDN: jsdelivr .../@0.74.0/dist/dotlottie-player.wasm)
renderer: "thorvg / dotlottie-rs via wasm"

summary: >-
  Calling setThemeData() with a theme that overrides several GRADIENT slots
  corrupts the shared wasm heap. The crash is non-deterministic: the same input
  throws different errors across runs ("index out of bounds", "indirect call to
  null", "function signature mismatch", "recursive use of an object ... already
  borrowed"), and which slot appears to trigger it shifts run to run. Solid
  Color slot rules are unaffected; a single Gradient rule applies fine.

environment:
  os: Linux
  build: Vite 5.4 bundle (ES module import of DotLottie), Chromium
  wasm_source: default CDN (not a vendored/mismatched copy)

what_works:
  - "Color rules (rgb and rgba values): fine at any count tested."
  - "A single Gradient rule (2-, 3-, or 5-stop): fine."
  - "~8-10 gradient rules: usually fine."

what_breaks:
  - "Applying ~11+ gradient slot overrides at once: throws and corrupts the heap."
  - "Because all DotLottie instances share one wasm heap, once corrupted, later"
  - "  setThemeData calls on fresh instances also fail erratically."

errors_observed:
  - "RuntimeError: index out of bounds"
  - "RuntimeError: indirect call to null"
  - "RuntimeError: function signature mismatch"
  - "Error: recursive use of an object detected which was already borrowed"
  # all classic single-heap memory-corruption symptoms

correlation:
  note: >-
    The crash correlates with gradients that carry OPACITY stops (gradient `g.k.k`
    longer than p*4, i.e. colour stops followed by opacity stops). The dotLottie
    theme Gradient rule format is { color, offset } per stop with NO opacity
    field, so a gradient that has opacity stops cannot be fully expressed; the
    player appears to index past the stop buffer instead of degrading gracefully.

theme_is_well_formed: >-
  Verified independently: every emitted rule has a length-4 RGBA color and
  offsets in [0,1] ascending, no NaN/undefined, and stop counts match g.p. So
  this is not malformed theme data from the caller.

reproduce:
  steps:
    - "Load a Lottie with a dozen+ radial gradients (several with opacity stops)."
    - "Add a `sid` to each gradient's colour property (g.k.sid)."
    - "Build a theme with a Gradient rule per slot: { id, type: 'Gradient',"
    - "  value: [{ color:[r,g,b,a], offset }] } — one rule per gradient."
    - "Call dotLottie.setThemeData(JSON.stringify({ rules }))."
  expected: "Theme applies, or returns false / throws a catchable validation error."
  actual: "Wasm RuntimeError (varies per run); the player instance is left unusable."

minimal_repro_sketch: |
  import { DotLottie } from '@lottiefiles/dotlottie-web';
  const dl = new DotLottie({ canvas, data: slottedJsonWithManyGradientSids, autoplay: true });
  dl.addEventListener('load', () => {
    // ~24 Gradient rules, several targeting gradients that have opacity stops
    const ok = dl.setThemeData(JSON.stringify({ rules: gradientRules }));
    // -> throws RuntimeError inside render()
  });

impact: >-
  Runtime gradient theming is unusable for real, gradient-heavy animations
  (e.g. exported radial-gradient art). Forces baking recoloured copies at build
  time instead of theming at runtime.

workaround: >-
  Recolour gradients by mutating the animation JSON before load (rewrite the
  gradient stop colours in g.k.k) and render the modified data; do not use
  gradient slots / setThemeData for gradients. Solid-colour slots are fine.
