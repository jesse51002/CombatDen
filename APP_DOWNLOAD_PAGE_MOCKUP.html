<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Iron Den — Get the App · Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;450;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   CombatDen — Per-gym APP-DOWNLOAD marketing page · mockup
   Member-facing. A member scans the kiosk QR (or the check-in QR
   with a plain camera) and lands here to download the app.

   Tokens = the LandingPage design system (LandingPage/DESIGN.md +
   hifi/ds.jsx): cool off-white ground, one sapphire accent + its
   gradient, Geist + Geist Mono, soft layered shadows, lifted white
   cards. Product surfaces (reward card, class row, video card, belt
   strip) are composed from the approved kiosk welcome (round1.html).

   PER-GYM: the live URL carries a gym_id (e.g. combatden.app/iron-den).
   Everything gym-branded here — the "Iron Den" wordmark, the monogram,
   the copy — is driven by that id. Placeholder gym = "Iron Den".

   PLATFORM-AWARE: the live page detects iOS vs Android and leads with
   that store button. The three device frames below hard-set the platform
   so the treatment is visible regardless of what you open this on.

   Store buttons are PLACEHOLDERS: the app is not published yet. They are
   honest ("Coming soon"), non-clickable, on-brand.
   ============================================================ */

:root{
  --ground:#F3F5F8;
  --ground-alt:#EEF1F6;
  --surface:#FFFFFF;
  --surface-grad:linear-gradient(180deg,#FFFFFF 0%,#F5F7FB 100%);
  --ink:#16181D;
  --ink-2:#565B66;
  --ink-3:#878D99;

  --sapphire:#2A67BD;
  --accent-dark:#1F5099;
  --accent-soft:#E8F0FB;
  --grad:linear-gradient(180deg,#2A67BD 0%,#1F5099 100%);
  --accent-glow:rgba(42,103,189,0.18);

  --good:#1D7D3E;

  --line:rgba(20,22,30,0.09);
  --line-soft:rgba(20,22,30,0.06);

  /* landing soft, layered elevation */
  --card-shadow:0 1px 2px rgba(20,22,40,0.04), 0 22px 50px -30px rgba(20,22,50,0.20), inset 0 1px 0 rgba(255,255,255,0.9);
  --card-shadow-hi:0 2px 4px rgba(20,22,40,0.06), 0 30px 60px -28px rgba(20,22,50,0.28), inset 0 1px 0 rgba(255,255,255,0.9);
  --button-shadow:0 1px 2px rgba(15,45,95,0.32), 0 10px 24px -8px rgba(30,80,160,0.5), inset 0 1px 0 rgba(255,255,255,0.28);
  --control-shadow:0 1px 2px rgba(20,22,40,0.05);

  --r-sm:8px; --r-md:12px; --r-btn:12px; --r-tile:16px; --r-card:22px; --r-panel:26px;
  --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:var(--sans);
  background:#0f1013;                 /* dark stage behind the device frames = obviously review chrome */
  color:var(--ink);
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ============================================================
   REVIEW CHROME  (dark, labelled — clearly not the page itself)
   ============================================================ */
.review-bar{
  position:sticky; top:0; z-index:100;
  height:52px; display:flex; align-items:center; gap:20px;
  padding:0 20px;
  background:#14161B; border-bottom:1px solid rgba(233,236,242,0.10);
  color:#A6ACB8;
}
.review-brand{ display:flex; align-items:center; gap:9px; font-size:12px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#828B98; white-space:nowrap; }
.review-brand .dot{ width:7px; height:7px; border-radius:999px; background:#3E7CD6; box-shadow:0 0 0 4px rgba(62,124,214,0.15); }
.review-tabs{ display:flex; gap:4px; }
.review-tab{ appearance:none; border:0; cursor:pointer; font-family:var(--sans); font-size:12.5px; font-weight:500; letter-spacing:-0.01em; color:#A6ACB8; background:transparent; padding:7px 13px; border-radius:8px; transition:color .16s ease, background .16s ease; }
.review-tab:hover{ color:#E9ECF2; background:rgba(233,236,242,0.06); }
.review-tab.active{ color:#0f1115; background:#E9ECF2; font-weight:600; }
.review-meta{ margin-left:auto; font-size:11.5px; letter-spacing:0.04em; color:#5a616e; white-space:nowrap; }
@media (max-width:720px){ .review-meta{ display:none; } }

.stage-wrap{ padding:40px 20px 72px; display:flex; justify-content:center; }
.view{ display:none; }
.view.active{ display:block; }

/* ============================================================
   DEVICE FRAMES
   ============================================================ */
/* -- phones -- */
.phone{
  position:relative; width:var(--pw); margin:0 auto;
  border-radius:var(--pr);
  background:linear-gradient(150deg,#3a3d45 0%,#191b1f 46%,#2a2d33 100%);
  padding:13px;
  box-shadow:0 2px 6px rgba(0,0,0,0.5), 0 40px 90px -30px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.06);
}
.phone-iphone{ --pw:404px; --pr:52px; }
.phone-android{ --pw:404px; --pr:38px; }
.device-screen{
  position:relative;
  border-radius:calc(var(--pr) - 12px);
  background:var(--ground);
  overflow:hidden;                     /* clip page corners to the screen */
  height:812px;
  container-type:inline-size; container-name:page;
}
.device-screen .scroll{ position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
/* phones only: a soft top scrim so scrolled page content fades under the OS
   status bar / notch instead of colliding sharply with it (the browser frame
   has no status bar, so it is excluded) */
.phone .device-screen::after{ content:""; position:absolute; top:0; left:0; right:0; height:52px; z-index:25; pointer-events:none; background:linear-gradient(180deg, var(--ground) 34%, rgba(243,245,248,0) 100%); }

/* iPhone dynamic island */
.island{ position:absolute; top:11px; left:50%; transform:translateX(-50%); width:112px; height:31px; border-radius:999px; background:#050506; z-index:40; }
/* Android hole-punch */
.hole{ position:absolute; top:14px; left:50%; transform:translateX(-50%); width:11px; height:11px; border-radius:999px; background:#050506; z-index:40; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.08); }

/* OS status bar (part of the frame, does not scroll) */
.statusbar{ position:absolute; top:0; left:0; right:0; height:46px; z-index:30; display:flex; align-items:center; justify-content:space-between; padding:0 26px; font-size:13px; font-weight:600; color:var(--ink); pointer-events:none; }
.statusbar.android{ padding:0 18px 0 22px; font-weight:500; font-size:12.5px; }
.sb-time{ letter-spacing:0.01em; }
.sb-right{ display:flex; align-items:center; gap:6px; }
.sb-right svg{ width:16px; height:15px; color:var(--ink); }
.statusbar.android .sb-right svg{ width:14px; height:13px; }

/* -- desktop browser -- */
.browser{ width:min(1120px,calc(100vw - 44px)); margin:0 auto; border-radius:16px; overflow:hidden; background:var(--surface); box-shadow:0 2px 6px rgba(0,0,0,0.4), 0 40px 90px -30px rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.06); }
.browser-bar{ height:46px; display:flex; align-items:center; gap:14px; padding:0 16px; background:#e9ecf1; border-bottom:1px solid rgba(20,22,30,0.10); }
.tl{ display:flex; gap:8px; }
.tl span{ width:12px; height:12px; border-radius:999px; }
.tl .r{ background:#ff5f57; } .tl .y{ background:#febc2e; } .tl .g{ background:#28c840; }
.url{ flex:1; display:flex; align-items:center; gap:9px; height:28px; padding:0 14px; background:#fff; border-radius:8px; border:1px solid rgba(20,22,30,0.10); font-family:var(--mono); font-size:12.5px; color:var(--ink-2); max-width:520px; }
.url svg{ width:13px; height:13px; color:var(--ink-3); }
.url b{ color:var(--ink); font-weight:600; }
.browser .device-screen{ height:720px; border-radius:0; }

/* ============================================================
   THE PAGE  (identical markup in every frame; container queries
   + [data-platform] on .device-screen drive layout + button emphasis)
   ============================================================ */
.page{ min-height:100%; display:flex; flex-direction:column; background:
   radial-gradient(120% 80% at 50% -8%, var(--accent-soft) 0%, rgba(232,240,251,0) 46%),
   var(--ground); }

/* faint dot-grid atmosphere, masked (landing GWDotGrid) */
.page::before{ content:""; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(rgba(20,22,40,0.045) 1px, transparent 1px); background-size:22px 22px;
  -webkit-mask-image:radial-gradient(120% 70% at 50% 0%, #000 38%, transparent 82%);
  mask-image:radial-gradient(120% 70% at 50% 0%, #000 38%, transparent 82%); }
.page > *{ position:relative; z-index:1; }

/* -- per-gym site header -- */
.site-head{ display:flex; align-items:center; justify-content:space-between; padding:52px 22px 14px; }
.device-screen .scroll .site-head{ padding-top:56px; }   /* clear the OS status bar on phones */
.browser .site-head{ padding:20px 40px 14px; }
.gym-id{ display:flex; align-items:center; gap:11px; }
.monogram{ width:40px; height:40px; border-radius:11px; background:var(--grad); box-shadow:var(--button-shadow); display:grid; place-items:center; color:#fff; font-weight:700; font-size:16px; letter-spacing:0.01em; flex:0 0 auto; }
.monogram svg{ width:22px; height:22px; }
.gym-word{ font-size:16px; font-weight:600; letter-spacing:0.02em; color:var(--ink); line-height:1.1; }
.gym-word .sub{ display:block; font-family:var(--mono); font-size:9.5px; font-weight:500; letter-spacing:0.16em; color:var(--ink-3); margin-top:3px; text-transform:uppercase; }
.powered{ display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-3); }
.powered .cd{ width:18px; height:18px; border-radius:6px; background:var(--grad); display:grid; place-items:center; color:#fff; }
.powered .cd svg{ width:11px; height:11px; }

/* ---- HERO ---- */
.hero{ padding:26px 22px 40px; }
.browser .hero{ padding:44px 40px 68px; }
.eyebrow{ font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--sapphire); }
.hero h1{ margin-top:16px; font-size:clamp(34px,10cqw,52px); font-weight:600; letter-spacing:-0.03em; line-height:1.02; color:var(--ink); text-wrap:balance; }
.hero .lede{ margin-top:16px; font-size:clamp(16px,4.4cqw,19px); font-weight:450; line-height:1.5; color:var(--ink-2); max-width:34ch; text-wrap:pretty; }

/* the four value props as a check-row (composed from the kiosk .app-benefits) */
.checks{ list-style:none; margin-top:22px; display:flex; flex-wrap:wrap; gap:9px 20px; }
.checks li{ display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:500; color:var(--ink); }
.checks .ck{ width:19px; height:19px; border-radius:999px; background:var(--accent-soft); display:grid; place-items:center; color:var(--sapphire); flex:0 0 auto; }
.checks .ck svg{ width:12px; height:12px; }

/* CTA cluster */
.cta{ margin-top:28px; }
.reco{ display:none; font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:11px; }
.reco .live{ display:inline-flex; align-items:center; gap:6px; }
.reco .live::before{ content:""; width:6px; height:6px; border-radius:999px; background:var(--sapphire); box-shadow:0 0 0 3px rgba(42,103,189,0.18); }

.store-badges{ display:flex; flex-direction:column; gap:12px; align-items:flex-start; }

/* a store badge (placeholder — app unpublished) */
.badge{ position:relative; display:inline-flex; align-items:center; gap:12px; height:58px; padding:0 20px 0 18px; border-radius:14px; cursor:default; user-select:none; min-width:212px; text-align:left; transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .2s ease; }
.badge .glyph{ width:26px; height:26px; flex:0 0 auto; display:grid; place-items:center; }
.badge .glyph svg{ width:100%; height:100%; }
.badge .lines{ display:flex; flex-direction:column; line-height:1.05; }
.badge .lines .top{ font-size:10.5px; font-weight:500; letter-spacing:0.02em; opacity:0.8; }
.badge .lines .name{ font-size:19px; font-weight:600; letter-spacing:-0.01em; margin-top:2px; }
/* "coming soon" honesty flag pinned to the badge */
.badge .soon{ position:absolute; top:-9px; right:-8px; font-family:var(--mono); font-size:8.5px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#fff; background:var(--sapphire); border-radius:999px; padding:3px 8px; box-shadow:0 4px 12px -4px rgba(42,103,189,0.6); }

/* PRIMARY badge = near-black official-style store badge */
.badge.primary{ background:#101216; color:#fff; box-shadow:0 1px 2px rgba(10,12,20,0.4), 0 14px 30px -12px rgba(10,12,20,0.55); }
.badge.primary:hover{ transform:translateY(-2px); box-shadow:0 2px 4px rgba(10,12,20,0.4), 0 20px 40px -14px rgba(10,12,20,0.6); }
.badge.primary .glyph{ color:#fff; }
/* SECONDARY badge = quiet ghost so platform hierarchy is unmistakable */
.badge.secondary{ background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--control-shadow); }
.badge.secondary:hover{ transform:translateY(-2px); box-shadow:var(--card-shadow); }
.badge.secondary .glyph{ color:var(--ink); }
.badge.secondary .soon{ background:var(--ground-alt); color:var(--ink-3); box-shadow:none; }

.cta-note{ margin-top:16px; font-size:13.5px; font-weight:450; line-height:1.5; color:var(--ink-3); max-width:40ch; }
.cta-note b{ color:var(--ink-2); font-weight:600; }

/* platform emphasis: default (desktop/equal) = both PRIMARY, side by side.
   ios / android = the matching badge PRIMARY + first, the other SECONDARY. */
.badge-ios .glyph, .badge-android .glyph{ /* glyphs use currentColor */ }
[data-platform="ios"] .badge-android{ order:2; }
[data-platform="ios"] .badge-ios{ order:1; }
[data-platform="android"] .badge-ios{ order:2; }
[data-platform="android"] .badge-android{ order:1; }
/* turn the non-recommended badge into the ghost variant */
[data-platform="ios"] .badge-android{ background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--control-shadow); }
[data-platform="ios"] .badge-android .glyph{ color:var(--ink); }
[data-platform="ios"] .badge-android .soon{ background:var(--ground-alt); color:var(--ink-3); box-shadow:none; }
[data-platform="android"] .badge-ios{ background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:var(--control-shadow); }
[data-platform="android"] .badge-ios .glyph{ color:var(--ink); }
[data-platform="android"] .badge-ios .soon{ background:var(--ground-alt); color:var(--ink-3); box-shadow:none; }
/* which reco line shows */
[data-platform="ios"] .reco-ios{ display:block; }
[data-platform="android"] .reco-android{ display:block; }
[data-platform="desktop"] .reco-desktop{ display:block; }

/* hero phone-proof (desktop only; a phone-in-phone on the phone views is redundant) */
.hero-proof{ display:none; }

/* ---- VALUE PROP SECTIONS ---- */
.prop{ padding:34px 22px; }
.browser .prop{ padding:56px 40px; }
.prop + .prop{ border-top:1px solid var(--line-soft); }
.prop-eyebrow{ display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink-3); }
.prop-eyebrow .idx{ color:var(--sapphire); }
.prop h2{ margin-top:13px; font-size:clamp(24px,6.4cqw,30px); font-weight:600; letter-spacing:-0.025em; line-height:1.08; color:var(--ink); text-wrap:balance; }
.prop p{ margin-top:11px; font-size:clamp(15px,4cqw,17px); font-weight:450; line-height:1.5; color:var(--ink-2); max-width:42ch; text-wrap:pretty; }
.prop-visual{ margin-top:24px; }

/* == composed product surfaces (from the approved kiosk welcome) == */

/* class rows (kiosk .bc-row) — Book */
.bc-list{ display:flex; flex-direction:column; gap:12px; }
.bc-row{ display:flex; align-items:center; gap:13px; background:var(--surface-grad); border:1px solid var(--line); border-radius:var(--r-tile); box-shadow:var(--card-shadow); padding:11px 13px; }
.bc-thumb{ position:relative; width:104px; aspect-ratio:16/10; border-radius:10px; overflow:hidden; flex:0 0 auto; background:radial-gradient(120% 130% at 30% 0%,#3a4a7a,#171a2b); }
.bc-thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.bc-meta{ display:flex; flex-direction:column; gap:3px; min-width:0; flex:1 1 auto; }
.bc-name{ font-size:16px; font-weight:600; letter-spacing:-0.01em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bc-when{ font-size:13.5px; font-weight:500; color:var(--ink-2); }
.bc-when b{ color:var(--good); font-weight:600; }
.bc-book{ flex:0 0 auto; font-size:13px; font-weight:600; letter-spacing:-0.01em; color:#fff; background:var(--grad); border-radius:999px; padding:9px 18px; box-shadow:0 4px 12px -4px rgba(42,103,189,0.5); }

/* reward cards (kiosk .reward) — Earn */
.reward-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px 14px; max-width:360px; }
.reward{ display:flex; flex-direction:column; background:var(--surface-grad); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--card-shadow); overflow:hidden; }
.reward-photo{ position:relative; display:block; width:100%; aspect-ratio:3/2; overflow:hidden; background:#20242e; }
.reward-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.price-pill{ position:absolute; top:8px; right:8px; z-index:2; font-size:11.5px; font-weight:700; letter-spacing:-0.01em; line-height:1; color:#fff; background:var(--sapphire); border-radius:var(--r-sm); padding:5px 9px; box-shadow:0 3px 10px -3px rgba(42,103,189,0.55); }
.reward-body{ padding:10px 11px 12px; display:flex; flex-direction:column; gap:6px; }
.reward-name{ text-align:center; color:var(--ink); font-size:14.5px; font-weight:600; letter-spacing:-0.01em; line-height:1.2; }
.reward-pts{ text-align:center; font-size:14px; font-weight:700; letter-spacing:-0.01em; color:var(--sapphire); }

/* video cards (kiosk .vcard) — Watch */
.vc-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:440px; }
.vcard{ display:flex; flex-direction:column; background:var(--surface-grad); border:1px solid var(--line); border-radius:var(--r-tile); box-shadow:var(--card-shadow); overflow:hidden; }
.vcard-thumb{ position:relative; aspect-ratio:16/9; background:#20242e; }
.vcard-thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.vcard-thumb::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,12,20,0) 55%,rgba(10,12,20,0.22) 100%); }
.play{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2; width:32px; height:32px; border-radius:999px; background:rgba(255,255,255,0.94); display:grid; place-items:center; box-shadow:0 5px 14px -4px rgba(15,20,35,0.55); }
.play svg{ width:13px; height:13px; margin-left:2px; color:var(--sapphire); }
.vcard-info{ display:flex; align-items:center; gap:9px; padding:10px 11px 12px; }
.vcard-avatar{ width:28px; height:28px; border-radius:999px; flex:0 0 auto; display:grid; place-items:center; background:var(--ground-alt); border:1px solid var(--line); color:var(--ink-2); font-size:12px; font-weight:700; }
.vcard-meta{ min-width:0; display:flex; flex-direction:column; gap:2px; }
.vcard-title{ font-size:13.5px; font-weight:600; letter-spacing:-0.01em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vcard-views{ font-size:12px; font-weight:500; color:var(--ink-3); }

/* belt strip (kiosk .belt-strip) — Track rank */
.belt-panel{ background:var(--surface-grad); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--card-shadow); padding:24px 22px 22px; max-width:460px; }
.belt-strip{ display:flex; align-items:flex-end; justify-content:space-between; gap:8px; }
.belt{ display:flex; flex-direction:column; align-items:center; gap:7px; position:relative; }
.belt-img{ width:54px; height:36px; display:grid; place-items:center; opacity:0.42; filter:grayscale(0.25); }
.belt-img img{ max-width:100%; max-height:100%; object-fit:contain; }
.belt-tag{ font-size:11px; font-weight:600; letter-spacing:0.02em; color:var(--ink-3); text-transform:capitalize; }
.belt.current .belt-img{ width:76px; height:52px; opacity:1; filter:none; }
.belt.current .belt-tag{ color:var(--sapphire); font-weight:700; }
.belt-here{ font-size:10px; font-weight:700; color:#fff; background:var(--sapphire); border-radius:999px; padding:3px 9px; box-shadow:0 3px 10px -3px rgba(42,103,189,0.55); }
.rank-prog{ margin-top:22px; display:flex; flex-direction:column; gap:9px; }
.rank-bar{ width:100%; height:8px; border-radius:999px; background:var(--ground-alt); overflow:hidden; }
.rank-bar > span{ display:block; height:100%; border-radius:999px; background:var(--grad); }
.rank-prog-label{ font-size:14px; font-weight:600; letter-spacing:-0.01em; color:var(--ink-2); }
.rank-prog-label b{ color:var(--sapphire); font-weight:700; }

/* ---- CLOSING CTA ---- */
.closing{ margin-top:8px; padding:44px 22px 40px; border-top:1px solid var(--line-soft); text-align:center; display:flex; flex-direction:column; align-items:center; }
.browser .closing{ padding:72px 40px; }

/* ============================================================
   DESKTOP LAYOUT  (container query — fires inside the wide browser
   frame's .device-screen, ~1080px, NOT the ~390px phone screens)
   ============================================================ */
@container page (min-width:720px){
  .hero{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:44px; align-items:center; }
  .hero .lede{ max-width:40ch; }
  .hero-proof{ display:block; justify-self:end; }

  .prop{ display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:center; }
  .prop-visual{ margin-top:0; }
  .prop-text{ max-width:46ch; }
  /* alternate image side for asymmetric rhythm (avoid the generic centered stack) */
  .prop-earn .prop-text, .prop-rank .prop-text{ order:2; }
  .prop-earn .prop-visual, .prop-rank .prop-visual{ order:1; }
  .prop .reward-grid, .prop .vc-grid, .prop .bc-list, .prop .belt-panel{ margin-left:auto; margin-right:auto; }
  .prop-earn .prop-visual > *, .prop-rank .prop-visual > *{ margin-right:0; }

  .store-badges{ flex-direction:row; align-items:stretch; }
  .closing .store-badges{ justify-content:center; }
}

<script>
/* ---- review-bar view switching ---- */
const rtabs = document.querySelectorAll('.review-tab');
const views = document.querySelectorAll('.view');
rtabs.forEach(t => t.addEventListener('click', () => {
  rtabs.forEach(x => x.classList.toggle('active', x === t));
  views.forEach(v => v.classList.toggle('active', v.dataset.view === t.dataset.view));
}));

/* ---- clone the single page template into every device frame ---- */
const tpl = document.getElementById('page-tpl');
document.querySelectorAll('[data-page]').forEach(host => {
  host.appendChild(tpl.content.cloneNode(true));
});

/* ---- live platform detection note (the REAL page would auto-order the
   store buttons from this; the frames above hard-set it so the treatment
   is visible on any device you open this mockup on) ---- */
(function(){
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);
  window.__detectedPlatform = isIOS ? 'ios' : isAndroid ? 'android' : 'desktop';
})();

/* ---- fake-but-realistic QR (finder patterns + seeded modules), matches the
   kiosk mockup's generator so the "scan again" chip reads as a real code ---- */
function buildQR(svgId, N, seedInit){
  const svg = document.getElementById(svgId);
  if(!svg) return;
  let seed = seedInit;
  const rnd = () => { seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const grid = Array.from({length:N}, () => Array(N).fill(false));
  const reserved = Array.from({length:N}, () => Array(N).fill(false));
  function finder(r,c){
    for(let i=-1;i<=7;i++) for(let j=-1;j<=7;j++){
      const rr=r+i, cc=c+j; if(rr<0||cc<0||rr>=N||cc>=N) continue;
      reserved[rr][cc]=true;
      grid[rr][cc]=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))||(i>=2&&i<=4&&j>=2&&j<=4);
    }
  }
  finder(0,0); finder(0,N-7); finder(N-7,0);
  for(let i=8;i<N-8;i++){ grid[6][i]=(i%2===0); grid[i][6]=(i%2===0); reserved[6][i]=reserved[i][6]=true; }
  (function align(r,c){ for(let i=-2;i<=2;i++) for(let j=-2;j<=2;j++){ const rr=r+i,cc=c+j; reserved[rr][cc]=true; grid[rr][cc]=(Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0)); } })(N-7,N-7);
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(!reserved[r][c]) grid[r][c] = rnd() > 0.52;
  let rects='';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(grid[r][c]) rects += '<rect x="'+c+'" y="'+r+'" width="1" height="1"/>';
  svg.setAttribute('viewBox','0 0 '+N+' '+N);
  svg.innerHTML = '<g fill="#16181D" shape-rendering="crispEdges">'+rects+'</g>';
}
/* the QR lives inside cloned templates → build every instance */
document.querySelectorAll('#qr-close').forEach((el,i) => { el.id = 'qr-close-'+i; buildQR('qr-close-'+i, 25, 55123901 + i); });
</script>
