{# Shared shell for every HTML email.

   INLINE CSS ONLY — Gmail and Outlook strip <style> blocks, so anything
   declared in a stylesheet simply does not exist by the time a recipient
   reads this. Tables rather than flex/grid for the same reason.

   Blocks: `body` (required) and `footer_extra` (marketing kinds put their
   unsubscribe line there; transactional kinds leave it empty on purpose). #}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background-color:#f4f4f5;margin:0;padding:24px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:520px;background-color:#ffffff;border-radius:12px;
                    padding:32px;font-family:-apple-system,BlinkMacSystemFont,
                    'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                    color:#18181b;">
        <tr>
          <td align="center" style="padding-bottom:20px;">
            {% if logo_url %}
            <img src="{{ logo_url }}" alt="{{ gym_name }}" width="56"
                 style="display:block;width:56px;height:auto;
                        border-radius:8px;" />
            {% endif %}
            <div style="font-size:15px;font-weight:600;color:#18181b;
                        padding-top:10px;">{{ gym_name }}</div>
          </td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:1.6;color:#3f3f46;">
            {% block body %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding-top:28px;border-top:1px solid #e4e4e7;
                     font-size:12px;line-height:1.5;color:#71717a;">
            Sent by {{ gym_name }} via CombatDen.
            {% block footer_extra %}{% endblock %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
