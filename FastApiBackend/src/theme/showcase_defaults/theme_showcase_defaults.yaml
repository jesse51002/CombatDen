# Category-keyed demo showcase content for the standalone theme browser.
#
# Static, bundled sample class/reward cards shown when no real gym is selected
# (the public theme browser has no login, so no gym data). Ported from the CRM's
# bundled constants (CRM/lib/showcase/showcase_group_defaults.dart). Loaded and
# validated into `ShowcaseDefaults` by `ThemeShowcaseDefaultsService`.
#
# Image hosts (kept as-is from the source):
#   * Class photos  — images.pexels.com (activity/people-safe)
#   * Reward photos — mix of images.pexels.com and upload.wikimedia.org
#
# The source constants carry only name / instructor_name / image_url per class
# and title / image_url / price_label / points_cost per reward, so the optional
# card fields (description, instructor_bio, instructor_image_url) are absent.

