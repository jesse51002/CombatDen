[project]
name = "combatden-api"
version = "0.1.0"
description = "CombatDen FastAPI Backend"
authors = [
    {name = "jm"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "uvicorn[standard] (>=0.42.0,<0.43.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "postgrest (>=2.28.3,<3.0.0)",
    "gotrue (>=2.12.4,<3.0.0)",
    "pyjwt[crypto] (>=2.12.1,<3.0.0)",
    "dependency-injector (>=4.49.0,<5.0.0)",
    "sqlalchemy[asyncio] (>=2.0.48,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "stripe (>=15.0.1,<16.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.8,<0.16.0)",
]

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.poetry]
package-mode = false
