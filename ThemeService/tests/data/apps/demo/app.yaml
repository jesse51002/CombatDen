id: demo
display_name: Demo App

# Matches the `category: Modern` stamped in default/output.yaml (the
# template `_seed_named_styles`/`_write_demo_app_yaml` in test_api.py copy
# from) so the styles-list vocabulary check accepts it.
categories:
  - Modern
  - Classic

images:
  - id: hero
    description: Bold hero illustration on a flat solid background.

colors:
  - id: primary
    description: Dominant brand colour for primary CTAs and key accents.
  - id: background
    description: App background surface colour.
    role: background
  - id: text
    description: Primary readable text colour for headings and body.
    role: text
  - id: accent
    description: Secondary highlight colour for badges and small accents.

fonts:
  - id: display
    description: Headlines and hero typography at large sizes.
  - id: body
    description: Running UI text — buttons, labels, body copy.

icons:
  - id: home_tab
    description: Navigation tab that returns to the home screen.
  - id: search_action
    description: Action that opens search.
  - id: celebration_badge
    description: Celebratory award badge shown when a milestone is hit.

texts:
  - id: booked_screen
    description: CTA shown to the user the moment a session is booked.
    min_words: 1
    max_words: 4
    min_chars: 3
    max_chars: 24
  - id: cancel_cta
    description: Button label that cancels a pending session.
    min_words: 1
    max_words: 3
    min_chars: 4
    max_chars: 18
  - id: home_greeting
    description: Top-of-home-screen greeting shown when the app opens.
    min_words: 2
    max_words: 6
    min_chars: 6
    max_chars: 40

# Two format slots — enough to exercise the multi-slot batched call and the
# per-slot vocabulary (each slot's list is its own), so the format node is
# covered end to end (registry -> graph -> assemble -> writer -> seed ->
# expand) without every fixture assertion carrying the real app's seven.
# Neither is in default/output.yaml, so they also stand in for the
# not-yet-done slots an `expand` pass backfills.
formats:
  - id: home_format
    description: How the schedule screen arranges its days and classes.
    values:
      - value: agendaList
        description: Pinned date rail over day groups; text left, thumb right.
      - value: dayPager
        description: One day per swipe; classes as wide media cards.
      - value: timeSpine
        description: A time gutter runs the day; classes hang off their start.
  - id: rewards_format
    description: How the points store presents its rewards and prices.
    values:
      - value: cardGrid
        description: Two-up image-top cards with the price tag on the image.
      - value: listRows
        description: "Full-width rows: square thumb left, action trailing."
