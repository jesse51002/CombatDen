[project]
name = "themeservice"
version = "0.1.0"
description = "App-agnostic AI customization pipeline: brand brief -> customized app (colors + images)."
requires-python = ">=3.13,<4.0"
dependencies = [
    "httpx (>=0.27,<1.0)",
    "litellm (>=1.0,<2.0)",
    "pillow>=10.0,<12.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.47.0,<0.48.0)",
    "networkx (>=3.6.1,<4.0.0) ; python_version >= \"3.13\" and python_full_version != \"3.14.1\" and python_version < \"4.0\"",
    "coloraide (>=8.8.1,<9.0.0)",
    "boto3 (>=1.43.18,<2.0.0)",
    "pydantic-ai-slim[anthropic] (>=2.18.0,<3.0.0)",
]

[tool.poetry]
# Two top-level packages (neither matches the project name) -> list explicitly.
packages = [
    { include = "src" },
    { include = "schema" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
