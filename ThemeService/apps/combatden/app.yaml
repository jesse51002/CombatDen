id: combatden
display_name: CombatDen

# The app-declared classification vocabulary: the closed set of values a
# run's output.yaml `category` may carry (the 8 parent gym-type buckets —
# mirrors ParentGymType in the FastApi backend / the CRM's showcase
# groups). A run whose category is missing or outside this set is skipped
# by GET /apps/{id}/styles. The category itself lives per-run in
# output.yaml, produced by the pipeline's classification node — it builds
# its response schema from this very list, so a value outside it can't be
# written. `expand` backfills an unclassified run; `regen --slot category`
# re-files a mis-classified one.
categories:
  - Fighting
  - Yoga
  - Pilates
  - Barre
  - HIIT
  - Cardio
  - Dance
  - Wellness

images:
  # Shared (tenant-wide)
  - id: logo_primary
    description: >-
      The gym's primary brand logo / identity mark. Lives in the persistent
      app top bar (GymHeader), shown roughly 100x100 and centred directly
      above the gym name and the info bar (which holds the rank, streak,
      points and QR items). It is present on every main tab — Home,
      Profile, Rewards, Videos — and at the top of every post-class
      celebration screen. It is the first thing the user sees on app open
      and is on screen almost constantly. Purpose: pure brand anchor and
      gym identity; it is never tied to an event or a reward. Role is calm
      and permanent, not celebratory — it must read instantly and stay
      legible at small size as a single coherent logo mark. Keep it simple
      and realistic — a clean, professional logo an actual business would
      really use as its mark, not an illustrated scene, a busy composition,
      or a rendered mascot (e.g. a wordmark, a monogram / lettermark, an
      emblem or badge mark, a simple abstract symbol — brand's choice).
  - id: rank_belt
    description: >-
      The visual token of the user's CURRENT earned rank / tier — what
      they are right now. The object is the brand's to choose: in combat
      sports a graded belt reads instantly, but interpret it as whatever
      rank token fits this brand's world (e.g. a graded belt, a tiered
      badge, a chevron/stripe rank insignia, a ranked crest — brand's
      choice). Used in three places: (1) a tiny ~39x24 indicator in the
      persistent top info bar next to the rank label; (2) ~77x50 in the
      Profile screen's rank header beside the rank name and subtitle; (3)
      the animated hero of the post-class Rank celebration screen — the 2nd
      of five post-class cards (Streak, Rank, Points, Rewards, Wins) — where
      it flies in large and centred (~280px), holds, then shrinks down into
      the profile header slot as stats fade in. So it must work both as a
      calm, tiny status indicator and as a bold, proud celebratory hero. The
      moment is achievement and earned status.

  # Page-specific
  - id: celebration_image
    description: >-
      The single hero that celebrates a successful class booking. Fills the
      ClassBookedScreen as a full-bleed centred hero (~50-60% of the
      viewport), revealed with a scale-in pop after a brief loading +
      done-check sequence, with a "Class Booked" headline directly below it
      and a Continue button at the bottom. It appears the instant the user
      commits to booking a class and is the ONLY place a booking success is
      celebrated — the first positive payoff for that action and a key
      retention moment. The emotion is peak, energetic, congratulatory
      success: "you're in, your spot is locked". Read that feeling and pick
      imagery that lands it in this brand's world (e.g. a confirmed
      ticket/pass, a checkmark seal in a burst, a locked-in calendar mark,
      raised gloves, a flag planted — brand's choice).
  - id: trophy_image
    description: >-
      The celebratory hero that headlines the end-of-session "Today's Wins"
      recap — its job is to land the feeling of victory and accomplishment,
      the reward for showing up and finishing. Read the emotion, not a fixed
      object: choose imagery that says "won / accomplished" in this brand's
      world (e.g. a trophy, a champion's belt, a medal, a laurel/crown, a
      milestone marker — brand's choice). Sits ~230x230, centred inside a
      sparkle/particle burst, on the WinsScreen — the 5th and final card of
      the post-class flow — with a "Today's Wins" headline, subtitle and
      three summary stat tiles cascading in below it. This is the closing
      high note as the user leaves the gym after their session is recapped.
  - id: points_stars_image
    description: >-
      The hero that celebrates the points earned during a session — a burst
      of earned value at the climax of the points reveal. It should echo the
      app's points unit (see single_point): build it from that same token
      rather than a generic graphic. On the PointsScreen — the 3rd post-class
      card — a kinetic 3D sphere of orbiting point tokens first collapses
      inward, and then this ~238x238 graphic is revealed centred with a "+N
      POINTS" count-up and a running total caption pinned below. It is the
      payoff at the end of the points animation: rewarding and high-energy
      (e.g. a radiant cluster, an upward cascade, or a burst of the point
      tokens — brand's choice). Must still read instantly as "points /
      earned value" and stay semi-professional — energetic, not gimmicky.
    depends_on:
      - single_point
  - id: next_rank_belt_image
    description: >-
      A preview of the NEXT rank's token — the tier the user is working
      toward, deliberately distinct from rank_belt (their current tier). Use
      the same kind of rank token rank_belt uses for this brand (e.g. a
      graded belt, a tiered badge, a chevron/stripe insignia, a ranked
      crest), but clearly one tier HIGHER and aspirational. Lives in the
      Profile screen's "Next Rank" section, inset inside a ~100x100 circular
      progress badge: an animated progress arc rings the badge and the image
      sits within it with ~22px padding, above a "Next Rank" title and an
      "X / Y classes to next tier" progress label. The moment is calm,
      between-classes browsing — motivational, not celebratory. It must read
      clearly inside a small circular badge without fighting the progress
      ring, and should clearly feel like a higher tier the user has not
      reached yet.
    depends_on:
      - rank_belt
  - id: giftbox
    description: >-
      The SOURCE of an unwrap-then-burst animation — the metaphor for an
      unclaimed reward about to be opened. It MUST read instantly (even
      mid-motion) as a single closed container that opens and releases a
      burst; the exact object is the brand's (e.g. a wrapped gift box, a
      treasure chest, a sealed prize capsule, a locker/case — brand's
      choice). On the RewardsCardScreen (4th post-class card) it flies in
      with a spin, holds briefly, then scales away as point tokens burst
      outward from its centre, after which a rewards carousel takes over. It
      is never shown statically for long — it exists to be opened. The moment
      is anticipation releasing into payoff: "you've earned something, claim
      it". Playful, kinetic, high-energy.
    depends_on:
      - single_point
  - id: single_point
    description: >-
      The app's signature points / earned-value token — the atomic
      unit of the points / rewards visual language. Three uses: (1) a ~22px
      points icon in the persistent top info bar next to the points balance;
      (2) fourteen instances forming the orbiting 3D sphere on the Points
      screen; (3) fourteen instances bursting radially out of the giftbox on
      the Rewards screen. So it is simultaneously a tiny permanent utility
      icon AND a mass-instanced motion particle: it MUST read instantly as a
      "points" unit, be simple, perfectly legible at ~22px, symmetrical, and
      look right when repeated, rotated, depth-sorted and scaled in motion —
      a single clean token, never a scene or a cluster, and kept
      semi-professional (no wild or gimmicky shapes). The object is otherwise the brand's to choose
      (e.g. a star, a coin/chip, a gem, a pip/token) as long as it
      stays an instantly-readable, restrained points unit.
  - id: icon_qrcode
    description: >-
      A QR-code graphic that signals in-gym check-in / sign-up. It is the
      right-most item of the persistent top info bar, ~30px tall and
      tappable; per the product it serves the at-the-gym check-in moment —
      scanned one-thumbed, sometimes with sweaty hands and variable gym
      lighting (the dedicated full check-in screen is not built yet, so for
      now it lives only as this top-bar entry point). Role is a calm,
      functional, navigational utility — it MUST read unmistakably as a
      scannable QR affordance at small size, never celebratory. It is a
      stylised QR-style graphic standing for "check in here", not a real
      scannable code.
  - id: streak_icon
    description: >-
      Communicates that the user has an attendance streak going. Read that feeling
      and pick imagery that fits this brand's world
      (e.g. a flame, stacked forward chevrons, a lightning bolt, or pick wtv you think would fit is encouraged).
      This should be stylized to fit their brand and feel exciting while being clear and scannable.
      Must not be inside a token, wtv you pick should be on its own.
      Used in three places: (1) ~22x30 in the persistent top info bar beside the streak
      day count; (2) ~12x15 in the Home screen's upcoming-sessions card
      footer next to "You're on an X week streak!"; (3) the ~240px icon hero
      of the post-class Streak screen (the 1st post-class card), revealed by
      the streak celebration animation as it grows in.
colors:
  - id: primary
    description: Dominant brand color. Used for primary CTAs and key accents.
  - id: background
    description: App background color. Usually dark for a gym aesthetic.
    role: background
  - id: text
    description: Main text color for headings and body copy.
    role: text
  - id: accent
    description: Selection / active-state highlight. MUST be a visibly distinct
      hue from `primary` (a different hue family, not a tint or clone of it),
      premium and coherent on the dark gym canvas, and meet WCAG AA against the
      background. Drives the active nav item, active timeframe pill, and active
      tab — used as borders / one active label, never a fill.

fonts:
  - id: display
    description: >-
      Headline / hero / celebration typography — the "Class Booked"
      title, post-class card titles (Streak / Rank / Points / Rewards /
      Wins), points count-ups, and screen titles. Used at large sizes
      (24–64px) and short bursts. Must carry the brand's athletic
      energy and feel distinctive at a glance — confident, modern,
      premium. Numerals must read cleanly because every celebration
      screen pairs the title with a big number.
  - id: body
    description: >-
      All running UI text — buttons, list rows, info-bar labels (rank /
      streak / points), stat tiles, body copy. Used at 13–18px in long
      sessions on a dark canvas. Must be highly legible at small sizes,
      have a generous x-height, hold up at every weight from regular to
      bold, and feel visually quiet so the display font and the
      accents lead. Numerals must be tabular-friendly because the info
      bar stacks several side-by-side counters.

texts:
  - id: class_booked_headline
    description: >-
      The full-bleed celebration headline shown the moment a class
      booking succeeds. Sits directly below the celebration hero on
      ClassBookedScreen, ~36–48px display weight. The single high
      point of the booking flow — the user just committed, this is
      their first positive payoff. Should land like the brand
      cheering — combative gyms read like a fighter locking in,
      grappling academies like stepping on the mat, premium studios
      like a calm confirmation. Title-case or sentence case; never
      ALL CAPS unless the brand demands it.
    min_words: 1
    max_words: 3
    min_chars: 4
    max_chars: 22
  - id: reserve_cta
    description: >-
      The primary booking button on a class detail / reservation
      screen — the action that commits the user to attend. Reads as
      a verb phrase in the brand's voice (combat gym: "Lock it in.";
      grappling academy: "Claim your mat."; calmer studio: "Reserve
      a spot."). Has to fit a single-line pill button without
      wrapping. Imperative, present tense, no trailing period unless
      the brand reads punchy with one.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 22
  - id: wins_title
    description: >-
      The headline of the post-class "wins" recap screen — the 5th
      and final post-class card. Pairs with a sparkle / trophy hero
      and three summary stat tiles. The closing high note of the
      session: it should celebrate the user's effort in the brand's
      voice without being saccharine. Combat-leaning brands lean
      punchy ("Today's wins"); calmer brands lean reflective
      ("Today's progress"). Short, declarative, never a full
      sentence.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 20
  - id: wins_subtitle
    description: >-
      The one-line subtitle directly under the wins headline on the
      same end-of-session recap screen. This is the single chattiest
      line of brand voice in the app — a short motivational beat
      that pushes the user back into the next session. Combat gyms
      read aggressive ("The grind never stops"), BJJ academies more
      technique-led ("Every roll sharpens you"), premium studios
      calm ("Each session counts"). One short clause; no exclamation
      mark unless the brand genuinely shouts.
    min_words: 2
    max_words: 6
    min_chars: 8
    max_chars: 40
  - id: book_next_class_cta
    description: >-
      The CTA at the bottom of the post-class wins recap that takes
      the user back into the booking flow for their next session.
      Same button shape as ``reserve_cta`` but the moment is
      different — the user just finished training and is being
      nudged to commit again. Should read like the brand inviting
      them back, not pleading. Imperative, verb-led, no trailing
      period.
    min_words: 2
    max_words: 5
    min_chars: 8
    max_chars: 28

# The persistent bottom-nav tab icons — the most repeated, brand-defining
# glyphs in the member app (present on Home, Rank/Profile, Rewards and
# Videos). Monochrome; the MobileApp tints them per theme (active = accent,
# inactive = muted text), so no colour belongs here. Each falls back to a
# Material Symbol in the app if the pipeline doesn't supply one.
icons:
  - id: nav_home
    description: >-
      The Home tab icon in the persistent bottom navigation bar — the first,
      left-most tab and the app's default landing destination (upcoming
      sessions, the day's schedule). It MUST read as "home" at ~24px (e.g. a
      house, a roof + door, a dashboard grid — brand's choice). Calm,
      functional and permanent, never celebratory; must stay sharp and
      unambiguous when small and when shown in both an active (highlighted)
      and inactive (muted) state.
  - id: nav_rank
    description: >-
      The Rank tab icon in the persistent bottom navigation bar — opens the
      profile / rank screen where the user sees their current rank tier,
      rating graph and progress to the next rank. It MUST read as achievement
      / rank / earned status at ~24px (e.g. a medal, badge, crest, chevron
      tier, ranking mark — brand's choice), matching the gym's progression
      theme. Permanent navigation utility, not a celebration; legible and
      clear in both active and inactive states.
  - id: nav_reward
    description: >-
      The Reward tab icon in the persistent bottom navigation bar — opens the
      points store / rewards area where earned points are redeemed. It MUST
      read as a reward / something earned-and-claimable at ~24px (e.g. a gift,
      a present, a token, a prize tag, treasure — brand's choice), tying into
      the app's points-and-rewards language. A calm, functional navigation
      affordance; clear and sharp in active and inactive states.
  - id: nav_videos
    description: >-
      The Videos tab icon in the persistent bottom navigation bar — opens the
      technique / level-up video library. It MUST read as "play / watch
      videos" at ~24px (e.g. a play triangle, a film/clapper, a media tile —
      brand's choice). Functional navigation, never celebratory; must stay
      legible and obvious at small size in both active and inactive states.

# The switchable FORMATS of the member app. Two families, one list:
# LAYOUT (one slot per major screen, plus the shell that frames every
# screen) and MOTION (one global personality plus five per-surface
# overrides). Each slot carries its OWN closed vocabulary — the pipeline
# picks exactly one value per slot from the brand brief, in one batched
# call, so the whole app reads as one decision rather than thirteen.
#
# THE VALUES ARE THE WIRE. Every value below is a Dart enum value name
# from `../MobileApp/lib/core/formats/layout_formats.dart` or its sibling
# `motion_formats.dart`, because that is exactly what the app's `fromWire`
# parses (case-insensitive, whitespace-trimmed, literal otherwise). A typo
# here fails nowhere: it silently resolves to what the app ships and reads
# forever as "the classifier chose the default".
#
# A slot the pipeline never resolved is simply absent from the run's
# `format_set`, and the app renders what it ships today (the first value
# of each enum, which is also its parse fallback). So an unpicked, stale
# or failed format is a non-event, never a broken screen.
#
# THE INVARIANT BOTH FAMILIES HOLD: a format changes ARRANGEMENT AND
# TIMING ONLY, never WHAT EXISTS. A layout may move an element and change
# its prominence; it may not merge or split a screen, add or drop
# functionality, or reach data the shipped screen did not already have.
# Motion is a TOKEN, not a layout — it touches timing and entrance only,
# never which elements exist or where they sit.
#
# Each value's description is the only thing the model reads to choose, so
# each one says three things: what the value does to the screen, how it
# reads to a member, and what kind of brand it was built for AND what kind
# it is wrong for. The contrast is the part that makes a choice possible.
formats:
  # ---------------------------------------------------------------------
  # LAYOUT — one slot per major screen, plus the shell.
  # ---------------------------------------------------------------------
  - id: app_shell_format
    description: >-
      The chrome that frames every screen: the top bar's brand identity
      (mark + gym name) and the stats row (rank, streak, points, QR),
      plus the bottom navigation. Factored out of the per-screen slots
      because it belongs to none of them and composes with every body —
      whatever is chosen here is what the member sees on Home, Rank,
      Rewards and Videos alike, constantly.
    values:
      - value: stacked
        description: >-
          The mark takes a full square at the top of Home with the gym
          name beneath it, and the stats spread across a full-width bar
          under that, so identity claims real vertical space and each
          stat gets room around it. Reads like walking into a lobby: the
          place announces itself first, and the member's numbers are laid
          out rather than clustered. Built for gyms whose name and mark
          are the draw — an established club, a franchise with equity in
          its logo, anywhere membership means belonging to a named place.
          Wrong for a gym whose members open the app several times a week
          to check one time, where a lobby on every screen is a toll they
          pay over and over.
      - value: compactRail
        description: >-
          Mark, gym name and the whole stats cluster share one compact
          row, so the chrome is a single band of height and the screen's
          content starts higher on every tab. Reads
          efficient and tool-like: the brand is present but is not asking
          for the room. Built for gyms whose app is used in a hurry and
          used often, and whose screens are long — a full weekly
          timetable, a deep video library, a large rewards catalogue.
          Wrong for a boutique studio whose whole proposition is the room
          and the name, where compressing identity into a corner turns a
          considered brand into a booking utility.
      - value: statFirst
        description: >-
          The stats row (rank, streak, points, QR) sits ABOVE the brand
          identity, and identity drops beneath it to a small mark and a
          body-sized name, so the first thing on every screen is the
          member's own progress rather than the gym's name. Reads as a
          training instrument rather than a storefront: personal,
          measured, faintly utilitarian. Built for gyms whose whole
          proposition is measurable progress — competitive programmes,
          belt and rank systems, anywhere members come to watch a number
          move. Wrong for a studio whose draw is atmosphere or community,
          where meeting the member with their own metrics before the
          brand's name feels like being weighed at the door.
      - value: markOnly
        description: >-
          Only the mark is shown: the gym name leaves the screen (it
          stays in the tree as the switch-gym target and for screen
          readers), the stats run inline beside it, there is no rule
          under the bar, and the bottom nav becomes a floating pill with
          no labels. Reads assured and design-led — an app confident you
          already know whose it is. Built for a single-location brand
          with a distinctive, self-explanatory mark and a members-only
          audience: the kind of gym whose logo is on the wall, the shirts
          and the door. Wrong for a multi-location or newly opened gym
          whose name is still doing the work of telling a member where
          they are, and for an audience that needs its navigation
          labelled.
  - id: home_format
    description: >-
      The class schedule — the app's default landing destination and the
      screen a member opens most. It lists the gym's upcoming classes by
      day; this slot decides how those days and classes are arranged.
    values:
      - value: agendaList
        description: >-
          A pinned date rail sits over vertically stacked day groups,
          each class a row with its text left and a thumbnail right, so a
          whole week is one continuous scroll with a shortcut to any day.
          Reads like a printed timetable you flick through: orderly,
          complete, easy to plan against. Built for a gym with a broad
          weekly programme whose members choose their days in advance
          rather than taking whatever is next. Wrong for a studio running
          one or two sessions a day, where a date rail and day headers
          are scaffolding around almost nothing.
      - value: dayPager
        description: >-
          The date rail stops being a scroll shortcut and becomes the
          control: it drives a horizontal pager, one day per swipe, and
          each class gets the room to be a wide image-top media card.
          Reads focused and unhurried — one day is the whole world, and
          each class is presented rather than listed. Built for a gym
          whose days are genuinely different from one another and whose
          classes have to be sold with a picture: themed sessions, varied
          programming, a studio where choosing is part of the
          experience. Wrong for a member comparing Tuesday against
          Thursday to plan a training week, which this turns into a
          swipe-and-remember exercise.
      - value: timeSpine
        description: >-
          The time leaves the meta column and becomes a left gutter with
          a vertical rule running down every row, so consecutive classes
          read as one continuous spine, and the thumbnail demotes to a
          small square. Reads like the board on the wall of a busy gym:
          operational and precise, time first and everything else second.
          Built for gyms running many sessions back to back — a full mat
          schedule, overlapping classes, open mats — where the real
          question is what is on at six. Wrong for a studio with two
          sessions a day, where a timetable spine implies a density that
          is not there and shrinks the imagery that actually sells the
          class.
      - value: nextUpHero
        description: >-
          The upcoming-sessions card runs edge to edge as a hero, the
          date rail becomes a segmented control that scrolls away with
          the content instead of pinning, and the rest of the schedule
          collapses into dense rows beneath. Reads as an answer rather
          than a catalogue: what is next, then everything else. Built for
          a gym whose members train on a fixed routine and open the app
          on the way in — a commuter check-in, a team with a set weekly
          schedule. Wrong for a gym whose value is variety and discovery,
          where putting one booked session in front of the programme
          hides everything else the gym offers.
      - value: boardGrid
        description: >-
          Each day is a band header over a two-up card grid, which packs
          twice as many classes into a screenful and pays for it in time
          hierarchy: two classes side by side no longer read as "this
          one, then that one". Reads like a menu board — a wide offer,
          browsed by what it is rather than when it runs. Built for a
          multi-discipline club with many concurrent class types, where
          members pick by discipline first and time second. Wrong for a
          gym whose classes run strictly in sequence, where losing the
          reading order of the day is losing the schedule itself.
  - id: videos_format
    description: >-
      The video feed — the technique / level-up library, browsed by tag.
      This slot decides how the tags and their videos are laid out.
    values:
      - value: carouselRows
        description: >-
          A pill strip of tags, one featured video as a hero, then a
          horizontally scrolling row per tag, so many groups stay
          reachable without a long page. Reads like a streaming service:
          a deep library you graze rather than read. Built for a gym
          publishing a lot of content across a lot of tags, whose promise
          to members is the size of the library. Wrong for a small or
          newly started library, where a horizontal row holding three
          items reads as an empty shelf.
      - value: editorialStack
        description: >-
          Nothing scrolls sideways: the hero bleeds to both edges like a
          cover, and every tag becomes a vertical section of two
          width-filling cards closed by a view-all row. Reads like a
          publication — slower, considered, every title legible at a
          glance. Built for a gym whose content is long-form and
          instructional, where members choose by reading the title rather
          than recognising a thumbnail. Wrong for a large, shallow
          catalogue meant to be skimmed, since every tag now costs a full
          screen to pass.
      - value: mosaic
        description: >-
          The tag filter pins to the top so it stays reachable through a
          long page, the hero spans the full width, and each tag becomes
          a two-column tile grid under an inline band divider. Reads like
          a gallery: image-led, dense, made for browsing by eye. Built
          for a library whose thumbnails carry the meaning — movement
          demos, drills, highlight footage — and that is deep enough to
          reward scrolling. Wrong for content whose titles are the
          information (numbered curriculum steps, named techniques),
          which a two-column tile clips before it can be read.
      - value: shortsColumn
        description: >-
          One column of tall portrait cards, with each tag's name riding
          the top of its first card instead of standing above the
          section, so the page reads as one continuous run of posters.
          Reads native and casual — the shape members already scroll in
          every other app on the phone. Built for a gym whose content is
          short vertical clips: quick drills, tips, technique of the day.
          Wrong for landscape or long-form sessions, which portrait cards
          letterbox, and for a library whose tag structure is meant to be
          navigated rather than scrolled past.
      - value: tagRail
        description: >-
          The filter leaves the top and becomes a pinned rail down the
          left, scrolling inside its own fixed band, with the content in
          one narrower column beside it. Reads like a reference library
          with its table of contents permanently open. Built for a feed
          carrying enough named groups that a strip across the top stops
          being readable — a structured syllabus, a technique index, a
          multi-discipline catalogue. Wrong for a library with two or
          three tags, where a permanent rail spends a sixth of the screen
          on a control with almost nothing to do.
  - id: rank_format
    description: >-
      Rank and progress — the member's current earned tier, their streak,
      their rating graph and their distance to the next rank. The screen
      where earned status is displayed back to them.
    values:
      - value: sparkleStack
        description: >-
          The streak hero opens the screen at full size, then the rank
          summary (current rank, rating plot, range pills), then the next
          rank, then level-up videos, each separated by a rule. Reads as
          a record of showing up: consistency is the headline and grading
          is context beneath it. Built for gyms with no formal ladder, or
          where attendance IS the progression — group fitness,
          conditioning, studios whose retention story is the habit.
          Wrong for a graded art whose members open this screen to ask
          how far they are from the next belt, a question this
          arrangement answers third.
      - value: beltHero
        description: >-
          The current rank becomes a full-width band with the streak
          statement laid over it, the next-rank rail runs directly
          beneath, and the rating plot demotes to a card lower down, so
          "where I am" and "what is next" are one glance instead of two
          scroll positions. Reads ceremonial: the rank is worn, not
          reported. Built for graded martial arts where the belt is
          identity — the thing a member earns, wears and is known by.
          Wrong for a gym with no visible rank ladder, where a full-width
          band leads the screen with a token that means little to the
          person looking at it.
      - value: statTiles
        description: >-
          A board opens the screen — the streak above it, paired tiles
          for current rank and the timeframe selector, then next rank —
          with the rating plot running full bleed beneath. Reads as a
          dashboard: training as a set of readings you check. Built for
          performance-led gyms whose members treat training as
          measurement — conditioning programmes, competitive athletes,
          anyone tracking form across months. Wrong for a studio where
          progress is felt rather than measured, and where a board of
          tiles makes a practice look like a quarterly report.
      - value: progressFirst
        description: >-
          Next-rank progress is promoted to a large arc with the rank
          token inside it at the top of the screen, the streak drops to a
          line, and the current rank compresses to a row beneath, so the
          screen answers "how far" before it answers "what am I". Reads
          as a climb in progress: the ladder is the point and the member
          is on it. Built for programmes with a long, finely stepped
          syllabus, where the next tier is close enough to chase and the
          distance is the motivation. Wrong for a gym with two or three
          broad levels, where an arc that barely moves in a month reads
          as being stuck.
      - value: splitRank
        description: >-
          The screen splits cleanly into where the member IS and what
          comes NEXT, with the rating plot as a collapsible strip on the
          seam between them. Reads plain and instructional: the structure
          is obvious and nothing on the screen performs. Built for a
          technical academy whose voice is matter-of-fact, that would
          rather state a member's standing than dramatise it. Wrong for a
          gym leaning on the app as its motivation surface, where a
          treatment this even-handed undersells the achievement it is
          reporting.
  - id: rewards_format
    description: >-
      The points store — the catalogue of rewards a member spends earned
      points on. This slot decides how the rewards and their prices are
      presented.
    values:
      - value: cardGrid
        description: >-
          Topbar, tab strip and points headline over a two-up grid of
          image-top cards, each with its price tag on the image. Reads
          like a small shop: things you can see, priced and compared side
          by side. Built for a catalogue of physical goods that a
          photograph sells — merchandise, gear, supplements, branded kit.
          Wrong for a catalogue of intangible perks (a guest pass, a free
          session, a private lesson) that have no picture worth half the
          screen.
      - value: listRows
        description: >-
          Every reward takes a full-width row: square thumbnail leading,
          price inline beside the cost, action trailing, and the title
          gets the whole width so a two-line clamp stops deciding what a
          reward is called. Reads as a plain price list — legible,
          unglamorous, quick to scan down. Built for perk-shaped
          catalogues whose names carry the meaning ("Bring a friend to
          any class", "One month of locker hire"). Wrong for a
          merchandise store, where the product photograph is the reason
          anyone wants the item and a square thumb is not it.
      - value: posterDeck
        description: >-
          The topbar, segmented tabs and points headline pin to the top,
          and the rest of the screen is a horizontally snapping deck of
          full-width posters, each carrying its own redeem action. Reads
          like a gallery of prizes: one at a time, each given the whole
          screen. Built for a short, curated catalogue where each reward
          is an event in itself — a signature prize, a seasonal drop, a
          handful of things genuinely worth wanting. Wrong for a long
          catalogue, where a member hunting for the cheapest thing they
          can afford has to swipe past everything to find it.
      - value: priceLadder
        description: >-
          The points headline pins above the content so the member's
          balance stays on screen while they scroll, and the rewards
          group into cost bands, cheapest first, each band labelled by
          how far off it is. Reads as a savings ladder: the store is a
          set of targets and the balance is a position on it. Built for
          gyms running points as a real engagement loop, where the member
          should always be able to see the next thing within reach.
          Wrong for a gym whose rewards are occasional gifts rather than
          a currency, since banding a handful of items by price implies
          an economy that is not actually running.
      - value: storefrontHero
        description: >-
          The first reward in the catalogue is promoted to a full-bleed
          hero with its title, cost and action riding the image; the
          points headline drops below it and the rest fall into the
          two-up grid, with the promoted reward taken OUT of the grid
          rather than duplicated. Reads as retail merchandising: one
          thing pushed, everything else stocked behind it. Built for a
          gym that curates its catalogue and wants a flagship item or a
          current promotion leading the screen. Wrong for a catalogue of
          equals, where promoting whichever reward happens to be first
          makes a claim the gym never intended to make.
  - id: class_format
    description: >-
      Class detail and booking — the screen a member lands on from the
      schedule, holding the class image, its meta (time, instructor,
      location) and the action that commits them to attend.
    values:
      - value: bannerStack
        description: >-
          A photo banner, then the meta block, then three divided
          sections — details, instructor, location — down one scroll with
          the reserve action pinned beneath. Reads complete and
          conventional: everything about the class is readable in order
          without a tap. Built for a gym still converting newcomers and
          drop-ins, where the description, the coach and the address all
          genuinely get read before someone commits. Wrong for a
          members-only routine where all of that is already known, and
          the page becomes a long scroll past facts the member has read
          fifty times.
      - value: overlayHero
        description: >-
          A taller 4:5 hero carries the topbar at its top and the meta
          block at its bottom, both behind a fade to the page
          background, and the instructor is promoted above the
          description. Reads like a poster for the session: the room and
          the coach are the pitch. Built for gyms where the coach is the
          reason to book — named instructors, personality-led
          programmes, a gym that markets its people. Wrong for a gym
          whose classes are interchangeable slots on a timetable, where
          poster treatment promises a distinctiveness the session does
          not have.
      - value: detailSheet
        description: >-
          The photo becomes a fixed backdrop and the content rises over
          it as a draggable sheet, with the reserve action at the TOP of
          the sheet — in thumb reach on the way down rather than at the
          end of a scroll. Reads modern and tactile: booking is a
          gesture, and the image is atmosphere behind it. Built for a
          design-forward studio whose members book fast and repeatedly
          and whose photography is worth keeping on screen. Wrong for a
          gym whose class detail is genuinely reference material — long
          descriptions, prerequisites, equipment lists — where a sheet
          puts a drag between the member and the text.
      - value: sectionTabs
        description: >-
          The photo and meta stay put and the three sections share one
          swipeable pane, so what the class is and when it runs is always
          on screen and two thirds of the detail sits behind a tap. Reads
          organised and app-like: a class with more to say than one
          screen holds. Built for gyms with substantial content in each
          section — long instructor bios, several rooms or sites,
          detailed prerequisites. Wrong for a gym whose sections are a
          line each, where three tabs over three sentences is chrome
          wrapped around nothing.
      - value: specBrief
        description: >-
          No banner at all: the photo shrinks to a thumbnail inline with
          the title, the specifics become a table, instructor and
          location compress to single strips, and the reserve action sits
          at the end of the content instead of pinned. Reads operational
          — a listing, not a pitch. Built for the member who has taken
          this class fifty times and wants the time and the mat, at a gym
          where booking is a routine rather than a decision. Wrong for a
          gym still selling first sessions, where the photograph and the
          atmosphere are exactly what makes someone book.
  - id: celebration_format
    description: >-
      The post-class celebration cards — the five-card payoff a member
      walks through after finishing a session (streak, wins, points,
      rewards, rank). One slot for all five: the body content differs per
      card, the arrangement around it does not. This is the app's emotional
      peak, so the arrangement carries real brand weight.
    values:
      - value: centerHero
        description: >-
          The header sits on top, the card's body is centred in
          everything left over, the action is pinned full width at the
          bottom, and the close sits in the screen's top-right inset.
          Reads composed and ceremonial: the moment is presented
          squarely, with air around it. Built for brands whose voice is
          measured and whose celebration should feel like a quiet
          acknowledgement — a premium studio, a technical academy that
          nods rather than cheers. Wrong for a gym whose payoff is meant
          to hit, where a centred figure on plain canvas is dignified and
          dignity is not what a fight gym's post-session screen is for.
      - value: figureTop
        description: >-
          The frame opens tighter and the body settles against the TOP of
          the stage instead of its centre, so on a screen held at arm's
          length the earned figure is where the eye lands first; the
          action keeps the same resting place it has everywhere else.
          Reads as a result being reported: the number is the news and
          everything else is supporting detail. Built for brands whose
          payoff genuinely IS the figure — points totals, session counts,
          streak days at a gym that tracks them seriously. Wrong for a
          brand carried by its imagery, where anchoring everything high
          leaves the lower half of the screen empty.
      - value: cardReveal
        description: >-
          The whole celebration rides one raised, rounded surface
          floating on the canvas, with the close in the card's own corner
          and the action on bare canvas beneath it. Reads collectible:
          something handed to you, with an edge you could pick up. Built
          for gyms leaning on rewards and accumulation — points
          economies, badges, tiers a member collects and comes back to.
          Wrong for a brand whose imagery is meant to be immersive, since
          a card frames the illustration and holds it at arm's length.
      - value: splitBand
        description: >-
          The celebration is contained in a band that bleeds to the top
          and both side edges, and the action sits alone on plain canvas
          beneath it; the seam gives the figure its own surface, which is
          what keeps it legible under a busy illustration. Reads
          structured and calm — the moment is framed rather than flooding
          the screen. Built for brands with rich, detailed artwork that
          needs a surface to sit on, and for a voice that wants clear
          separation between the celebration and the thing it asks for
          next. Wrong for a spare, minimal identity, where a band drawn
          around a small figure reads as a container with nothing to
          contain.
      - value: fullBleed
        description: >-
          No frame: the stage runs the entire canvas top to bottom and
          the chrome floats over it on a scrim instead of reserving rows
          in a column, which gives the illustration and its intro the
          whole canvas to work in. Reads cinematic and loud — the payoff
          fills the room. Built for brands with strong, distinctive
          imagery whose celebration should feel like an event: combative
          gyms, competition teams, anywhere the post-session screen is
          the emotional peak of the product. Wrong for a restrained,
          typographic identity, where an edge-to-edge illustration
          overwhelms the brand it is meant to express.

  # ---------------------------------------------------------------------
  # MOTION — one global personality plus five per-surface overrides.
  #
  # Wired in the app and consumed by the celebration stack, the loaders,
  # the page-transition theme and the count-up figures. Motion is a TOKEN,
  # not a layout: every value here touches TIMING AND ENTRANCE ONLY, never
  # which elements exist or where they sit, so no motion value can break
  # any arrangement chosen above.
  #
  # The app's motion law is ease-out only — no bounce, no elastic, no
  # overshoot past a settled size — so energy comes from stagger density
  # and never from a spring. A value may be quiet; it may not be absent,
  # and it may not be too fast to be seen.
  # ---------------------------------------------------------------------
  - id: motion_personality
    description: >-
      The global motion intensity dial: one personality resolves the WHOLE
      timing set — element duration and curve, the stagger between
      consecutive reveals and between badge cascades, count-up length, the
      sparkle window, and the decorative particle count — and every
      surface inherits from it unless one of the slots below overrides it.
      NOTE: nothing reads this slot yet. The five motion slots below are
      each consumed by real screens; this one is declared so the value is
      waiting when the global dial is wired, and picking it changes
      nothing in the app today.
    values:
      - value: standard
        description: >-
          260ms elements on ease-out-quart, 90ms between consecutive
          reveals, a 1.4-second count-up and twelve decorative particles
          — an even, mid-tempo timing set with no accent of its own.
          Reads brisk and unremarkable: motion that does its job and gets
          out of the way of the content. Built for brands whose
          personality lives in
          their imagery, copy and colour rather than in how the app
          moves: a gym with a strong visual identity that needs no help
          from the animation. Wrong for a brand whose whole promise is
          intensity or serenity, where neutral timing on every surface
          says nothing about either.
      - value: calm
        description: >-
          Elements settle on a soft ease-out-sine, consecutive reveals
          follow only 40ms apart so a stack arrives almost as one rather
          than cascading, the count-up runs short, and NO decorative
          particles are drawn at all. Reads unhurried and quiet: nothing
          is performed at the member. Built for restorative and
          technique-led practices — recovery, mobility, yoga,
          rehabilitation — where a shower of particles would contradict
          the room the member just trained in. Wrong for a gym selling
          intensity, where an app that arrives without energy reads as
          flat.
      - value: hype
        description: >-
          200ms elements on a steep ease-out-expo with a tight 55ms
          stagger, a shorter count-up and twenty decorative particles:
          the energy comes from how densely things arrive, never from a
          bounce. Reads urgent and physical, like the app is still
          breathing hard. Built for combative and competitive gyms —
          striking, fight teams, hard conditioning — where the product
          should feel the way the training does. Wrong for a premium or
          restorative brand, where a dense cascade under twenty particles
          reads as a mobile game rather than a studio.
      - value: cinematic
        description: >-
          Authored long and clamped to the app's element ceiling, with a
          wide 140ms stagger, a two-second count-up and a deep
          ease-out-quint: elements arrive one at a time and the number
          takes its time landing. Reads deliberate and weighty — every
          payoff is staged as an occasion. Built for brands that trade on
          prestige and ceremony: a promotion night, a competition team, a
          premium club where earning something is meant to feel formal.
          Wrong for an app opened in a hurry several times a week, where
          sitting through a two-second count before you can leave the
          screen is a toll.
  - id: celebration_intro
    description: >-
      The one-shot that plays before a post-class card settles — the
      streak, rank, points, rewards and wins cards all run it. The card
      supplies its hero mark, its particle mark and its settled content;
      this slot supplies the timing and the entrance and nothing else, so
      whichever value is active the same settled content arrives. Every
      value plays something: a celebration card always animates, so "no
      intro" is not offerable.
    values:
      - value: orbit
        description: >-
          A ring of eight small marks expands out from centre while
          spinning, then collapses back to nothing; the hero pops up into
          the space it left, holds for most of a second, and fades into
          the stats cascade. Reads ceremonious and complete — a build, a
          reveal and a settle, with the ring built from the brand's own
          point token. Built for gyms whose points-and-rewards language
          is central to the product and whose post-class moment is meant
          to be a small ritual. Wrong for a spare, disciplined identity,
          where a spinning ring of marks is more decoration than the
          brand wants anywhere near its screens.
      - value: burst
        description: >-
          The marks fade in out from centre and draw INWARD around the
          hero first, then fire outward once and fade where they land: no
          ring, no rotation, no return trip, with a run-up in front of
          the payoff and a beat behind it. Reads as an impact — tension,
          then release. Built for striking and combative gyms where
          finishing a session should land like a hit. Wrong for a
          restorative practice, where a scatter firing outward carries an
          aggression the room does not have.
      - value: rise
        description: >-
          The hero climbs from below the stage with a vertical trail
          behind it that sharpens as it decelerates, and settles. No
          particles at all. Reads as ascent: calm, controlled,
          cinematic. Built for technique-led academies and premium
          studios whose story is steady progress and whose screens should
          stay clean. Wrong for a gym whose payoff should feel explosive,
          where a single silent climb reads as the app underreacting to
          what the member just did.
      - value: flipCount
        description: >-
          The hero turns in on its vertical axis from edge-on over more
          than a second, holds facing the member, and leaves; only then
          does the card settle and its figure count up. Reads as a
          reveal — something turning to face you, the way a card is
          shown. Built for brands whose reward language is collectible:
          badges, tiers, cards, things earned and then displayed. Wrong
          for a brand whose payoff is physical effort, where a card flip
          is a game gesture rather than a training one.
  - id: reveal_style
    description: >-
      The per-element entrance used across the celebration stack: how each
      stat, tile, caption and figure arrives once its card has settled.
      Every value is a genuine entrance — an element that never animates
      in is not a treatment a brand gets to pick — and every value runs
      long enough to be read, since an entrance under about a quarter of a
      second stops being a transition and becomes a cut.
    values:
      - value: fadeUp
        description: >-
          Opacity comes up on ease-out-quart while the element rises the
          last few pixels into place, over 260ms, with no held beat in
          front of it. Reads as things settling into position:
          unobtrusive and immediately legible, with no element drawing
          attention to its own arrival. Built for content-dense brands
          whose screens carry many elements at once and whose character
          is in what is on the screen rather than how it got there.
          Wrong for a brand that wants the entrance itself to carry some
          of its personality.
      - value: scalePop
        description: >-
          Every element fades in from half its size — the pop IS the
          entrance, and nothing translates, because stacking a slide on
          top of it would make two beats out of one. Reads eager and
          springy, each thing arriving with a bit of life in it, while
          never growing past its settled size. Built for playful,
          high-energy brands: youth programmes, group fitness, a gym
          whose whole tone is upbeat. Wrong for a formal, text-heavy
          identity, where scaling type up through fractional sizes reads
          soft-edged and bouncy.
      - value: slideIn
        description: >-
          After a short held beat the element travels 28px in from the
          leading edge with its opacity held high for most of the run, so
          what the eye follows is the travel rather than a fade; leading
          resolves against the reading direction, so an RTL locale gets
          the mirror for free. Reads directional and orderly, like items
          being dealt into place along a line. Built for brands whose
          language is sequence and discipline — a syllabus, a
          progression, a programme with steps. Wrong for a centred,
          symmetrical visual identity, where a sideways entrance
          introduces a direction the design does not have.
      - value: maskWipe
        description: >-
          Nothing is transformed at all — no scale, no translate, no
          opacity ramp: the element is uncovered by a clip sweeping along
          its own long axis, so text renders at exactly its final size
          and position for every frame it is visible and stays
          pin-sharp. Reads editorial and exact, like type being printed
          rather than flown in. Built for typographic, premium brands
          where crisp lettering is a large part of the identity. Wrong
          for an illustration-led brand, where a wipe across a figure
          reads as an image still loading rather than as a reveal.
  - id: loader_style
    description: >-
      The waiting state — what a member looks at while something is being
      fetched. A small surface, but the one they see at their least
      patient moment, so it carries more brand weight than its size
      suggests.
    values:
      - value: dots
        description: >-
          Three brand-coloured dots in a travelling wave, each a third of
          a cycle behind the last, so the bounce reads as one ripple
          crossing the row and coming back. Reads friendly and
          universally understood — the ordinary "working on it". Built
          for brands that want waiting to be unremarkable and human, and
          whose tone is warm rather than technical. Wrong for a severe,
          minimal identity, where three bouncing dots read as a chat app
          that wandered into the product.
      - value: pulseRing
        description: >-
          Two rings, half a cycle apart, scale out from the centre and
          fade, each arriving at its settled radius and never passing it,
          so a ripple is always on screen including at mount. Reads
          technical and alive, like a signal going out and being listened
          for. Built for gyms whose language is measurement and systems:
          performance labs, data-forward programmes, anywhere training is
          presented as instrumentation. Wrong for a warm, human-led
          studio, where a radar ping is colder than the room it stands
          for.
      - value: barSweep
        description: >-
          A short bar sweeps its track there and back on a half-cosine,
          arriving at each end with zero velocity so the loop closes on
          itself instead of cutting back to the start. Reads mechanical
          and industrial — something being driven, at a steady rate.
          Built for strength, conditioning and equipment-led gyms whose
          visual language is already hardware, plates and straight lines.
          Wrong for a soft or organic identity, where a machine stroke is
          the wrong metaphor for what happens in the room.
      - value: logoBreathe
        description: >-
          The gym's own mark breathes: scaling up from just under its
          settled size and back on a slow two-and-a-half-second cycle,
          never growing past its true size, so the mark is never
          distorted. It is the only waiting state made from the tenant's
          own identity rather than an abstract shape. Built for brands
          with a strong, simple mark that should be present even in dead
          time — a gym whose logo is genuinely part of what members buy.
          Wrong for a finely detailed mark or a long wordmark that stops
          being legible at loader size.
  - id: transition_style
    description: >-
      Screen-to-screen motion: how an arriving route animates in and how
      the one it covers behaves. It lives in the app's page-transition
      theme, so it can only change how a route animates — it never sees
      which route was pushed and never touches the back stack.
    # DELIBERATE OMISSION: the app's `TransitionStyle` enum carries a
    # FIFTH value, `none` (an instant cut), which is NOT offered here and
    # must not be added. It stays in the enum so it can still be set by
    # hand, but no tenant should ever be automatically assigned "no
    # animation between screens" — that is an explicit product call, not
    # an oversight. Do not "fix" this list by syncing it back to the enum.
    values:
      - value: platformDefault
        description: >-
          Whatever the platform's own page transition already is, read
          live from the framework rather than copied — so if the OS
          changes what it does, this follows. Reads native: the app moves
          between screens exactly the way every other app on that phone
          does. Built for brands whose app should disappear into the
          device, utility-first products where familiarity beats having a
          signature. Wrong for a brand that wants its own hand on every
          part of the experience, since this is the one value that
          deliberately has none.
      - value: fade
        description: >-
          A cross-dissolve with no travel at all: the arriving screen
          fades up over the one it replaces, which stays fully painted
          underneath for the whole transition. Reads weightless and
          quiet — screens replace one another rather than sliding past.
          Built for calm, atmospheric brands (recovery, wellness,
          meditative practice) where moving through the app should be as
          gentle as the training it books. Wrong for an app with deep
          navigation, where a dissolve leaves the member no sense of
          having gone in or come back out.
      - value: sharedAxis
        description: >-
          A paired slide plus fade along the navigation axis: the
          arriving screen travels in a quarter of the screen's width from
          the leading edge while the leaving one carries on in the same
          direction. The pairing is what makes the axis legible — one
          screen moving alone reads as an overlay, two moving together
          read as a step along a line. Built for programmes built on
          sequence, where moving through the app should feel like moving
          through a progression. Wrong for a brand whose screens are
          peers rather than steps, where implying a line that is not
          there makes ordinary navigation feel one-way.
      - value: cardStack
        description: >-
          The arriving screen rises up over the one it covers, which
          recedes to slightly under full size and stays legible behind it
          — a scale, not a dim, so the covered screen remains itself
          rather than becoming a grey plate. Reads layered and physical,
          like cards being dealt onto a table. Built for brands whose
          product language is collectible and tactile: rewards, badges,
          decks, tiers. Wrong for a utility app opened many times a day,
          where 360ms of layered motion between every screen becomes a
          tax the member pays constantly.
  - id: count_up_style
    description: >-
      How an earned figure arrives — the points total, the streak count,
      the session tallies on the post-class cards. It changes how the
      number reaches its value and nothing else: the same figure, in the
      same box, is what is left at rest under every value.
    values:
      - value: odometer
        description: >-
          A slot-counter reel: one vertical strip per digit position,
          each listing every integer that digit will pass through,
          clipped to a one-digit window, on a steep ease-out-expo — fast
          spin up front, long slow landing on the final digits. Reads
          mechanical and satisfying, like a meter turning over. Built for
          gyms where points are a real currency and watching the number
          climb is part of the payoff. Wrong for a brand whose numbers
          are incidental, where a full reel spin makes a modest figure
          look like a jackpot.
      - value: ticker
        description: >-
          No per-digit motion at all: the whole number simply re-renders
          through its intermediate values on a gentle ease-out-quad after
          a short opening hold, so the figures are meant to be read on
          the way up rather than blurred through. Reads plain and
          factual — a number counting, not a machine spinning. Built for
          measurement-led brands whose members care about the actual
          values: performance tracking, training logs, anywhere the
          intermediate numbers mean something. Wrong for a brand whose
          post-class screen is meant to feel like a reward, where a quiet
          re-render lands as a readout.
      - value: sweepArc
        description: >-
          An arc sweeps left to right beneath the number while the number
          holds on its opening zeros; then the figure rolls up while the
          arc completes and clears, so the two settle together and the
          arc leaves nothing behind. Reads as a gauge filling — the
          figure is progress toward something. Built for programmes
          framed as distance to a threshold: graded ladders, class-count
          targets, anything with a next tier to reach. Wrong for a brand
          whose points are an open-ended tally with no target, where an
          arc implies a ceiling that does not exist.
      - value: instant
        description: >-
          The figure is simply there at its final value: no roll, no
          hold, no run-up. The entrance is not removed — it belongs
          entirely to the surrounding reveal, so the number still arrives
          with everything around it; only the counting is gone. Reads
          matter-of-fact: the result is stated rather than performed.
          Built for brands whose restraint is the point — a serious
          technical academy, a premium studio that would rather state a
          fact than animate it. Wrong for a gym running points as an
          engagement loop, where the count-up IS the reward and removing
          it removes the moment.
