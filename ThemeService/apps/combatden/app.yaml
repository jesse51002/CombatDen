id: combatden
display_name: CombatDen

# The app-declared classification vocabulary: the closed set of values a
# run's output.yaml `category` may carry (the 8 parent gym-type buckets —
# mirrors ParentGymType in the FastApi backend / the CRM's showcase
# groups). A run whose category is missing or outside this set is skipped
# by GET /apps/{id}/styles. The category itself lives per-run in
# output.yaml, produced by the pipeline's classification node — it builds
# its response schema from this very list, so a value outside it can't be
# written. `expand` backfills an unclassified run; `regen --slot category`
# re-files a mis-classified one.
categories:
  - Fighting
  - Yoga
  - Pilates
  - Barre
  - HIIT
  - Cardio
  - Dance
  - Wellness

images:
  # Shared (tenant-wide)
  - id: logo_primary
    description: >-
      The gym's primary brand logo / identity mark. Lives in the persistent
      app top bar (GymHeader), shown roughly 100x100 and centred directly
      above the gym name and the info bar (which holds the rank, streak,
      points and QR items). It is present on every main tab — Home,
      Profile, Rewards, Videos — and at the top of every post-class
      celebration screen. It is the first thing the user sees on app open
      and is on screen almost constantly. Purpose: pure brand anchor and
      gym identity; it is never tied to an event or a reward. Role is calm
      and permanent, not celebratory — it must read instantly and stay
      legible at small size as a single coherent logo mark. Keep it simple
      and realistic — a clean, professional logo an actual business would
      really use as its mark, not an illustrated scene, a busy composition,
      or a rendered mascot (e.g. a wordmark, a monogram / lettermark, an
      emblem or badge mark, a simple abstract symbol — brand's choice).
  - id: rank_belt
    description: >-
      The visual token of the user's CURRENT earned rank / tier — what
      they are right now. The object is the brand's to choose: in combat
      sports a graded belt reads instantly, but interpret it as whatever
      rank token fits this brand's world (e.g. a graded belt, a tiered
      badge, a chevron/stripe rank insignia, a ranked crest — brand's
      choice). Used in three places: (1) a tiny ~39x24 indicator in the
      persistent top info bar next to the rank label; (2) ~77x50 in the
      Profile screen's rank header beside the rank name and subtitle; (3)
      the animated hero of the post-class Rank celebration screen — the 2nd
      of five post-class cards (Streak, Rank, Points, Rewards, Wins) — where
      it flies in large and centred (~280px), holds, then shrinks down into
      the profile header slot as stats fade in. So it must work both as a
      calm, tiny status indicator and as a bold, proud celebratory hero. The
      moment is achievement and earned status.

  # Page-specific
  - id: celebration_image
    description: >-
      The single hero that celebrates a successful class booking. Fills the
      ClassBookedScreen as a full-bleed centred hero (~50-60% of the
      viewport), revealed with a scale-in pop after a brief loading +
      done-check sequence, with a "Class Booked" headline directly below it
      and a Continue button at the bottom. It appears the instant the user
      commits to booking a class and is the ONLY place a booking success is
      celebrated — the first positive payoff for that action and a key
      retention moment. The emotion is peak, energetic, congratulatory
      success: "you're in, your spot is locked". Read that feeling and pick
      imagery that lands it in this brand's world (e.g. a confirmed
      ticket/pass, a checkmark seal in a burst, a locked-in calendar mark,
      raised gloves, a flag planted — brand's choice).
  - id: trophy_image
    description: >-
      The celebratory hero that headlines the end-of-session "Today's Wins"
      recap — its job is to land the feeling of victory and accomplishment,
      the reward for showing up and finishing. Read the emotion, not a fixed
      object: choose imagery that says "won / accomplished" in this brand's
      world (e.g. a trophy, a champion's belt, a medal, a laurel/crown, a
      milestone marker — brand's choice). Sits ~230x230, centred inside a
      sparkle/particle burst, on the WinsScreen — the 5th and final card of
      the post-class flow — with a "Today's Wins" headline, subtitle and
      three summary stat tiles cascading in below it. This is the closing
      high note as the user leaves the gym after their session is recapped.
  - id: points_stars_image
    description: >-
      The hero that celebrates the points earned during a session — a burst
      of earned value at the climax of the points reveal. It should echo the
      app's points unit (see single_point): build it from that same token
      rather than a generic graphic. On the PointsScreen — the 3rd post-class
      card — a kinetic 3D sphere of orbiting point tokens first collapses
      inward, and then this ~238x238 graphic is revealed centred with a "+N
      POINTS" count-up and a running total caption pinned below. It is the
      payoff at the end of the points animation: rewarding and high-energy
      (e.g. a radiant cluster, an upward cascade, or a burst of the point
      tokens — brand's choice). Must still read instantly as "points /
      earned value" and stay semi-professional — energetic, not gimmicky.
    depends_on:
      - single_point
  - id: next_rank_belt_image
    description: >-
      A preview of the NEXT rank's token — the tier the user is working
      toward, deliberately distinct from rank_belt (their current tier). Use
      the same kind of rank token rank_belt uses for this brand (e.g. a
      graded belt, a tiered badge, a chevron/stripe insignia, a ranked
      crest), but clearly one tier HIGHER and aspirational. Lives in the
      Profile screen's "Next Rank" section, inset inside a ~100x100 circular
      progress badge: an animated progress arc rings the badge and the image
      sits within it with ~22px padding, above a "Next Rank" title and an
      "X / Y classes to next tier" progress label. The moment is calm,
      between-classes browsing — motivational, not celebratory. It must read
      clearly inside a small circular badge without fighting the progress
      ring, and should clearly feel like a higher tier the user has not
      reached yet.
    depends_on:
      - rank_belt
  - id: giftbox
    description: >-
      The SOURCE of an unwrap-then-burst animation — the metaphor for an
      unclaimed reward about to be opened. It MUST read instantly (even
      mid-motion) as a single closed container that opens and releases a
      burst; the exact object is the brand's (e.g. a wrapped gift box, a
      treasure chest, a sealed prize capsule, a locker/case — brand's
      choice). On the RewardsCardScreen (4th post-class card) it flies in
      with a spin, holds briefly, then scales away as point tokens burst
      outward from its centre, after which a rewards carousel takes over. It
      is never shown statically for long — it exists to be opened. The moment
      is anticipation releasing into payoff: "you've earned something, claim
      it". Playful, kinetic, high-energy.
    depends_on:
      - single_point
  - id: single_point
    description: >-
      The app's signature points / earned-value token — the atomic
      unit of the points / rewards visual language. Three uses: (1) a ~22px
      points icon in the persistent top info bar next to the points balance;
      (2) fourteen instances forming the orbiting 3D sphere on the Points
      screen; (3) fourteen instances bursting radially out of the giftbox on
      the Rewards screen. So it is simultaneously a tiny permanent utility
      icon AND a mass-instanced motion particle: it MUST read instantly as a
      "points" unit, be simple, perfectly legible at ~22px, symmetrical, and
      look right when repeated, rotated, depth-sorted and scaled in motion —
      a single clean token, never a scene or a cluster, and kept
      semi-professional (no wild or gimmicky shapes). The object is otherwise the brand's to choose
      (e.g. a star, a coin/chip, a gem, a pip/token) as long as it
      stays an instantly-readable, restrained points unit.
  - id: icon_qrcode
    description: >-
      A QR-code graphic that signals in-gym check-in / sign-up. It is the
      right-most item of the persistent top info bar, ~30px tall and
      tappable; per the product it serves the at-the-gym check-in moment —
      scanned one-thumbed, sometimes with sweaty hands and variable gym
      lighting (the dedicated full check-in screen is not built yet, so for
      now it lives only as this top-bar entry point). Role is a calm,
      functional, navigational utility — it MUST read unmistakably as a
      scannable QR affordance at small size, never celebratory. It is a
      stylised QR-style graphic standing for "check in here", not a real
      scannable code.
  - id: streak_icon
    description: >-
      Communicates that the user has an attendance streak going. Read that feeling
      and pick imagery that fits this brand's world
      (e.g. a flame, stacked forward chevrons, a lightning bolt, or pick wtv you think would fit is encouraged).
      This should be stylized to fit their brand and feel exciting while being clear and scannable.
      Must not be inside a token, wtv you pick should be on its own.
      Used in three places: (1) ~22x30 in the persistent top info bar beside the streak
      day count; (2) ~12x15 in the Home screen's upcoming-sessions card
      footer next to "You're on an X week streak!"; (3) the ~240px icon hero
      of the post-class Streak screen (the 1st post-class card), revealed by
      the streak celebration animation as it grows in.
colors:
  - id: primary
    description: Dominant brand color. Used for primary CTAs and key accents.
  - id: background
    description: App background color. Usually dark for a gym aesthetic.
    role: background
  - id: text
    description: Main text color for headings and body copy.
    role: text
  - id: accent
    description: Selection / active-state highlight. MUST be a visibly distinct
      hue from `primary` (a different hue family, not a tint or clone of it),
      premium and coherent on the dark gym canvas, and meet WCAG AA against the
      background. Drives the active nav item, active timeframe pill, and active
      tab — used as borders / one active label, never a fill.

fonts:
  - id: display
    description: >-
      Headline / hero / celebration typography — the "Class Booked"
      title, post-class card titles (Streak / Rank / Points / Rewards /
      Wins), points count-ups, and screen titles. Used at large sizes
      (24–64px) and short bursts. Must carry the brand's athletic
      energy and feel distinctive at a glance — confident, modern,
      premium. Numerals must read cleanly because every celebration
      screen pairs the title with a big number.
  - id: body
    description: >-
      All running UI text — buttons, list rows, info-bar labels (rank /
      streak / points), stat tiles, body copy. Used at 13–18px in long
      sessions on a dark canvas. Must be highly legible at small sizes,
      have a generous x-height, hold up at every weight from regular to
      bold, and feel visually quiet so the display font and the
      accents lead. Numerals must be tabular-friendly because the info
      bar stacks several side-by-side counters.

texts:
  - id: class_booked_headline
    description: >-
      The full-bleed celebration headline shown the moment a class
      booking succeeds. Sits directly below the celebration hero on
      ClassBookedScreen, ~36–48px display weight. The single high
      point of the booking flow — the user just committed, this is
      their first positive payoff. Should land like the brand
      cheering — combative gyms read like a fighter locking in,
      grappling academies like stepping on the mat, premium studios
      like a calm confirmation. Title-case or sentence case; never
      ALL CAPS unless the brand demands it.
    min_words: 1
    max_words: 3
    min_chars: 4
    max_chars: 22
  - id: reserve_cta
    description: >-
      The primary booking button on a class detail / reservation
      screen — the action that commits the user to attend. Reads as
      a verb phrase in the brand's voice (combat gym: "Lock it in.";
      grappling academy: "Claim your mat."; calmer studio: "Reserve
      a spot."). Has to fit a single-line pill button without
      wrapping. Imperative, present tense, no trailing period unless
      the brand reads punchy with one.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 22
  - id: wins_title
    description: >-
      The headline of the post-class "wins" recap screen — the 5th
      and final post-class card. Pairs with a sparkle / trophy hero
      and three summary stat tiles. The closing high note of the
      session: it should celebrate the user's effort in the brand's
      voice without being saccharine. Combat-leaning brands lean
      punchy ("Today's wins"); calmer brands lean reflective
      ("Today's progress"). Short, declarative, never a full
      sentence.
    min_words: 1
    max_words: 4
    min_chars: 4
    max_chars: 20
  - id: wins_subtitle
    description: >-
      The one-line subtitle directly under the wins headline on the
      same end-of-session recap screen. This is the single chattiest
      line of brand voice in the app — a short motivational beat
      that pushes the user back into the next session. Combat gyms
      read aggressive ("The grind never stops"), BJJ academies more
      technique-led ("Every roll sharpens you"), premium studios
      calm ("Each session counts"). One short clause; no exclamation
      mark unless the brand genuinely shouts.
    min_words: 2
    max_words: 6
    min_chars: 8
    max_chars: 40
  - id: book_next_class_cta
    description: >-
      The CTA at the bottom of the post-class wins recap that takes
      the user back into the booking flow for their next session.
      Same button shape as ``reserve_cta`` but the moment is
      different — the user just finished training and is being
      nudged to commit again. Should read like the brand inviting
      them back, not pleading. Imperative, verb-led, no trailing
      period.
    min_words: 2
    max_words: 5
    min_chars: 8
    max_chars: 28

# The persistent bottom-nav tab icons — the most repeated, brand-defining
# glyphs in the member app (present on Home, Rank/Profile, Rewards and
# Videos). Monochrome; the MobileApp tints them per theme (active = accent,
# inactive = muted text), so no colour belongs here. Each falls back to a
# Material Symbol in the app if the pipeline doesn't supply one.
icons:
  - id: nav_home
    description: >-
      The Home tab icon in the persistent bottom navigation bar — the first,
      left-most tab and the app's default landing destination (upcoming
      sessions, the day's schedule). It MUST read as "home" at ~24px (e.g. a
      house, a roof + door, a dashboard grid — brand's choice). Calm,
      functional and permanent, never celebratory; must stay sharp and
      unambiguous when small and when shown in both an active (highlighted)
      and inactive (muted) state.
  - id: nav_rank
    description: >-
      The Rank tab icon in the persistent bottom navigation bar — opens the
      profile / rank screen where the user sees their current rank tier,
      rating graph and progress to the next rank. It MUST read as achievement
      / rank / earned status at ~24px (e.g. a medal, badge, crest, chevron
      tier, ranking mark — brand's choice), matching the gym's progression
      theme. Permanent navigation utility, not a celebration; legible and
      clear in both active and inactive states.
  - id: nav_reward
    description: >-
      The Reward tab icon in the persistent bottom navigation bar — opens the
      points store / rewards area where earned points are redeemed. It MUST
      read as a reward / something earned-and-claimable at ~24px (e.g. a gift,
      a present, a token, a prize tag, treasure — brand's choice), tying into
      the app's points-and-rewards language. A calm, functional navigation
      affordance; clear and sharp in active and inactive states.
  - id: nav_videos
    description: >-
      The Videos tab icon in the persistent bottom navigation bar — opens the
      technique / level-up video library. It MUST read as "play / watch
      videos" at ~24px (e.g. a play triangle, a film/clapper, a media tile —
      brand's choice). Functional navigation, never celebratory; must stay
      legible and obvious at small size in both active and inactive states.

# The switchable LAYOUTS of the member app: one slot per major screen, plus
# the shell that frames every screen. Each carries its OWN closed
# vocabulary — the pipeline picks exactly one value per slot from the brand
# brief, in one batched call, so the whole app reads as one decision rather
# than seven.
#
# Every value here is a Dart enum value name from
# `../MobileApp/lib/core/formats/layout_formats.dart`, because that is what
# the app's `fromWire` parses (case-insensitive, whitespace-trimmed,
# literal otherwise). The descriptions are those enums' own doc comments —
# they are what the model reads to choose, so they must keep describing the
# real arrangement.
#
# LAYOUT ONLY. The app also carries a sibling `motion_formats.dart`, and it
# is deliberately NOT declared here: no screen reads those enums yet, so
# picking values for them would spend money producing tokens nothing can
# consume. Declare them here when the app consumes them, not before.
#
# The invariant those enums hold: a format changes ARRANGEMENT ONLY. No
# screen is merged or split, no functionality added or removed, and no
# variant reaches data the shipped screen did not already have.
#
# A slot the pipeline never resolved is simply absent from the run's
# `format_set`, and the app renders what it ships today (the first value of
# each enum, which is also its parse fallback). So an unpicked, stale or
# failed format is a non-event, never a broken screen.
formats:
  - id: app_shell_format
    description: >-
      The chrome that frames every screen: the top bar's brand identity
      (mark + gym name) and the stats row (rank, streak, points, QR),
      plus the bottom navigation. Factored out of the per-screen slots
      because it belongs to none of them and composes with every body —
      whatever is chosen here is what the member sees on Home, Rank,
      Rewards and Videos alike, constantly.
    values:
      - value: stacked
        description: Big square mark, name below, stats in a full-width bar.
      - value: compactRail
        description: >-
          One row: mark leading, name centred, stats clustered trailing.
      - value: statFirst
        description: Stats promoted above identity.
      - value: markOnly
        description: >-
          Mark only, stats inline, floating pill nav. The gym name stays in
          the tree (a11y + switch target) but leaves the screen.
  - id: home_format
    description: >-
      The class schedule — the app's default landing destination and the
      screen a member opens most. It lists the gym's upcoming classes by
      day; this slot decides how those days and classes are arranged.
    values:
      - value: agendaList
        description: >-
          Pinned date rail over day groups; text left, thumb right.
      - value: dayPager
        description: One day per swipe; classes as wide media cards.
      - value: timeSpine
        description: >-
          A time gutter runs the day; classes hang off their start time.
      - value: nextUpHero
        description: Next class as a full-bleed hero; the rest goes dense.
      - value: boardGrid
        description: Two-up card grid per day under a sticky day header.
  - id: videos_format
    description: >-
      The video feed — the technique / level-up library, browsed by tag.
      This slot decides how the tags and their videos are laid out.
    values:
      - value: carouselRows
        description: Featured hero over one horizontal row per tag.
      - value: editorialStack
        description: >-
          No horizontal scrolling; two large cards per tag then view-all.
      - value: mosaic
        description: Featured spans two columns inside a mixed-size grid.
      - value: shortsColumn
        description: >-
          One column of tall cards with the tag overlaid on each.
      - value: tagRail
        description: Tags move to a scroll-spy rail; content is one column.
  - id: rank_format
    description: >-
      Rank and progress — the member's current earned tier, their streak,
      their rating graph and their distance to the next rank. The screen
      where earned status is displayed back to them.
    values:
      - value: sparkleStack
        description: Streak hero, rank summary, next rank, level-up videos.
      - value: beltHero
        description: >-
          Belt takes the top with the streak over it, progress rail beneath.
      - value: statTiles
        description: >-
          A four-tile board opens the screen, graph runs full bleed beneath.
      - value: progressFirst
        description: >-
          Next-rank progress becomes a large arc with the belt inside it.
      - value: splitRank
        description: Now over next, graph collapsed onto the seam.
  - id: rewards_format
    description: >-
      The points store — the catalogue of rewards a member spends earned
      points on. This slot decides how the rewards and their prices are
      presented.
    values:
      - value: cardGrid
        description: Two-up image-top cards with the price tag on the image.
      - value: listRows
        description: "Full-width rows: square thumb left, action trailing."
      - value: posterDeck
        description: >-
          A snapping deck of posters with one action pinned beneath it.
      - value: priceLadder
        description: >-
          Banded by cost with the points total as an affordability bar.
      - value: storefrontHero
        description: >-
          One promoted reward full bleed, the rest two-up beneath.
  - id: class_format
    description: >-
      Class detail and booking — the screen a member lands on from the
      schedule, holding the class image, its meta (time, instructor,
      location) and the action that commits them to attend.
    values:
      - value: bannerStack
        description: >-
          Banner, meta, then three divided sections; action pinned.
      - value: overlayHero
        description: >-
          Meta rides the image under a scrim; instructor promoted.
      - value: detailSheet
        description: Image is a fixed backdrop; content rises as a sheet.
      - value: sectionTabs
        description: >-
          Details / instructor / location share one swipeable pane.
      - value: specBrief
        description: "No banner: a spec table and an inline action."
  - id: celebration_format
    description: >-
      The post-class celebration cards — the five-card payoff a member
      walks through after finishing a session (streak, wins, points,
      rewards, rank). One slot for all five: the body content differs per
      card, the arrangement around it does not. This is the app's emotional
      peak, so the arrangement carries real brand weight.
    values:
      - value: centerHero
        description: Everything centred, action pinned.
      - value: figureTop
        description: >-
          The earned figure top-aligned; illustration bleeds off the bottom.
      - value: cardReveal
        description: >-
          Stat on a raised card, illustration breaking over its top edge.
      - value: splitBand
        description: An illustration band over a plain lower half.
      - value: fullBleed
        description: >-
          Illustration fills the screen; everything else stacks on a scrim.
