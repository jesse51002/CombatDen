name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is a monorepo. Each top-level directory is a separate subsystem
            with its own `CLAUDE.md` file containing the rules and conventions
            for that subsystem. The root `CLAUDE.md` documents how the monorepo
            is organised and which cross-system contracts exist (e.g.
            `Database/openapi.json` is the API contract consumed by other
            subsystems).

            Review this PR by following these steps in order:

            1. Run `gh pr diff ${{ github.event.pull_request.number }} --name-only`
               to list every changed file.

            2. Group the changed files by their top-level directory. Each
               top-level directory that has its own `CLAUDE.md` is a subsystem
               (examples in this repo today: `AppManagement/`, `MobileApp/`,
               `FastApiBackend/`, `Database/`, `LandingPage/`).
               Files at the repo root (e.g. `CLAUDE.md`, `.github/`,
               `pyrightconfig.json`) are not a subsystem — call those "root".

            3. Read the root `CLAUDE.md`. Then for each touched subsystem, read
               that subsystem's `CLAUDE.md`. These files are the source of
               truth for what is and isn't acceptable in that subsystem — do
               not invent rules that aren't there, and do not skip rules that
               are there.

            4. Run `gh pr diff ${{ github.event.pull_request.number }}` to see
               the actual code changes.

            5. Review each touched subsystem against its own `CLAUDE.md`. Cover
               code quality, bugs, performance, security, test coverage — but
               frame every finding around what that subsystem's `CLAUDE.md`
               actually requires. Quote the rule when it's load-bearing.

            6. Do a cross-system check. The root `CLAUDE.md` and each
               subsystem's `CLAUDE.md` document cross-system contracts (e.g.
               `Database/CLAUDE.md` requires `immutable_columns.py` and
               `schema_db_diagram.io` to stay in sync with `schemas/`; the root
               `CLAUDE.md` says callers of the FastAPI backend must include
               every required field from `Database/openapi.json`). If the diff
               touches one side of any such contract without touching the
               other, flag it. Do not invent contracts that aren't documented.

            7. Post exactly ONE consolidated comment with `gh pr comment` using
               this layout:

                  ## Claude review

                  **Touched subsystems:** <comma-separated list, or "none — root-only changes">

                  ### <Subsystem name>
                  <findings, grouped by severity>

                  ### <Next subsystem name>
                  <findings>

                  ### Cross-system
                  <contract checks pulled from CLAUDE.md cross-references, or "none">

               If only root files were touched, skip the per-subsystem sections
               and post a short generic review under a single `### Root`
               heading instead of inventing subsystem sections.

            Be constructive. Findings are advisory — this workflow never blocks
            merge.

          claude_args: '--model claude-opus-4-8 --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
